<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Pipeline Tool v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      #canvas-print-area { overflow: visible !important; height: auto !important; }
      body { background: white; }
    }
    body { font-family: system-ui, -apple-system, sans-serif; }
    .step-controls { opacity: 0; transition: opacity 0.1s; }
    .step-card:hover .step-controls { opacity: 1; }
    .step-card { transition: box-shadow 0.15s, border-color 0.15s; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #6366f1; outline-offset: 1px; }
    .fade-in { animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:3px; }
    .doc-col { min-width: 260px; max-width: 260px; }
    .notes-expand { max-height: 0; overflow: hidden; transition: max-height 0.2s ease; }
    .notes-expand.open { max-height: 200px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── Utilities ──────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2, 9);
const STORAGE_KEY = 'cs_pipeline_tool_v2';

function loadStore() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch {}
  return null;
}
function saveStore(d) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {}
}

// ── Seed data helpers ──────────────────────────────────────────────────────────
const DEFAULT_ROLES = [
  { id: 'r1', label: 'PC' },
  { id: 'r2', label: 'CS Admin' },
  { id: 'r3', label: 'Dean' },
  { id: 'r4', label: 'Director' },
];

const STORAGE_PRESETS = ['CS Mgmt SharePoint', 'CS SharePoint'];
const STORAGE_SHAREPOINT = ['CS Mgmt SharePoint', 'CS SharePoint'];
const STORAGE_ALL = [...STORAGE_SHAREPOINT];

const mkAction = (type, label, person = '') => ({ id: uid(), type, label, person });
const mkStep = (stageName, actions, presenterIds, carrierIds, notes = '', returnToStepId = null, storageLocation = '', fileOperation = '', deliveryMethod = '', informationOnly = false) =>
  ({ id: uid(), stageName, actions, presenterIds, carrierIds, notes, returnToStepId, storageLocation, fileOperation, deliveryMethod, informationOnly });

function makeSeedProjectTypes() {
  // ── New Program ──
  const cpSteps = [
    mkStep('Upload to SharePoint',
      [mkAction('custom', 'PC uploads Concept Paper to SharePoint folder')],
      ['r1'], ['r1'], 'Starting point for Concept Paper', null, 'CS SharePoint', 'copy'),
    mkStep('CS Consultations — Faculty & TCDC',
      [mkAction('review', 'Review by', 'Faculty'), mkAction('review', 'Review by', 'TCDC (Signs)')],
      ['r3', 'r1'], ['r2'], 'Dean shares with Faculty; PC shares with TCDC for signature', null, 'CS SharePoint', 'copy'),
    mkStep('JCCS',
      [mkAction('approval', 'Approval by', 'JCCS (Signs)')],
      ['r2', 'r3'], ['r2'], 'Admin & Dean bring to JCCS meeting', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('AQA – Langara Post',
      [mkAction('approval', 'Approval by', 'AQA (Signs)')],
      ['r4'], ['r2'], 'Director shares with AQA for sign-off', null, 'CS Mgmt SharePoint', 'move'),
  ];

  const coursePropSteps = [
    mkStep('Upload to SharePoint',
      [mkAction('custom', 'PC uploads Course Proposal to SharePoint folder')],
      ['r1'], ['r1'], '', null, 'CS SharePoint', 'copy'),
    mkStep('CS Consultations — Faculty & TCDC',
      [mkAction('review', 'Review by', 'Faculty (Signs)'), mkAction('review', 'Review by', 'TCDC (Signs)')],
      ['r3', 'r1'], ['r2'], 'Dean shares with Faculty for signature; PC shares with TCDC for signature', null, 'CS SharePoint', 'copy'),
    mkStep('JCCS',
      [mkAction('approval', 'Approval by', 'JCCS (Signs)')],
      ['r2', 'r3'], ['r2'], '', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('VPE – ELT',
      [mkAction('approval', 'Approval by', 'VPE (Signs)')],
      ['r3', 'r2'], ['r2'], 'Dean/Admin share with VPE for signature', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('ELT / RES Review',
      [mkAction('review', 'Review & Adjust by', 'RES'), mkAction('approval', 'Approval & Sign by', 'RES')],
      ['r1', 'r4'], ['r2'], 'PC/Director share Course Proposal with RES for review, adjustment, and sign-off', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('CRC – EDCO Approved',
      [mkAction('custom', 'Admin shares package to CRC & EDCO'), mkAction('custom', 'Admin moves final approved files to folder')],
      ['r2'], ['r2'], 'Final approval and file archival', null, 'CS Mgmt SharePoint', ''),
  ];

  const progPropSteps = [
    mkStep('Upload to SharePoint',
      [mkAction('custom', 'PC uploads Program Proposal to SharePoint folder')],
      ['r1'], ['r1'], '', null, 'CS SharePoint', 'copy'),
    mkStep('VPE – ELT',
      [mkAction('approval', 'Approval by', 'VPE (Signs)')],
      ['r3', 'r2'], ['r2'], 'Dean/Admin share with VPE for signature', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('ELT / RES Review',
      [mkAction('review', 'Review & Adjust by', 'RES'), mkAction('approval', 'Approval & Sign by', 'RES')],
      ['r1', 'r4'], ['r2'], '', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('CRC – EDCO Approved',
      [mkAction('custom', 'Admin shares package to CRC & EDCO'), mkAction('custom', 'Admin moves final approved files to folder')],
      ['r2'], ['r2'], 'Final approval and file archival', null, 'CS Mgmt SharePoint', ''),
  ];

  const progSumSteps = [
    mkStep('Upload to SharePoint',
      [mkAction('custom', 'PC uploads Program Summary to SharePoint folder')],
      ['r1'], ['r1'], '', null, 'CS SharePoint', 'copy'),
    mkStep('TCDC',
      [mkAction('review', 'Review by', 'TCDC')],
      ['r1'], ['r1'], 'PC shares Program Summary with TCDC', null, 'CS SharePoint', 'copy'),
    mkStep('VPE – ELT',
      [mkAction('approval', 'Approval by', 'VPE (Signs)')],
      ['r3', 'r2'], ['r2'], 'Dean/Admin share with VPE for signature', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('ELT Review',
      [mkAction('approval', 'ELT Approval (Signs & adds ELT approval date)')],
      ['r4'], ['r2'], 'Director shares Program Summary with ELT; ELT approval date recorded', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('RES Review',
      [mkAction('review', 'Review & Adjust by', 'RES'), mkAction('approval', 'Approval & Sign by', 'RES')],
      ['r4', 'r1'], ['r2'], 'PC/Director share with RES for review and sign-off', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('CRC – EDCO Approved',
      [mkAction('custom', 'Admin shares package to CRC & EDCO'), mkAction('custom', 'Admin moves final approved files to folder')],
      ['r2'], ['r2'], 'Final approval and file archival', null, 'CS Mgmt SharePoint', ''),
  ];

  // ── Discontinuation ──
  const discSteps = [
    mkStep('Director Creates & Uploads',
      [mkAction('custom', 'Director creates Discontinuation Form and uploads to SharePoint')],
      ['r4'], ['r4'], 'Director is responsible for initiating discontinuation forms', null, 'CS SharePoint', 'copy'),
    mkStep('VPE – ELT',
      [mkAction('approval', 'Approval by', 'VPE (Signs)')],
      ['r3', 'r2'], ['r2'], '', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('ELT / RES Review',
      [mkAction('review', 'Review & Adjust by', 'RES'), mkAction('approval', 'Approval & Sign by', 'RES')],
      ['r4', 'r1'], ['r2'], '', null, 'CS Mgmt SharePoint', 'move'),
    mkStep('CRC – EDCO Approved',
      [mkAction('custom', 'Admin shares to CRC & EDCO'), mkAction('custom', 'Admin moves final approved files to folder')],
      ['r2'], ['r2'], '', null, 'CS Mgmt SharePoint', ''),
  ];

  return [
    {
      id: 'pt1', name: 'New Program',
      documents: [
        { id: uid(), name: 'Concept Paper',    color: '#b45309', steps: cpSteps },
        { id: uid(), name: 'Course Proposal',  color: '#16a34a', steps: coursePropSteps },
        { id: uid(), name: 'Program Proposal', color: '#2563eb', steps: progPropSteps },
        { id: uid(), name: 'Program Summary',  color: '#7c3aed', steps: progSumSteps },
      ],
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    },
    {
      id: 'pt2', name: 'New Courses',
      documents: [
        { id: uid(), name: 'Concept Paper',   color: '#b45309', steps: cpSteps.map(s => ({...s, id: uid(), actions: s.actions.map(a => ({...a, id: uid()}))})) },
        { id: uid(), name: 'Course Proposal', color: '#16a34a', steps: coursePropSteps.map(s => ({...s, id: uid(), actions: s.actions.map(a => ({...a, id: uid()}))})) },
      ],
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    },
    {
      id: 'pt3', name: 'Course Changes',
      documents: [
        { id: uid(), name: 'Course Proposal', color: '#16a34a', steps: coursePropSteps.map(s => ({...s, id: uid(), actions: s.actions.map(a => ({...a, id: uid()}))})) },
      ],
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    },
    {
      id: 'pt4', name: 'Discontinuation',
      documents: [
        { id: uid(), name: 'Discontinuation Form', color: '#dc2626', steps: discSteps },
      ],
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    },
    {
      id: 'pt5', name: 'Micro-Credential',
      documents: [
        { id: uid(), name: 'Concept Paper',    color: '#b45309', steps: cpSteps.map(s => ({...s, id: uid(), actions: s.actions.map(a => ({...a, id: uid()}))})) },
        { id: uid(), name: 'Course Proposal',  color: '#16a34a', steps: coursePropSteps.map(s => ({...s, id: uid(), actions: s.actions.map(a => ({...a, id: uid()}))})) },
        { id: uid(), name: 'Program Proposal', color: '#2563eb', steps: progPropSteps.map(s => ({...s, id: uid(), actions: s.actions.map(a => ({...a, id: uid()}))})) },
        { id: uid(), name: 'Program Summary',  color: '#7c3aed', steps: progSumSteps.map(s => ({...s, id: uid(), actions: s.actions.map(a => ({...a, id: uid()}))})) },
      ],
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    },
  ];
}

function getDefaultStore() {
  const projectTypes = makeSeedProjectTypes();
  return {
    roles: DEFAULT_ROLES,
    projectTypes,
    templates: [],
    activeProjectTypeId: projectTypes[0].id,
  };
}

// ── useStore ───────────────────────────────────────────────────────────────────
function useStore() {
  const [store, setStore] = useState(() => loadStore() || getDefaultStore());
  useEffect(() => { saveStore(store); }, [store]);
  const update = useCallback((updater) => {
    setStore(prev => typeof updater === 'function' ? updater(prev) : { ...prev, ...updater });
  }, []);
  return [store, update];
}

// ── Primitive Components ───────────────────────────────────────────────────────
function Modal({ title, onClose, wide, children }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`bg-white rounded-xl shadow-2xl flex flex-col ${wide ? 'w-full max-w-2xl' : 'w-full max-w-lg'} max-h-[90vh] fade-in`}>
        <div className="flex items-center justify-between px-5 py-3 border-b">
          <h2 className="font-bold text-slate-800 text-base">{title}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-xl font-bold leading-none">&times;</button>
        </div>
        <div className="overflow-y-auto flex-1 px-5 py-4">{children}</div>
      </div>
    </div>
  );
}

function Btn({ onClick, children, variant = 'primary', sm, disabled, className = '' }) {
  const base = 'inline-flex items-center gap-1.5 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1';
  const size = sm ? 'text-xs px-2.5 py-1.5' : 'text-sm px-3.5 py-2';
  const vs = {
    primary: 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500',
    secondary: 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 focus:ring-indigo-400',
    danger: 'bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 focus:ring-red-400',
    ghost: 'text-slate-500 hover:bg-slate-100 focus:ring-slate-400',
  };
  return (
    <button onClick={onClick} disabled={disabled}
      className={`${base} ${size} ${vs[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
      {children}
    </button>
  );
}

function Field({ label, hint, children }) {
  return (
    <div className="mb-4">
      <label className="block text-sm font-semibold text-slate-700 mb-1">{label}</label>
      {hint && <p className="text-xs text-slate-400 mb-1.5">{hint}</p>}
      {children}
    </div>
  );
}

const inputCls = 'w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:border-indigo-400 transition-colors';
const textareaCls = inputCls + ' resize-none';

// ── StepForm Modal ─────────────────────────────────────────────────────────────
// Parses a stored storageLocation string into { preset, subPath }
function parseStorageLocation(loc) {
  if (!loc) return { preset: '', subPath: '' };
  for (const p of STORAGE_ALL) {
    if (loc === p) return { preset: p, subPath: '' };
    if (loc.startsWith(p + ' / ')) return { preset: p, subPath: loc.slice(p.length + 3) };
  }
  // Legacy: 'Download / Email Copy' was previously a storage preset; clear it
  if (loc === 'Download / Email Copy') return { preset: '', subPath: '' };
  // Other unrecognized value — treat as sub-path under CS SharePoint
  return { preset: 'CS SharePoint', subPath: loc };
}

function buildStorageLocation(preset, subPath) {
  if (!preset) return '';
  const sub = subPath.trim();
  return sub ? `${preset} / ${sub}` : preset;
}

function StepForm({ step, docSteps, allSteps, roles, docColor, onSave, onClose }) {
  const [form, setForm] = useState(() => step ? { ...step, actions: step.actions.map(a => ({...a})) } : {
    id: uid(), stageName: '', actions: [], presenterIds: [], carrierIds: [],
    notes: '', returnToStepId: null, storageLocation: '', fileOperation: '', deliveryMethod: '', informationOnly: false,
  });
  const parsed = useMemo(() => parseStorageLocation(form.storageLocation), []);
  const [storagePreset, setStoragePreset] = useState(parsed.preset);
  const [storageSubPath, setStorageSubPath] = useState(parsed.subPath);

  // Keep form.storageLocation in sync whenever preset/subpath changes
  const updateStorage = (preset, subPath) => {
    setStoragePreset(preset);
    setStorageSubPath(subPath);
    setForm(f => ({ ...f, storageLocation: buildStorageLocation(preset, subPath) }));
  };
  const showSubPath = STORAGE_SHAREPOINT.includes(storagePreset);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleArr = (k, id) => set(k, form[k].includes(id) ? form[k].filter(x => x !== id) : [...form[k], id]);

  const addAction = (type) => {
    const label = type === 'review' ? 'Review by' : type === 'approval' ? 'Approval by' : '';
    setForm(f => ({ ...f, actions: [...f.actions, { id: uid(), type, label, person: '' }] }));
  };
  const updateAction = (id, field, val) => setForm(f => ({
    ...f, actions: f.actions.map(a => a.id === id ? { ...a, [field]: val } : a)
  }));
  const removeAction = (id) => setForm(f => ({ ...f, actions: f.actions.filter(a => a.id !== id) }));
  const moveAction = (idx, dir) => {
    const arr = [...form.actions];
    const t = idx + dir;
    if (t < 0 || t >= arr.length) return;
    [arr[idx], arr[t]] = [arr[t], arr[idx]];
    setForm(f => ({ ...f, actions: arr }));
  };

  const prevSteps = (allSteps || docSteps || []).filter(s => s.id !== form.id);

  return (
    <Modal title={step ? 'Edit Step' : 'Add Step'} wide onClose={onClose}>
      <Field label="Stage / Committee Name" hint="e.g. JCCS, VPE – ELT, AQA – Langara Post, CS Consultations">
        <input className={inputCls} value={form.stageName} onChange={e => set('stageName', e.target.value)}
          placeholder="Stage name..." autoFocus />
      </Field>

      {/* Actions */}
      <Field label="Actions / Approvals Required" hint="What happens at this step? Add structured actions below.">
        <div className="space-y-2 mb-2">
          {form.actions.map((a, idx) => (
            <div key={a.id} className="flex items-start gap-2 bg-slate-50 rounded-lg p-2 border border-slate-200">
              <div className="flex flex-col gap-0.5 pt-0.5">
                <button onClick={() => moveAction(idx, -1)} disabled={idx === 0} className="text-slate-300 hover:text-slate-600 disabled:opacity-20 text-xs leading-none">▲</button>
                <button onClick={() => moveAction(idx, 1)} disabled={idx === form.actions.length - 1} className="text-slate-300 hover:text-slate-600 disabled:opacity-20 text-xs leading-none">▼</button>
              </div>
              <div className="flex-1 min-w-0">
                {a.type === 'custom' ? (
                  <input className={inputCls} value={a.label} onChange={e => updateAction(a.id, 'label', e.target.value)}
                    placeholder="Custom action description..." />
                ) : (
                  <div className="flex gap-2">
                    <input className={inputCls} value={a.label} onChange={e => updateAction(a.id, 'label', e.target.value)}
                      placeholder={a.type === 'review' ? 'Review by' : 'Approval by'} style={{ flex: '0 0 130px' }} />
                    <input className={inputCls} value={a.person} onChange={e => updateAction(a.id, 'person', e.target.value)}
                      placeholder="Who? (e.g. Dean, JCCS Chair...)" />
                  </div>
                )}
              </div>
              <button onClick={() => removeAction(a.id)} className="text-red-400 hover:text-red-600 text-sm font-bold pt-1.5 shrink-0">✕</button>
            </div>
          ))}
          {form.actions.length === 0 && <p className="text-xs text-slate-400 italic">No actions yet. Add one below.</p>}
        </div>
        <div className="flex gap-2 flex-wrap">
          <Btn sm variant="secondary" onClick={() => addAction('review')}>+ Review by ___</Btn>
          <Btn sm variant="secondary" onClick={() => addAction('approval')}>+ Approval by ___</Btn>
          <Btn sm variant="secondary" onClick={() => addAction('custom')}>+ Custom action</Btn>
        </div>
        <label className="flex items-center gap-2 cursor-pointer mt-2.5 pt-2.5 border-t border-slate-200">
          <input type="checkbox" checked={!!form.informationOnly}
            onChange={e => set('informationOnly', e.target.checked)}
            className="accent-sky-500 shrink-0" />
          <span className="text-xs text-slate-700 font-medium">Information only — no action/approval required at this step</span>
        </label>
      </Field>

      {/* Document Storage */}
      <div className="mb-4 p-3 bg-teal-50 rounded-xl border border-teal-100">
        <div className="text-sm font-semibold text-teal-800 mb-3">📁 Document Storage</div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs font-semibold text-slate-600 mb-1">File Location at This Step</label>
            <select className={inputCls} value={storagePreset}
              onChange={e => updateStorage(e.target.value, showSubPath && STORAGE_SHAREPOINT.includes(e.target.value) ? storageSubPath : '')}>
              <option value="">— Not specified —</option>
              {STORAGE_ALL.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
            {showSubPath && (
              <input className={inputCls + ' mt-1.5'} value={storageSubPath}
                onChange={e => updateStorage(storagePreset, e.target.value)}
                placeholder="Sub-folder (optional): e.g. Programs / 2025 / New" />
            )}
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-600 mb-1">Moving to Next Step</label>
            <div className="space-y-1.5 mt-1">
              {[['', 'Not specified'], ['copy', 'Copy  (original stays; copy advances)'], ['move', 'Move  (file is relocated)']].map(([val, lbl]) => (
                <label key={val} className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="fileOperation" value={val} checked={form.fileOperation === val}
                    onChange={() => set('fileOperation', val)} className="accent-teal-600" />
                  <span className="text-xs text-slate-700">{lbl}</span>
                </label>
              ))}
              <label className="flex items-start gap-2 cursor-pointer pt-1 border-t border-teal-100 mt-1">
                <input type="checkbox" checked={form.deliveryMethod === 'download_email'}
                  onChange={e => set('deliveryMethod', e.target.checked ? 'download_email' : '')}
                  className="accent-teal-600 mt-0.5 shrink-0" />
                <span className="text-xs text-slate-700">Delivered via download / email copy<br/><span className="text-slate-400">(file may still be stored in SharePoint above)</span></span>
              </label>
            </div>
          </div>
        </div>
      </div>

      {/* Responsible Parties */}
      <div className="grid grid-cols-2 gap-4 mb-4">
        <Field label="Prepares / Presents at this step" hint="Who prepares and presents/submits the doc AT this committee/meeting">
          <div className="flex flex-wrap gap-1.5">
            {roles.map(r => (
              <button key={r.id} onClick={() => toggleArr('presenterIds', r.id)}
                className={`px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors ${form.presenterIds.includes(r.id) ? 'bg-indigo-600 text-white border-indigo-600' : 'border-slate-300 text-slate-600 hover:border-indigo-400'}`}>
                {r.label.replace('Program Coordinator ', 'PC ')}
              </button>
            ))}
          </div>
        </Field>
        <Field label="Carries to next step" hint="Who is responsible for moving the doc TO the next stage">
          <div className="flex flex-wrap gap-1.5">
            {roles.map(r => (
              <button key={r.id} onClick={() => toggleArr('carrierIds', r.id)}
                className={`px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors ${form.carrierIds.includes(r.id) ? 'bg-emerald-600 text-white border-emerald-600' : 'border-slate-300 text-slate-600 hover:border-emerald-400'}`}>
                {r.label.replace('Program Coordinator ', 'PC ')}
              </button>
            ))}
          </div>
        </Field>
      </div>

      <Field label="If Rejected / Needs Revision — Return To" hint="Optional: if the document is not approved, which earlier step does it return to?">
        <select className={inputCls} value={form.returnToStepId || ''} onChange={e => set('returnToStepId', e.target.value || null)}>
          <option value="">— No return step (proceed or re-discuss) —</option>
          {prevSteps.map(s => <option key={s.id} value={s.id}>{s.stageName || '(unnamed step)'}</option>)}
        </select>
      </Field>

      <Field label="Notes" hint="Context, reminders, or clarifications — visible on hover/click in the canvas">
        <textarea className={textareaCls} rows={3} value={form.notes} onChange={e => set('notes', e.target.value)}
          placeholder="e.g. Bring signed copy; allow 2 weeks lead time; contact Jane for scheduling..." />
      </Field>

      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={() => { if (form.stageName.trim()) onSave(form); }} disabled={!form.stageName.trim()}>
          {step ? 'Save Changes' : 'Add Step'}
        </Btn>
      </div>
    </Modal>
  );
}

// ── CopyToModal ────────────────────────────────────────────────────────────────
function CopyToModal({ step, otherDocs, onCopy, otherProjects, onCopyToProject, onClose }) {
  const hasLocal = otherDocs && otherDocs.length > 0;
  const hasRemote = otherProjects && otherProjects.length > 0;
  return (
    <Modal title={`Copy "${step.stageName}" to…`} onClose={onClose}>
      <p className="text-xs text-slate-500 mb-3">
        Select a document flow to append a copy of this step to.
      </p>
      {hasLocal && (
        <>
          <div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">This Project Type</div>
          <div className="space-y-1.5 mb-3">
            {otherDocs.map(doc => (
              <button key={doc.id} onClick={() => { onCopy(doc.id); onClose(); }}
                className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-left transition-colors">
                <span className="w-3 h-3 rounded-full shrink-0" style={{ background: doc.color }} />
                <span className="font-semibold text-sm text-slate-700">{doc.name}</span>
                <span className="text-xs text-slate-400 ml-auto">{doc.steps.length} step{doc.steps.length !== 1 ? 's' : ''}</span>
              </button>
            ))}
          </div>
        </>
      )}
      {hasRemote && (
        <>
          <div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">Other Project Types</div>
          <div className="space-y-3">
            {otherProjects.map(proj => (
              <div key={proj.id}>
                <div className="text-xs font-semibold text-slate-500 mb-1 px-1">{proj.name}</div>
                {proj.documents.length === 0
                  ? <p className="text-xs text-slate-300 italic px-1">No documents</p>
                  : <div className="space-y-1">
                      {proj.documents.map(doc => (
                        <button key={doc.id} onClick={() => { onCopyToProject(proj.id, doc.id); onClose(); }}
                          className="w-full flex items-center gap-3 px-3 py-2 rounded-xl border border-slate-200 hover:border-violet-400 hover:bg-violet-50 text-left transition-colors">
                          <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: doc.color }} />
                          <span className="text-sm text-slate-600">{doc.name}</span>
                          <span className="text-xs text-slate-400 ml-auto">{doc.steps.length} step{doc.steps.length !== 1 ? 's' : ''}</span>
                        </button>
                      ))}
                    </div>
                }
              </div>
            ))}
          </div>
        </>
      )}
      {!hasLocal && !hasRemote && (
        <p className="text-sm text-slate-400 italic">No other document flows available.</p>
      )}
      <div className="flex justify-end mt-4">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

function CopyDocModal({ doc, otherProjects, onCopy, onClose }) {
  return (
    <Modal title={`Copy "${doc.name}" to…`} onClose={onClose}>
      <p className="text-xs text-slate-500 mb-3">
        Select a project type to copy this entire document flow (all {doc.steps.length} steps) into.
      </p>
      {otherProjects.length === 0
        ? <p className="text-sm text-slate-400 italic">No other project types available.</p>
        : <div className="space-y-1.5">
            {otherProjects.map(proj => (
              <button key={proj.id} onClick={() => { onCopy(proj.id); onClose(); }}
                className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border-2 border-slate-200 hover:border-violet-400 hover:bg-violet-50 text-left transition-colors">
                <span className="font-semibold text-sm text-slate-700">{proj.name}</span>
                <span className="text-xs text-slate-400 ml-auto">{proj.documents.length} doc{proj.documents.length !== 1 ? 's' : ''}</span>
              </button>
            ))}
          </div>
      }
      <div className="flex justify-end mt-4">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

// ── StepCard ───────────────────────────────────────────────────────────────────
function StepCard({ step, stepIndex, totalSteps, docSteps, roles, docColor, onEdit, onDelete, onMove, onCopyTo, returnStepName, isDragging, onDragStart, onDragEnd, onDragOver, onDrop }) {
  const [notesOpen, setNotesOpen] = useState(false);
  const [copyOpen, setCopyOpen] = useState(false);
  const roleName = (id) => {
    const r = roles.find(r => r.id === id);
    return r ? r.label.replace('Program Coordinator', 'PC') : id;
  };
  const actionIcon = (type) => type === 'review' ? '🔍' : type === 'approval' ? '✅' : '▸';

  return (
    <div className="step-card relative bg-white rounded-xl border-2 border-slate-200 overflow-hidden"
      style={{ '--doc-color': docColor, borderTopColor: docColor, borderTopWidth: 3, opacity: isDragging ? 0.4 : 1, cursor: 'grab' }}
      draggable
      onDragStart={e => { e.dataTransfer.effectAllowed = 'move'; onDragStart && onDragStart(); }}
      onDragEnd={() => onDragEnd && onDragEnd()}
      onDragOver={e => { e.preventDefault(); e.stopPropagation(); onDragOver && onDragOver(); }}
      onDrop={e => { e.preventDefault(); e.stopPropagation(); onDrop && onDrop(); }}>

      {/* Hover controls */}
      <div className="step-controls absolute top-2 right-2 flex gap-1 z-10">
        <button onClick={() => onMove(stepIndex, -1)} disabled={stepIndex === 0}
          className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs disabled:opacity-30 flex items-center justify-center">▲</button>
        <button onClick={() => onMove(stepIndex, 1)} disabled={stepIndex === totalSteps - 1}
          className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs disabled:opacity-30 flex items-center justify-center">▼</button>
        <button onClick={onEdit}
          className="w-6 h-6 rounded bg-indigo-100 hover:bg-indigo-200 text-indigo-600 text-xs flex items-center justify-center" title="Edit step">✎</button>
        {onCopyTo && (
          <button onClick={() => setCopyOpen(true)}
            className="w-6 h-6 rounded bg-violet-50 hover:bg-violet-100 text-violet-600 text-xs flex items-center justify-center" title="Copy step to another document">⎘</button>
        )}
        <button onClick={onDelete}
          className="w-6 h-6 rounded bg-red-50 hover:bg-red-100 text-red-500 text-xs flex items-center justify-center" title="Delete step">✕</button>
      </div>

      <div className="p-3">
        {/* Stage name */}
        <div className={`font-bold text-sm text-slate-800 leading-tight pr-2 ${step.informationOnly ? 'mb-1' : 'mb-2'}`}>{step.stageName}</div>
        {step.informationOnly && (
          <div className="mb-2 inline-flex items-center gap-1 text-xs font-semibold text-sky-600 bg-sky-50 border border-sky-200 rounded-full px-2 py-0.5">
            <span>ⓘ</span><span>Information Only</span>
          </div>
        )}

        {/* Actions */}
        {step.actions.length > 0 && (
          <div className="mb-2 space-y-1">
            {step.actions.map(a => (
              <div key={a.id} className="flex items-start gap-1.5 text-xs text-slate-700">
                <span className="shrink-0 mt-0.5 text-base leading-none" style={{ fontSize: 11 }}>{actionIcon(a.type)}</span>
                <span>
                  {a.type === 'custom'
                    ? a.label
                    : <><span className="font-medium">{a.label}</span>{a.person ? <span className="text-slate-500"> {a.person}</span> : null}</>
                  }
                </span>
              </div>
            ))}
          </div>
        )}

        {/* Responsible parties + storage */}
        {(step.presenterIds.length > 0 || step.carrierIds.length > 0 || step.storageLocation || step.fileOperation) && (
          <div className="border-t border-slate-100 pt-2 mt-2 space-y-1">
            {step.presenterIds.length > 0 && (
              <div className="text-xs text-slate-500">
                <span className="font-semibold text-indigo-600">Prepares/Presents: </span>
                {step.presenterIds.map(roleName).join(', ')}
              </div>
            )}
            {step.carrierIds.length > 0 && (
              <div className="text-xs text-slate-500">
                <span className="font-semibold text-emerald-600">Carries to next: </span>
                {step.carrierIds.map(roleName).join(', ')}
              </div>
            )}
            {step.storageLocation && (
              <div className="text-xs text-teal-700">
                <span className="font-semibold">📁 </span>{step.storageLocation}
              </div>
            )}
          </div>
        )}

        {/* Return path */}
        {step.returnToStepId && returnStepName && (
          <div className="mt-2 pt-2 border-t border-dashed border-amber-300 text-xs text-amber-700 flex items-start gap-1">
            <span className="shrink-0">↩</span>
            <span><span className="font-semibold">If rejected:</span> returns to "{returnStepName}"</span>
          </div>
        )}

        {/* Notes toggle */}
        {step.notes && (
          <div className="mt-2 pt-2 border-t border-slate-100">
            <button onClick={() => setNotesOpen(o => !o)}
              className="text-xs text-slate-400 hover:text-slate-600 flex items-center gap-1">
              <span>{notesOpen ? '▾' : '▸'}</span>
              <span>📝 Notes</span>
            </button>
            <div className={`notes-expand ${notesOpen ? 'open' : ''}`}>
              <p className="text-xs text-slate-500 mt-1 bg-amber-50 rounded p-2 border border-amber-100">{step.notes}</p>
            </div>
          </div>
        )}
      </div>
      {copyOpen && onCopyTo && (
        <CopyToModal step={step}
          otherDocs={onCopyTo.otherDocs}
          onCopy={onCopyTo.copy}
          otherProjects={onCopyTo.otherProjects}
          onCopyToProject={onCopyTo.copyToProject}
          onClose={() => setCopyOpen(false)} />
      )}
    </div>
  );
}

// ── DocumentColumn ─────────────────────────────────────────────────────────────
function DocumentColumn({ doc, docIndex, totalDocs, onMoveDoc, projectTypeId, roles, store, onUpdateDoc, onDeleteDoc, otherDocs, otherProjects, onCopyStepToDoc, onCopyStepToProject, onCopyDocToProject, dragRef, dropTarget, setDropTarget, onMoveStepDrop }) {
  const [addingStep, setAddingStep] = useState(false);
  const [editStep, setEditStep] = useState(null);
  const [editDocName, setEditDocName] = useState(false);
  const [docNameVal, setDocNameVal] = useState(doc.name);
  const [copyDocOpen, setCopyDocOpen] = useState(false);

  const saveStep = (stepData) => {
    const existing = doc.steps.find(s => s.id === stepData.id);
    const steps = existing
      ? doc.steps.map(s => s.id === stepData.id ? stepData : s)
      : [...doc.steps, stepData];
    onUpdateDoc({ ...doc, steps });
    setAddingStep(false);
    setEditStep(null);
  };

  const deleteStep = (id) => {
    if (!confirm('Delete this step?')) return;
    onUpdateDoc({ ...doc, steps: doc.steps.filter(s => s.id !== id) });
  };

  const moveStep = (idx, dir) => {
    const steps = [...doc.steps];
    const t = idx + dir;
    if (t < 0 || t >= steps.length) return;
    [steps[idx], steps[t]] = [steps[t], steps[idx]];
    onUpdateDoc({ ...doc, steps });
  };

  const saveName = () => {
    if (docNameVal.trim()) onUpdateDoc({ ...doc, name: docNameVal.trim() });
    setEditDocName(false);
  };

  const returnStepName = (id) => doc.steps.find(s => s.id === id)?.stageName;

  return (
    <div className="doc-col flex flex-col">
      {/* Column header */}
      <div className="rounded-xl mb-3 px-3 py-2.5 flex items-center gap-2 no-print"
        style={{ background: doc.color + '18', borderBottom: `3px solid ${doc.color}` }}>
        {editDocName ? (
          <input className="flex-1 text-sm font-bold bg-white border rounded px-2 py-0.5 border-slate-300"
            value={docNameVal} onChange={e => setDocNameVal(e.target.value)}
            onBlur={saveName} onKeyDown={e => e.key === 'Enter' && saveName()} autoFocus />
        ) : (
          <span className="flex-1 font-bold text-sm truncate" style={{ color: doc.color }}
            onDoubleClick={() => { setDocNameVal(doc.name); setEditDocName(true); }}
            title="Double-click to rename">{doc.name}</span>
        )}
        <div className="flex gap-0.5 shrink-0">
          <button onClick={() => onMoveDoc(-1)} disabled={docIndex === 0}
            className="w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Move column left">◀</button>
          <button onClick={() => onMoveDoc(1)} disabled={docIndex === totalDocs - 1}
            className="w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Move column right">▶</button>
          <button onClick={() => { setDocNameVal(doc.name); setEditDocName(true); }}
            className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Rename">✎</button>
          <input type="color" value={doc.color}
            onChange={e => onUpdateDoc({ ...doc, color: e.target.value })}
            className="w-5 h-5 rounded cursor-pointer border-0 p-0 bg-transparent" title="Change color" />
          {otherProjects && otherProjects.length > 0 && (
            <button onClick={() => setCopyDocOpen(true)}
              className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Copy document to another project type">⎘</button>
          )}
          <button onClick={() => { if (confirm(`Delete "${doc.name}" and all its steps?`)) onDeleteDoc(doc.id); }}
            className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-red-100 text-red-400 transition-colors" title="Delete document">✕</button>
        </div>
      </div>

      {/* Print header */}
      <div className="rounded-xl mb-3 px-3 py-2.5 hidden" style={{ background: doc.color + '18', borderBottom: `3px solid ${doc.color}` }}
        id={`print-header-${doc.id}`}>
        <span className="font-bold text-sm" style={{ color: doc.color }}>{doc.name}</span>
      </div>

      {/* Steps */}
      <div className="flex-1 space-y-0"
        onDragOver={e => { e.preventDefault(); if (dragRef?.current) setDropTarget({ docId: doc.id, atEnd: true }); }}
        onDrop={e => { e.preventDefault(); if (dragRef?.current) { const { stepId, srcDocId } = dragRef.current; onMoveStepDrop(srcDocId, stepId, doc.id, null); } }}>
        {doc.steps.length === 0 && (
          <div className="text-center py-8 text-slate-400 text-xs border-2 border-dashed border-slate-200 rounded-xl">
            No steps yet.<br />Click below to add.
          </div>
        )}
        {doc.steps.map((step, i) => (
          <div key={step.id}>
            {/* Drop indicator above this step */}
            {dropTarget?.docId === doc.id && dropTarget?.beforeStepId === step.id && (
              <div className="h-1 rounded mx-1 my-0.5" style={{ background: doc.color }} />
            )}
            <StepCard
              step={step}
              stepIndex={i}
              totalSteps={doc.steps.length}
              docSteps={doc.steps}
              roles={roles}
              docColor={doc.color}
              onEdit={() => setEditStep(step)}
              onDelete={() => deleteStep(step.id)}
              onMove={moveStep}
              returnStepName={step.returnToStepId ? returnStepName(step.returnToStepId) : null}
              onCopyTo={(otherDocs && otherDocs.length > 0) || (otherProjects && otherProjects.length > 0) ? {
                otherDocs: otherDocs || [],
                copy: (targetDocId) => onCopyStepToDoc(step, targetDocId),
                otherProjects: otherProjects || [],
                copyToProject: (targetProjId, targetDocId) => onCopyStepToProject(step, targetProjId, targetDocId),
              } : null}
              isDragging={dragRef?.current?.stepId === step.id}
              onDragStart={() => { dragRef.current = { stepId: step.id, srcDocId: doc.id }; }}
              onDragEnd={() => { dragRef.current = null; setDropTarget(null); }}
              onDragOver={() => { if (dragRef?.current) setDropTarget({ docId: doc.id, beforeStepId: step.id }); }}
              onDrop={() => { if (dragRef?.current) { const { stepId, srcDocId } = dragRef.current; onMoveStepDrop(srcDocId, stepId, doc.id, step.id); } }}
            />
            {/* Arrow between steps */}
            {i < doc.steps.length - 1 && (() => {
              const s = doc.steps[i];
              const opLabel = s.fileOperation === 'copy' ? 'Document Copied'
                            : s.fileOperation === 'move' ? 'Document Moved' : null;
              const dlLabel = s.deliveryMethod === 'download_email' ? 'Document Emailed as Attachment' : null;
              const arrowLabel = [opLabel, dlLabel].filter(Boolean).join(' · ');
              return (
                <div className="flex flex-col items-center py-1">
                  {arrowLabel && (
                    <span className="text-xs italic mb-0.5 text-center leading-tight" style={{ color: doc.color }}>{arrowLabel}</span>
                  )}
                  <svg width="20" height="20" viewBox="0 0 20 20">
                    <line x1="10" y1="1" x2="10" y2="14" stroke={doc.color} strokeWidth="2" strokeOpacity="0.6" />
                    <polygon points="10,19 5,11 15,11" fill={doc.color} fillOpacity="0.7" />
                  </svg>
                </div>
              );
            })()}
          </div>
        ))}
        {/* Drop indicator at end of column */}
        {dropTarget?.docId === doc.id && dropTarget?.atEnd && (
          <div className="h-1 rounded mx-1 mt-0.5" style={{ background: doc.color }} />
        )}
      </div>

      {/* Add Step */}
      <div className="mt-3 no-print">
        <button onClick={() => setAddingStep(true)}
          className="w-full py-2 rounded-xl text-xs font-semibold border-2 border-dashed transition-colors hover:bg-white"
          style={{ borderColor: doc.color + '60', color: doc.color }}>
          + Add Step
        </button>
      </div>

      {/* End marker */}
      <div className="mt-2 rounded-lg py-1.5 px-3 text-center text-xs font-semibold"
        style={{ background: doc.color + '15', color: doc.color }}>
        ✓ Complete
      </div>

      {(addingStep || editStep) && (
        <StepForm
          step={editStep}
          docSteps={doc.steps}
          roles={roles}
          docColor={doc.color}
          onSave={saveStep}
          onClose={() => { setAddingStep(false); setEditStep(null); }}
        />
      )}
      {copyDocOpen && (
        <CopyDocModal doc={doc} otherProjects={otherProjects || []}
          onCopy={(targetProjId) => onCopyDocToProject(doc, targetProjId)}
          onClose={() => setCopyDocOpen(false)} />
      )}
    </div>
  );
}

// ── ProjectTypeCanvas ──────────────────────────────────────────────────────────
function ProjectTypeCanvas({ projectType, roles, onUpdateProjectType, allProjectTypes, onCopyStepToProject, onCopyDocToProject }) {
  const dragRef = React.useRef(null);
  const [dropTarget, setDropTarget] = React.useState(null);

  const updateDoc = (updated) => {
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.map(d => d.id === updated.id ? updated : d),
      updatedAt: new Date().toISOString(),
    });
  };

  const deleteDoc = (id) => {
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.filter(d => d.id !== id),
      updatedAt: new Date().toISOString(),
    });
  };

  const addDocument = () => {
    const name = prompt('Document name:');
    if (!name?.trim()) return;
    const colors = ['#0891b2', '#d97706', '#9333ea', '#0d9488', '#db2777'];
    const color = colors[projectType.documents.length % colors.length];
    onUpdateProjectType({
      ...projectType,
      documents: [...projectType.documents, { id: uid(), name: name.trim(), color, steps: [] }],
      updatedAt: new Date().toISOString(),
    });
  };

  if (projectType.documents.length === 0) {
    return (
      <div className="flex flex-col items-center justify-center h-64 text-slate-400">
        <div className="text-4xl mb-3">📄</div>
        <p className="text-sm mb-3">No documents defined for this project type.</p>
        <Btn onClick={addDocument}>+ Add Document Type</Btn>
      </div>
    );
  }

  const moveDoc = (id, dir) => {
    const arr = [...projectType.documents];
    const idx = arr.findIndex(d => d.id === id);
    const t = idx + dir;
    if (t < 0 || t >= arr.length) return;
    [arr[idx], arr[t]] = [arr[t], arr[idx]];
    onUpdateProjectType({ ...projectType, documents: arr, updatedAt: new Date().toISOString() });
  };

  const copyStepToDoc = (step, targetDocId) => {
    const newStep = { ...step, id: uid(), actions: step.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null };
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.map(d =>
        d.id === targetDocId ? { ...d, steps: [...d.steps, newStep] } : d
      ),
      updatedAt: new Date().toISOString(),
    });
  };

  const moveStepDrop = (srcDocId, stepId, targetDocId, beforeStepId) => {
    const srcDoc = projectType.documents.find(d => d.id === srcDocId);
    if (!srcDoc) return;
    const step = srcDoc.steps.find(s => s.id === stepId);
    if (!step) return;
    const movingStep = srcDocId !== targetDocId ? { ...step, returnToStepId: null } : step;
    const newDocs = projectType.documents.map(d => {
      const isSrc = d.id === srcDocId;
      const isTgt = d.id === targetDocId;
      if (!isSrc && !isTgt) return d;
      if (isSrc && isTgt) {
        // reorder within same doc
        let steps = d.steps.filter(s => s.id !== stepId);
        const insertIdx = beforeStepId ? steps.findIndex(s => s.id === beforeStepId) : steps.length;
        steps.splice(insertIdx < 0 ? steps.length : insertIdx, 0, movingStep);
        return { ...d, steps };
      }
      if (isSrc) return { ...d, steps: d.steps.filter(s => s.id !== stepId) };
      // isTgt
      let steps = [...d.steps];
      const insertIdx = beforeStepId ? steps.findIndex(s => s.id === beforeStepId) : steps.length;
      steps.splice(insertIdx < 0 ? steps.length : insertIdx, 0, movingStep);
      return { ...d, steps };
    });
    onUpdateProjectType({ ...projectType, documents: newDocs, updatedAt: new Date().toISOString() });
    setDropTarget(null);
    dragRef.current = null;
  };

  return (
    <div className="flex flex-col h-full">
      <div className="overflow-x-auto overflow-y-auto flex-1 pb-4" id="canvas-print-area">
        <div className="flex gap-4 items-start p-4" style={{ minWidth: 'max-content' }}>
          {projectType.documents.map((doc, docIdx) => (
            <DocumentColumn
              key={doc.id}
              doc={doc}
              docIndex={docIdx}
              totalDocs={projectType.documents.length}
              onMoveDoc={(dir) => moveDoc(doc.id, dir)}
              projectTypeId={projectType.id}
              otherDocs={projectType.documents.filter(d => d.id !== doc.id)}
              otherProjects={(allProjectTypes || []).filter(p => p.id !== projectType.id)}
              onCopyStepToDoc={copyStepToDoc}
              onCopyStepToProject={onCopyStepToProject}
              onCopyDocToProject={onCopyDocToProject}
              roles={roles}
              onUpdateDoc={updateDoc}
              onDeleteDoc={deleteDoc}
              dragRef={dragRef}
              dropTarget={dropTarget}
              setDropTarget={setDropTarget}
              onMoveStepDrop={moveStepDrop}
            />
          ))}
          {/* Add document column button */}
          <div className="doc-col no-print">
            <button onClick={addDocument}
              className="w-full h-24 rounded-xl border-2 border-dashed border-slate-300 text-slate-400 hover:border-indigo-400 hover:text-indigo-500 transition-colors text-sm font-medium flex flex-col items-center justify-center gap-1">
              <span className="text-2xl">+</span>
              <span>Add Document</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── ProjectTypeEditor Modal ────────────────────────────────────────────────────
function ProjectTypeEditor({ store, onUpdateStore, onClose }) {
  const [pts, setPts] = useState(store.projectTypes.map(pt => ({ ...pt })));
  const [newName, setNewName] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState('');

  const add = () => {
    if (!newName.trim()) return;
    setPts(prev => [...prev, { id: uid(), name: newName.trim(), documents: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }]);
    setNewName('');
  };
  const del = (id) => { if (confirm('Delete this project type?')) setPts(prev => prev.filter(p => p.id !== id)); };
  const rename = (id) => {
    if (renameVal.trim()) setPts(prev => prev.map(p => p.id === id ? { ...p, name: renameVal.trim() } : p));
    setRenamingId(null);
  };
  const save = () => { onUpdateStore({ ...store, projectTypes: pts }); onClose(); };

  return (
    <Modal title="Manage Project / Program Types" onClose={onClose}>
      <p className="text-xs text-slate-500 mb-4">Project types define the top-level category. Documents and steps are configured directly on the canvas.</p>
      <div className="space-y-2 mb-4">
        {pts.map(pt => (
          <div key={pt.id} className="flex items-center gap-2 border rounded-lg px-3 py-2">
            {renamingId === pt.id ? (
              <input className={inputCls + ' flex-1'} value={renameVal} onChange={e => setRenameVal(e.target.value)}
                autoFocus onBlur={() => rename(pt.id)} onKeyDown={e => e.key === 'Enter' && rename(pt.id)} />
            ) : (
              <span className="flex-1 text-sm font-medium">{pt.name}</span>
            )}
            <button className="text-xs text-indigo-500 hover:underline" onClick={() => { setRenamingId(pt.id); setRenameVal(pt.name); }}>Rename</button>
            <button className="text-xs text-red-400 hover:underline" onClick={() => del(pt.id)}>Delete</button>
          </div>
        ))}
      </div>
      <div className="flex gap-2 mb-4">
        <input className={inputCls} value={newName} onChange={e => setNewName(e.target.value)} placeholder="New project type name..."
          onKeyDown={e => e.key === 'Enter' && add()} />
        <Btn onClick={add}>Add</Btn>
      </div>
      <div className="flex justify-end gap-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={save}>Save Changes</Btn>
      </div>
    </Modal>
  );
}

// ── RolesEditor Modal ──────────────────────────────────────────────────────────
function RolesEditor({ store, onUpdateStore, onClose }) {
  const [roles, setRoles] = useState(store.roles);
  const [newRole, setNewRole] = useState('');
  const add = () => { if (!newRole.trim()) return; setRoles(r => [...r, { id: uid(), label: newRole.trim() }]); setNewRole(''); };
  const del = (id) => setRoles(r => r.filter(x => x.id !== id));
  const save = () => { onUpdateStore({ ...store, roles }); onClose(); };
  return (
    <Modal title="Manage Roles & Responsible Parties" onClose={onClose}>
      <p className="text-xs text-slate-500 mb-3">These roles appear when setting who presents at a step or carries documents to the next step.</p>
      <div className="space-y-2 mb-4">
        {roles.map(r => (
          <div key={r.id} className="flex items-center gap-2 border rounded-lg px-3 py-2">
            <span className="flex-1 text-sm">{r.label}</span>
            <button onClick={() => del(r.id)} className="text-xs text-red-400 hover:underline">Remove</button>
          </div>
        ))}
      </div>
      <div className="flex gap-2 mb-4">
        <input className={inputCls} value={newRole} onChange={e => setNewRole(e.target.value)} placeholder="New role or person..."
          onKeyDown={e => e.key === 'Enter' && add()} />
        <Btn onClick={add}>Add</Btn>
      </div>
      <div className="flex justify-end gap-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={save}>Save</Btn>
      </div>
    </Modal>
  );
}

// ── BackupModal ────────────────────────────────────────────────────────────────
function BackupModal({ store, onRestore, onClose }) {
  const fileRef = useRef(null);
  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `langara-pipeline-v2-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const importBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.projectTypes || !data.roles) { alert('Invalid backup file.'); return; }
        if (!confirm('Replace ALL current data with this backup?')) return;
        onRestore(data); onClose();
      } catch { alert('Could not read file.'); }
    };
    reader.readAsText(file);
  };
  return (
    <Modal title="Backup & Restore" onClose={onClose}>
      <div className="space-y-4">
        <div className="border rounded-lg p-4 bg-slate-50">
          <div className="font-semibold text-sm mb-1">Export Backup</div>
          <p className="text-xs text-slate-500 mb-3">Downloads all project types, documents, steps, templates, and roles as a JSON file.</p>
          <Btn onClick={exportBackup}>⬇ Download Backup</Btn>
        </div>
        <div className="border rounded-lg p-4 bg-slate-50">
          <div className="font-semibold text-sm mb-1">Restore from Backup</div>
          <p className="text-xs text-red-500 mb-3">⚠ This will overwrite all current data.</p>
          <input type="file" accept=".json" ref={fileRef} onChange={importBackup} className="hidden" />
          <Btn variant="secondary" onClick={() => fileRef.current.click()}>⬆ Import Backup File</Btn>
        </div>
      </div>
      <div className="flex justify-end mt-4">
        <Btn variant="secondary" onClick={onClose}>Close</Btn>
      </div>
    </Modal>
  );
}

// ── TemplateSaveModal ──────────────────────────────────────────────────────────
function TemplateSaveModal({ projectType, onSave, onClose }) {
  const [name, setName] = useState(projectType.name + ' (Template)');
  return (
    <Modal title="Save as Template" onClose={onClose}>
      <p className="text-sm text-slate-500 mb-4">Saves this project type's documents and all their steps as a reusable template.</p>
      <Field label="Template Name">
        <input className={inputCls} value={name} onChange={e => setName(e.target.value)} autoFocus />
      </Field>
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={() => { if (name.trim()) onSave(name.trim()); }}>Save Template</Btn>
      </div>
    </Modal>
  );
}

// ── NewProjectTypeModal ────────────────────────────────────────────────────────
function NewProjectTypeModal({ store, onCreate, onClose }) {
  const [name, setName] = useState('');
  const [fromTemplate, setFromTemplate] = useState('');

  const create = () => {
    if (!name.trim()) return;
    let documents = [];
    if (fromTemplate) {
      const tmpl = store.templates.find(t => t.id === fromTemplate);
      if (tmpl) {
        documents = tmpl.projectType.documents.map(d => ({
          ...d, id: uid(),
          steps: d.steps.map(s => ({ ...s, id: uid(), actions: s.actions.map(a => ({...a, id: uid()})) }))
        }));
      }
    }
    onCreate({ id: uid(), name: name.trim(), documents, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
  };

  return (
    <Modal title="New Project / Program Type" onClose={onClose}>
      <Field label="Project Type Name" hint="e.g. New Program, Course Changes, Micro-Credential">
        <input className={inputCls} value={name} onChange={e => setName(e.target.value)} placeholder="Project type name..." autoFocus
          onKeyDown={e => e.key === 'Enter' && create()} />
      </Field>
      {store.templates.length > 0 && (
        <Field label="Start from Template (optional)" hint="Copy documents and steps from an existing template">
          <select className={inputCls} value={fromTemplate} onChange={e => setFromTemplate(e.target.value)}>
            <option value="">— Start blank —</option>
            {store.templates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </Field>
      )}
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={create} disabled={!name.trim()}>Create</Btn>
      </div>
    </Modal>
  );
}

// ── Print / PDF generator ──────────────────────────────────────────────────────
function generatePrintHTML(projectType, roles) {
  const numCols = projectType.documents.length;
  const zoom = Math.min(1, 870 / Math.max(1, numCols * 190)).toFixed(3);

  const roleLabel = (ids) =>
    (ids || []).map(id => roles.find(r => r.id === id)?.label ?? id).join(', ');

  const actionIcon = (type) => type === 'review' ? '🔍' : type === 'approval' ? '✅' : '▸';

  const stepHTML = (step, color) => {
    const actions = (step.actions || []).map(a =>
      `<div class="action">${actionIcon(a.type)} ${a.type === 'custom' ? a.label : `<b>${a.label}</b>${a.person ? ' ' + a.person : ''}`}</div>`
    ).join('');

    const parties = [];
    if (step.presenterIds?.length) parties.push(`<span class="lbl-indigo">Prepares/Presents:</span> ${roleLabel(step.presenterIds)}`);
    if (step.carrierIds?.length) parties.push(`<span class="lbl-green">Carries to next:</span> ${roleLabel(step.carrierIds)}`);

    const storage = [];
    if (step.storageLocation) storage.push(`📁 ${step.storageLocation}`);
    if (step.fileOperation) storage.push(step.fileOperation === 'copy' ? '⎘ Copies forward' : '→ Moves forward');

    const rejection = step.returnToStepId ? '<div class="rejection">↩ If rejected, returns to an earlier step</div>' : '';
    const notes = step.notes ? `<div class="notes">📝 ${step.notes}</div>` : '';

    return `
      <div class="step" style="border-top-color:${color}">
        <div class="step-name">${step.stageName || '(unnamed)'}</div>
        ${actions ? `<div class="actions">${actions}</div>` : ''}
        ${parties.length ? `<div class="parties">${parties.join('<br>')}</div>` : ''}
        ${storage.length ? `<div class="storage">${storage.join(' &nbsp;·&nbsp; ')}</div>` : ''}
        ${rejection}
        ${notes}
      </div>`;
  };

  const colsHTML = projectType.documents.map(doc => `
    <div class="col">
      <div class="col-header" style="background:${doc.color}18;color:${doc.color};border-bottom:2px solid ${doc.color}">${doc.name}</div>
      ${doc.steps.length === 0
        ? '<div class="empty">No steps defined</div>'
        : doc.steps.map((s, i) =>
            stepHTML(s, doc.color) + (i < doc.steps.length - 1 ? `<div class="arrow" style="color:${doc.color}">↓</div>` : '')
          ).join('')
      }
      <div class="complete" style="color:${doc.color};border-color:${doc.color}20;background:${doc.color}10">✓ Complete</div>
    </div>`).join('');

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
  @page { size: landscape; margin: 1.2cm; }
  body { font-family: system-ui, sans-serif; font-size: 9px; margin: 0; zoom: ${zoom}; }
  h1 { font-size: 13px; font-weight: bold; margin: 0 0 2px; }
  .subtitle { font-size: 8px; color: #64748b; margin: 0 0 10px; }
  .columns { display: flex; gap: 8px; align-items: flex-start; }
  .col { flex: 1; min-width: 0; }
  .col-header { font-weight: bold; font-size: 9.5px; padding: 4px 6px; border-radius: 4px 4px 0 0; margin-bottom: 5px; }
  .step { border: 1px solid #e2e8f0; border-top-width: 2px; border-radius: 5px; padding: 5px 6px; margin-bottom: 2px; background: #fff; }
  .step-name { font-weight: bold; font-size: 9px; margin-bottom: 2px; color: #1e293b; }
  .actions { margin-bottom: 3px; }
  .action { font-size: 8px; color: #374151; line-height: 1.5; }
  .action b { color: #1e293b; }
  .parties { font-size: 7.5px; color: #64748b; border-top: 1px solid #f1f5f9; padding-top: 2px; margin-top: 2px; line-height: 1.6; }
  .lbl-indigo { font-weight: bold; color: #4f46e5; }
  .lbl-green  { font-weight: bold; color: #059669; }
  .storage { font-size: 7.5px; color: #0d9488; margin-top: 2px; border-top: 1px solid #f0fdfa; padding-top: 2px; }
  .rejection { font-size: 7.5px; color: #b45309; margin-top: 2px; border-top: 1px dashed #fcd34d; padding-top: 2px; }
  .notes { font-size: 7.5px; color: #78716c; background: #fefce8; border: 1px solid #fef08a; border-radius: 3px; padding: 2px 4px; margin-top: 2px; }
  .arrow { text-align: center; font-size: 11px; line-height: 1.2; margin: 1px 0; }
  .complete { text-align: center; font-size: 8px; font-weight: bold; padding: 3px; border-radius: 4px; border: 1px solid; margin-top: 4px; }
  .empty { font-size: 8px; color: #94a3b8; font-style: italic; padding: 8px; text-align: center; }
</style>
</head>
<body>
  <h1>${projectType.name} — Program Development Pipeline</h1>
  <div class="subtitle">Continuing Studies · Langara College &nbsp;|&nbsp; Generated ${new Date().toLocaleDateString('en-CA', { year:'numeric', month:'long', day:'numeric' })}</div>
  <div class="columns">${colsHTML}</div>
  <script>window.onload = () => { window.print(); };<\/script>
</body>
</html>`;
}

// ── App ────────────────────────────────────────────────────────────────────────
function App() {
  const [store, updateStore] = useStore();
  const [modal, setModal] = useState(null);

  const activePT = store.projectTypes.find(p => p.id === store.activeProjectTypeId) || store.projectTypes[0];

  const setActivePT = (id) => updateStore(s => ({ ...s, activeProjectTypeId: id }));

  const updatePT = (updated) => {
    updateStore(s => ({ ...s, projectTypes: s.projectTypes.map(p => p.id === updated.id ? updated : p) }));
  };

  const deletePT = (id) => {
    if (!confirm('Delete this project type and all its data?')) return;
    updateStore(s => {
      const pts = s.projectTypes.filter(p => p.id !== id);
      return { ...s, projectTypes: pts, activeProjectTypeId: pts[0]?.id || null };
    });
  };

  const movePT = (id, dir) => {
    updateStore(s => {
      const arr = [...s.projectTypes];
      const idx = arr.findIndex(p => p.id === id);
      const t = idx + dir;
      if (t < 0 || t >= arr.length) return s;
      [arr[idx], arr[t]] = [arr[t], arr[idx]];
      return { ...s, projectTypes: arr };
    });
  };

  const createPT = (pt) => {
    updateStore(s => ({ ...s, projectTypes: [...s.projectTypes, pt], activeProjectTypeId: pt.id }));
    setModal(null);
  };

  const copyStepToProject = (step, targetProjectId, targetDocId) => {
    updateStore(s => ({
      ...s,
      projectTypes: s.projectTypes.map(pt => {
        if (pt.id !== targetProjectId) return pt;
        const newStep = { ...step, id: uid(), actions: step.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null };
        return { ...pt, documents: pt.documents.map(d =>
          d.id === targetDocId ? { ...d, steps: [...d.steps, newStep] } : d
        ), updatedAt: new Date().toISOString() };
      })
    }));
  };

  const copyDocToProject = (doc, targetProjectId) => {
    updateStore(s => ({
      ...s,
      projectTypes: s.projectTypes.map(pt => {
        if (pt.id !== targetProjectId) return pt;
        const newDoc = { ...doc, id: uid(), steps: doc.steps.map(s => ({ ...s, id: uid(), actions: s.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null })) };
        return { ...pt, documents: [...pt.documents, newDoc], updatedAt: new Date().toISOString() };
      })
    }));
  };

  const saveTemplate = (name) => {
    if (!activePT) return;
    const tmpl = {
      id: uid(), name,
      projectType: { name: activePT.name, documents: activePT.documents }
    };
    updateStore(s => ({ ...s, templates: [...s.templates, tmpl] }));
    setModal(null);
    alert(`Template "${name}" saved!`);
  };

  const deleteTemplate = (id) => {
    if (!confirm('Delete this template?')) return;
    updateStore(s => ({ ...s, templates: s.templates.filter(t => t.id !== id) }));
  };

  return (
    <div className="flex h-screen overflow-hidden bg-slate-100">
      {/* Sidebar */}
      <aside className="w-60 bg-white border-r border-slate-200 flex flex-col shrink-0 no-print">
        <div className="p-4 border-b border-slate-200">
          <div className="font-bold text-slate-800 text-sm leading-tight">CS Pipeline Tool</div>
          <div className="text-xs text-slate-400 mt-0.5">Continuing Studies · Langara</div>
          <div className="text-xs text-indigo-500 font-semibold mt-0.5">v2</div>
        </div>

        <div className="flex-1 overflow-y-auto p-3">
          {/* Project Types */}
          <div className="flex items-center justify-between mb-2 px-1">
            <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Project Types</span>
            <button onClick={() => setModal('newPT')} className="text-indigo-600 hover:text-indigo-800 text-lg font-bold leading-none" title="New project type">+</button>
          </div>

          {store.projectTypes.map((pt, idx) => (
            <div key={pt.id}
              onClick={() => setActivePT(pt.id)}
              className={`group flex items-center gap-1 px-2 py-2 rounded-lg cursor-pointer mb-1 transition-colors ${pt.id === activePT?.id ? 'bg-indigo-600 text-white' : 'text-slate-700 hover:bg-slate-100'}`}>
              <span className="text-sm font-medium truncate flex-1">{pt.name}</span>
              <div className="opacity-0 group-hover:opacity-100 flex gap-0.5 shrink-0">
                <button onClick={e => { e.stopPropagation(); movePT(pt.id, -1); }} disabled={idx === 0}
                  className={`w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 ${pt.id === activePT?.id ? 'hover:bg-indigo-500' : 'hover:bg-slate-200'}`}
                  title="Move up">▲</button>
                <button onClick={e => { e.stopPropagation(); movePT(pt.id, 1); }} disabled={idx === store.projectTypes.length - 1}
                  className={`w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 ${pt.id === activePT?.id ? 'hover:bg-indigo-500' : 'hover:bg-slate-200'}`}
                  title="Move down">▼</button>
                {pt.id !== activePT?.id && (
                  <button onClick={e => { e.stopPropagation(); deletePT(pt.id); }}
                    className="w-5 h-5 rounded text-xs flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50"
                    title="Delete">✕</button>
                )}
              </div>
            </div>
          ))}

          {/* Templates */}
          {store.templates.length > 0 && (
            <div className="mt-4">
              <div className="text-xs font-bold text-slate-400 uppercase tracking-widest px-1 mb-2">Templates</div>
              {store.templates.map(t => (
                <div key={t.id} className="group flex items-center justify-between px-3 py-1.5 rounded-lg mb-1 text-slate-500 hover:bg-slate-50">
                  <span className="text-xs truncate flex-1">{t.name}</span>
                  <button onClick={() => deleteTemplate(t.id)} className="opacity-0 group-hover:opacity-100 text-red-400 text-xs ml-1">✕</button>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Bottom settings */}
        <div className="p-3 border-t border-slate-200 space-y-1">
          <button onClick={() => setModal('manageTypes')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>🗂</span> Manage Project Types
          </button>
          <button onClick={() => setModal('roles')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>👥</span> Roles &amp; People
          </button>
          <button onClick={() => setModal('backup')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>💾</span> Backup &amp; Restore
          </button>
          <button onClick={() => {
            if (!confirm('Reset ALL data to the original defaults?')) return;
            updateStore(getDefaultStore());
          }} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-red-50 hover:text-red-600 flex items-center gap-2">
            <span>↺</span> Reset to Defaults
          </button>
        </div>
      </aside>

      {/* Main area */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        {/* Top bar */}
        <header className="bg-white border-b border-slate-200 px-5 py-2.5 flex items-center gap-3 shrink-0 no-print">
          <div className="flex-1 min-w-0">
            {activePT ? (
              <>
                <h1 className="font-bold text-slate-800 text-base truncate">{activePT.name}</h1>
                <div className="text-xs text-slate-400">{activePT.documents.length} document type{activePT.documents.length !== 1 ? 's' : ''} &middot; Updated {new Date(activePT.updatedAt).toLocaleDateString()}</div>
              </>
            ) : (
              <h1 className="font-bold text-slate-400">No project type selected</h1>
            )}
          </div>
          {activePT && (
            <div className="flex items-center gap-2 shrink-0">
              <Btn variant="secondary" sm onClick={() => setModal('saveTemplate')}>☆ Save as Template</Btn>
              <Btn variant="secondary" sm onClick={() => {
                const html = generatePrintHTML(activePT, store.roles);
                const win = window.open('', '_blank');
                if (win) { win.document.write(html); win.document.close(); }
                else alert('Pop-up blocked. Please allow pop-ups for this page and try again.');
              }}>🖨 Print / Export PDF</Btn>
            </div>
          )}
        </header>

        {/* Canvas */}
        <div className="flex-1 min-h-0 overflow-hidden">
          {activePT ? (
            <ProjectTypeCanvas
              projectType={activePT}
              roles={store.roles}
              onUpdateProjectType={updatePT}
              allProjectTypes={store.projectTypes}
              onCopyStepToProject={copyStepToProject}
              onCopyDocToProject={copyDocToProject}
            />
          ) : (
            <div className="flex items-center justify-center h-full text-slate-400">
              <div className="text-center">
                <div className="text-4xl mb-3">📋</div>
                <p className="text-sm">No project type selected. Create one using the sidebar.</p>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Modals */}
      {modal === 'newPT' && <NewProjectTypeModal store={store} onCreate={createPT} onClose={() => setModal(null)} />}
      {modal === 'manageTypes' && <ProjectTypeEditor store={store} onUpdateStore={s => updateStore(s)} onClose={() => setModal(null)} />}
      {modal === 'roles' && <RolesEditor store={store} onUpdateStore={s => updateStore(s)} onClose={() => setModal(null)} />}
      {modal === 'backup' && <BackupModal store={store} onRestore={data => updateStore(data)} onClose={() => setModal(null)} />}
      {modal === 'saveTemplate' && activePT && <TemplateSaveModal projectType={activePT} onSave={saveTemplate} onClose={() => setModal(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
