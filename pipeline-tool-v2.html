// ── Step Flow print / PDF generator ────────────────────────────────────────────
// The Step Flow view needs its own renderer, same as the document canvas —
// the React components aren't reused for print.
// NOTE: no optional chaining on computed members (?.[expr]) in here; the pinned
// Babel standalone build chokes on it and blanks the page.
function generateFlowPrintHTML(projectType, roles, prefs) {
  const details = (prefs && prefs.details) || NO_DETAILS;
  const hidden = new Set((prefs && prefs.hidden) || []);
  const fullSpine = buildStepSpine(projectType);
  const spine = fullSpine.filter(n => !hidden.has(n.key));
  const docs = projectType.documents || [];
  const anyDetail = FLOW_DETAILS.some(d => details[d.id]);

  const colWidthMM = anyDetail ? 40 : 26;
  const pageWidthMM = Math.max(180, spine.length * colWidthMM + 60);

  const roleLabel = (ids) => (ids || [])
    .map(id => { const r = roles.find(x => x.id === id); return r ? r.label : id; })
    .join(', ');

  const actionIcon = (type) => type === 'review' ? '🔍' : type === 'approval' ? '✅' : type === 'consultation' ? '💬' : type === 'prepared_by' ? '📝' : '▸';

  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const detailLines = (steps) => {
    const out = [];
    steps.forEach(step => {
      if (details.trigger && triggerDisplay(step)) out.push(esc(triggerDisplay(step)));
      if (details.actions) (step.actions || []).forEach(a => {
        out.push(actionIcon(a.type) + ' ' + esc(a.type === 'custom' ? a.label : a.label + (a.person ? ' ' + a.person : '')));
      });
      if (details.presenters && (step.presenterIds || []).length) out.push('Presents: ' + esc(roleLabel(step.presenterIds)));
      if (details.carriers && (step.carrierIds || []).length) out.push('Carries: ' + esc(roleLabel(step.carrierIds)));
      if (details.storage && step.storageLocation) {
        const op = step.fileOperation === 'copy' ? ' (copy)' : step.fileOperation === 'move' ? ' (move)' : '';
        out.push('📁 ' + esc(step.storageLocation) + op);
      }
      if (details.notes && step.notes) out.push('📝 ' + esc(step.notes));
    });
    return out;
  };

  const headHTML = spine.map((n, i) =>
    `<th><div class="idx">${i + 1}</div>${esc(n.label)}</th>`
  ).join('');

  const rowsHTML = docs.map(doc => {
    const track = docTrack(doc, spine);
    const cells = track.cells, first = track.first, last = track.last;

    const cellsHTML = spine.map((n, i) => {
      const steps = cells[i];
      const active = steps.length > 0;
      const inTrack = first >= 0 && i >= first && i <= last;

      const leftLine  = inTrack && i > first ? `<span class="ln ln-l ${active ? 'solid' : 'dash'}" style="border-color:${active ? doc.color : '#cbd5e1'}"></span>` : '';
      const rightLine = inTrack && i < last  ? `<span class="ln ln-r ${active ? 'solid' : 'dash'}" style="border-color:${active ? doc.color : '#cbd5e1'}"></span>` : '';

      let inner = '';
      if (active) {
        const infoOnly = steps.every(s => s.informationOnly);
        const multi = steps.length > 1 ? `<span class="mult">×${steps.length}</span>` : '';
        const ret = steps.some(s => s.returnToStepId) ? '<span class="ret">↩</span>' : '';
        const lines = detailLines(steps);
        const body = lines.length ? `<div class="lines">${lines.map(l => `<div>${l}</div>`).join('')}</div>` : '';
        const startTag = i === first ? '<div class="tag start">▸ START</div>' : '';
        const endTag   = i === last  ? '<div class="tag end">✓ END</div>' : '';
        inner = `${startTag}<div class="node" style="border-color:${doc.color};border-style:${infoOnly ? 'dashed' : 'solid'};background:${infoOnly ? '#fff' : 'linear-gradient(' + doc.color + '14,' + doc.color + '14),#fff'}">
          <span class="dot" style="color:${doc.color}">${infoOnly ? 'ⓘ' : '●'}</span>${multi}${ret}${body}
        </div>${endTag}`;
      } else if (inTrack) {
        inner = '<span class="bypass">bypassed</span>';
      }
      return `<td><div class="cell">${leftLine}${rightLine}${inner}</div></td>`;
    }).join('');

    const count = cells.filter(c => c.length).length;
    return `<tr>
      <th class="doc"><span class="swatch" style="background:${doc.color}"></span>
        <span class="dname">${esc(doc.name)}</span>
        <div class="dmeta">${first < 0 ? 'no steps in view' : count + ' of ' + spine.length + ' steps'}</div>
      </th>${cellsHTML}</tr>`;
  }).join('');

  const shownDetails = FLOW_DETAILS.filter(d => details[d.id]).map(d => d.label).join(', ');
  const hiddenNote = fullSpine.length !== spine.length
    ? ` &nbsp;|&nbsp; ${fullSpine.length - spine.length} step(s) hidden` : '';
  const detailNote = shownDetails ? ` &nbsp;|&nbsp; Showing: ${esc(shownDetails)}` : '';

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
  @page { size: ${pageWidthMM}mm auto; margin: 10mm; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; font-size: 9px; margin: 0; }
  h1 { font-size: 13px; font-weight: bold; margin: 0 0 2px; }
  .subtitle { font-size: 8px; color: #64748b; margin: 0 0 10px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 0; vertical-align: middle; }
  thead th { font-size: 8.5px; font-weight: bold; color: #1e293b; padding: 3px 4px 5px;
             border-bottom: 1.5px solid #cbd5e1; text-align: center; width: ${colWidthMM}mm; }
  thead th .idx { font-size: 7px; color: #cbd5e1; }
  thead th:first-child { width: 42mm; }
  th.doc { text-align: left; padding: 6px 6px 6px 0; border-bottom: 1px solid #f1f5f9;
           border-right: 1px solid #e2e8f0; font-size: 9.5px; color: #1e293b; }
  .swatch { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 4px; }
  .dname { font-weight: bold; }
  .dmeta { font-size: 7px; color: #94a3b8; font-weight: normal; margin-top: 1px; padding-left: 11px; }
  td { border-bottom: 1px solid #f1f5f9; }
  .cell { position: relative; min-height: 34px; display: flex; align-items: center;
          justify-content: center; padding: 12px 3px; }
  .ln { position: absolute; top: 50%; width: 50%; border-top-width: 1.5px; }
  .ln-l { left: 0; } .ln-r { right: 0; }
  .solid { border-top-style: solid; } .dash { border-top-style: dashed; }
  .node { position: relative; z-index: 2; border-width: 1.5px; border-radius: 4px;
          padding: 2px 4px; text-align: center; min-width: 14px; }
  .dot { font-size: 10px; line-height: 1; }
  .mult { font-size: 7px; font-weight: bold; margin-left: 2px; }
  .ret { font-size: 7px; color: #b45309; margin-left: 2px; }
  .lines { margin-top: 2px; text-align: left; }
  .lines div { font-size: 7px; color: #475569; line-height: 1.45; }
  .tag { position: absolute; left: 0; right: 0; text-align: center; font-size: 6px; font-weight: bold; z-index: 3; }
  .tag.start { top: 2px; color: #059669; }
  .tag.end { bottom: 2px; color: #94a3b8; }
  .bypass { position: absolute; left: 0; right: 0; top: calc(50% - 9px); text-align: center;
            font-size: 6.5px; color: #94a3b8; }
  .legend { margin-top: 8px; font-size: 7.5px; color: #94a3b8; }
</style>
</head>
<body>
  <h1>${esc(projectType.name)} — Step Flow</h1>
  <div class="subtitle">Continuing Studies · Langara College &nbsp;|&nbsp; Generated ${new Date().toLocaleDateString('en-CA', { year:'numeric', month:'long', day:'numeric' })}${hiddenNote}${detailNote}</div>
  <table><thead><tr><th>Document</th>${headHTML}</tr></thead><tbody>${rowsHTML}</tbody></table>
  <div class="legend">● goes through &nbsp;·&nbsp; ⓘ information only &nbsp;·&nbsp; dashed line = bypasses this step &nbsp;·&nbsp; ▸ START = first step &nbsp;·&nbsp; ✓ END = last step &nbsp;·&nbsp; ↩ can return to an earlier step</div>
<script>
window.onload = function() {
  var PX_MM = 0.264583;
  var wMM = Math.ceil(document.body.scrollWidth * PX_MM * 1.03) + 25;
  var hMM = Math.ceil(document.body.scrollHeight * PX_MM * 1.03) + 25;
  var s = document.createElement('style');
  s.textContent = '@page{size:' + wMM + 'mm ' + hMM + 'mm;margin:8mm;}';
  document.head.appendChild(s);
  window.print();
};
<\\/script>
</body>
</html>`;
}

// ── Presence ───────────────────────────────────────────────────────────────────
function usePresence(authUser) {
  const [activeUsers, setActiveUsers] = useState([]);
  useEffect(() => {
    if (!authUser) return;
    const db = getFbDb();
    const presenceRef = db.ref('presence/' + authUser.uid);
    presenceRef.set({
      email: authUser.email,
      displayName: authUser.displayName || authUser.email,
      online: true,
      lastSeen: firebase.database.ServerValue.TIMESTAMP,
    });
    presenceRef.onDisconnect().remove();
    const allPresenceRef = db.ref('presence');
    const listener = allPresenceRef.on('value', snap => {
      const val = snap.val() || {};
      setActiveUsers(Object.entries(val).map(([uid, data]) => ({ uid, ...data })));
    });
    return () => {
      allPresenceRef.off('value', listener);
      presenceRef.remove();
    };
  }, [authUser?.uid]);
  return activeUsers;
}

function App({ authUser }) {

  const [modal, setModal] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [view, setView] = useState('documents'); // 'documents' | 'flow'
  const [sidebarWidth, setSidebarWidth] = useState(240);
  const sidebarDragRef = useRef(false);

  if (!store) return (
    <div className="flex items-center justify-center h-screen bg-slate-100">
      <div className="text-center text-slate-500">
        <div className="text-3xl mb-3 animate-spin">⏳</div>
        <div className="text-sm font-medium">Loading from Firebase…</div>
      </div>
    </div>
  );

  const activePT = store.projectTypes.find(p => p.id === store.activeProjectTypeId) || store.projectTypes[0];

  const setActivePT = (id) => updateStore(s => ({ ...s, activeProjectTypeId: id }));

  const updatePT = (updated) => {
    updateStore(s => ({ ...s, projectTypes: s.projectTypes.map(p => p.id === updated.id ? updated : p) }));
  };

  const deletePT = (id) => {
    if (!confirm('Delete this project type and all its data?')) return;
    updateStore(s => {
      const pts = s.projectTypes.filter(p => p.id !== id);
      return { ...s, projectTypes: pts, activeProjectTypeId: pts[0]?.id || null };
    });
  };

  const movePT = (id, dir) => {
    updateStore(s => {
      const arr = [...s.projectTypes];
      const idx = arr.findIndex(p => p.id === id);
      const t = idx + dir;
      if (t < 0 || t >= arr.length) return s;
      [arr[idx], arr[t]] = [arr[t], arr[idx]];
      return { ...s, projectTypes: arr };
    });
  };

  const createPT = (pt) => {
    updateStore(s => ({ ...s, projectTypes: [...s.projectTypes, pt], activeProjectTypeId: pt.id }));
    setModal(null);
  };

  const copyStepToProject = (step, targetProjectId, targetDocId) => {
    updateStore(s => ({
      ...s,
      projectTypes: s.projectTypes.map(pt => {
        if (pt.id !== targetProjectId) return pt;
        const newStep = { ...step, id: uid(), actions: step.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null };
        return { ...pt, documents: pt.documents.map(d =>
          d.id === targetDocId ? { ...d, steps: [...d.steps, newStep] } : d
        ), updatedAt: new Date().toISOString() };
      })
    }));
  };

  const copyDocToProject = (doc, targetProjectId) => {
    updateStore(s => ({
      ...s,
      projectTypes: s.projectTypes.map(pt => {
        if (pt.id !== targetProjectId) return pt;
        const newDoc = { ...doc, id: uid(), steps: doc.steps.map(s => ({ ...s, id: uid(), actions: s.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null })) };
        return { ...pt, documents: [...pt.documents, newDoc], updatedAt: new Date().toISOString() };
      })
    }));
  };

  const updateSyncGroupMeta = (meta) => updateStore(s => ({ ...s, syncGroupMeta: meta }));

  const dissolveGroup = (groupId) => {
    updateStore(s => {
      const newMeta = { ...s.syncGroupMeta };
      delete newMeta[groupId];
      const newPTs = s.projectTypes.map(pt => ({
        ...pt,
        documents: pt.documents.map(d => ({
          ...d,
          steps: d.steps.map(step => step.syncGroupId === groupId ? { ...step, syncGroupId: null } : step)
        }))
      }));
      return { ...s, syncGroupMeta: newMeta, projectTypes: newPTs };
    });
  };

  const saveTemplate = (name) => {
    if (!activePT) return;
    const tmpl = {
      id: uid(), name,
      projectType: { name: activePT.name, documents: activePT.documents }
    };
    updateStore(s => ({ ...s, templates: [...s.templates, tmpl] }));
    setModal(null);
    alert(`Template "${name}" saved!`);
  };

  const deleteTemplate = (id) => {
    if (!confirm('Delete this template?')) return;
    updateStore(s => ({ ...s, templates: s.templates.filter(t => t.id !== id) }));
  };

  return (
    <div className="flex h-screen overflow-hidden bg-slate-100">
      {/* Sidebar */}

        <div className="p-4 border-b border-slate-200">
          <div className="font-bold text-slate-800 text-sm leading-tight">CS Pipeline Tool</div>
          <div className="text-xs text-slate-400 mt-0.5">Continuing Studies · Langara</div>
          <div className="text-xs text-indigo-500 font-semibold mt-0.5">v2</div>
        </div>

        <div className="flex-1 overflow-y-auto p-3">
          {/* Project Types */}
          <div className="flex items-center justify-between mb-2 px-1">

            <button onClick={() => setModal('newPT')} className="text-indigo-600 hover:text-indigo-800 text-lg font-bold leading-none" title="New project type">+</button>
          </div>

          {store.projectTypes.map((pt, idx) => (
            <div key={pt.id}
              onClick={() => setActivePT(pt.id)}
              className={`group flex items-center gap-1 px-2 py-2 rounded-lg cursor-pointer mb-1 transition-colors ${pt.id === activePT?.id ? 'bg-indigo-600 text-white' : 'text-slate-700 hover:bg-slate-100'}`}>
              <span className="text-sm font-medium truncate flex-1">{pt.name}</span>
              <div className="opacity-0 group-hover:opacity-100 flex gap-0.5 shrink-0">
                <button onClick={e => { e.stopPropagation(); movePT(pt.id, -1); }} disabled={idx === 0}
                  className={`w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 ${pt.id === activePT?.id ? 'hover:bg-indigo-500' : 'hover:bg-slate-200'}`}
                  title="Move up">▲</button>

                  className={`w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 ${pt.id === activePT?.id ? 'hover:bg-indigo-500' : 'hover:bg-slate-200'}`}
                  title="Move down">▼</button>
                {pt.id !== activePT?.id && (
                  <button onClick={e => { e.stopPropagation(); deletePT(pt.id); }}
                    className="w-5 h-5 rounded text-xs flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50"
                    title="Delete">✕</button>
                )}
              </div>
            </div>
          ))}

          {/* Templates */}
          {store.templates.length > 0 && (
            <div className="mt-4">
              <div className="text-xs font-bold text-slate-400 uppercase tracking-widest px-1 mb-2">Templates</div>
              {store.templates.map(t => (
                <div key={t.id} className="group flex items-center justify-between px-3 py-1.5 rounded-lg mb-1 text-slate-500 hover:bg-slate-50">
                  <span className="text-xs truncate flex-1">{t.name}</span>
                  <button onClick={() => deleteTemplate(t.id)} className="opacity-0 group-hover:opacity-100 text-red-400 text-xs ml-1">✕</button>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Bottom settings */}
        <div className="p-3 border-t border-slate-200 space-y-1">
          <button onClick={() => setModal('manageTypes')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>🗂</span> Manage Project Types
          </button>
          <button onClick={() => setModal('roles')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>👥</span> Roles &amp; People
          </button>
          <button onClick={() => setModal('backup')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>💾</span> Backup &amp; Restore
          </button>
          <button onClick={() => {
            if (!confirm('Reset ALL data to the original defaults?')) return;
            updateStore(getDefaultStore());
          }} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-red-50 hover:text-red-600 flex items-center gap-2">
            <span>↺</span> Reset to Defaults
          </button>
        </div>
        <div
          style={{ position:'absolute', top:0, right:0, width:4, height:'100%', cursor:'col-resize', zIndex:10, userSelect:'none' }}
          onMouseDown={e => {
            sidebarDragRef.current = true;
            const onMove = ev => {
              if (!sidebarDragRef.current) return;
              const newWidth = ev.clientX;
              if (newWidth < 48) {
                setSidebarOpen(false);
              } else {
                const clamped = Math.min(400, Math.max(48, newWidth));
                setSidebarWidth(clamped);
                setSidebarOpen(true);
              }
            };
            const onUp = () => {
              sidebarDragRef.current = false;
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          }}
        />
      </aside>

      {/* Main area */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        {/* Top bar */}
        <header className="bg-white border-b border-slate-200 px-5 py-2.5 flex items-center gap-3 shrink-0 no-print">
          <button onClick={() => setSidebarOpen(o => !o)}
            className="text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded p-1 transition-colors shrink-0"
            title={sidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'}>
            {sidebarOpen ? '◀' : '▶'}
          </button>
          <div className="flex-1 min-w-0">
            {activePT ? (
              <>
                <h1 className="font-bold text-slate-800 text-base truncate">{activePT.name}</h1>
                <div className="text-xs text-slate-400">{activePT.documents.length} document type{activePT.documents.length !== 1 ? 's' : ''} &middot; Updated {new Date(activePT.updatedAt).toLocaleDateString()}</div>
              </>
            ) : (
              <h1 className="font-bold text-slate-400">No project type selected</h1>
            )}
          </div>
          {activePT && (
            <div className="flex items-center bg-slate-100 rounded-lg p-0.5 shrink-0 no-print">
              {[['documents', '▤ Documents'], ['flow', '🪜 Step Flow']].map(([id, label]) => (
                <button key={id} onClick={() => setView(id)}
                  className={`text-xs font-medium px-2.5 py-1 rounded-md transition-colors ${view === id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                  title={id === 'documents' ? 'Full detail, one column per document' : 'At a glance: which steps each document goes through'}>
                  {label}
                </button>
              ))}
            </div>
          )}
          <div className="flex items-center gap-1.5 shrink-0 no-print">
            {activeUsers.length > 0 && (
              <div className="flex items-center gap-1 mr-1">
                {activeUsers.slice(0, 5).map(u => {
                  const initials = (u.displayName || u.email || '?').slice(0,2).toUpperCase();
                  const hash = [...(u.uid || '')].reduce((acc, c) => acc + c.charCodeAt(0), 0);
                  const colors = ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#0ea5e9'];
                  const bg = colors[hash % colors.length];
                  return (
                    <div key={u.uid} title={u.email || u.displayName}
                      style={{ width:24, height:24, borderRadius:'50%', background: bg, color:'white', fontSize:9, fontWeight:'bold', display:'flex', alignItems:'center', justifyContent:'center', border:'2px solid white', marginLeft: -4 }}>
                      {initials}
                    </div>
                  );
                })}
              </div>
            )}
            <button onClick={refreshStore} title="Pull latest from Firebase"
              className="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded px-1.5 py-1 text-xs transition-colors">↻</button>
            <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
              syncStatus === 'ready'   ? 'bg-green-100 text-green-700' :
              syncStatus === 'saving'  ? 'bg-yellow-100 text-yellow-700' :
              syncStatus === 'error'   ? 'bg-red-100 text-red-600' :
                                         'bg-slate-100 text-slate-500'
            }`}>
              {syncStatus === 'ready'   ? '✓ Synced' :
               syncStatus === 'saving'  ? '💾 Saving…' :
               syncStatus === 'error'   ? '⚠ Offline' :
                                          '⏳ Loading…'}
            </span>
            <span className="text-xs text-slate-400 hidden sm:inline">{authUser.email}</span>
            <button onClick={() => getFbAuth().signOut()}
              className="text-xs text-slate-400 hover:text-red-600 hover:bg-red-50 rounded px-1.5 py-1 transition-colors"
              title="Sign out">Sign out</button>
          </div>
          {activePT && (
            <div className="flex items-center gap-2 shrink-0">
              <Btn variant="secondary" sm onClick={() => setModal('saveTemplate')}>☆ Save as Template</Btn>
              <Btn variant="secondary" sm onClick={() => {
                const html = view === 'flow'
                  ? generateFlowPrintHTML(activePT, store.roles, loadFlowPrefs(activePT.id))
                  : generatePrintHTML(activePT, store.roles, store.syncGroupMeta);
                const iframe = document.createElement('iframe');
                // Give real dimensions off-screen so flex layout renders before we measure
                iframe.style.cssText = 'position:fixed;left:-9999px;top:-9999px;border:0;width:3000px;height:4000px;';
                document.body.appendChild(iframe);
                iframe.contentDocument.open();
                iframe.contentDocument.write(html);
                iframe.contentDocument.close();
                iframe.contentWindow.focus();
                setTimeout(() => document.body.removeChild(iframe), 5000);
              }}>🖨 Print / Export PDF</Btn>
            </div>
          )}
        </header>

        {/* Canvas */}
        <div className="flex-1 min-h-0 overflow-hidden">
          {activePT ? (view === 'flow' ? (
            <StepFlowView projectType={activePT} roles={store.roles} />
          ) : (
            <ProjectTypeCanvas
              projectType={activePT}
              roles={store.roles}
              onUpdateProjectType={updatePT}
              allProjectTypes={store.projectTypes}
              onCopyStepToProject={copyStepToProject}
              onCopyDocToProject={copyDocToProject}
              syncGroupMeta={store.syncGroupMeta || {}}
              onUpdateSyncGroupMeta={updateSyncGroupMeta}
              onDissolveGroup={dissolveGroup}
            />
          )) : (
            <div className="flex items-center justify-center h-full text-slate-400">
              <div className="text-center">
                <div className="text-4xl mb-3">📋</div>
                <p className="text-sm">No project type selected. Create one using the sidebar.</p>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Modals */}
      {modal === 'newPT' && <NewProjectTypeModal store={store} onCreate={createPT} onClose={() => setModal(null)} />}
      {modal === 'manageTypes' && <ProjectTypeEditor store={store} onUpdateStore={s => updateStore(s)} onClose={() => setModal(null)} />}
      {modal === 'roles' && <RolesEditor store={store} onUpdateStore={s => updateStore(s)} onClose={() => setModal(null)} />}
      {modal === 'backup' && <BackupModal store={store} onRestore={data => updateStore(data)} onClose={() => setModal(null)} />}
      {modal === 'saveTemplate' && activePT && <TemplateSaveModal projectType={activePT} onSave={saveTemplate} onClose={() => setModal(null)} />}
    </div>
  );
}

function Root() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = checking
  useEffect(() => {
    getFbApp(); // ensure app is initialized before auth
    return getFbAuth().onAuthStateChanged(user => setAuthUser(user));
  }, []);
  if (authUser === undefined) return (
    <div className="flex items-center justify-center h-screen bg-slate-100">
      <div className="text-slate-400 text-sm">Checking authentication…</div>
    </div>
  );
  if (!authUser) return <LoginScreen />;
  return <App authUser={authUser} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
