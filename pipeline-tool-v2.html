// ── Row Lock: align sync-grouped steps onto shared rows ────────────────────────
// Display-only. Steps in the same sync group become one node, so they land on
// the same row across documents; every other step keeps its own row. Each
// document's own sequence supplies the ordering constraints, merged by the same
// topological sort the Step Flow spine uses.
function buildRowBands(projectType) {
  const docs = (projectType && projectType.documents) || [];
  // A sync group forces alignment (steps that are literally the same meeting,
  // even under different names). Otherwise fall back to matching by name, the
  // same rule the Step Flow view uses — without it, five documents that all
  // start with "New Documents" would each get their own band and the canvas
  // would read as a staircase instead of a table.
  const nodeKey = (step) => step.syncGroupId
    ? 'g:' + step.syncGroupId
    : 'n:' + (stepKey(step.stageName) || step.id);

  const nodes = new Map();
  const succ  = new Map();
  const indeg = new Map();

  docs.forEach(doc => {
    (doc.steps || []).forEach((step, i) => {
      const k = nodeKey(step);
      if (!nodes.has(k)) {
        nodes.set(k, {
          key: k, label: step.stageName || '', firstIdx: i,
          syncGroupId: step.syncGroupId || null, cells: {},
        });
        succ.set(k, new Set());
        indeg.set(k, 0);
      } else if (i < nodes.get(k).firstIdx) {
        nodes.get(k).firstIdx = i;
      }
      const cells = nodes.get(k).cells;
      if (!cells[doc.id]) cells[doc.id] = [];
      cells[doc.id].push(step);
    });
  });

  docs.forEach(doc => {
    const keys = (doc.steps || []).map(nodeKey);
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (a === b || !succ.has(a)) continue;
      if (!succ.get(a).has(b)) { succ.get(a).add(b); indeg.set(b, indeg.get(b) + 1); }
    }
  });

  return topoMerge(nodes, succ, indeg);
}

// Which steps of `doc` land on each spine column, plus where its track starts
// and ends. Steps whose name matches a spine entry more than once are kept
// together in the same cell.
function docTrack(doc, spine) {
  const byKey = new Map();
  (doc.steps || []).forEach(s => {
    const k = stepKey(s.stageName);
    if (!k) return;
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(s);
  });
  const cells = spine.map(n => byKey.get(n.key) || []);
  let first = -1, last = -1;
  cells.forEach((c, i) => { if (c.length) { if (first < 0) first = i; last = i; } });
  // Steps that exist on the document but were filtered out of the spine.
  const hiddenCount = (doc.steps || []).filter(s => {
    const k = stepKey(s.stageName);
    return k && !spine.some(n => n.key === k);
  }).length;
  return { cells, first, last, hiddenCount };
}

const FLOW_DETAILS = [
  { id: 'trigger',    label: 'Trigger' },
  { id: 'actions',    label: 'Actions' },
  { id: 'presenters', label: 'Prepares / Presents' },
  { id: 'carriers',   label: 'Carries to next' },
  { id: 'storage',    label: 'Where it lives' },
  { id: 'notes',      label: 'Notes' },
];
const NO_DETAILS = { trigger: false, actions: false, presenters: false, carriers: false, storage: false, notes: false };

function loadFlowPrefs(projectTypeId) {
  try {
    const all = JSON.parse(localStorage.getItem(FLOW_PREFS_KEY) || '{}');
    const p = all[projectTypeId] || {};
    return { hidden: p.hidden || [], details: { ...NO_DETAILS, ...(p.details || {}) } };
  } catch (e) {
    return { hidden: [], details: { ...NO_DETAILS } };
  }
}
function saveFlowPrefs(projectTypeId, prefs) {
  try {
    const all = JSON.parse(localStorage.getItem(FLOW_PREFS_KEY) || '{}');
    all[projectTypeId] = prefs;
    localStorage.setItem(FLOW_PREFS_KEY, JSON.stringify(all));
  } catch (e) { /* view preference only — safe to lose */ }
}

const FLOW_ROW_H = 62;   // vertical centre of a node sits at FLOW_ROW_H / 2

function FlowStepNode({ steps, doc, roles, details, anyDetail }) {
  const roleLabel = (ids) => (ids || [])
    .map(id => { const r = roles.find(x => x.id === id); return r ? r.label : id; })
    .join(', ');

  // Same glyphs as the Documents view — one icon language across both.
  const lines = [];
  steps.forEach(step => {
    if (details.trigger && triggerDisplay(step)) lines.push({ k: 'trigger', icon: triggerIcon(step), t: triggerDisplay(step) });
    if (details.actions) (step.actions || []).forEach(a => lines.push({
      k: 'action', icon: actionSlot(a.type), color: ACTION_COLOR[actionSlot(a.type)],
      t: a.type === 'custom' ? a.label : a.label + (a.person ? ' ' + a.person : ''),
    }));
    if (details.presenters && (step.presenterIds || []).length) lines.push({ k: 'pres', t: `Presents: ${roleLabel(step.presenterIds)}` });
    if (details.carriers && (step.carrierIds || []).length) lines.push({ k: 'carr', t: `Carries: ${roleLabel(step.carrierIds)}` });
    if (details.storage && step.storageLocation) lines.push({ k: 'stor', icon: 'storage', t: `${step.storageLocation}${step.fileOperation === 'copy' ? ' (copy)' : step.fileOperation === 'move' ? ' (move)' : ''}` });
    if (details.notes && step.notes) lines.push({ k: 'note', icon: 'notes', t: step.notes });
  });

  const infoOnly = steps.every(s => s.informationOnly) && steps.length > 0;
  const returns = steps.some(s => s.returnToStepId);

  return (
    <div className="relative z-10 rounded-lg px-2 py-1.5 text-center shadow-sm"
      style={{
        background: infoOnly ? '#ffffff' : `linear-gradient(${doc.color}14, ${doc.color}14), #ffffff`,
        border: `2px ${infoOnly ? 'dashed' : 'solid'} ${doc.color}`,
        minWidth: anyDetail ? 0 : 44,
      }}>
      <div className="flex items-center justify-center gap-1">
        {infoOnly
          ? <Icon name="info" size={13} style={{ color: doc.color }} />
          : <span style={{ color: doc.color, fontSize: 13, lineHeight: 1 }}>●</span>}
        {steps.length > 1 && <span className="text-[10px] font-bold" style={{ color: doc.color }}>×{steps.length}</span>}
        {returns && <Icon name="ret" size={11} style={{ color: '#b45309' }} />}
      </div>
      {lines.length > 0 && (
        <div className="mt-1 space-y-0.5 text-left">
          {lines.map((l, i) => (
            <div key={i} className="text-[10px] leading-snug text-slate-600 break-words flex items-start gap-1">
              {l.icon && <Icon name={l.icon} size={10} style={{ marginTop: 2, color: l.color || '#94a3b8' }} />}
              <span className="min-w-0">{l.t}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function StepFlowView({ projectType, roles, syncGroupMeta }) {
  const [prefs, setPrefs] = React.useState(() => loadFlowPrefs(projectType.id));
  const [panel, setPanel] = React.useState(null); // 'steps' | 'details' | null
  const [detailCell, setDetailCell] = React.useState(null); // { steps, doc } | null

  React.useEffect(() => { setPrefs(loadFlowPrefs(projectType.id)); }, [projectType.id]);

  const setAndSave = (next) => { setPrefs(next); saveFlowPrefs(projectType.id, next); };

  const fullSpine = React.useMemo(() => buildStepSpine(projectType), [projectType]);
  const hiddenSet = new Set(prefs.hidden);
  const spine = fullSpine.filter(n => !hiddenSet.has(n.key));

  const details = prefs.details;
  const anyDetail = FLOW_DETAILS.some(d => details[d.id]);
  const colW = anyDetail ? 190 : 128;
  const docs = projectType.documents || [];

  const toggleStep = (key) => {
    const hidden = hiddenSet.has(key) ? prefs.hidden.filter(k => k !== key) : [...prefs.hidden, key];
    setAndSave({ ...prefs, hidden });
  };
  const toggleDetail = (id) => setAndSave({ ...prefs, details: { ...details, [id]: !details[id] } });

  if (fullSpine.length === 0) {
    return (
      <div className="flex flex-col items-center justify-center h-64 text-slate-400">
        <div className="text-4xl mb-3">🪜</div>
        <p className="text-sm">No named steps yet — add steps in the Documents view and they'll appear here.</p>
      </div>
    );
  }

  return (
    <div className="flex flex-col h-full overflow-hidden" id="flow-print-area">

      {/* Toolbar — z-50 so its panels clear the sticky matrix header (z-30) and
          the sticky document column (z-40) below. */}
      <div className="shrink-0 flex flex-wrap items-center gap-2 px-4 py-2 border-b border-slate-200 bg-white no-print relative z-50">
        <div className="relative">
          <Btn variant="secondary" sm className="tb-btn" onClick={() => setPanel(panel === 'details' ? null : 'details')}>
            ⚙ Details {anyDetail && <span className="text-indigo-600 font-bold">({FLOW_DETAILS.filter(d => details[d.id]).length})</span>}
          </Btn>
          {panel === 'details' && (
            <div className="absolute left-0 top-full mt-1 w-64 bg-white border border-slate-200 rounded-xl shadow-xl p-2 fade-in">
              <div className="text-xs text-slate-400 px-2 py-1">Off by default — turn on only what you need.</div>
              {FLOW_DETAILS.map(d => (
                <label key={d.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <input type="checkbox" checked={!!details[d.id]} onChange={() => toggleDetail(d.id)} />
                  <span className="text-sm text-slate-700">{d.label}</span>
                </label>
              ))}
              {anyDetail && (
                <button onClick={() => setAndSave({ ...prefs, details: { ...NO_DETAILS } })}
                  className="w-full mt-1 text-xs text-indigo-600 hover:bg-indigo-50 rounded-lg py-1.5">Hide all details</button>
              )}
            </div>
          )}
        </div>

        <div className="relative">
          <Btn variant="secondary" sm className="tb-btn" onClick={() => setPanel(panel === 'steps' ? null : 'steps')}>
            ⚑ Steps shown {prefs.hidden.length > 0 && <span className="text-indigo-600 font-bold">({spine.length}/{fullSpine.length})</span>}
          </Btn>
          {panel === 'steps' && (
            <div className="absolute left-0 top-full mt-1 w-72 bg-white border border-slate-200 rounded-xl shadow-xl p-2 fade-in max-h-80 overflow-y-auto">
              <div className="text-xs text-slate-400 px-2 py-1">Uncheck a step to drop it from this view. Doesn't change the data.</div>
              {fullSpine.map(n => (
                <label key={n.key} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <input type="checkbox" checked={!hiddenSet.has(n.key)} onChange={() => toggleStep(n.key)} />
                  <span className="text-sm text-slate-700 truncate">{n.label}</span>
                </label>
              ))}
              {prefs.hidden.length > 0 && (
                <button onClick={() => setAndSave({ ...prefs, hidden: [] })}
                  className="w-full mt-1 text-xs text-indigo-600 hover:bg-indigo-50 rounded-lg py-1.5">Show all steps</button>
              )}
            </div>
          )}
        </div>

        <div className="flex-1" />
        <div className="flex items-center gap-3 text-[11px] text-slate-400">
          <span className="flex items-center gap-1"><span className="text-slate-700">●</span> goes through</span>
          <span className="flex items-center gap-1">
            <span style={{ display:'inline-block', width:18, borderTop:'2px dashed #cbd5e1' }} /> bypasses
          </span>
          <span className="flex items-center gap-1"><span className="text-emerald-600 font-bold">▸</span> starts</span>
          <span className="flex items-center gap-1"><span className="text-slate-500 font-bold">✓</span> ends</span>
        </div>
      </div>

      {/* Matrix */}
      <div className="flex-1 overflow-auto" onClick={() => setPanel(null)}>
        <div style={{ minWidth: 'max-content' }} className="pb-6">

          {/* Step header row */}
          <div className="flex sticky top-0 bg-slate-100 z-30 border-b border-slate-200">
            <div className="shrink-0 px-3 py-2 sticky left-0 bg-slate-100 z-40 border-r border-slate-200"
              style={{ width: 190 }}>
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Document</span>
            </div>
            {spine.map((n, i) => (
              <div key={n.key} className="shrink-0 px-2 py-2 text-center" style={{ width: colW }}>
                <div className="text-[10px] font-bold text-slate-300">{i + 1}</div>
                <div className="text-xs font-bold text-slate-700 leading-tight break-words">{n.label}</div>
              </div>
            ))}
          </div>

          {/* One row per document */}
          {docs.map(doc => {
            const { cells, first, last, hiddenCount } = docTrack(doc, spine);
            return (
              <div key={doc.id} className="flex border-b border-slate-100 hover:bg-white/60 transition-colors">
                {/* Document label */}
                <div className="shrink-0 px-3 py-3 sticky left-0 bg-slate-100 z-20 border-r border-slate-200 flex items-start gap-2"
                  style={{ width: 190 }}>
                  <span className="mt-1 rounded-full shrink-0" style={{ width: 10, height: 10, background: doc.color }} />
                  <div className="min-w-0">
                    <div className="text-sm font-semibold text-slate-800 leading-tight break-words">{doc.name}</div>
                    <div className="text-[10px] text-slate-400 mt-0.5">
                      {first < 0 ? 'no steps in view' : `${cells.filter(c => c.length).length} of ${spine.length} steps`}
                      {hiddenCount > 0 && ` · ${hiddenCount} hidden`}
                    </div>
                  </div>
                </div>

                {/* Track cells */}
                {spine.map((n, i) => {
                  const steps = cells[i];
                  const active = steps.length > 0;
                  const inTrack = first >= 0 && i >= first && i <= last;
                  const lineColor = active ? doc.color : '#cbd5e1';
                  const lineStyle = active ? 'solid' : 'dashed';
                  return (
                    <div key={n.key} className="shrink-0 relative flex items-center justify-center px-2"
                      style={{ width: colW, minHeight: FLOW_ROW_H }}>
                      {/* connector: left half */}
                      {inTrack && i > first && (
                        <div style={{ position:'absolute', left:0, width:'50%', top:'50%',
                          borderTop:`2px ${lineStyle} ${lineColor}` }} />
                      )}
                      {/* connector: right half */}
                      {inTrack && i < last && (
                        <div style={{ position:'absolute', right:0, width:'50%', top:'50%',
                          borderTop:`2px ${lineStyle} ${lineColor}` }} />
                      )}
                      {active ? (
                        <div className="relative py-3" style={{ width: anyDetail ? '100%' : 'auto' }}>
                          {i === first && (
                            <div className="absolute -top-0.5 left-1/2 -translate-x-1/2 text-[9px] font-bold text-emerald-600 whitespace-nowrap">▸ START</div>
                          )}
                          <div onClick={() => setDetailCell({ steps, doc })}
                            className="cursor-pointer transition-transform hover:scale-105"
                            title="Click for the full step detail">
                            <FlowStepNode steps={steps} doc={doc} roles={roles} details={details} anyDetail={anyDetail} />
                          </div>
                          {i === last && (
                            <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 text-[9px] font-bold text-slate-400 whitespace-nowrap">✓ END</div>
                          )}
                        </div>
                      ) : inTrack ? (
                        <span className="absolute left-0 right-0 text-center text-[9px] font-medium text-slate-400 pointer-events-none"
                          style={{ top: 'calc(50% - 15px)' }}>bypassed</span>
                      ) : null}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>

      {detailCell && (
        <FlowStepDetail steps={detailCell.steps} doc={detailCell.doc} roles={roles}
          syncGroupMeta={syncGroupMeta} onClose={() => setDetailCell(null)} />
      )}
    </div>
  );
}



// ── Publishing ─────────────────────────────────────────────────────────────────
// A publication is a *snapshot*: the project type as it stood when you pressed
// publish, copied to `published/<slug>` where it can be read without signing in.
// It never tracks later edits — that's the point — so the app compares a hash of
// the live project type against the hash stored at publish time and says so when
// they diverge.
const PUB_PATH = 'published';
const FLOW_LAYOUTS = [
  { id: 'serpentine', label: 'Serpentine', hint: 'Rows alternate direction; the wrap is a short hop down.' },
  { id: 'ltr',        label: 'Always left to right', hint: 'Every row starts at the left, like text.' },
];

// Key order from Firebase isn't stable, so sort before hashing or the same
// content would produce different hashes on different loads.
function stableStringify(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
}
function contentHash(obj) {
  const s = stableStringify(obj);
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
function snapshotOf(projectType, roles, syncGroupMeta) {
  return { projectType, roles: roles || [], syncGroupMeta: syncGroupMeta || {} };
}
function slugify(name) {
  const base = (name || 'workflow').toLowerCase().replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '').slice(0, 40) || 'workflow';
  return base + '-' + Math.random().toString(36).slice(2, 6);
}

// none | current | stale — drives the chip in the top bar.
function publicationStatus(store, projectType) {
  if (!store || !projectType) return { state: 'none', pub: null };
  const pubs = store.publications || {};
  const pub = pubs[projectType.id];
  if (!pub) return { state: 'none', pub: null };
  const live = contentHash(snapshotOf(projectType, store.roles, store.syncGroupMeta));
  return { state: live === pub.hash ? 'current' : 'stale', pub, liveHash: live };
}

async function writePublication(slug, payload) {
  await getFbDb().ref(PUB_PATH + '/' + slug).set(payload);
}
async function readPublication(slug) {
  const snap = await getFbDb().ref(PUB_PATH + '/' + slug).get();
  return snap.exists() ? snap.val() : null;
}

function PublishModal({ store, projectType, authUser, onUpdateStore, onClose }) {
  const status = publicationStatus(store, projectType);
  const existing = status.pub;
  const [layout, setLayout] = useState(existing ? existing.flowLayout || 'serpentine' : 'serpentine');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [done, setDone] = useState(false);
  const [copied, setCopied] = useState(false);

  const slug = existing ? existing.slug : slugify(projectType.name);
  const url = location.origin + location.pathname + '?p=' + slug;

  const publish = async () => {
    setBusy(true); setErr('');
    const snapshot = snapshotOf(projectType, store.roles, store.syncGroupMeta);
    const payload = {
      slug, projectTypeId: projectType.id, name: projectType.name,
      snapshot, flowLayout: layout,
      hash: contentHash(snapshot),
      publishedAt: new Date().toISOString(),
      publishedBy: authUser && authUser.email ? authUser.email : '',
    };
    try {
      await writePublication(slug, payload);
      onUpdateStore(s => ({
        ...s,
        publications: { ...(s.publications || {}), [projectType.id]: {
          slug, hash: payload.hash, publishedAt: payload.publishedAt,
          publishedBy: payload.publishedBy, flowLayout: layout,
        } },
      }));
      setDone(true);
    } catch (e) {
      setErr('Could not publish. If this is the first time, the database rules may not allow writes to "published" yet — see the note below.');
    }
    setBusy(false);
  };

  const copyLink = async () => {
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      // clipboard API needs a secure context; fall back to a selection copy
      const el = document.createElement('textarea');
      el.value = url; document.body.appendChild(el); el.select();
      try { document.execCommand('copy'); } catch (e2) { /* nothing else to try */ }
      document.body.removeChild(el);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 1800);
  };

  const unpublish = async () => {
    if (!confirm('Take the published page down? The link will stop working for everyone.')) return;
    setBusy(true); setErr('');
    try {
      await getFbDb().ref(PUB_PATH + '/' + slug).remove();
      onUpdateStore(s => {
        const next = { ...(s.publications || {}) };
        delete next[projectType.id];
        return { ...s, publications: next };
      });
      onClose();
    } catch (e) {
      setErr('Could not take the page down. Check your connection and try again.');
      setBusy(false);
    }
  };

  return (
    <Modal title={existing ? 'Republish read-only page' : 'Publish read-only page'} onClose={onClose} wide>
      <p className="text-sm text-slate-600 mb-4">
        Publishes <span className="font-semibold text-slate-800">{projectType.name}</span> as a snapshot anyone
        with the link can read — no sign-in. It does not update itself; republish when you want the page to
        catch up.
      </p>

      {existing && (
        <div className={`mb-4 rounded-xl border p-3 text-sm ${status.state === 'stale'
          ? 'border-amber-300 bg-amber-50 text-amber-800' : 'border-emerald-200 bg-emerald-50 text-emerald-800'}`}>
          {status.state === 'stale'
            ? <><span className="font-semibold">The published page is out of date.</span> It still shows the version published {new Date(existing.publishedAt).toLocaleString()}.</>
            : <><span className="font-semibold">The published page matches what's here.</span> Last published {new Date(existing.publishedAt).toLocaleString()}.</>}
        </div>
      )}

      <Field label="Card flow layout" hint="How the step cards run across the printed sheet.">
        <div className="space-y-2">
          {FLOW_LAYOUTS.map(l => (
            <label key={l.id}
              className={`flex items-start gap-2 p-2.5 rounded-xl border cursor-pointer transition-colors ${
                layout === l.id ? 'border-indigo-400 bg-indigo-50' : 'border-slate-200 hover:bg-slate-50'}`}>
              <input type="radio" name="flowlayout" className="mt-1" checked={layout === l.id}
                onChange={() => setLayout(l.id)} />
              <span>
                <span className="block text-sm font-semibold text-slate-800">{l.label}</span>
                <span className="block text-xs text-slate-500">{l.hint}</span>
              </span>
            </label>
          ))}
        </div>
      </Field>

      <Field label="Link" hint="Same link every time you republish, so anything you've already sent keeps working.">
        <div className="flex gap-2">
          <input readOnly className={inputCls} value={url} onFocus={e => e.target.select()} />
          <Btn variant="secondary" onClick={copyLink} className="shrink-0">
            {copied ? '✓ Copied' : '⧉ Copy link'}
          </Btn>
        </div>
      </Field>

      {err && <p className="text-xs text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-3">{err}</p>}
      {done && <p className="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2 mb-3">Published. The link above is live.</p>}

      <div className="flex items-center gap-2">
        {existing && (
          <Btn variant="danger" onClick={unpublish} disabled={busy}>Unpublish</Btn>
        )}
        <div className="flex-1" />
        <Btn variant="secondary" onClick={onClose}>{done ? 'Close' : 'Cancel'}</Btn>
        {existing && <Btn variant="secondary" onClick={() => window.open(url, '_blank')}>Open page</Btn>}
        <Btn onClick={publish} disabled={busy}>{busy ? 'Publishing…' : existing ? 'Republish' : 'Publish'}</Btn>
      </div>
    </Modal>
  );
}

// ── Published read-only page ───────────────────────────────────────────────────
// Rendered when the URL carries ?p=<slug>. Reads the snapshot straight from
// `published/<slug>`, which the database rules allow without authentication, so
// there is no sign-in gate here. One sheet per document: the step matrix on top,
// that document's cards below. Sized for 11 × 8.5 in landscape at print time.

const PER_ROW = 4;

function chunkRows(steps, perRow) {
  const rows = [];
  for (let i = 0; i < steps.length; i += perRow) {
    rows.push(steps.slice(i, i + perRow).map((s, j) => ({ s, i: i + j })));
  }
  return rows;
}

function PubCard({ step, index, roles, color }) {
  const roleName = (id) => { const r = roles.find(x => x.id === id); return r ? r.label : id; };

  const who = (step.presenterIds || []).map(roleName).join(', ');
  const storage = step.storageLocation
    ? step.storageLocation + (step.fileOperation === 'copy' ? ' · copy' : step.fileOperation === 'move' ? ' · move' : '')
    : '';
  return (
    <div className="pub-card" style={{ borderColor: color }}>
      <span className="pub-num" style={{ color, borderColor: color }}>{String(index + 1).padStart(2, '0')}</span>
      <div className="pub-ct">
        {step.stageName}
        {step.informationOnly && (
          <span className="pub-badge io"><Icon name="info" size={9} /></span>
        )}
        {step.returnToStepId && (
          <span className="pub-badge rt"><Icon name="ret" size={9} /></span>
        )}
      </div>
      {(step.actions || []).length > 0 && (
        <div className="pub-ca">
          {step.actions.map(a => (
            <div key={a.id} className="pub-line">
              <Icon name={actionSlot(a.type)} size={9} />
              <span>{a.type === 'custom' ? a.label : a.label + (a.person ? ' ' + a.person : '')}</span>
            </div>
          ))}
        </div>
      )}
      {(who || storage) && (
        <div className="pub-cm">
          {who && <div><b>{who}</b></div>}
          {storage && (
            <div className="pub-line">
              <Icon name="storage" size={9} />
              {step.storageUrl
                ? <a href={step.storageUrl} target="_blank" rel="noopener noreferrer"
                    style={{ color: 'inherit' }}>{storage}</a>
                : <span>{storage}</span>}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Cards laid out row by row. Connectors are real elements — a rule plus a head —
// not a bare arrowhead floating in the gap, which is what made an earlier
// version read so much weaker than the drawings.
function PubFlow({ steps, roles, color, layout }) {
  const rows = chunkRows(steps, PER_ROW);
  return (
    <div className="pub-flow" style={{ '--flow': color }}>
      {rows.map((row, r) => {
        const reversed = layout === 'serpentine' && r % 2 === 1;
        const disp = reversed ? row.slice().reverse() : row;
        const pad = PER_ROW - disp.length;
        return (
          <React.Fragment key={r}>
            <div className="pub-row">
              {disp.map((x, i) => (
                <React.Fragment key={x.s.id}>
                  <div className="pub-slot"><PubCard step={x.s} index={x.i} roles={roles} color={color} /></div>
                  {i < disp.length - 1 &&
                    <span className={'pub-conn ' + (reversed ? 'left' : 'right')} aria-hidden="true"><i /><b /></span>}
                </React.Fragment>
              ))}
              {pad > 0 && Array.from({ length: pad }).map((_, k) => (
                <React.Fragment key={'p' + k}>
                  <span className="pub-conn spacer" aria-hidden="true" />
                  <div className="pub-slot" />
                </React.Fragment>
              ))}
            </div>
            {r < rows.length - 1 && (
              layout === 'serpentine'
                // The next card sits directly below, so the turn is a short
                // vertical arrow in that column — mirror the row's slot layout
                // so it lines up exactly.
                ? <div className="pub-turn" aria-hidden="true">
                    {Array.from({ length: PER_ROW }).map((_, k) => (
                      <React.Fragment key={k}>
                        {k > 0 && <span className="pub-conn spacer" />}
                        <div className="pub-slot">
                          {k === (r % 2 === 0 ? PER_ROW - 1 : 0) && <span className="pub-down"><i /><b /></span>}
                        </div>
                      </React.Fragment>
                    ))}
                  </div>
                // Left-to-right restarts at the far left, so draw the return
                // sweep: down out of the last card, back across, down into the
                // first card of the next row.
                : <div className="pub-sweep" aria-hidden="true">
                    <span className="stub-out" /><span className="run" /><span className="stub-in"><i /><b /></span>
                  </div>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function PubMatrix({ projectType, spine }) {
  const docs = projectType.documents || [];
  return (
    <table className="pub-mx">
      <thead>
        <tr>
          <th className="dh">Document</th>
          {spine.map((n, i) => <th key={n.key}><span className="n">{i + 1}</span>{n.label}</th>)}
        </tr>
      </thead>
      <tbody>
        {docs.map(d => {
          const t = docTrack(d, spine);
          return (
            <tr key={d.id}>
              <td className="dn"><span className="sw" style={{ borderColor: d.color }} />{d.name}</td>
              {spine.map((n, i) => {
                const on = t.cells[i].length > 0;
                const inTrack = t.first >= 0 && i >= t.first && i <= t.last;
                const col = on ? d.color : '#ccd1d9';
                return (
                  <td key={n.key} className="c">
                    {inTrack && i > t.first && <span className={'ln l' + (on ? '' : ' dsh')} style={{ borderColor: col }} />}
                    {inTrack && i < t.last && <span className={'ln r' + (on ? '' : ' dsh')} style={{ borderColor: col }} />}
                    {on && i === t.first && <span className="cap s">START</span>}
                    {on && <span className="nd" style={{ borderColor: col }} />}
                    {on && i === t.last && <span className="cap e">END</span>}
                  </td>
                );
              })}
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

function PublishedView({ slug }) {
  const [state, setState] = useState({ loading: true, pub: null, error: '' });

  useEffect(() => {
    getFbApp();
    readPublication(slug)
      .then(pub => setState({ loading: false, pub, error: pub ? '' : 'notfound' }))
      .catch(() => setState({ loading: false, pub: null, error: 'denied' }));
  }, [slug]);

  // The tab, the bookmark and the PDF's default filename all come from this,
  // so it should name the workflow, not the tool.
  useEffect(() => {
    const name = state.pub && state.pub.snapshot && state.pub.snapshot.projectType
      ? state.pub.snapshot.projectType.name : (state.pub ? state.pub.name : '');
    if (name) document.title = name;
  }, [state.pub]);

  if (state.loading) return (
    <div className="flex items-center justify-center h-screen text-slate-400 text-sm">Loading…</div>
  );
  if (!state.pub) return (
    <div className="flex items-center justify-center h-screen bg-slate-100">
      <div className="text-center text-slate-500 max-w-md px-6">
        <div className="text-4xl mb-3">🔍</div>
        <p className="text-sm font-medium mb-1">
          {state.error === 'denied' ? 'This page could not be loaded.' : 'No published page at this link.'}
        </p>
        <p className="text-xs text-slate-400">
          {state.error === 'denied'
            ? 'The link may be correct but the database is not allowing public reads yet.'
            : 'It may have been removed, or the link may be mistyped.'}
        </p>
      </div>
    </div>
  );

  const pub = state.pub;
  const snapshot = normalizeSnapshot(pub.snapshot);
  const spine = buildStepSpine(snapshot.projectType);
  const docs = (snapshot.projectType.documents || []).filter(d => (d.steps || []).length > 0);
  const layout = pub.flowLayout || 'serpentine';

  return (
    <div className="pub-root">
      <header className="pub-bar no-print">
        <div>
          <div className="pub-bar-t">{snapshot.projectType.name}</div>
          <div className="pub-bar-s">
            Read-only · published {new Date(pub.publishedAt).toLocaleDateString()}
            {pub.publishedBy ? ' by ' + pub.publishedBy : ''} · {docs.length} document{docs.length !== 1 ? 's' : ''}
          </div>
        </div>
        <button className="pub-print" onClick={() => window.print()}>🖨 Print / Save as PDF</button>
      </header>

      <div className="pub-page">
        <div className="pub-title-block">
          <h1 className="pub-h1">{snapshot.projectType.name}</h1>
          <div className="pub-sub">Continuing Studies · Langara College — {docs.length} documents, {spine.length} steps</div>
          {(snapshot.projectType.notes || '').trim() && (
            <div className="pub-notes">{snapshot.projectType.notes}</div>
          )}
        </div>

        <section className="pub-block">
          <div className="pub-sect">Where every document goes</div>
          <PubMatrix projectType={snapshot.projectType} spine={spine} />
        </section>

        {docs.map(d => (
          <section className="pub-block pub-doc" key={d.id}>
            <div className="pub-doc-h" style={{ borderColor: d.color }}>
              <span className="sw" style={{ borderColor: d.color }} />
              <span className="pub-doc-n">{d.name}</span>
              <span className="pub-doc-c">{(d.steps || []).length} of {spine.length} steps</span>
            </div>
            <PubFlow steps={d.steps || []} roles={snapshot.roles} color={d.color} layout={layout} />
          </section>
        ))}

        <div className="pub-legend">
          Numbered badges follow each document's own order
          {layout === 'serpentine' ? ' · rows alternate direction' : ' · every row reads left to right'}
          {' '}· <Icon name="info" size={9} /> information only
          {' '}· <Icon name="ret" size={9} /> can return to an earlier step
        </div>
      </div>
    </div>
  );
}

// Snapshots go through the same defaulting as the live store — Firebase drops
// empty arrays, so an old snapshot can come back with fields undefined.
function normalizeSnapshot(snap) {
  const s = snap || {};
  const pt = s.projectType || { name: '', documents: [] };
  return {
    roles: s.roles || [],
    syncGroupMeta: s.syncGroupMeta || {},
    projectType: {
      ...pt,
      notes: pt.notes || '',
      documents: (pt.documents || []).map(d => ({ ...d, steps: (d.steps || []).map(normalizeStep) })),
    },
  };
}

// ── Presence ───────────────────────────────────────────────────────────────────
function usePresence(authUser) {
  const [activeUsers, setActiveUsers] = useState([]);
  useEffect(() => {
    if (!authUser) return;
    const db = getFbDb();
    const presenceRef = db.ref('presence/' + authUser.uid);
    presenceRef.set({
      email: authUser.email,
      displayName: authUser.displayName || authUser.email,
      online: true,
      lastSeen: firebase.database.ServerValue.TIMESTAMP,
    });
    presenceRef.onDisconnect().remove();
    const allPresenceRef = db.ref('presence');
    const listener = allPresenceRef.on('value', snap => {
      const val = snap.val() || {};
      setActiveUsers(Object.entries(val).map(([uid, data]) => ({ uid, ...data })));
    });
    return () => {
      allPresenceRef.off('value', listener);
      presenceRef.remove();
    };
  }, [authUser?.uid]);
  return activeUsers;
}

// ── App ────────────────────────────────────────────────────────────────────────
function App({ authUser }) {
  const [store, updateStore, syncStatus, refreshStore] = useStore();
  const activeUsers = usePresence(authUser);
  const [modal, setModal] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [view, setView] = useState('documents'); // 'documents' | 'flow'
  const [sidebarWidth, setSidebarWidth] = useState(240);
  const sidebarDragRef = useRef(false);
  // Sidebar workflow drag-reorder state. Declared with the other hooks, above
  // the `if (!store)` return — a hook below it runs on some renders and not
  // others, which is React error #310 and a blank page.
  const ptDragRef = React.useRef(null);
  const [ptDropId, setPtDropId] = useState(null);

  if (!store) return (
    <div className="flex items-center justify-center h-screen bg-slate-100">
      <div className="text-center text-slate-500">
        <div className="text-3xl mb-3 animate-spin">⏳</div>
        <div className="text-sm font-medium">Loading from Firebase…</div>
      </div>
    </div>
  );

  const activePT = store.projectTypes.find(p => p.id === store.activeProjectTypeId) || store.projectTypes[0];

  const setActivePT = (id) => updateStore(s => ({ ...s, activeProjectTypeId: id }));

  const updatePT = (updated) => {
    updateStore(s => ({ ...s, projectTypes: s.projectTypes.map(p => p.id === updated.id ? updated : p) }));
  };

  const deletePT = (id) => {
    if (!confirm('Delete this workflow and all its data?')) return;
    updateStore(s => {
      const pts = s.projectTypes.filter(p => p.id !== id);
      return { ...s, projectTypes: pts, activeProjectTypeId: pts[0]?.id || null };
    });
  };

  // Sidebar list is reordered by dragging; drop moves the dragged workflow to
  // the target's position rather than swapping, so a long drag lands where the
  // indicator says it will.
  const reorderPT = (dragId, targetId) => {
    ptDragRef.current = null;
    setPtDropId(null);
    if (!dragId || !targetId || dragId === targetId) return;
    updateStore(s => {
      const arr = [...s.projectTypes];
      const from = arr.findIndex(p => p.id === dragId);
      const to = arr.findIndex(p => p.id === targetId);
      if (from < 0 || to < 0) return s;
      const [moved] = arr.splice(from, 1);
      arr.splice(to, 0, moved);
      return { ...s, projectTypes: arr };
    });
  };

  const createPT = (pt) => {
    updateStore(s => ({ ...s, projectTypes: [...s.projectTypes, pt], activeProjectTypeId: pt.id }));
    setModal(null);
  };

  const copyStepToProject = (step, targetProjectId, targetDocId) => {
    updateStore(s => ({
      ...s,
      projectTypes: s.projectTypes.map(pt => {
        if (pt.id !== targetProjectId) return pt;
        const newStep = { ...step, id: uid(), actions: step.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null };
        return { ...pt, documents: pt.documents.map(d =>
          d.id === targetDocId ? { ...d, steps: [...d.steps, newStep] } : d
        ), updatedAt: new Date().toISOString() };
      })
    }));
  };

  const copyDocToProject = (doc, targetProjectId) => {
    updateStore(s => ({
      ...s,
      projectTypes: s.projectTypes.map(pt => {
        if (pt.id !== targetProjectId) return pt;
        const newDoc = { ...doc, id: uid(), steps: doc.steps.map(s => ({ ...s, id: uid(), actions: s.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null })) };
        return { ...pt, documents: [...pt.documents, newDoc], updatedAt: new Date().toISOString() };
      })
    }));
  };

  const updateSyncGroupMeta = (meta) => updateStore(s => ({ ...s, syncGroupMeta: meta }));

  const dissolveGroup = (groupId) => {
    updateStore(s => {
      const newMeta = { ...s.syncGroupMeta };
      delete newMeta[groupId];
      const newPTs = s.projectTypes.map(pt => ({
        ...pt,
        documents: pt.documents.map(d => ({
          ...d,
          steps: d.steps.map(step => step.syncGroupId === groupId ? { ...step, syncGroupId: null } : step)
        }))
      }));
      return { ...s, syncGroupMeta: newMeta, projectTypes: newPTs };
    });
  };

  const saveTemplate = (name) => {
    if (!activePT) return;
    const tmpl = {
      id: uid(), name,
      projectType: { name: activePT.name, documents: activePT.documents }
    };
    updateStore(s => ({ ...s, templates: [...s.templates, tmpl] }));
    setModal(null);
    alert(`Template "${name}" saved!`);
  };

  const deleteTemplate = (id) => {
    if (!confirm('Delete this template?')) return;
    updateStore(s => ({ ...s, templates: s.templates.filter(t => t.id !== id) }));
  };

  return (
    <div className="flex h-screen overflow-hidden bg-slate-100">
      {/* Sidebar */}
      <aside className="bg-white border-r border-slate-200 flex flex-col shrink-0 no-print overflow-hidden" style={{ width: sidebarOpen ? sidebarWidth : 0, position: 'relative' }}>
        <div className="p-4 border-b border-slate-200">
          <div className="font-bold text-slate-800 text-sm leading-tight">CS Pipeline Tool</div>
          <div className="text-xs text-slate-400 mt-0.5">Continuing Studies · Langara</div>
          <div className="text-xs text-indigo-500 font-semibold mt-0.5">v2</div>
        </div>

        <div className="flex-1 overflow-y-auto p-3">
          {/* Project Types */}
          <div className="flex items-center justify-between mb-2 px-1">
            <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Workflows</span>
            <button onClick={() => setModal('newPT')} className="text-indigo-600 hover:text-indigo-800 text-lg font-bold leading-none" title="New workflow">+</button>
          </div>

          {store.projectTypes.map((pt, idx) => (
            <div key={pt.id}
              draggable
              onDragStart={e => { ptDragRef.current = pt.id; e.dataTransfer.effectAllowed = 'move'; }}
              onDragEnd={() => { ptDragRef.current = null; setPtDropId(null); }}
              onDragOver={e => { if (ptDragRef.current && ptDragRef.current !== pt.id) { e.preventDefault(); setPtDropId(pt.id); } }}
              onDragLeave={() => setPtDropId(cur => cur === pt.id ? null : cur)}
              onDrop={e => { e.preventDefault(); reorderPT(ptDragRef.current, pt.id); }}
              onClick={() => setActivePT(pt.id)}
              className={`group relative flex items-center gap-1 px-2 py-2 rounded-lg cursor-pointer mb-1 transition-colors ${pt.id === activePT?.id ? 'bg-indigo-600 text-white' : 'text-slate-700 hover:bg-slate-100'} ${ptDragRef.current === pt.id ? 'opacity-40' : ''}`}>
              {ptDropId === pt.id && (
                <div className="absolute left-1 right-1 -top-0.5 h-0.5 rounded bg-indigo-400" />
              )}
              <span className={`shrink-0 select-none leading-none ${pt.id === activePT?.id ? 'text-indigo-200' : 'text-slate-300'}`}
                style={{ cursor: 'grab', fontSize: 13, letterSpacing: '-1px' }}
                title="Drag to reorder">⠿</span>
              <span className="text-sm font-medium truncate flex-1">{pt.name}</span>
              {pt.id !== activePT?.id && (
                <button onClick={e => { e.stopPropagation(); deletePT(pt.id); }}
                  className="opacity-0 group-hover:opacity-100 shrink-0 w-5 h-5 rounded text-xs flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50"
                  title="Delete">✕</button>
              )}
            </div>
          ))}

          {/* Templates */}
          {store.templates.length > 0 && (
            <div className="mt-4">
              <div className="text-xs font-bold text-slate-400 uppercase tracking-widest px-1 mb-2">Templates</div>
              {store.templates.map(t => (
                <div key={t.id} className="group flex items-center justify-between px-3 py-1.5 rounded-lg mb-1 text-slate-500 hover:bg-slate-50">
                  <span className="text-xs truncate flex-1">{t.name}</span>
                  <button onClick={() => deleteTemplate(t.id)} className="opacity-0 group-hover:opacity-100 text-red-400 text-xs ml-1">✕</button>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Bottom settings */}
        <div className="p-3 border-t border-slate-200 space-y-1">
          <button onClick={() => setModal('manageTypes')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>🗂</span> Manage Workflows
          </button>
          <button onClick={() => setModal('roles')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>👥</span> Roles &amp; People
          </button>
          <button onClick={() => setModal('backup')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>💾</span> Backup &amp; Restore
          </button>
          <button onClick={() => {
            if (!confirm('Reset ALL data to the original defaults?')) return;
            updateStore(getDefaultStore());
          }} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-red-50 hover:text-red-600 flex items-center gap-2">
            <span>↺</span> Reset to Defaults
          </button>
        </div>
        <div
          style={{ position:'absolute', top:0, right:0, width:4, height:'100%', cursor:'col-resize', zIndex:10, userSelect:'none' }}
          onMouseDown={e => {
            sidebarDragRef.current = true;
            const onMove = ev => {
              if (!sidebarDragRef.current) return;
              const newWidth = ev.clientX;
              if (newWidth < 48) {
                setSidebarOpen(false);
              } else {
                const clamped = Math.min(400, Math.max(48, newWidth));
                setSidebarWidth(clamped);
                setSidebarOpen(true);
              }
            };
            const onUp = () => {
              sidebarDragRef.current = false;
              document.removeEventListener('mousemove', onMove);
              document.removeEventListener('mouseup', onUp);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
          }}
        />
      </aside>

      {/* Main area */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        {/* Top bar */}
        <header className="bg-white border-b border-slate-200 px-5 py-2.5 flex items-center gap-3 shrink-0 no-print">
          <button onClick={() => setSidebarOpen(o => !o)}
            className="text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded p-1 transition-colors shrink-0"
            title={sidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'}>
            {sidebarOpen ? '◀' : '▶'}
          </button>
          <div className="flex-1 min-w-0">
            {activePT ? (
              <>
                <h1 className="font-bold text-slate-800 text-base truncate">{activePT.name}</h1>
                <div className="text-xs text-slate-400">{activePT.documents.length} document type{activePT.documents.length !== 1 ? 's' : ''} &middot; Updated {new Date(activePT.updatedAt).toLocaleDateString()}</div>
              </>
            ) : (
              <h1 className="font-bold text-slate-400">No workflow selected</h1>
            )}
          </div>
          {activePT && (
            <div className="flex items-center bg-slate-100 rounded-lg p-0.5 shrink-0 no-print">
              {[['documents', '▤ Documents'], ['flow', '🪜 Step Flow']].map(([id, label]) => (
                <button key={id} onClick={() => setView(id)}
                  className={`text-xs font-medium px-2.5 py-1 rounded-md transition-colors ${view === id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                  title={id === 'documents' ? 'Full detail, one column per document' : 'At a glance: which steps each document goes through'}>
                  {label}
                </button>
              ))}
            </div>
          )}
          <div className="flex items-center gap-1.5 shrink-0 no-print">
            {activeUsers.length > 0 && (
              <div className="flex items-center gap-1 mr-1">
                {activeUsers.slice(0, 5).map(u => {
                  const initials = (u.displayName || u.email || '?').slice(0,2).toUpperCase();
                  const hash = [...(u.uid || '')].reduce((acc, c) => acc + c.charCodeAt(0), 0);
                  const colors = ['#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#0ea5e9'];
                  const bg = colors[hash % colors.length];
                  return (
                    <div key={u.uid} title={u.email || u.displayName}
                      style={{ width:24, height:24, borderRadius:'50%', background: bg, color:'white', fontSize:9, fontWeight:'bold', display:'flex', alignItems:'center', justifyContent:'center', border:'2px solid white', marginLeft: -4 }}>
                      {initials}
                    </div>
                  );
                })}
              </div>
            )}
            <button onClick={refreshStore} title="Pull latest from Firebase"
              className="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded px-1.5 py-1 text-xs transition-colors">↻</button>
            <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${
              syncStatus === 'ready'   ? 'bg-green-100 text-green-700' :
              syncStatus === 'saving'  ? 'bg-yellow-100 text-yellow-700' :
              syncStatus === 'error'   ? 'bg-red-100 text-red-600' :
                                         'bg-slate-100 text-slate-500'
            }`}>
              {syncStatus === 'ready'   ? '✓ Synced' :
               syncStatus === 'saving'  ? '💾 Saving…' :
               syncStatus === 'error'   ? '⚠ Offline' :
                                          '⏳ Loading…'}
            </span>
            <span className="text-xs text-slate-400 hidden sm:inline">{authUser.email}</span>
            <button onClick={() => getFbAuth().signOut()}
              className="text-xs text-slate-400 hover:text-red-600 hover:bg-red-50 rounded px-1.5 py-1 transition-colors"
              title="Sign out">Sign out</button>
          </div>
          {activePT && (
            <div className="flex items-center gap-2 shrink-0">
              {(() => {
                const st = publicationStatus(store, activePT);
                const cls = st.state === 'current' ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                          : st.state === 'stale'   ? 'bg-amber-50 text-amber-700 border-amber-300'
                          :                          'bg-white text-slate-600 border-slate-300';
                const label = st.state === 'current' ? '● Published · current'
                            : st.state === 'stale'   ? '● Published · out of date'
                            :                          '↗ Publish';
                return (
                  <button onClick={() => setModal('publish')}
                    title={st.state === 'stale'
                      ? 'The published page still shows an older version. Republish to bring it up to date.'
                      : st.state === 'current' ? 'The published page matches what you see here.'
                      : 'Publish a read-only link to this workflow'}
                    className={`inline-flex items-center gap-1.5 font-medium rounded-lg text-xs px-2.5 py-1.5 border transition-colors hover:brightness-95 ${cls}`}>
                    {label}
                  </button>
                );
              })()}
              <Btn variant="secondary" sm onClick={() => setModal('saveTemplate')}>☆ Save as Template</Btn>
            </div>
          )}
        </header>

        {/* Canvas */}
        {/* min-w-0 as well as min-h-0: without it this flex item will not shrink
            below its content, so a wide canvas (Row Lock sizes its band to
            max-content) grows the whole app sideways instead of scrolling. */}
        <div className="flex-1 min-h-0 min-w-0 overflow-hidden">
          {activePT ? (view === 'flow' ? (
            <StepFlowView projectType={activePT} roles={store.roles} syncGroupMeta={store.syncGroupMeta} />
          ) : (
            <ProjectTypeCanvas
              projectType={activePT}
              roles={store.roles}
              onUpdateProjectType={updatePT}
              allProjectTypes={store.projectTypes}
              onCopyStepToProject={copyStepToProject}
              onCopyDocToProject={copyDocToProject}
              syncGroupMeta={store.syncGroupMeta || {}}
              onUpdateSyncGroupMeta={updateSyncGroupMeta}
              onDissolveGroup={dissolveGroup}
            />
          )) : (
            <div className="flex items-center justify-center h-full text-slate-400">
              <div className="text-center">
                <div className="text-4xl mb-3">📋</div>
                <p className="text-sm">No workflow selected. Create one using the sidebar.</p>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Modals */}
      {modal === 'newPT' && <NewProjectTypeModal store={store} onCreate={createPT} onClose={() => setModal(null)} />}
      {modal === 'manageTypes' && <ProjectTypeEditor store={store} onUpdateStore={s => updateStore(s)} onClose={() => setModal(null)} />}
      {modal === 'roles' && <RolesEditor store={store} onUpdateStore={s => updateStore(s)} onClose={() => setModal(null)} />}
      {modal === 'backup' && <BackupModal store={store} onRestore={data => updateStore(data)} onClose={() => setModal(null)} />}
      {modal === 'publish' && activePT && <PublishModal store={store} projectType={activePT}
        authUser={authUser} onUpdateStore={updateStore} onClose={() => setModal(null)} />}
      {modal === 'saveTemplate' && activePT && <TemplateSaveModal projectType={activePT} onSave={saveTemplate} onClose={() => setModal(null)} />}
    </div>
  );
}

function Root() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = checking
  useEffect(() => {
    getFbApp(); // ensure app is initialized before auth
    return getFbAuth().onAuthStateChanged(user => setAuthUser(user));
  }, []);
  if (authUser === undefined) return (
    <div className="flex items-center justify-center h-screen bg-slate-100">
      <div className="text-slate-400 text-sm">Checking authentication…</div>
    </div>
  );
  if (!authUser) return <LoginScreen />;
  return <App authUser={authUser} />;
}

// A published page is public — no auth gate, no store, just the snapshot. The
// branch lives here rather than inside Root so no hook is skipped by an early
// return (see the Rules of Hooks note in CLAUDE.md).
const PUB_SLUG = new URLSearchParams(location.search).get('p');
ReactDOM.createRoot(document.getElementById('root'))
  .render(PUB_SLUG ? <PublishedView slug={PUB_SLUG} /> : <Root />);
</script>
</body>
</html>
