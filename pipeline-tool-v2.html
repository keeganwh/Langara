// ── Documents view display preferences ─────────────────────────────────────────
// Same idea as the Step Flow prefs: display-only, per project type, stored in
// localStorage so toggling detail never writes to the shared Firebase store.
// Unlike Step Flow, these default to ON — Documents is the full-detail view.
const DOC_PREFS_KEY = 'cs_pipeline_doc_prefs_v1';
const DOC_DETAILS = [
  { id: 'actions',    label: 'Actions' },
  { id: 'presenters', label: 'Prepares / Presents' },
  { id: 'carriers',   label: 'Carries to next' },
  { id: 'storage',    label: 'Where it lives' },
  { id: 'trigger',    label: 'Trigger' },
  { id: 'returns',    label: 'Return path' },
  { id: 'notes',      label: 'Notes' },
];
const ALL_DOC_DETAILS = DOC_DETAILS.reduce((a, d) => { a[d.id] = true; return a; }, {});

// Columns flex to share the canvas; below this width they stop shrinking and
// the canvas scrolls instead. One number, not a preference — the flexing is
// what adapts to the display, so a size picker had nothing left to do.
const DOC_MIN_WIDTH = 250;
// A ceiling as well as a floor: a one-document workflow otherwise stretches its
// single column across the whole display.
const DOC_MAX_WIDTH = 500;
const DOC_GAP = 16;
const ROW_LOCK_GUTTER = 26;   // vertical sync-group label column
// The grid wrapper has to stop growing too — max-width on a track loses to 1fr.
const docGridCap = (n, extra = 0) =>
  n > 0 ? (n * DOC_MAX_WIDTH + (n - 1) * DOC_GAP + extra) + 'px' : 'none';

function loadDocPrefs(projectTypeId) {
  try {
    const all = JSON.parse(localStorage.getItem(DOC_PREFS_KEY) || '{}');
    const p = all[projectTypeId] || {};
    return { details: { ...ALL_DOC_DETAILS, ...(p.details || {}) }, rowLock: !!p.rowLock };
  } catch (e) {
    return { details: { ...ALL_DOC_DETAILS }, rowLock: false };
  }
}
function saveDocPrefs(projectTypeId, prefs) {
  try {
    const all = JSON.parse(localStorage.getItem(DOC_PREFS_KEY) || '{}');
    all[projectTypeId] = prefs;
    localStorage.setItem(DOC_PREFS_KEY, JSON.stringify(all));
  } catch (e) { /* display preference only — safe to lose */ }
}

// ── StepCard ───────────────────────────────────────────────────────────────────
function StepCard({ step, stepIndex, totalSteps, docSteps, roles, docColor, onEdit, onDelete, onMove, onCopyTo, returnStepName, isDragging, onDragStart, onDragEnd, onDragOver, onDrop, linkingGroupId, onLinkStep, syncGroupColor, details = ALL_DOC_DETAILS, readOnly = false, fillHeight = false }) {
  const [notesOpen, setNotesOpen] = useState(false);
  const [copyOpen, setCopyOpen] = useState(false);
  const roleName = (id) => {
    const r = roles.find(r => r.id === id);
    return r ? r.label.replace('Program Coordinator', 'PC') : id;
  };

  const inActiveGroup = step.syncGroupId && step.syncGroupId === linkingGroupId;
  const inDifferentGroup = step.syncGroupId && linkingGroupId && step.syncGroupId !== linkingGroupId;
  const dimmed = linkingGroupId && !inActiveGroup && !isDragging;
  const linkColor = syncGroupColor || '#64748b';

  return (
    <div className={`step-card relative bg-white rounded-xl${step.informationOnly ? ' info-only' : ''}${fillHeight ? ' flex-1 flex flex-col' : ''}`}
      data-step-id={step.id}
      style={{
        '--doc-color': docColor,
        border: syncGroupColor
          ? `3px ${step.informationOnly ? 'dashed' : 'solid'} ${syncGroupColor}`
          : `2px ${step.informationOnly ? 'dashed' : 'solid'} ${step.informationOnly ? '#7dd3fc' : '#e2e8f0'}`,
        borderTopColor: syncGroupColor || (step.informationOnly ? '#7dd3fc' : docColor),
        borderTopWidth: syncGroupColor ? 3 : 3,
        opacity: isDragging ? 0.4 : dimmed ? 0.3 : 1,
        cursor: readOnly ? 'default' : 'grab',
        transition: 'opacity 0.15s',
      }}
      draggable={!readOnly}
      onDragStart={e => { e.dataTransfer.effectAllowed = 'move'; onDragStart && onDragStart(); }}
      onDragEnd={() => onDragEnd && onDragEnd()}
      onDragOver={e => { e.preventDefault(); e.stopPropagation(); onDragOver && onDragOver(); }}
      onDrop={e => { e.preventDefault(); e.stopPropagation(); onDrop && onDrop(); }}>

      {/* Hover controls */}
      <div className="step-controls absolute top-2 right-2 flex gap-1 z-10">
        {readOnly && (
          <button onClick={onEdit}
            className="w-6 h-6 rounded bg-indigo-100 hover:bg-indigo-200 text-indigo-600 text-xs flex items-center justify-center" title="Edit step">✎</button>
        )}
        {!readOnly && (<>
        <button onClick={() => onMove(stepIndex, -1)} disabled={stepIndex === 0}
          className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs disabled:opacity-30 flex items-center justify-center">▲</button>
        <button onClick={() => onMove(stepIndex, 1)} disabled={stepIndex === totalSteps - 1}
          className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs disabled:opacity-30 flex items-center justify-center">▼</button>
        <button onClick={onEdit}
          className="w-6 h-6 rounded bg-indigo-100 hover:bg-indigo-200 text-indigo-600 text-xs flex items-center justify-center" title="Edit step">✎</button>
        {onCopyTo && (
          <button onClick={() => setCopyOpen(true)}
            className="w-6 h-6 rounded bg-violet-50 hover:bg-violet-100 text-violet-600 text-xs flex items-center justify-center" title="Copy step to another document">⎘</button>
        )}
        {onLinkStep && (
          <button
            onClick={e => { e.stopPropagation(); if (!inDifferentGroup) onLinkStep(); }}
            className="w-6 h-6 rounded text-xs flex items-center justify-center transition-colors"
            style={inActiveGroup
              ? { background: linkColor + '30', color: linkColor, opacity: 1 }
              : inDifferentGroup
                ? { background: '#f1f5f9', color: '#94a3b8', cursor: 'not-allowed', opacity: 0.4 }
                : step.syncGroupId
                  ? { background: linkColor + '20', color: linkColor, opacity: 1 }
                  : { background: '#f1f5f9', color: '#64748b' }}
            title={inActiveGroup ? 'Remove from sync group' : inDifferentGroup ? 'Already in a different group' : step.syncGroupId ? 'Edit sync group' : 'Add to sync group'}>
            <Icon name="sync" size={12} />
          </button>
        )}
        <button onClick={onDelete}
          className="w-6 h-6 rounded bg-red-50 hover:bg-red-100 text-red-500 text-xs flex items-center justify-center" title="Delete step">✕</button>
        </>)}
      </div>

      {/* Badges: sync group and information-only, side by side above the top edge */}
      {(syncGroupColor || step.informationOnly) && (
        <div className="card-badges">
          {syncGroupColor && (
            <div className="card-badge" style={{ background: syncGroupColor }} title="In a sync group">
              <Icon name="sync" size={13} />
            </div>
          )}
          {step.informationOnly && (
            <div className="card-badge" style={{ background: '#0284c7' }}
              title="Information only — no action or approval at this step">
              <Icon name="info" size={13} />
            </div>
          )}
        </div>
      )}

      <div className={`p-3${fillHeight ? ' flex-1' : ''}`}>
        {/* Stage name — takes the document colour, so a column reads as one thing.
            "Information only" shares the line and wraps below when it won't fit. */}
        <div className="step-title-row pr-8 mb-2">
          <span className="font-bold text-sm leading-tight min-w-0"
            style={{ color: docColor, overflowWrap: 'anywhere' }}>{step.stageName}</span>
          {step.informationOnly && (
            <span className="info-only-label">Information only</span>
          )}
        </div>

        {/* Actions */}
        {details.actions && step.actions.length > 0 && (
          <div className="mb-2 flex flex-col" style={{ gap: 6 }}>
            {step.actions.map(a => (
              <div key={a.id} className="flex items-start gap-1.5 text-xs text-slate-700"
                style={{ lineHeight: 1.55 }}>
                <Icon name={actionSlot(a.type)} size={13} className="shrink-0"
                  style={{ marginTop: 2, color: ACTION_COLOR[actionSlot(a.type)] }} />
                <span className="min-w-0" style={{ overflowWrap: 'anywhere' }}>
                  {a.type === 'custom'
                    ? a.label
                    : <><span className="font-medium">{a.label}</span>{a.person ? <span className="text-slate-500"> {a.person}</span> : null}</>
                  }
                </span>
              </div>
            ))}
          </div>
        )}

        {/* Responsible parties + storage */}
        {((details.presenters && step.presenterIds.length > 0) || (details.carriers && step.carrierIds.length > 0) || (details.storage && (step.storageLocation || step.fileOperation))) && (
          <div className="border-t border-slate-100 pt-2 mt-2 flex flex-col" style={{ gap: 5 }}>
            {details.presenters && step.presenterIds.length > 0 && (
              <div className="flex items-baseline" style={{ gap: 8 }}>
                <span className="meta-key">Presents</span>
                <span className="flex flex-wrap min-w-0" style={{ gap: 4 }}>
                  {step.presenterIds.map(id => (
                    <span key={id} className="role-pill">{roleName(id)}</span>
                  ))}
                </span>
              </div>
            )}
            {details.carriers && step.carrierIds.length > 0 && (
              <div className="flex items-baseline" style={{ gap: 8 }}>
                <span className="meta-key">Carries</span>
                <span className="flex flex-wrap min-w-0" style={{ gap: 4 }}>
                  {step.carrierIds.map(id => (
                    <span key={id} className="role-pill">{roleName(id)}</span>
                  ))}
                </span>
              </div>
            )}
            {details.storage && step.storageLocation && (
              <div className="flex items-baseline" style={{ gap: 8 }}>
                <span className="meta-key">Filed</span>
                <span className="min-w-0">
                  {step.storageUrl
                    ? <a className="filed-chip" href={step.storageUrl} target="_blank" rel="noopener noreferrer"
                        onClick={e => e.stopPropagation()} title={step.storageUrl}>
                        <Icon name="storage" size={11} /><span>{step.storageLocation}</span>
                      </a>
                    : <span className="filed-chip">
                        <Icon name="storage" size={11} /><span>{step.storageLocation}</span>
                      </span>}
                </span>
              </div>
            )}
          </div>
        )}

        {/* Return path */}
        {details.returns && step.returnToStepId && returnStepName && (
          <div className="mt-2 pt-2 border-t border-dashed border-amber-300 text-xs text-amber-700 flex items-start gap-1">
            <Icon name="ret" size={12} className="shrink-0" style={{ marginTop: 2 }} />
            <span><span className="font-semibold">If rejected:</span> returns to "{returnStepName}"</span>
          </div>
        )}

        {/* Notes toggle */}
        {details.notes && step.notes && (
          <div className="mt-2 pt-2 border-t border-slate-100">
            <button onClick={() => setNotesOpen(o => !o)}
              className="text-xs text-slate-400 hover:text-slate-600 flex items-center gap-1">
              <span className="inline-block rounded-full" style={{ width: 5, height: 5, background: '#f59e0b' }} />
              <Icon name="notes" size={12} />
              <span>Notes</span>
              <span>{notesOpen ? '▾' : '▸'}</span>
            </button>
            <div className={`notes-expand ${notesOpen ? 'open' : ''}`}>
              <p className="text-xs text-slate-500 mt-1 bg-amber-50 rounded p-2 border border-amber-100">{step.notes}</p>
            </div>
          </div>
        )}
      </div>
      {copyOpen && onCopyTo && (
        <CopyToModal step={step}
          otherDocs={onCopyTo.otherDocs}
          onCopy={onCopyTo.copy}
          otherProjects={onCopyTo.otherProjects}
          onCopyToProject={onCopyTo.copyToProject}
          onClose={() => setCopyOpen(false)} />
      )}
    </div>
  );
}

// ── DocumentColumn ─────────────────────────────────────────────────────────────
function DocumentColumn({ doc, docIndex, totalDocs, onMoveDoc, projectTypeId, roles, store, onUpdateDoc, onDeleteDoc, otherDocs, otherProjects, onCopyStepToDoc, onCopyStepToProject, onCopyDocToProject, dragRef, dropTarget, setDropTarget, onMoveStepDrop, linkingGroupId, onLinkStep, syncGroupMeta, onUpdateSyncGroupMeta, onDissolveGroup, renderMode = 'body', details = ALL_DOC_DETAILS }) {
  const [addingStep, setAddingStep] = useState(false);
  const [editStep, setEditStep] = useState(null);
  const [editDocName, setEditDocName] = useState(false);
  const [docNameVal, setDocNameVal] = useState(doc.name);
  const [editOrderLabel, setEditOrderLabel] = useState(false);
  const [orderLabelVal, setOrderLabelVal] = useState(doc.orderLabel || '');
  const [copyDocOpen, setCopyDocOpen] = useState(false);
  const [inlineTriggerFor, setInlineTriggerFor] = useState(null); // stepId
  const [inlineCustomText, setInlineCustomText] = useState('');

  const setStepTrigger = (stepId, triggerType, triggerLabel = '') => {
    onUpdateDoc({ ...doc, steps: doc.steps.map(s => s.id === stepId ? { ...s, triggerType, triggerLabel } : s) });
    setInlineTriggerFor(null);
    setInlineCustomText('');
  };

  const saveStep = (stepData) => {
    const existing = doc.steps.find(s => s.id === stepData.id);
    const steps = existing
      ? doc.steps.map(s => s.id === stepData.id ? stepData : s)
      : [...doc.steps, stepData];
    onUpdateDoc({ ...doc, steps });
    setAddingStep(false);
    setEditStep(null);
  };

  const deleteStep = (id) => {
    if (!confirm('Delete this step?')) return;
    onUpdateDoc({ ...doc, steps: doc.steps.filter(s => s.id !== id) });
  };

  const moveStep = (idx, dir) => {
    const steps = [...doc.steps];
    const t = idx + dir;
    if (t < 0 || t >= steps.length) return;
    [steps[idx], steps[t]] = [steps[t], steps[idx]];
    onUpdateDoc({ ...doc, steps });
    const movedId = steps[t].id;
    setTimeout(() => {
      document.querySelector(`[data-step-id="${movedId}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  };

  const saveName = () => {
    if (docNameVal.trim()) onUpdateDoc({ ...doc, name: docNameVal.trim() });
    setEditDocName(false);
  };

  const returnStepName = (id) => doc.steps.find(s => s.id === id)?.stageName;

  const headerJSX = (
    <div className="group relative rounded-xl px-3 py-2.5 flex items-center no-print bg-white"
      style={{ border: '1px solid #e2e8f0', borderLeft: `4px solid ${doc.color}` }}>
      {editDocName ? (
        <input className="flex-1 text-sm font-bold bg-white border rounded px-2 py-0.5 border-slate-300"
          value={docNameVal} onChange={e => setDocNameVal(e.target.value)}
          onBlur={saveName} onKeyDown={e => e.key === 'Enter' && saveName()} autoFocus />
      ) : (
        <>
          {editOrderLabel ? (
            <input
              className="w-8 text-xs font-bold text-center bg-white border rounded px-1 py-0.5 border-slate-300 mr-1.5 shrink-0"
              style={{ color: '#0f172a' }}
              value={orderLabelVal}
              onChange={e => setOrderLabelVal(e.target.value)}
              onBlur={() => { onUpdateDoc({ ...doc, orderLabel: orderLabelVal.trim() }); setEditOrderLabel(false); }}
              onKeyDown={e => { if (e.key === 'Enter' || e.key === 'Escape') { onUpdateDoc({ ...doc, orderLabel: orderLabelVal.trim() }); setEditOrderLabel(false); } }}
              autoFocus
              placeholder="#"
            />
          ) : (
            <span
              className="text-xs font-bold mr-1.5 shrink-0 cursor-pointer hover:opacity-80 transition-opacity"
              style={{ color: '#0f172a', opacity: doc.orderLabel ? 1 : 0.3 }}
              onClick={() => { setOrderLabelVal(doc.orderLabel || ''); setEditOrderLabel(true); }}
              title="Click to set order number">
              {doc.orderLabel ? `#${doc.orderLabel}` : '#'}
            </span>
          )}
          <span className="flex-1 font-bold text-sm truncate" style={{ color: doc.color }}
            onDoubleClick={() => { setDocNameVal(doc.name); setEditDocName(true); }}
            title="Double-click to rename">{doc.name}</span>
        </>
      )}
      <div className="absolute right-2 top-1/2 -translate-y-1/2 flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity rounded"
        style={{ background: '#fff', boxShadow: '0 0 0 4px #fff' }}>
        <button onClick={() => onMoveDoc(-1)} disabled={docIndex === 0}
          className="w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Move column left">◀</button>
        <button onClick={() => onMoveDoc(1)} disabled={docIndex === totalDocs - 1}
          className="w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Move column right">▶</button>
        <button onClick={() => { setDocNameVal(doc.name); setEditDocName(true); }}
          className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Rename">✎</button>
        <input type="color" value={doc.color}
          onChange={e => onUpdateDoc({ ...doc, color: e.target.value })}
          className="w-5 h-5 rounded cursor-pointer border-0 p-0 bg-transparent" title="Change color" />
        {otherProjects && otherProjects.length > 0 && (
          <button onClick={() => setCopyDocOpen(true)}
            className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Copy document to another workflow">⎘</button>
        )}
        <button onClick={() => { if (confirm(`Delete "${doc.name}" and all its steps?`)) onDeleteDoc(doc.id); }}
          className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-red-100 text-red-400 transition-colors" title="Delete document">✕</button>
      </div>
    </div>
  );

  if (renderMode === 'header') {
    return (
      <div className="doc-col no-print">
        {headerJSX}
        {copyDocOpen && (
          <CopyDocModal doc={doc} otherProjects={otherProjects || []}
            onCopy={(targetProjId) => onCopyDocToProject(doc, targetProjId)}
            onClose={() => setCopyDocOpen(false)} />
        )}
      </div>
    );
  }

  return (
    <div className="doc-col flex flex-col bg-slate-100">

      {/* Print header */}
      <div className="rounded-xl mb-3 px-3 py-2.5 hidden bg-white" style={{ border: '1px solid #e2e8f0', borderLeft: `4px solid ${doc.color}` }}
        id={`print-header-${doc.id}`}>
        <span className="font-bold text-sm" style={{ color: doc.color }}>{doc.name}</span>
      </div>

      {/* Steps */}
      <div className="space-y-0"
        onDragOver={e => { e.preventDefault(); if (dragRef?.current) setDropTarget({ docId: doc.id, atEnd: true }); }}
        onDrop={e => { e.preventDefault(); if (dragRef?.current) { const { stepId, srcDocId } = dragRef.current; onMoveStepDrop(srcDocId, stepId, doc.id, null); } }}>
        {doc.steps.length === 0 && (
          <div className="text-center py-8 text-slate-400 text-xs border-2 border-dashed border-slate-200 rounded-xl">
            No steps yet.<br />Click below to add.
          </div>
        )}
        {doc.steps.map((step, i) => (
          <div key={step.id}>
            {/* Drop indicator above this step */}
            {dropTarget?.docId === doc.id && dropTarget?.beforeStepId === step.id && (
              <div className="h-1 rounded mx-1 my-0.5" style={{ background: doc.color }} />
            )}
            {/* Trigger on the first step — the same band without an arrow */}
            {details.trigger && step.triggerType && i === 0 && (
              <div onClick={() => setEditStep(step)} className="step-link no-print"
                title="Click to change what triggers this step">
                <div className="step-link-rows">
                  <div className="flex items-center gap-1.5 text-[10.5px] text-amber-700 leading-tight">
                    <Icon name={triggerIcon(step)} size={12} />
                    <span className="min-w-0" style={{ overflowWrap: 'anywhere' }}>{triggerDisplay(step)}</span>
                  </div>
                </div>
                <span className="step-link-add">Edit trigger</span>
              </div>
            )}
            <StepCard
              step={step}
              stepIndex={i}
              totalSteps={doc.steps.length}
              docSteps={doc.steps}
              roles={roles}
              docColor={doc.color}
              onEdit={() => setEditStep(step)}
              onDelete={() => deleteStep(step.id)}
              onMove={moveStep}
              returnStepName={step.returnToStepId ? returnStepName(step.returnToStepId) : null}
              onCopyTo={(otherDocs && otherDocs.length > 0) || (otherProjects && otherProjects.length > 0) ? {
                otherDocs: otherDocs || [],
                copy: (targetDocId) => onCopyStepToDoc(step, targetDocId),
                otherProjects: otherProjects || [],
                copyToProject: (targetProjId, targetDocId) => onCopyStepToProject(step, targetProjId, targetDocId),
              } : null}
              isDragging={dragRef?.current?.stepId === step.id}
              onDragStart={() => { dragRef.current = { stepId: step.id, srcDocId: doc.id }; }}
              onDragEnd={() => { dragRef.current = null; setDropTarget(null); }}
              onDragOver={() => { if (dragRef?.current) setDropTarget({ docId: doc.id, beforeStepId: step.id }); }}
              onDrop={() => { if (dragRef?.current) { const { stepId, srcDocId } = dragRef.current; onMoveStepDrop(srcDocId, stepId, doc.id, step.id); } }}
              linkingGroupId={linkingGroupId}
              onLinkStep={onLinkStep ? () => onLinkStep(step) : null}
              syncGroupColor={step.syncGroupId && syncGroupMeta ? syncGroupMeta[step.syncGroupId]?.color : null}
              details={details}
            />
            {/* Between two steps: arrow on the left, the file-operation and
                trigger lines stacked beside it, the whole group centred. The
                band itself opens the trigger picker, so it needs no button. */}
            {i < doc.steps.length - 1 && (() => {
              const s = doc.steps[i];
              const nextStep = doc.steps[i + 1];
              const opLabel = s.fileOperation === 'copy' ? 'Document copied'
                            : s.fileOperation === 'move' ? 'Document moved' : null;
              const dlLabel = s.deliveryMethod === 'download_email' ? 'Emailed as attachment' : null;
              const arrowLabel = details.storage ? [opLabel, dlLabel].filter(Boolean).join(' · ') : '';
              const showPicker = inlineTriggerFor === nextStep.id;
              const hasTrigger = details.trigger && nextStep.triggerType;
              if (showPicker) {
                return (
                  <div className="mx-1 my-1 no-print">
                    <div className="bg-white border border-amber-200 rounded-lg p-2 shadow-sm">
                      <div className="text-xs text-slate-400 mb-1.5 font-medium">What triggers the next step?</div>
                      <div className="flex flex-wrap gap-1 mb-1">
                        {TRIGGER_TYPES.map(t => (
                          <button key={t} onClick={() => setStepTrigger(nextStep.id, t)}
                            className="px-2 py-0.5 rounded-full text-xs border border-slate-200 hover:border-amber-400 hover:bg-amber-50 text-slate-600 transition-colors inline-flex items-center gap-1.5">
                            <Icon name={TRIGGER_ICON[t]} size={11} />{TRIGGER_LABELS[t]}
                          </button>
                        ))}
                        <button onClick={() => { setInlineCustomText(''); setInlineTriggerFor(nextStep.id + '_custom'); }}
                          className="px-2 py-0.5 rounded-full text-xs border border-slate-200 hover:border-amber-400 hover:bg-amber-50 text-slate-600 transition-colors inline-flex items-center gap-1.5">
                          <Icon name="t_cust" size={11} />Custom
                        </button>
                        {nextStep.triggerType && (
                          <button onClick={() => setStepTrigger(nextStep.id, '')}
                            className="px-2 py-0.5 rounded-full text-xs border border-slate-200 hover:border-red-300 hover:bg-red-50 text-slate-500 transition-colors">
                            Clear
                          </button>
                        )}
                      </div>
                      {inlineTriggerFor === nextStep.id + '_custom' && (
                        <div className="flex gap-1 mt-1">
                          <input className="flex-1 text-xs border border-slate-300 rounded px-2 py-0.5" value={inlineCustomText}
                            onChange={e => setInlineCustomText(e.target.value)}
                            onKeyDown={e => { if (e.key === 'Enter' && inlineCustomText.trim()) setStepTrigger(nextStep.id, 'custom', inlineCustomText.trim()); if (e.key === 'Escape') setInlineTriggerFor(null); }}
                            placeholder="Describe trigger..." autoFocus />
                          <button onClick={() => inlineCustomText.trim() && setStepTrigger(nextStep.id, 'custom', inlineCustomText.trim())}
                            className="px-2 py-0.5 text-xs bg-amber-500 text-white rounded hover:bg-amber-600">✓</button>
                        </div>
                      )}
                      <button onClick={() => setInlineTriggerFor(null)} className="mt-1 text-xs text-slate-400 hover:text-slate-600">Cancel</button>
                    </div>
                  </div>
                );
              }
              return (
                <div className="step-link no-print"
                  onClick={() => setInlineTriggerFor(nextStep.id)}
                  title={hasTrigger ? 'Click to change what triggers the next step' : 'Click to set what triggers the next step'}>
                  <div className="step-link-arrow" style={{ color: doc.color }}>
                    <span className="stem" /><span className="head" />
                  </div>
                  <div className="step-link-rows">
                    {arrowLabel && (
                      <div className="text-[10px] italic leading-tight" style={{ color: doc.color }}>{arrowLabel}</div>
                    )}
                    {hasTrigger && (
                      <div className="flex items-center gap-1.5 text-[10.5px] text-amber-700 leading-tight">
                        <Icon name={triggerIcon(nextStep)} size={12} />
                        <span className="min-w-0" style={{ overflowWrap: 'anywhere' }}>{triggerDisplay(nextStep)}</span>
                      </div>
                    )}
                  </div>
                  <span className="step-link-add">{hasTrigger ? 'Edit trigger' : '+ Trigger'}</span>
                </div>
              );
            })()}
          </div>
        ))}
        {/* Drop indicator at end of column */}
        {dropTarget?.docId === doc.id && dropTarget?.atEnd && (
          <div className="h-1 rounded mx-1 mt-0.5" style={{ background: doc.color }} />
        )}
      </div>

      {/* Add Step */}
      <div className="mt-3 no-print">
        <button onClick={() => setAddingStep(true)}
          className="w-full py-2 rounded-xl text-xs font-semibold border-2 border-dashed transition-colors hover:bg-white"
          style={{ borderColor: doc.color + '60', color: doc.color }}>
          + Add Step
        </button>
      </div>

      {/* End marker */}
      <div className="mt-2 rounded-lg py-1.5 px-3 text-center text-xs font-semibold"
        style={{ background: doc.color + '15', color: doc.color }}>
        ✓ Complete
      </div>

      {(addingStep || editStep) && (
        <StepForm
          step={editStep}
          docSteps={doc.steps}
          roles={roles}
          docColor={doc.color}
          syncGroupMeta={syncGroupMeta}
          onUpdateSyncGroupMeta={onUpdateSyncGroupMeta}
          onDissolveGroup={onDissolveGroup}
          onSave={saveStep}
          onClose={() => { setAddingStep(false); setEditStep(null); }}
        />
      )}
    </div>
  );
}

// ── RowLockedCanvas ────────────────────────────────────────────────────────────
// Documents view with Row Lock on: one CSS grid for the whole canvas, so a row
// band's height is set by its tallest card and every document lines up on it.
// Sync-grouped steps share a band — that's the point of the mode. Reordering is
// disabled here (the bands, not the columns, decide vertical position), so this
// is a reading layout; editing a step still works.
function RowLockedCanvas({ projectType, roles, details, syncGroupMeta, onUpdateProjectType, onUpdateSyncGroupMeta, onDissolveGroup }) {
  const [editStep, setEditStep] = React.useState(null);
  const docs = projectType.documents || [];

  // Column width is measured, not left to the grid. This band sits inside a
  // shrink-to-fit box whose width depends on its content, so `1fr` resolves
  // against max-content and every column lands on its ceiling however narrow
  // the window is. Measuring the scroller and dividing is unambiguous.
  const bandRef = React.useRef(null);
  const [colWidth, setColWidth] = React.useState(DOC_MIN_WIDTH);
  React.useEffect(() => {
    const el = bandRef.current;
    const host = el && el.parentElement;
    if (!host) return;
    const measure = () => {
      const n = docs.length || 1;
      const usable = host.clientWidth - 32 - ROW_LOCK_GUTTER - DOC_GAP * n;   // px-4
      setColWidth(Math.max(DOC_MIN_WIDTH, Math.min(DOC_MAX_WIDTH, Math.floor(usable / n))));
    };
    // An observer, not a one-shot: on mount the scroller has not been sized yet,
    // and a single measurement reads the unconstrained width.
    const ro = new ResizeObserver(measure);
    ro.observe(host);
    measure();
    return () => ro.disconnect();
  }, [docs.length]);
  const bands = React.useMemo(() => buildRowBands(projectType), [projectType]);

  // Where each document's track starts and ends, by band index. Empty cells
  // between the two are steps the document passes over; empty cells outside
  // are simply before it starts or after it ends, and stay blank.
  const trackRange = React.useMemo(() => {
    const range = {};
    docs.forEach(doc => {
      let first = -1, last = -1;
      bands.forEach((b, i) => {
        if ((b.cells[doc.id] || []).length) { if (first < 0) first = i; last = i; }
      });
      range[doc.id] = { first, last };
    });
    return range;
  }, [bands, docs]);

  const saveStep = (stepData) => {
    onUpdateProjectType({
      ...projectType,
      documents: docs.map(d => ({
        ...d,
        steps: (d.steps || []).map(st => st.id === stepData.id ? stepData : st),
      })),
      updatedAt: new Date().toISOString(),
    });
    setEditStep(null);
  };

  const allSteps = docs.flatMap(d => d.steps || []);
  const returnStepName = (id) => {
    const st = allSteps.find(x => x.id === id);
    return st ? st.stageName : null;
  };

  const editDoc = editStep ? docs.find(d => (d.steps || []).some(st => st.id === editStep.id)) : null;

  return (
    <div className="flex-1 overflow-auto" id="canvas-print-area">
      <div className="px-4 pt-3 pb-8" ref={bandRef} style={{ minWidth: 'max-content' }}>
        <div style={{
          display: 'grid',
          // Same floor and ceiling as the Documents view — this used to hard-code
          // 260px and ignore the canvas width entirely. Bounded on both sides
          // rather than 1fr with a cap: this grid's wrapper is min-width
          // max-content, so 1fr would resolve against the content and sail past
          // the maximum.
          gridTemplateColumns: `${ROW_LOCK_GUTTER}px repeat(${docs.length}, ${colWidth}px)`,
          columnGap: DOC_GAP, rowGap: 0, alignItems: 'stretch',
        }}>
          {/* Gutter spacer above the sync-group labels */}
          <div style={{ gridColumn: 1, gridRow: 1 }} />

          {/* Document headers */}
          {docs.map(doc => (
            <div key={`h-${doc.id}`} className="sticky top-0 z-20 pb-2"
              style={{ background: 'linear-gradient(to bottom, #f1f5f9 78%, transparent)' }}>
              <div className="rounded-xl px-3 py-2 font-bold text-sm flex items-center gap-2"
                style={{ background: doc.color + '18', color: doc.color, border: `2px solid ${doc.color}40` }}>
                {doc.orderLabel && <span className="opacity-60">#{doc.orderLabel}</span>}
                <span className="truncate">{doc.name}</span>
                <span className="ml-auto text-[10px] font-semibold opacity-60">{(doc.steps || []).length}</span>
              </div>
            </div>
          ))}

          {/* One row band at a time, so grid rows keep every column aligned */}
          {bands.map((band, bi) => {
            const meta = band.syncGroupId && syncGroupMeta ? syncGroupMeta[band.syncGroupId] : null;
            return [
              // Sync-group label, rotated to keep the gutter narrow. Spans the
              // band, so it reads as a bracket around the whole group.
              <div key={`g-${band.key}`} className="pb-3" style={{ gridColumn: 1, gridRow: bi + 2 }}>
                {meta && (
                  <div className="h-full rounded-lg flex items-center justify-center overflow-hidden"
                    title={`Sync group: ${meta.name}`}
                    style={{ background: meta.color + '14', border: `1px solid ${meta.color}40` }}>
                    <span style={{
                      writingMode: 'vertical-rl', transform: 'rotate(180deg)',
                      color: meta.color, fontSize: 10, fontWeight: 700,
                      letterSpacing: '.08em', textTransform: 'uppercase',
                      whiteSpace: 'nowrap', textOverflow: 'ellipsis', overflow: 'hidden',
                      maxHeight: '100%', padding: '6px 0',
                    }}>{meta.name}</span>
                  </div>
                )}
              </div>,
              ...docs.map(doc => {
              const steps = band.cells[doc.id] || [];
              const { first, last } = trackRange[doc.id] || { first: -1, last: -1 };
              const inTrack = first >= 0 && bi >= first && bi <= last;
              const passing = inTrack && steps.length === 0;
              return (
                <div key={`${band.key}-${doc.id}`} className="pb-3 flex flex-col"
                  style={{ gridColumn: 'auto', gridRow: bi + 2 }}>
                  {steps.length === 0 ? (
                    // Empty cell. If the document carries on below this band it
                    // gets a ↓ marker; before it starts or after it ends the box
                    // stays blank, so "not involved" reads differently from
                    // "passes through".
                    <div className="flex-1 min-h-[2.5rem] rounded-xl border-2 border-dashed flex flex-col items-center justify-center py-3"
                      style={{ borderColor: meta ? meta.color + '40' : '#dfe3ea' }}
                      title={passing ? `${doc.name} passes this step` : undefined}>
                      {passing && (<>
                        <div style={{ width: 3, flex: 1, minHeight: 20, background: '#c3c9d4', borderRadius: 2 }} />
                        <div style={{
                          width: 0, height: 0, marginTop: -1,
                          borderLeft: '8px solid transparent', borderRight: '8px solid transparent',
                          borderTop: '11px solid #c3c9d4',
                        }} />
                      </>)}
                    </div>
                  ) : (
                    <div className="flex-1 flex flex-col gap-2">
                      {steps.map(step => (
                        <StepCard key={step.id} fillHeight
                          step={step} stepIndex={0} totalSteps={1}
                          docSteps={doc.steps || []} roles={roles} docColor={doc.color}
                          onEdit={() => setEditStep(step)}
                          onDelete={() => {}} onMove={() => {}} onCopyTo={null}
                          returnStepName={step.returnToStepId ? returnStepName(step.returnToStepId) : null}
                          syncGroupColor={meta ? meta.color : null}
                          details={details} readOnly />
                      ))}
                    </div>
                  )}
                </div>
              );
            })];
          })}
        </div>

        {/* Sync group legend — the reason this mode exists */}
        {Object.keys(syncGroupMeta || {}).length > 0 && (
          <div className="mt-4 flex flex-wrap items-center gap-3 text-[11px] text-slate-400">
            <span className="font-semibold text-slate-500">Sync groups:</span>
            {Object.entries(syncGroupMeta).map(([id, m]) => {
              const n = bands.filter(b => b.syncGroupId === id)
                .reduce((a, b) => a + Object.keys(b.cells).length, 0);
              if (!n) return null;
              return (
                <span key={id} className="inline-flex items-center gap-1.5">
                  <span style={{ width: 10, height: 10, borderRadius: 3, background: m.color, display: 'inline-block' }} />
                  {m.name} <span className="text-slate-300">({n} docs)</span>
                </span>
              );
            })}
          </div>
        )}
      </div>

      {editStep && editDoc && (
        <StepForm step={editStep} docSteps={editDoc.steps || []} allSteps={allSteps}
          roles={roles} docColor={editDoc.color} syncGroupMeta={syncGroupMeta || {}}
          onUpdateSyncGroupMeta={onUpdateSyncGroupMeta} onDissolveGroup={onDissolveGroup}
          onSave={saveStep} onClose={() => setEditStep(null)} />
      )}
    </div>
  );
}

// ── ProjectTypeCanvas ──────────────────────────────────────────────────────────
function ProjectTypeCanvas({ projectType, roles, onUpdateProjectType, allProjectTypes, onCopyStepToProject, onCopyDocToProject, syncGroupMeta, onUpdateSyncGroupMeta, onDissolveGroup }) {
  const dragRef = React.useRef(null);
  const [dropTarget, setDropTarget] = React.useState(null);
  const canvasRef = React.useRef(null);
  const [linkingGroupId, setLinkingGroupId] = React.useState(null);
  const headerScrollRef = React.useRef(null);
  const [docPrefs, setDocPrefs] = React.useState(() => loadDocPrefs(projectType.id));
  const [panelOpen, setPanelOpen] = React.useState(false);
  const [notesOpen, setNotesOpen] = React.useState(false);
  const hasWorkflowNotes = !!(projectType.notes || '').trim();

  const [scrollState, setScrollState] = useState({ l: false, r: false, v: false });
  const syncScrollState = React.useCallback(() => {
    const el = canvasRef.current;
    if (!el) return;
    const over = el.scrollWidth - el.clientWidth > 4;
    setScrollState({
      l: el.scrollLeft > 4,
      r: over && el.scrollLeft < el.scrollWidth - el.clientWidth - 4,
      v: el.scrollTop > 4,
    });
  }, []);
  const onStepsScroll = (e) => {
    if (headerScrollRef.current) headerScrollRef.current.scrollLeft = e.currentTarget.scrollLeft;
    syncScrollState();
  };
  const nudge = (dir) => {
    if (canvasRef.current) canvasRef.current.scrollBy({ left: dir * 360, behavior: 'smooth' });
  };
  React.useEffect(() => {
    syncScrollState();
    window.addEventListener('resize', syncScrollState);
    return () => window.removeEventListener('resize', syncScrollState);
  }, [syncScrollState, projectType.documents.length, docPrefs.rowLock]);

  React.useEffect(() => { setDocPrefs(loadDocPrefs(projectType.id)); }, [projectType.id]);

  const setAndSaveDocPrefs = (next) => { setDocPrefs(next); saveDocPrefs(projectType.id, next); };
  const details = docPrefs.details;
  const hiddenDetailCount = DOC_DETAILS.filter(d => !details[d.id]).length;

  // Exit linking mode on Escape
  React.useEffect(() => {
    if (!linkingGroupId) return;
    const handler = (e) => { if (e.key === 'Escape') setLinkingGroupId(null); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [linkingGroupId]);

  const onLinkStep = (step, doc) => {
    if (step.syncGroupId) {
      if (step.syncGroupId === linkingGroupId) {
        // Remove this step from the active group
        const newSteps = doc.steps.map(s => s.id === step.id ? { ...s, syncGroupId: null } : s);
        onUpdateProjectType({ ...projectType, documents: projectType.documents.map(d => d.id === doc.id ? { ...d, steps: newSteps } : d), updatedAt: new Date().toISOString() });
        // If no steps remain in the group, dissolve it
        const remaining = projectType.documents.flatMap(d => d.steps).filter(s => s.syncGroupId === linkingGroupId && s.id !== step.id);
        if (remaining.length === 0) { onDissolveGroup(linkingGroupId); setLinkingGroupId(null); }
      } else if (!linkingGroupId) {
        // Enter linking mode for this step's existing group
        setLinkingGroupId(step.syncGroupId);
      }
      // If in linking mode with a different group: ignore
      return;
    }
    // Step is ungrouped
    if (linkingGroupId) {
      // Add to current group
      const newSteps = doc.steps.map(s => s.id === step.id ? { ...s, syncGroupId: linkingGroupId } : s);
      onUpdateProjectType({ ...projectType, documents: projectType.documents.map(d => d.id === doc.id ? { ...d, steps: newSteps } : d), updatedAt: new Date().toISOString() });
    } else {
      // Create new group
      const newGroupId = uid();
      const groupCount = Object.keys(syncGroupMeta).length;
      const newMeta = { ...syncGroupMeta, [newGroupId]: { name: `Sync Group ${groupCount + 1}`, color: SYNC_COLORS[groupCount % SYNC_COLORS.length] } };
      onUpdateSyncGroupMeta(newMeta);
      const newSteps = doc.steps.map(s => s.id === step.id ? { ...s, syncGroupId: newGroupId } : s);
      onUpdateProjectType({ ...projectType, documents: projectType.documents.map(d => d.id === doc.id ? { ...d, steps: newSteps } : d), updatedAt: new Date().toISOString() });
      setLinkingGroupId(newGroupId);
    }
  };

  const updateDoc = (updated) => {
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.map(d => d.id === updated.id ? updated : d),
      updatedAt: new Date().toISOString(),
    });
  };

  const deleteDoc = (id) => {
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.filter(d => d.id !== id),
      updatedAt: new Date().toISOString(),
    });
  };

  const addDocument = () => {
    const name = prompt('Document name:');
    if (!name?.trim()) return;
    const colors = ['#0891b2', '#d97706', '#9333ea', '#0d9488', '#db2777'];
    const color = colors[projectType.documents.length % colors.length];
    onUpdateProjectType({
      ...projectType,
      documents: [...projectType.documents, { id: uid(), name: name.trim(), color, steps: [], orderLabel: '' }],
      updatedAt: new Date().toISOString(),
    });
  };

  if (projectType.documents.length === 0) {
    return (
      <div className="flex flex-col items-center justify-center h-64 text-slate-400">
        <div className="text-4xl mb-3">📄</div>
        <p className="text-sm mb-3">No documents defined for this workflow.</p>
        <Btn onClick={addDocument}>+ Add Document Type</Btn>
      </div>
    );
  }

  const moveDoc = (id, dir) => {
    const arr = [...projectType.documents];
    const idx = arr.findIndex(d => d.id === id);
    const t = idx + dir;
    if (t < 0 || t >= arr.length) return;
    [arr[idx], arr[t]] = [arr[t], arr[idx]];
    onUpdateProjectType({ ...projectType, documents: arr, updatedAt: new Date().toISOString() });
  };

  const copyStepToDoc = (step, targetDocId) => {
    const newStep = { ...step, id: uid(), actions: step.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null };
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.map(d =>
        d.id === targetDocId ? { ...d, steps: [...d.steps, newStep] } : d
      ),
      updatedAt: new Date().toISOString(),
    });
  };

  const moveStepDrop = (srcDocId, stepId, targetDocId, beforeStepId) => {
    if (beforeStepId === stepId) return; // dropped on self — no-op
    const srcDoc = projectType.documents.find(d => d.id === srcDocId);
    if (!srcDoc) return;
    const step = srcDoc.steps.find(s => s.id === stepId);
    if (!step) return;
    const movingStep = srcDocId !== targetDocId ? { ...step, returnToStepId: null } : step;
    const newDocs = projectType.documents.map(d => {
      const isSrc = d.id === srcDocId;
      const isTgt = d.id === targetDocId;
      if (!isSrc && !isTgt) return d;
      if (isSrc && isTgt) {
        // reorder within same doc
        let steps = d.steps.filter(s => s.id !== stepId);
        const insertIdx = beforeStepId ? steps.findIndex(s => s.id === beforeStepId) : steps.length;
        steps.splice(insertIdx < 0 ? steps.length : insertIdx, 0, movingStep);
        return { ...d, steps };
      }
      if (isSrc) return { ...d, steps: d.steps.filter(s => s.id !== stepId) };
      // isTgt
      let steps = [...d.steps];
      const insertIdx = beforeStepId ? steps.findIndex(s => s.id === beforeStepId) : steps.length;
      steps.splice(insertIdx < 0 ? steps.length : insertIdx, 0, movingStep);
      return { ...d, steps };
    });
    onUpdateProjectType({ ...projectType, documents: newDocs, updatedAt: new Date().toISOString() });
    setDropTarget(null);
    dragRef.current = null;
  };


  const colProps = (doc, docIdx) => ({
    doc,
    docIndex: docIdx,
    totalDocs: projectType.documents.length,
    onMoveDoc: (dir) => moveDoc(doc.id, dir),
    projectTypeId: projectType.id,
    otherDocs: projectType.documents.filter(d => d.id !== doc.id),
    otherProjects: (allProjectTypes || []).filter(p => p.id !== projectType.id),
    onCopyStepToDoc: copyStepToDoc,
    onCopyStepToProject,
    onCopyDocToProject,
    roles,
    onUpdateDoc: updateDoc,
    onDeleteDoc: deleteDoc,
    details,
  });

  return (
    <div className="flex flex-col h-full overflow-hidden relative" id="canvas-print-area">

      {/* Display toolbar */}
      <div className="shrink-0 flex flex-wrap items-center gap-2 px-4 py-2 border-b border-slate-200 bg-white no-print relative z-30">
        <div className="relative">
          <Btn variant="secondary" sm className="tb-btn" onClick={() => setPanelOpen(o => !o)}>
            ⚙ Details {hiddenDetailCount > 0 && <span className="text-indigo-600 font-bold">({DOC_DETAILS.length - hiddenDetailCount}/{DOC_DETAILS.length})</span>}
          </Btn>
          {panelOpen && (
            <div className="absolute left-0 top-full mt-1 w-64 bg-white border border-slate-200 rounded-xl shadow-xl p-2 fade-in">
              <div className="text-xs text-slate-400 px-2 py-1">Hide detail to scan the shape of the process. Doesn't change the data.</div>
              {DOC_DETAILS.map(d => (
                <label key={d.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <input type="checkbox" checked={!!details[d.id]}
                    onChange={() => setAndSaveDocPrefs({ ...docPrefs, details: { ...details, [d.id]: !details[d.id] } })} />
                  <span className="text-sm text-slate-700">{d.label}</span>
                </label>
              ))}
              <div className="flex gap-1 mt-1">
                <button onClick={() => setAndSaveDocPrefs({ ...docPrefs, details: { ...ALL_DOC_DETAILS } })}
                  className="flex-1 text-xs text-indigo-600 hover:bg-indigo-50 rounded-lg py-1.5">Show all</button>
                <button onClick={() => setAndSaveDocPrefs({ ...docPrefs, details: DOC_DETAILS.reduce((a, d) => { a[d.id] = false; return a; }, {}) })}
                  className="flex-1 text-xs text-slate-500 hover:bg-slate-100 rounded-lg py-1.5">Hide all</button>
              </div>
            </div>
          )}
        </div>
        <button
          onClick={() => setAndSaveDocPrefs({ ...docPrefs, rowLock: !docPrefs.rowLock })}
          className={`tb-btn inline-flex items-center gap-1.5 font-medium rounded-lg text-xs px-2.5 py-1.5 border transition-colors ${
            docPrefs.rowLock
              ? 'bg-indigo-600 border-indigo-600 text-white hover:bg-indigo-700'
              : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}`}
          title="Line documents up on shared rows so sync-grouped steps sit side by side. Reordering is off while this is on.">
          ⇥ Row Lock
        </button>
        {docPrefs.rowLock && (
          <span className="text-[11px] text-slate-400">Rows aligned · drag to reorder is off</span>
        )}
        <button
          onClick={() => setNotesOpen(o => !o)}
          className={`tb-btn inline-flex items-center gap-1.5 font-medium rounded-lg text-xs px-2.5 py-1.5 border transition-colors ${
            notesOpen
              ? 'bg-amber-500 border-amber-500 text-white hover:bg-amber-600'
              : hasWorkflowNotes
                ? 'bg-amber-50 border-amber-300 text-amber-800 hover:bg-amber-100'
                : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}`}
          title={hasWorkflowNotes ? 'This workflow has notes' : 'Add notes for this workflow'}>
          <Icon name="notes" size={13} />
          Notes
          {hasWorkflowNotes && !notesOpen && (
            <span className="inline-block rounded-full" style={{ width: 5, height: 5, background: '#f59e0b' }} />
          )}
        </button>
        <div className="flex-1" />
        <span className="text-[11px] text-slate-400">{projectType.documents.length} document{projectType.documents.length !== 1 ? 's' : ''}</span>
      </div>

      {/* Workflow notes — shared content, so it writes to the store. Closed by
          default; the toolbar button shows a dot when there is something here. */}
      {notesOpen && (
        <div className="shrink-0 border-b border-amber-200 bg-amber-50 px-4 py-3 no-print">
          <div className="flex items-start gap-2">
            <Icon name="notes" size={14} className="text-amber-600 mt-0.5 shrink-0" />
            <div className="flex-1 min-w-0">
              <textarea
                className="w-full text-sm bg-white border border-amber-200 rounded-lg px-3 py-2 resize-y focus:outline-none"
                rows={3}
                value={projectType.notes || ''}
                onChange={e => onUpdateProjectType({ ...projectType, notes: e.target.value })}
                placeholder="Notes about this whole workflow — context, timing, who to ask. Shown on the published page." />
              <div className="text-[11px] text-slate-400 mt-1">
                Shared with everyone, and included on the published page.
              </div>
            </div>
            <button onClick={() => setNotesOpen(false)}
              className="text-slate-400 hover:text-slate-600 text-sm shrink-0" title="Close">✕</button>
          </div>
        </div>
      )}

      {docPrefs.rowLock ? (
        <RowLockedCanvas
          projectType={projectType}
          roles={roles}
          details={details}
          syncGroupMeta={syncGroupMeta || {}}
          onUpdateProjectType={onUpdateProjectType}
          onUpdateSyncGroupMeta={onUpdateSyncGroupMeta}
          onDissolveGroup={onDissolveGroup}
        />
      ) : (<>

      {/* Fixed header row — never scrolls vertically */}
      <div className="shrink-0 overflow-hidden relative z-20 no-print" ref={headerScrollRef}
        onClick={() => setPanelOpen(false)} style={{ '--doc-min': DOC_MIN_WIDTH + 'px' }}>
        <div className="flex gap-4 px-4 pt-4 pb-0">
          <div className="doc-grid flex-1"
            style={{ '--doc-n': projectType.documents.length,
                     '--doc-cap': docGridCap(projectType.documents.length) }}>
            {projectType.documents.map((doc, docIdx) => (
              <DocumentColumn key={`hdr-${doc.id}`} renderMode="header" {...colProps(doc, docIdx)} />
            ))}
          </div>
          <div className="shrink-0" style={{ width: 170 }} /> {/* aligns with Add Document */}
        </div>
      </div>

      {/* Scrollable steps area */}
      <div className="overflow-x-auto overflow-y-auto flex-1 pb-4 relative canvas-scroll" ref={canvasRef}
        onScroll={onStepsScroll} style={{ '--doc-min': DOC_MIN_WIDTH + 'px' }}>
        {/* Softens content passing under the header row — but only once something
            is actually scrolling under it. Unconditionally, it faded the top of
            the first card at rest. z-30 keeps it above the card badges (z-2). */}
        <div className="sticky top-0 left-0 right-0 h-8 pointer-events-none no-print z-30 -mb-8"
          style={{ background: 'linear-gradient(to bottom, #f1f5f9 0%, transparent 100%)',
                   opacity: scrollState.v ? 1 : 0, transition: 'opacity .15s' }} />
        <div className="flex gap-4 px-4 pt-3 pb-4 relative" style={{ zIndex: 1 }}>
          <div className="doc-grid flex-1"
            style={{ '--doc-n': projectType.documents.length,
                     '--doc-cap': docGridCap(projectType.documents.length) }}>
          {projectType.documents.map((doc, docIdx) => (
            <DocumentColumn
              key={`body-${doc.id}`}
              renderMode="body"
              {...colProps(doc, docIdx)}
              dragRef={dragRef}
              dropTarget={dropTarget}
              setDropTarget={setDropTarget}
              onMoveStepDrop={moveStepDrop}
              linkingGroupId={linkingGroupId}
              onLinkStep={(step) => onLinkStep(step, doc)}
              syncGroupMeta={syncGroupMeta}
              onUpdateSyncGroupMeta={onUpdateSyncGroupMeta}
              onDissolveGroup={onDissolveGroup}
            />
          ))}
          </div>
          {/* Add document column button */}
          <div className="no-print shrink-0" style={{ width: 170 }}>
            <button onClick={addDocument}
              className="w-full h-24 rounded-xl border-2 border-dashed border-slate-300 text-slate-400 hover:border-indigo-400 hover:text-indigo-500 transition-colors text-sm font-medium flex flex-col items-center justify-center gap-1">
              <span className="text-2xl">+</span>
              <span>Add Document</span>
            </button>
          </div>
        </div>
      </div>

      {/* Scroll affordance — the canvas says when there is more of it */}
      <div className={`scroll-edge l no-print${scrollState.l ? ' on' : ''}`} />
      <div className={`scroll-edge r no-print${scrollState.r ? ' on' : ''}`} />
      <button className={`scroll-nudge no-print${scrollState.l ? ' on' : ''}`} style={{ left: 8 }}
        onClick={() => nudge(-1)} title="Scroll left" aria-label="Scroll left">
        <Icon name="custom" size={17} style={{ transform: 'rotate(180deg)' }} />
      </button>
      <button className={`scroll-nudge no-print${scrollState.r ? ' on' : ''}`} style={{ right: 8 }}
        onClick={() => nudge(1)} title="Scroll right" aria-label="Scroll right">
        <Icon name="custom" size={17} />
      </button>
      </>)}

      {/* Done-linking floating button */}
      {linkingGroupId && (() => {
        const meta = syncGroupMeta[linkingGroupId];
        return (
          <div className="absolute bottom-6 right-6 z-50 no-print flex flex-col items-end gap-2">
            <div className="text-xs px-3 py-1 rounded-full font-semibold text-white shadow"
              style={{ background: meta?.color || '#64748b' }}>
              Editing: {meta?.name || 'Sync Group'}
            </div>
            <button onClick={() => setLinkingGroupId(null)}
              className="px-4 py-2 rounded-xl text-sm font-semibold text-white shadow-lg transition-transform hover:scale-105"
              style={{ background: meta?.color || '#64748b' }}>
              ✓ Done linking
            </button>
          </div>
        );
      })()}

    </div>
  );
}

// ── ProjectTypeEditor Modal ────────────────────────────────────────────────────
function ProjectTypeEditor({ store, onUpdateStore, onClose }) {
  const [pts, setPts] = useState(store.projectTypes.map(pt => ({ ...pt })));
  const [newName, setNewName] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState('');

  const add = () => {
    if (!newName.trim()) return;
    setPts(prev => [...prev, { id: uid(), name: newName.trim(), documents: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }]);
    setNewName('');
  };
  const del = (id) => { if (confirm('Delete this workflow?')) setPts(prev => prev.filter(p => p.id !== id)); };
  const rename = (id) => {
    if (renameVal.trim()) setPts(prev => prev.map(p => p.id === id ? { ...p, name: renameVal.trim() } : p));
    setRenamingId(null);
  };
  const save = () => { onUpdateStore({ ...store, projectTypes: pts }); onClose(); };

  return (
    <Modal title="Manage Workflows" onClose={onClose}>
      <p className="text-xs text-slate-500 mb-4">Project types define the top-level category. Documents and steps are configured directly on the canvas.</p>
      <div className="space-y-2 mb-4">
        {pts.map(pt => (
          <div key={pt.id} className="flex items-center gap-2 border rounded-lg px-3 py-2">
            {renamingId === pt.id ? (
              <input className={inputCls + ' flex-1'} value={renameVal} onChange={e => setRenameVal(e.target.value)}
                autoFocus onBlur={() => rename(pt.id)} onKeyDown={e => e.key === 'Enter' && rename(pt.id)} />
            ) : (
              <span className="flex-1 text-sm font-medium">{pt.name}</span>
            )}
            <button className="text-xs text-indigo-500 hover:underline" onClick={() => { setRenamingId(pt.id); setRenameVal(pt.name); }}>Rename</button>
            <button className="text-xs text-red-400 hover:underline" onClick={() => del(pt.id)}>Delete</button>
          </div>
        ))}
      </div>
      <div className="flex gap-2 mb-4">
        <input className={inputCls} value={newName} onChange={e => setNewName(e.target.value)} placeholder="New workflow name..."
          onKeyDown={e => e.key === 'Enter' && add()} />
        <Btn onClick={add}>Add</Btn>
      </div>
      <div className="flex justify-end gap-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={save}>Save Changes</Btn>
      </div>
    </Modal>
  );
}

// ── RolesEditor Modal ──────────────────────────────────────────────────────────
function RolesEditor({ store, onUpdateStore, onClose }) {
  const [roles, setRoles] = useState(store.roles);
  const [newRole, setNewRole] = useState('');
  const add = () => { if (!newRole.trim()) return; setRoles(r => [...r, { id: uid(), label: newRole.trim() }]); setNewRole(''); };
  const del = (id) => setRoles(r => r.filter(x => x.id !== id));
  const save = () => { onUpdateStore({ ...store, roles }); onClose(); };
  return (
    <Modal title="Manage Roles & Responsible Parties" onClose={onClose}>

// ── BackupModal ────────────────────────────────────────────────────────────────
function BackupModal({ store, onRestore, onClose }) {
  const fileRef = useRef(null);
  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `langara-pipeline-v2-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const importBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.projectTypes || !data.roles) { alert('Invalid backup file.'); return; }
        if (!confirm('Replace ALL current data with this backup?')) return;
        onRestore(data); onClose();
      } catch { alert('Could not read file.'); }
    };
    reader.readAsText(file);
  };
  return (
    <Modal title="Backup & Restore" onClose={onClose}>
      <div className="space-y-4">
        <div className="border rounded-lg p-4 bg-slate-50">
          <div className="font-semibold text-sm mb-1">Export Backup</div>
          <p className="text-xs text-slate-500 mb-3">Downloads all workflows, documents, steps, templates, and roles as a JSON file.</p>
          <Btn onClick={exportBackup}>⬇ Download Backup</Btn>
        </div>
        <div className="border rounded-lg p-4 bg-slate-50">
          <div className="font-semibold text-sm mb-1">Restore from Backup</div>
          <p className="text-xs text-red-500 mb-3">⚠ This will overwrite all current data.</p>
          <input type="file" accept=".json" ref={fileRef} onChange={importBackup} className="hidden" />
          <Btn variant="secondary" onClick={() => fileRef.current.click()}>⬆ Import Backup File</Btn>
        </div>
      </div>
      <div className="flex justify-end mt-4">
        <Btn variant="secondary" onClick={onClose}>Close</Btn>
      </div>
    </Modal>
  );
}

// ── Step Flow view (step-centric) ──────────────────────────────────────────────
// Second view: rows are documents, columns are the shared pipeline of steps.
// Steps are matched across documents *by name* — two steps called "JCCS" are the
// same stage of the process, regardless of whether they happen at the same
// meeting (that's what sync groups are for, and they're deliberately ignored
// here). A document that never visits a step is shown bypassing it.

const FLOW_PREFS_KEY = 'cs_pipeline_flow_prefs_v1';

// Normalized matching key: case-, whitespace- and dash-insensitive so
// "VPE – ELT" and "VPE - ELT" collapse to one column.
const stepKey = (name) => (name || '')
  .replace(/[‐-―]/g, '-')
  .trim().toLowerCase().replace(/\s+/g, ' ');

// Derive the canonical left-to-right order of steps for a project type.
// Each document contributes ordering constraints (its own step sequence);
// a topological sort merges them. Documents that disagree, or a genuine
// cycle (a return loop), fall back to earliest-position-wins.
function buildStepSpine(projectType) {
  const docs = (projectType && projectType.documents) || [];
  const nodes = new Map();   // key -> { key, label, firstIdx }
  const succ  = new Map();   // key -> Set(key)
  const indeg = new Map();   // key -> number

  docs.forEach(doc => {
    (doc.steps || []).forEach((s, i) => {
      const k = stepKey(s.stageName);
      if (!k) return;
      if (!nodes.has(k)) {
        nodes.set(k, { key: k, label: (s.stageName || '').trim(), firstIdx: i });
        succ.set(k, new Set());
        indeg.set(k, 0);
      } else if (i < nodes.get(k).firstIdx) {
        nodes.get(k).firstIdx = i;
      }
    });
  });

  docs.forEach(doc => {
    const keys = (doc.steps || []).map(s => stepKey(s.stageName)).filter(Boolean);
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (a === b || !succ.has(a)) continue;
      if (!succ.get(a).has(b)) { succ.get(a).add(b); indeg.set(b, indeg.get(b) + 1); }
    }
  });

  return topoMerge(nodes, succ, indeg);
}

// Cycle-safe topological merge shared by the Step Flow spine and the
// Documents-view row bands. Ties, and any genuine cycle (a return loop),
// fall back to earliest-position-wins so the sort always terminates.
function topoMerge(nodes, succ, indeg) {
  const cmp = (a, b) =>
    (nodes.get(a).firstIdx - nodes.get(b).firstIdx) ||
    String(nodes.get(a).label).localeCompare(String(nodes.get(b).label));

  const order = [];
  const remaining = new Set(nodes.keys());
  while (remaining.size) {
    let ready = [...remaining].filter(k => indeg.get(k) === 0);
    if (!ready.length) ready = [...remaining];  // cycle — break at the earliest
    ready.sort(cmp);
    const k = ready[0];
    order.push(nodes.get(k));
    remaining.delete(k);
    succ.get(k).forEach(n => { if (remaining.has(n)) indeg.set(n, indeg.get(n) - 1); });
  }
  return order;
}
