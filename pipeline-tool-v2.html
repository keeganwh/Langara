// Firebase drops empty arrays/objects on save, so restore defaults after loading
function normalizeStep(s) {
  return { ...s,
    actions: s.actions || [], presenterIds: s.presenterIds || [], carrierIds: s.carrierIds || [],
    notes: s.notes || '', storageLocation: s.storageLocation || '', fileOperation: s.fileOperation || '',
    deliveryMethod: s.deliveryMethod || '', informationOnly: s.informationOnly || false,
    triggerType: s.triggerType || '', triggerLabel: s.triggerLabel || '',
    syncGroupId: s.syncGroupId || null, returnToStepId: s.returnToStepId || null,
  };
}
function normalizeStore(store) {
  if (!store) return store;
  return { ...store,
    roles: store.roles || [], templates: store.templates || [], syncGroupMeta: store.syncGroupMeta || {},
    projectTypes: (store.projectTypes || []).map(pt => ({
      ...pt,
      documents: (pt.documents || []).map(d => ({ ...d, steps: (d.steps || []).map(normalizeStep), orderLabel: d.orderLabel || '' })),
    })),
  };
}

async function loadFromFB() {
  try {
    const snap = await getFbDb().ref(FB_PATH).get();
    if (snap.exists()) return normalizeStore(snap.val());
    return null;
  } catch (e) {
    console.warn('Firebase load failed, using localStorage fallback:', e);
    try { const r = localStorage.getItem(STORAGE_KEY); return r ? normalizeStore(JSON.parse(r)) : null; } catch {}
    return null;
  }
}

async function saveToFB(data) {
  try {
    await getFbDb().ref(FB_PATH).set(data);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('Firebase save failed, saving locally:', e);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
}

// ── useStore ───────────────────────────────────────────────────────────────────
function useStore() {
  const [store, setStore] = useState(null); // null = loading
  const [syncStatus, setSyncStatus] = useState('loading');
  const saveTimer = useRef(null);
  const refreshStore = useCallback(() => {
    setSyncStatus('loading');
    return loadFromFB().then(data => {
      setStore(data || getDefaultStore());
      setSyncStatus('ready');
    }).catch(() => {
      setStore(prev => prev || getDefaultStore());
      setSyncStatus('error');
    });
  }, []);
  useEffect(() => { refreshStore(); }, []);
  useEffect(() => {
    if (!store) return;
    setSyncStatus('saving');
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveToFB(store).then(() => setSyncStatus('ready')).catch(() => setSyncStatus('error'));
    }, 2000);
  }, [store]);
  const update = useCallback((updater) => {
    setStore(prev => normalizeStore(typeof updater === 'function' ? updater(prev) : { ...prev, ...updater }));
  }, []);
  return [store, update, syncStatus, refreshStore];
}

        </div>
        <div className="overflow-y-auto flex-1 px-5 py-4">{children}</div>
      </div>
    </div>
  );
  return ReactDOM.createPortal(content, document.body);
}

    ghost: 'text-slate-500 hover:bg-slate-100 focus:ring-slate-400',

  return (
    <button onClick={onClick} disabled={disabled}
      className={`${base} ${size} ${vs[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>

}

// ── StepForm Modal ─────────────────────────────────────────────────────────────
// Parses a stored storageLocation string into { preset, subPath }
function parseStorageLocation(loc) {
  if (!loc) return { preset: '', subPath: '' };
  for (const p of STORAGE_ALL) {
    if (loc === p) return { preset: p, subPath: '' };
    if (loc.startsWith(p + ' / ')) return { preset: p, subPath: loc.slice(p.length + 3) };
  }
  // Legacy: 'Download / Email Copy' was previously a storage preset; clear it
  if (loc === 'Download / Email Copy') return { preset: '', subPath: '' };
  // Other unrecognized value — treat as sub-path under CS SharePoint
  return { preset: 'CS SharePoint', subPath: loc };
}

function buildStorageLocation(preset, subPath) {
  if (!preset) return '';
  const sub = subPath.trim();
  return sub ? `${preset} / ${sub}` : preset;
}

function StepForm({ step, docSteps, allSteps, roles, docColor, syncGroupMeta, onUpdateSyncGroupMeta, onDissolveGroup, onSave, onClose }) {

  });
  const parsed = useMemo(() => parseStorageLocation(form.storageLocation), []);
  const [storagePreset, setStoragePreset] = useState(parsed.preset);
  const [storageSubPath, setStorageSubPath] = useState(parsed.subPath);

  // Keep form.storageLocation in sync whenever preset/subpath changes
  const updateStorage = (preset, subPath) => {
    setStoragePreset(preset);
    setStorageSubPath(subPath);
    setForm(f => ({ ...f, storageLocation: buildStorageLocation(preset, subPath) }));

  const showSubPath = STORAGE_SHAREPOINT.includes(storagePreset);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleArr = (k, id) => set(k, form[k].includes(id) ? form[k].filter(x => x !== id) : [...form[k], id]);

  const addAction = (type) => {
    const label = type === 'review' ? 'Review by' : type === 'approval' ? 'Approval by' : type === 'consultation' ? 'Consultation by' : type === 'prepared_by' ? 'Document(s) Prepared by' : '';
    setForm(f => ({ ...f, actions: [...f.actions, { id: uid(), type, label, person: '' }] }));
  };
  const updateAction = (id, field, val) => setForm(f => ({
    ...f, actions: f.actions.map(a => a.id === id ? { ...a, [field]: val } : a)
  }));
  const removeAction = (id) => setForm(f => ({ ...f, actions: f.actions.filter(a => a.id !== id) }));
  const moveAction = (idx, dir) => {
    const arr = [...form.actions];
    const t = idx + dir;
    if (t < 0 || t >= arr.length) return;
    [arr[idx], arr[t]] = [arr[t], arr[idx]];
    setForm(f => ({ ...f, actions: arr }));
  };

  const prevSteps = (allSteps || docSteps || []).filter(s => s.id !== form.id);

  return (
    <Modal title={step ? 'Edit Step' : 'Add Step'} wide onClose={onClose}>
      <Field label="Stage / Committee Name" hint="e.g. JCCS, VPE – ELT, AQA – Langara Post, CS Consultations">
        <input className={inputCls} value={form.stageName} onChange={e => set('stageName', e.target.value)}
          placeholder="Stage name..." autoFocus />
      </Field>

      {/* Trigger */}
      <Field label="What triggers this step?" hint="Optional — what prompts this step to begin?">
        <div className="flex flex-wrap gap-1.5">
          {TRIGGER_TYPES.map(t => (
            <button key={t} onClick={() => set('triggerType', form.triggerType === t ? '' : t)}
              className={`px-2.5 py-1 rounded-full text-xs font-medium border transition-colors ${form.triggerType === t ? 'bg-amber-500 text-white border-amber-500' : 'border-slate-300 text-slate-600 hover:border-amber-400'}`}>
              {TRIGGER_LABELS[t]}
            </button>
          ))}
          <button onClick={() => set('triggerType', form.triggerType === 'custom' ? '' : 'custom')}
            className={`px-2.5 py-1 rounded-full text-xs font-medium border transition-colors ${form.triggerType === 'custom' ? 'bg-amber-500 text-white border-amber-500' : 'border-slate-300 text-slate-600 hover:border-amber-400'}`}>
            ✏ Custom
          </button>
        </div>
        {form.triggerType === 'custom' && (
          <input className={inputCls + ' mt-2'} value={form.triggerLabel}
            onChange={e => set('triggerLabel', e.target.value)}
            placeholder="Describe what triggers this step..." />
        )}
      </Field>

      {/* Actions */}
      <Field label="Actions / Approvals Required" hint="What happens at this step? Add structured actions below.">
        <div className="space-y-2 mb-2">
          {form.actions.map((a, idx) => (
            <div key={a.id} className="flex items-start gap-2 bg-slate-50 rounded-lg p-2 border border-slate-200">
              <div className="flex flex-col gap-0.5 pt-0.5">
                <button onClick={() => moveAction(idx, -1)} disabled={idx === 0} className="text-slate-300 hover:text-slate-600 disabled:opacity-20 text-xs leading-none">▲</button>
                <button onClick={() => moveAction(idx, 1)} disabled={idx === form.actions.length - 1} className="text-slate-300 hover:text-slate-600 disabled:opacity-20 text-xs leading-none">▼</button>
              </div>
              <div className="flex-1 min-w-0">
                {a.type === 'custom' ? (
                  <input className={inputCls} value={a.label} onChange={e => updateAction(a.id, 'label', e.target.value)}
                    placeholder="Custom action description..." />
                ) : (
                  <div className="flex gap-2">
                    <input className={inputCls} value={a.label} onChange={e => updateAction(a.id, 'label', e.target.value)}
                      placeholder={a.type === 'review' ? 'Review by' : 'Approval by'} style={{ flex: '0 0 130px' }} />
                    <input className={inputCls} value={a.person} onChange={e => updateAction(a.id, 'person', e.target.value)}
                      placeholder="Who? (e.g. Dean, JCCS Chair...)" />
                  </div>
                )}
              </div>
              <button onClick={() => removeAction(a.id)} className="text-red-400 hover:text-red-600 text-sm font-bold pt-1.5 shrink-0">✕</button>
            </div>
          ))}
          {form.actions.length === 0 && <p className="text-xs text-slate-400 italic">No actions yet. Add one below.</p>}
        </div>
        <div className="flex gap-2 flex-wrap">
          <Btn sm variant="secondary" onClick={() => addAction('review')}>+ Review by ___</Btn>
          <Btn sm variant="secondary" onClick={() => addAction('approval')}>+ Approval by ___</Btn>
          <Btn sm variant="secondary" onClick={() => addAction('consultation')}>+ Consultation by ___</Btn>
          <Btn sm variant="secondary" onClick={() => addAction('prepared_by')}>+ Document(s) Prepared by ___</Btn>
          <Btn sm variant="secondary" onClick={() => addAction('custom')}>+ Custom action</Btn>
        </div>
        <label className="flex items-center gap-2 cursor-pointer mt-2.5 pt-2.5 border-t border-slate-200">
          <input type="checkbox" checked={!!form.informationOnly}
            onChange={e => set('informationOnly', e.target.checked)}
            className="accent-sky-500 shrink-0" />
          <span className="text-xs text-slate-700 font-medium">Information only — no action/approval required at this step</span>
        </label>
      </Field>

      {/* Document Storage */}
      <div className="mb-4 p-3 bg-teal-50 rounded-xl border border-teal-100">
        <div className="text-sm font-semibold text-teal-800 mb-3">📁 Document Storage</div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-xs font-semibold text-slate-600 mb-1">File Location at This Step</label>
            <select className={inputCls} value={storagePreset}
              onChange={e => updateStorage(e.target.value, showSubPath && STORAGE_SHAREPOINT.includes(e.target.value) ? storageSubPath : '')}>
              <option value="">— Not specified —</option>
              {STORAGE_ALL.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
            {showSubPath && (
              <input className={inputCls + ' mt-1.5'} value={storageSubPath}
                onChange={e => updateStorage(storagePreset, e.target.value)}
                placeholder="Sub-folder (optional): e.g. Programs / 2025 / New" />
            )}
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-600 mb-1">Moving to Next Step</label>
            <div className="space-y-1.5 mt-1">
              {[['', 'Not specified'], ['copy', 'Copy  (original stays; copy advances)'], ['move', 'Move  (file is relocated)']].map(([val, lbl]) => (
                <label key={val} className="flex items-center gap-2 cursor-pointer">
                  <input type="radio" name="fileOperation" value={val} checked={form.fileOperation === val}
                    onChange={() => set('fileOperation', val)} className="accent-teal-600" />
                  <span className="text-xs text-slate-700">{lbl}</span>
                </label>
              ))}
              <label className="flex items-start gap-2 cursor-pointer pt-1 border-t border-teal-100 mt-1">
                <input type="checkbox" checked={form.deliveryMethod === 'download_email'}
                  onChange={e => set('deliveryMethod', e.target.checked ? 'download_email' : '')}
                  className="accent-teal-600 mt-0.5 shrink-0" />
                <span className="text-xs text-slate-700">Delivered via download / email copy<br/><span className="text-slate-400">(file may still be stored in SharePoint above)</span></span>
              </label>
            </div>
          </div>
        </div>
      </div>

      {/* Responsible Parties */}
      <div className="grid grid-cols-2 gap-4 mb-4">
        <Field label="Prepares / Presents at this step" hint="Who prepares and presents/submits the doc AT this committee/meeting">
          <div className="flex flex-wrap gap-1.5">
            {roles.map(r => (
              <button key={r.id} onClick={() => toggleArr('presenterIds', r.id)}
                className={`px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors ${form.presenterIds.includes(r.id) ? 'bg-indigo-600 text-white border-indigo-600' : 'border-slate-300 text-slate-600 hover:border-indigo-400'}`}>
                {r.label.replace('Program Coordinator ', 'PC ')}
              </button>
            ))}
          </div>
        </Field>
        <Field label="Carries to next step" hint="Who is responsible for moving the doc TO the next stage">
          <div className="flex flex-wrap gap-1.5">
            {roles.map(r => (
              <button key={r.id} onClick={() => toggleArr('carrierIds', r.id)}
                className={`px-2.5 py-1 rounded-full text-xs font-semibold border transition-colors ${form.carrierIds.includes(r.id) ? 'bg-emerald-600 text-white border-emerald-600' : 'border-slate-300 text-slate-600 hover:border-emerald-400'}`}>
                {r.label.replace('Program Coordinator ', 'PC ')}
              </button>
            ))}
          </div>
        </Field>
      </div>

      <Field label="If Rejected / Needs Revision — Return To" hint="Optional: if the document is not approved, which earlier step does it return to?">
        <select className={inputCls} value={form.returnToStepId || ''} onChange={e => set('returnToStepId', e.target.value || null)}>
          <option value="">— No return step (proceed or re-discuss) —</option>
          {prevSteps.map(s => <option key={s.id} value={s.id}>{s.stageName || '(unnamed step)'}</option>)}
        </select>
      </Field>

      <Field label="Notes" hint="Context, reminders, or clarifications — visible on hover/click in the canvas">
        <textarea className={textareaCls} rows={3} value={form.notes} onChange={e => set('notes', e.target.value)}
          placeholder="e.g. Bring signed copy; allow 2 weeks lead time; contact Jane for scheduling..." />
      </Field>

      {/* Sync group panel — shown only if this step is in a group */}
      {form.syncGroupId && syncGroupMeta && (() => {
        const gid = form.syncGroupId;
        const meta = syncGroupMeta[gid] || { name: 'Sync Group', color: '#64748b' };
        const [editingName, setEditingName] = useState(false);
        const [nameVal, setNameVal] = useState(meta.name);
        const saveName = () => {
          onUpdateSyncGroupMeta && onUpdateSyncGroupMeta({ ...syncGroupMeta, [gid]: { ...meta, name: nameVal.trim() || meta.name } });
          setEditingName(false);
        };
        return (
          <div className="mb-4 p-3 rounded-xl border-2" style={{ borderColor: meta.color + '60', background: meta.color + '0d' }}>
            <div className="flex items-center gap-2 mb-2">
              <span style={{ color: meta.color }}>🔗</span>
              {editingName ? (
                <input className="flex-1 text-sm font-semibold border border-slate-300 rounded px-2 py-0.5"
                  value={nameVal} onChange={e => setNameVal(e.target.value)}
                  onBlur={saveName} onKeyDown={e => { if (e.key === 'Enter' || e.key === 'Escape') saveName(); }} autoFocus />
              ) : (
                <span className="flex-1 text-sm font-semibold" style={{ color: meta.color }}>{meta.name}</span>
              )}
              <button onClick={() => { setNameVal(meta.name); setEditingName(true); }}
                className="text-xs px-2 py-0.5 rounded bg-white border border-slate-200 hover:bg-slate-50 text-slate-600" title="Rename group">Rename</button>
            </div>
            <div className="mb-2">
              <div className="text-xs text-slate-500 mb-1">Group colour:</div>
              <div className="flex gap-1.5 flex-wrap">
                {SYNC_COLORS.map(c => (
                  <button key={c} onClick={() => onUpdateSyncGroupMeta && onUpdateSyncGroupMeta({ ...syncGroupMeta, [gid]: { ...meta, color: c } })}
                    className="w-5 h-5 rounded-full border-2 transition-transform hover:scale-110"
                    style={{ background: c, borderColor: meta.color === c ? '#1e293b' : 'transparent' }} />
                ))}
              </div>
            </div>
            <div className="flex gap-2 flex-wrap">
              <button onClick={() => set('syncGroupId', null)}
                className="text-xs px-2 py-1 rounded bg-white border border-slate-200 hover:bg-slate-50 text-slate-600">
                Remove from group
              </button>
              <button onClick={() => { onDissolveGroup && onDissolveGroup(gid); set('syncGroupId', null); }}
                className="text-xs px-2 py-1 rounded bg-red-50 border border-red-200 hover:bg-red-100 text-red-600">
                Dissolve group (remove all)
              </button>
            </div>
          </div>
        );
      })()}

      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={() => { if (form.stageName.trim()) onSave(form); }} disabled={!form.stageName.trim()}>
          {step ? 'Save Changes' : 'Add Step'}
        </Btn>
      </div>
    </Modal>
  );
}

// ── CopyToModal ────────────────────────────────────────────────────────────────
function CopyToModal({ step, otherDocs, onCopy, otherProjects, onCopyToProject, onClose }) {
  const hasLocal = otherDocs && otherDocs.length > 0;
  const hasRemote = otherProjects && otherProjects.length > 0;
  const [remoteOpen, setRemoteOpen] = React.useState(false);
  return (
    <Modal title={`Copy "${step.stageName}" to…`} onClose={onClose}>
      <p className="text-xs text-slate-500 mb-3">
        Select a document flow to append a copy of this step to.
      </p>
      {hasLocal && (
        <>
          <div className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5">This Project Type</div>
          <div className="space-y-1.5 mb-3">
            {otherDocs.map(doc => (
              <button key={doc.id} onClick={() => { onCopy(doc.id); onClose(); }}
                className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border-2 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50 text-left transition-colors">
                <span className="w-3 h-3 rounded-full shrink-0" style={{ background: doc.color }} />
                <span className="font-semibold text-sm text-slate-700">{doc.name}</span>
                <span className="text-xs text-slate-400 ml-auto">{doc.steps.length} step{doc.steps.length !== 1 ? 's' : ''}</span>
              </button>
            ))}
          </div>
        </>
      )}
      {hasRemote && (
        <>
          <button onClick={() => setRemoteOpen(o => !o)}
            className="flex items-center gap-2 text-xs font-bold text-slate-400 uppercase tracking-widest mb-1.5 hover:text-slate-600 transition-colors">
            <span>{remoteOpen ? '▾' : '▸'}</span>
            <span>Other Project Types</span>
          </button>
          {remoteOpen && (
            <div className="space-y-3 mb-2">
              {otherProjects.map(proj => (
                <div key={proj.id}>
                  <div className="text-xs font-semibold text-slate-500 mb-1 px-1">{proj.name}</div>
                  {proj.documents.length === 0
                    ? <p className="text-xs text-slate-300 italic px-1">No documents</p>
                    : <div className="space-y-1">
                        {proj.documents.map(doc => (
                          <button key={doc.id} onClick={() => { onCopyToProject(proj.id, doc.id); onClose(); }}
                            className="w-full flex items-center gap-3 px-3 py-2 rounded-xl border border-slate-200 hover:border-violet-400 hover:bg-violet-50 text-left transition-colors">
                            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: doc.color }} />
                            <span className="text-sm text-slate-600">{doc.name}</span>
                            <span className="text-xs text-slate-400 ml-auto">{doc.steps.length} step{doc.steps.length !== 1 ? 's' : ''}</span>
                          </button>
                        ))}
                      </div>
                  }
                </div>
              ))}
            </div>
          )}
        </>
      )}
      {!hasLocal && !hasRemote && (
        <p className="text-sm text-slate-400 italic">No other document flows available.</p>
      )}
      <div className="flex justify-end mt-4">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

function CopyDocModal({ doc, otherProjects, onCopy, onClose }) {
  return (
    <Modal title={`Copy "${doc.name}" to…`} onClose={onClose}>
      <p className="text-xs text-slate-500 mb-3">
        Select a project type to copy this entire document flow (all {doc.steps.length} steps) into.
      </p>
      {otherProjects.length === 0
        ? <p className="text-sm text-slate-400 italic">No other project types available.</p>
        : <div className="space-y-1.5">
            {otherProjects.map(proj => (
              <button key={proj.id} onClick={() => { onCopy(proj.id); onClose(); }}
                className="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl border-2 border-slate-200 hover:border-violet-400 hover:bg-violet-50 text-left transition-colors">
                <span className="font-semibold text-sm text-slate-700">{proj.name}</span>
                <span className="text-xs text-slate-400 ml-auto">{proj.documents.length} doc{proj.documents.length !== 1 ? 's' : ''}</span>
              </button>
            ))}
          </div>
      }
      <div className="flex justify-end mt-4">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      </div>
    </Modal>
  );
}

// ── StepCard ───────────────────────────────────────────────────────────────────
function StepCard({ step, stepIndex, totalSteps, docSteps, roles, docColor, onEdit, onDelete, onMove, onCopyTo, returnStepName, isDragging, onDragStart, onDragEnd, onDragOver, onDrop, linkingGroupId, onLinkStep, syncGroupColor }) {
  const [notesOpen, setNotesOpen] = useState(false);
  const [copyOpen, setCopyOpen] = useState(false);
  const roleName = (id) => {
    const r = roles.find(r => r.id === id);
    return r ? r.label.replace('Program Coordinator', 'PC') : id;
  };
  const actionIcon = (type) => type === 'review' ? '🔍' : type === 'approval' ? '✅' : type === 'consultation' ? '💬' : type === 'prepared_by' ? '📝' : '▸';

  const inActiveGroup = step.syncGroupId && step.syncGroupId === linkingGroupId;
  const inDifferentGroup = step.syncGroupId && linkingGroupId && step.syncGroupId !== linkingGroupId;
  const dimmed = linkingGroupId && !inActiveGroup && !isDragging;
  const linkColor = syncGroupColor || '#64748b';

  return (
    <div className="step-card relative bg-white rounded-xl overflow-hidden"
      data-step-id={step.id}
      style={{
        '--doc-color': docColor,
        border: syncGroupColor ? `3px solid ${syncGroupColor}` : `2px solid #e2e8f0`,
        borderTopColor: syncGroupColor || docColor,
        borderTopWidth: syncGroupColor ? 3 : 3,
        opacity: isDragging ? 0.4 : dimmed ? 0.3 : 1,
        cursor: 'grab',
        transition: 'opacity 0.15s',
      }}
      draggable
      onDragStart={e => { e.dataTransfer.effectAllowed = 'move'; onDragStart && onDragStart(); }}
      onDragEnd={() => onDragEnd && onDragEnd()}
      onDragOver={e => { e.preventDefault(); e.stopPropagation(); onDragOver && onDragOver(); }}
      onDrop={e => { e.preventDefault(); e.stopPropagation(); onDrop && onDrop(); }}>

      {/* Hover controls */}
      <div className="step-controls absolute top-2 right-2 flex gap-1 z-10">
        <button onClick={() => onMove(stepIndex, -1)} disabled={stepIndex === 0}
          className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs disabled:opacity-30 flex items-center justify-center">▲</button>
        <button onClick={() => onMove(stepIndex, 1)} disabled={stepIndex === totalSteps - 1}
          className="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-500 text-xs disabled:opacity-30 flex items-center justify-center">▼</button>
        <button onClick={onEdit}
          className="w-6 h-6 rounded bg-indigo-100 hover:bg-indigo-200 text-indigo-600 text-xs flex items-center justify-center" title="Edit step">✎</button>
        {onCopyTo && (
          <button onClick={() => setCopyOpen(true)}
            className="w-6 h-6 rounded bg-violet-50 hover:bg-violet-100 text-violet-600 text-xs flex items-center justify-center" title="Copy step to another document">⎘</button>
        )}
        {onLinkStep && (
          <button
            onClick={e => { e.stopPropagation(); if (!inDifferentGroup) onLinkStep(); }}
            className="w-6 h-6 rounded text-xs flex items-center justify-center transition-colors"
            style={inActiveGroup
              ? { background: linkColor + '30', color: linkColor, opacity: 1 }
              : inDifferentGroup
                ? { background: '#f1f5f9', color: '#94a3b8', cursor: 'not-allowed', opacity: 0.4 }
                : step.syncGroupId
                  ? { background: linkColor + '20', color: linkColor, opacity: 1 }
                  : { background: '#f1f5f9', color: '#64748b' }}
            title={inActiveGroup ? 'Remove from sync group' : inDifferentGroup ? 'Already in a different group' : step.syncGroupId ? 'Edit sync group' : 'Add to sync group'}>
            🔗
          </button>
        )}
        <button onClick={onDelete}
          className="w-6 h-6 rounded bg-red-50 hover:bg-red-100 text-red-500 text-xs flex items-center justify-center" title="Delete step">✕</button>
      </div>

      <div className="p-3">
        {/* Sync group icon — always visible when in a group */}
        {syncGroupColor && (
          <div className="absolute top-2 left-2 w-5 h-5 rounded-full flex items-center justify-center z-10 text-white"
            style={{ background: syncGroupColor, fontSize: 10 }} title="In a sync group">🔗</div>
        )}
        {/* Stage name */}
        <div className={`font-bold text-sm text-slate-800 leading-tight ${syncGroupColor ? 'pl-6' : ''} pr-2 ${step.informationOnly ? 'mb-1' : 'mb-2'}`}>{step.stageName}</div>
        {step.informationOnly && (
          <div className="mb-2 inline-flex items-center gap-1 text-xs font-semibold text-sky-600 bg-sky-50 border border-sky-200 rounded-full px-2 py-0.5">
            <span>ⓘ</span><span>Information Only</span>
          </div>
        )}

        {/* Actions */}
        {step.actions.length > 0 && (
          <div className="mb-2 space-y-1">
            {step.actions.map(a => (
              <div key={a.id} className="flex items-start gap-1.5 text-xs text-slate-700">
                <span className="shrink-0 mt-0.5 text-base leading-none" style={{ fontSize: 11 }}>{actionIcon(a.type)}</span>
                <span>
                  {a.type === 'custom'
                    ? a.label
                    : <><span className="font-medium">{a.label}</span>{a.person ? <span className="text-slate-500"> {a.person}</span> : null}</>
                  }
                </span>
              </div>
            ))}
          </div>
        )}

        {/* Responsible parties + storage */}
        {(step.presenterIds.length > 0 || step.carrierIds.length > 0 || step.storageLocation || step.fileOperation) && (
          <div className="border-t border-slate-100 pt-2 mt-2 space-y-1">
            {step.presenterIds.length > 0 && (
              <div className="text-xs text-slate-500">
                <span className="font-semibold text-indigo-600">Prepares/Presents: </span>
                {step.presenterIds.map(roleName).join(', ')}
              </div>
            )}
            {step.carrierIds.length > 0 && (
              <div className="text-xs text-slate-500">
                <span className="font-semibold text-emerald-600">Carries to next: </span>
                {step.carrierIds.map(roleName).join(', ')}
              </div>
            )}
            {step.storageLocation && (
              <div className="text-xs text-teal-700">
                <span className="font-semibold">📁 </span>{step.storageLocation}
              </div>
            )}
          </div>
        )}

        {/* Return path */}
        {step.returnToStepId && returnStepName && (
          <div className="mt-2 pt-2 border-t border-dashed border-amber-300 text-xs text-amber-700 flex items-start gap-1">
            <span className="shrink-0">↩</span>
            <span><span className="font-semibold">If rejected:</span> returns to "{returnStepName}"</span>
          </div>
        )}

        {/* Notes toggle */}
        {step.notes && (
          <div className="mt-2 pt-2 border-t border-slate-100">
            <button onClick={() => setNotesOpen(o => !o)}
              className="text-xs text-slate-400 hover:text-slate-600 flex items-center gap-1">
              <span>{notesOpen ? '▾' : '▸'}</span>
              <span>📝 Notes</span>
            </button>
            <div className={`notes-expand ${notesOpen ? 'open' : ''}`}>
              <p className="text-xs text-slate-500 mt-1 bg-amber-50 rounded p-2 border border-amber-100">{step.notes}</p>
            </div>
          </div>
        )}
      </div>
      {copyOpen && onCopyTo && (
        <CopyToModal step={step}
          otherDocs={onCopyTo.otherDocs}
          onCopy={onCopyTo.copy}
          otherProjects={onCopyTo.otherProjects}
          onCopyToProject={onCopyTo.copyToProject}
          onClose={() => setCopyOpen(false)} />
      )}
    </div>
  );
}

// ── DocumentColumn ─────────────────────────────────────────────────────────────
function DocumentColumn({ doc, docIndex, totalDocs, onMoveDoc, projectTypeId, roles, store, onUpdateDoc, onDeleteDoc, otherDocs, otherProjects, onCopyStepToDoc, onCopyStepToProject, onCopyDocToProject, dragRef, dropTarget, setDropTarget, onMoveStepDrop, linkingGroupId, onLinkStep, syncGroupMeta, onUpdateSyncGroupMeta, onDissolveGroup, renderMode = 'body' }) {
  const [addingStep, setAddingStep] = useState(false);
  const [editStep, setEditStep] = useState(null);
  const [editDocName, setEditDocName] = useState(false);
  const [docNameVal, setDocNameVal] = useState(doc.name);
  const [editOrderLabel, setEditOrderLabel] = useState(false);
  const [orderLabelVal, setOrderLabelVal] = useState(doc.orderLabel || '');
  const [copyDocOpen, setCopyDocOpen] = useState(false);
  const [inlineTriggerFor, setInlineTriggerFor] = useState(null); // stepId
  const [inlineCustomText, setInlineCustomText] = useState('');

  const setStepTrigger = (stepId, triggerType, triggerLabel = '') => {
    onUpdateDoc({ ...doc, steps: doc.steps.map(s => s.id === stepId ? { ...s, triggerType, triggerLabel } : s) });
    setInlineTriggerFor(null);
    setInlineCustomText('');
  };

  const saveStep = (stepData) => {
    const existing = doc.steps.find(s => s.id === stepData.id);
    const steps = existing
      ? doc.steps.map(s => s.id === stepData.id ? stepData : s)
      : [...doc.steps, stepData];
    onUpdateDoc({ ...doc, steps });
    setAddingStep(false);
    setEditStep(null);
  };

  const deleteStep = (id) => {
    if (!confirm('Delete this step?')) return;
    onUpdateDoc({ ...doc, steps: doc.steps.filter(s => s.id !== id) });
  };

  const moveStep = (idx, dir) => {
    const steps = [...doc.steps];
    const t = idx + dir;
    if (t < 0 || t >= steps.length) return;
    [steps[idx], steps[t]] = [steps[t], steps[idx]];
    onUpdateDoc({ ...doc, steps });
    const movedId = steps[t].id;
    setTimeout(() => {
      document.querySelector(`[data-step-id="${movedId}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  };

  const saveName = () => {
    if (docNameVal.trim()) onUpdateDoc({ ...doc, name: docNameVal.trim() });
    setEditDocName(false);
  };

  const returnStepName = (id) => doc.steps.find(s => s.id === id)?.stageName;

  const headerJSX = (
    <div className="group relative rounded-xl px-3 py-2.5 flex items-center no-print"
      style={{ background: `color-mix(in srgb, ${doc.color} 12%, white)`, borderBottom: `3px solid ${doc.color}` }}>
      {editDocName ? (
        <input className="flex-1 text-sm font-bold bg-white border rounded px-2 py-0.5 border-slate-300"
          value={docNameVal} onChange={e => setDocNameVal(e.target.value)}
          onBlur={saveName} onKeyDown={e => e.key === 'Enter' && saveName()} autoFocus />
      ) : (
        <>
          {editOrderLabel ? (
            <input
              className="w-8 text-xs font-bold text-center bg-white border rounded px-1 py-0.5 border-slate-300 mr-1.5 shrink-0"
              style={{ color: doc.color }}
              value={orderLabelVal}
              onChange={e => setOrderLabelVal(e.target.value)}
              onBlur={() => { onUpdateDoc({ ...doc, orderLabel: orderLabelVal.trim() }); setEditOrderLabel(false); }}
              onKeyDown={e => { if (e.key === 'Enter' || e.key === 'Escape') { onUpdateDoc({ ...doc, orderLabel: orderLabelVal.trim() }); setEditOrderLabel(false); } }}
              autoFocus
              placeholder="#"
            />
          ) : (
            <span
              className="text-xs font-bold mr-1.5 shrink-0 cursor-pointer hover:opacity-80 transition-opacity"
              style={{ color: doc.color, opacity: doc.orderLabel ? 1 : 0.3 }}
              onClick={() => { setOrderLabelVal(doc.orderLabel || ''); setEditOrderLabel(true); }}
              title="Click to set order number">
              {doc.orderLabel ? `#${doc.orderLabel}` : '#'}
            </span>
          )}
          <span className="flex-1 font-bold text-sm truncate" style={{ color: doc.color }}
            onDoubleClick={() => { setDocNameVal(doc.name); setEditDocName(true); }}
            title="Double-click to rename">{doc.name}</span>
        </>
      )}
      <div className="absolute right-2 top-1/2 -translate-y-1/2 flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity"
        style={{ background: doc.color + '18' }}>
        <button onClick={() => onMoveDoc(-1)} disabled={docIndex === 0}
          className="w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Move column left">◀</button>
        <button onClick={() => onMoveDoc(1)} disabled={docIndex === totalDocs - 1}
          className="w-5 h-5 rounded text-xs flex items-center justify-center disabled:opacity-20 hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Move column right">▶</button>
        <button onClick={() => { setDocNameVal(doc.name); setEditDocName(true); }}
          className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Rename">✎</button>
        <input type="color" value={doc.color}
          onChange={e => onUpdateDoc({ ...doc, color: e.target.value })}
          className="w-5 h-5 rounded cursor-pointer border-0 p-0 bg-transparent" title="Change color" />
        {otherProjects && otherProjects.length > 0 && (
          <button onClick={() => setCopyDocOpen(true)}
            className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-white/60 transition-colors" style={{ color: doc.color }} title="Copy document to another project type">⎘</button>
        )}
        <button onClick={() => { if (confirm(`Delete "${doc.name}" and all its steps?`)) onDeleteDoc(doc.id); }}
          className="w-5 h-5 rounded text-xs flex items-center justify-center hover:bg-red-100 text-red-400 transition-colors" title="Delete document">✕</button>
      </div>
    </div>
  );

  if (renderMode === 'header') {
    return (
      <div className="doc-col no-print">
        {headerJSX}
        {copyDocOpen && (
          <CopyDocModal doc={doc} otherProjects={otherProjects || []}
            onCopy={(targetProjId) => onCopyDocToProject(doc, targetProjId)}
            onClose={() => setCopyDocOpen(false)} />
        )}
      </div>
    );
  }

  return (
    <div className="doc-col flex flex-col bg-slate-100">

      {/* Print header */}
      <div className="rounded-xl mb-3 px-3 py-2.5 hidden" style={{ background: doc.color + '18', borderBottom: `3px solid ${doc.color}` }}
        id={`print-header-${doc.id}`}>
        <span className="font-bold text-sm" style={{ color: doc.color }}>{doc.name}</span>
      </div>

      {/* Steps */}
      <div className="space-y-0"
        onDragOver={e => { e.preventDefault(); if (dragRef?.current) setDropTarget({ docId: doc.id, atEnd: true }); }}
        onDrop={e => { e.preventDefault(); if (dragRef?.current) { const { stepId, srcDocId } = dragRef.current; onMoveStepDrop(srcDocId, stepId, doc.id, null); } }}>
        {doc.steps.length === 0 && (
          <div className="text-center py-8 text-slate-400 text-xs border-2 border-dashed border-slate-200 rounded-xl">
            No steps yet.<br />Click below to add.
          </div>
        )}
        {doc.steps.map((step, i) => (
          <div key={step.id}>
            {/* Drop indicator above this step */}
            {dropTarget?.docId === doc.id && dropTarget?.beforeStepId === step.id && (
              <div className="h-1 rounded mx-1 my-0.5" style={{ background: doc.color }} />
            )}
            {/* Trigger mini-card */}
            {step.triggerType && (
              <div onClick={() => setEditStep(step)}
                className="group/trigger mx-1 mb-1 px-3 py-1 rounded-lg border border-dashed border-amber-300 bg-amber-50 flex items-center justify-between text-xs text-amber-700 cursor-pointer hover:bg-amber-100 transition-colors no-print">
                <span>{triggerDisplay(step)}</span>
                <span className="opacity-0 group-hover/trigger:opacity-100 text-amber-400 text-xs ml-2" title="Edit step to change trigger">✎</span>
              </div>
            )}
            <StepCard
              step={step}
              stepIndex={i}
              totalSteps={doc.steps.length}
              docSteps={doc.steps}
              roles={roles}
              docColor={doc.color}
              onEdit={() => setEditStep(step)}
              onDelete={() => deleteStep(step.id)}
              onMove={moveStep}
              returnStepName={step.returnToStepId ? returnStepName(step.returnToStepId) : null}
              onCopyTo={(otherDocs && otherDocs.length > 0) || (otherProjects && otherProjects.length > 0) ? {
                otherDocs: otherDocs || [],
                copy: (targetDocId) => onCopyStepToDoc(step, targetDocId),
                otherProjects: otherProjects || [],
                copyToProject: (targetProjId, targetDocId) => onCopyStepToProject(step, targetProjId, targetDocId),
              } : null}
              isDragging={dragRef?.current?.stepId === step.id}
              onDragStart={() => { dragRef.current = { stepId: step.id, srcDocId: doc.id }; }}
              onDragEnd={() => { dragRef.current = null; setDropTarget(null); }}
              onDragOver={() => { if (dragRef?.current) setDropTarget({ docId: doc.id, beforeStepId: step.id }); }}
              onDrop={() => { if (dragRef?.current) { const { stepId, srcDocId } = dragRef.current; onMoveStepDrop(srcDocId, stepId, doc.id, step.id); } }}
              linkingGroupId={linkingGroupId}
              onLinkStep={onLinkStep ? () => onLinkStep(step) : null}
              syncGroupColor={step.syncGroupId && syncGroupMeta ? syncGroupMeta[step.syncGroupId]?.color : null}
            />
            {/* Arrow between steps */}
            {i < doc.steps.length - 1 && (() => {
              const s = doc.steps[i];
              const nextStep = doc.steps[i + 1];
              const opLabel = s.fileOperation === 'copy' ? 'Document Copied'
                            : s.fileOperation === 'move' ? 'Document Moved' : null;
              const dlLabel = s.deliveryMethod === 'download_email' ? 'Emailed as Attachment' : null;
              const arrowLabel = [opLabel, dlLabel].filter(Boolean).join(' · ');
              const showPicker = inlineTriggerFor === nextStep.id;
              return (
                <div className="group/arrow flex flex-col items-center py-1 no-print">
                  {arrowLabel && (
                    <span className="text-xs italic mb-0.5 text-center leading-tight" style={{ color: doc.color }}>{arrowLabel}</span>
                  )}
                  <svg width="20" height="20" viewBox="0 0 20 20">
                    <line x1="10" y1="1" x2="10" y2="14" stroke={doc.color} strokeWidth="2" strokeOpacity="0.6" />
                    <polygon points="10,19 5,11 15,11" fill={doc.color} fillOpacity="0.7" />
                  </svg>
                  {showPicker ? (
                    <div className="mt-1 w-full px-1">
                      <div className="bg-white border border-amber-200 rounded-lg p-2 shadow-sm">
                        <div className="text-xs text-slate-400 mb-1.5 font-medium">What triggers next step?</div>
                        <div className="flex flex-wrap gap-1 mb-1">
                          {TRIGGER_TYPES.map(t => (
                            <button key={t} onClick={() => setStepTrigger(nextStep.id, t)}
                              className="px-2 py-0.5 rounded-full text-xs border border-slate-200 hover:border-amber-400 hover:bg-amber-50 text-slate-600 transition-colors">
                              {TRIGGER_LABELS[t]}
                            </button>
                          ))}
                          <button onClick={() => { setInlineCustomText(''); setInlineTriggerFor(nextStep.id + '_custom'); }}
                            className="px-2 py-0.5 rounded-full text-xs border border-slate-200 hover:border-amber-400 hover:bg-amber-50 text-slate-600 transition-colors">
                            ✏ Custom
                          </button>
                        </div>
                        {inlineTriggerFor === nextStep.id + '_custom' && (
                          <div className="flex gap-1 mt-1">
                            <input className="flex-1 text-xs border border-slate-300 rounded px-2 py-0.5" value={inlineCustomText}
                              onChange={e => setInlineCustomText(e.target.value)}
                              onKeyDown={e => { if (e.key === 'Enter' && inlineCustomText.trim()) setStepTrigger(nextStep.id, 'custom', inlineCustomText.trim()); if (e.key === 'Escape') setInlineTriggerFor(null); }}
                              placeholder="Describe trigger..." autoFocus />
                            <button onClick={() => inlineCustomText.trim() && setStepTrigger(nextStep.id, 'custom', inlineCustomText.trim())}
                              className="px-2 py-0.5 text-xs bg-amber-500 text-white rounded hover:bg-amber-600">✓</button>
                          </div>
                        )}
                        <button onClick={() => setInlineTriggerFor(null)} className="mt-1 text-xs text-slate-400 hover:text-slate-600">Cancel</button>
                      </div>
                    </div>
                  ) : (
                    <button onClick={() => setInlineTriggerFor(nextStep.id)}
                      className="opacity-0 group-hover/arrow:opacity-100 mt-0.5 text-xs text-amber-400 hover:text-amber-600 transition-opacity"
                      title="Add trigger for next step">⚡+</button>
                  )}
                </div>
              );
            })()}
          </div>
        ))}
        {/* Drop indicator at end of column */}
        {dropTarget?.docId === doc.id && dropTarget?.atEnd && (
          <div className="h-1 rounded mx-1 mt-0.5" style={{ background: doc.color }} />
        )}
      </div>

      {/* Add Step */}
      <div className="mt-3 no-print">
        <button onClick={() => setAddingStep(true)}
          className="w-full py-2 rounded-xl text-xs font-semibold border-2 border-dashed transition-colors hover:bg-white"
          style={{ borderColor: doc.color + '60', color: doc.color }}>
          + Add Step
        </button>
      </div>

      {/* End marker */}
      <div className="mt-2 rounded-lg py-1.5 px-3 text-center text-xs font-semibold"
        style={{ background: doc.color + '15', color: doc.color }}>
        ✓ Complete
      </div>

      {(addingStep || editStep) && (
        <StepForm
          step={editStep}
          docSteps={doc.steps}
          roles={roles}
          docColor={doc.color}
          syncGroupMeta={syncGroupMeta}
          onUpdateSyncGroupMeta={onUpdateSyncGroupMeta}
          onDissolveGroup={onDissolveGroup}
          onSave={saveStep}
          onClose={() => { setAddingStep(false); setEditStep(null); }}
        />
      )}
    </div>
  );
}

// ── ProjectTypeCanvas ──────────────────────────────────────────────────────────
function ProjectTypeCanvas({ projectType, roles, onUpdateProjectType, allProjectTypes, onCopyStepToProject, onCopyDocToProject, syncGroupMeta, onUpdateSyncGroupMeta, onDissolveGroup }) {
  const dragRef = React.useRef(null);
  const [dropTarget, setDropTarget] = React.useState(null);
  const canvasRef = React.useRef(null);
  const [linkingGroupId, setLinkingGroupId] = React.useState(null);
  const headerScrollRef = React.useRef(null);

  // Exit linking mode on Escape
  React.useEffect(() => {
    if (!linkingGroupId) return;
    const handler = (e) => { if (e.key === 'Escape') setLinkingGroupId(null); };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [linkingGroupId]);

  const onLinkStep = (step, doc) => {
    if (step.syncGroupId) {
      if (step.syncGroupId === linkingGroupId) {
        // Remove this step from the active group
        const newSteps = doc.steps.map(s => s.id === step.id ? { ...s, syncGroupId: null } : s);
        onUpdateProjectType({ ...projectType, documents: projectType.documents.map(d => d.id === doc.id ? { ...d, steps: newSteps } : d), updatedAt: new Date().toISOString() });
        // If no steps remain in the group, dissolve it
        const remaining = projectType.documents.flatMap(d => d.steps).filter(s => s.syncGroupId === linkingGroupId && s.id !== step.id);
        if (remaining.length === 0) { onDissolveGroup(linkingGroupId); setLinkingGroupId(null); }
      } else if (!linkingGroupId) {
        // Enter linking mode for this step's existing group
        setLinkingGroupId(step.syncGroupId);
      }
      // If in linking mode with a different group: ignore
      return;
    }
    // Step is ungrouped
    if (linkingGroupId) {
      // Add to current group
      const newSteps = doc.steps.map(s => s.id === step.id ? { ...s, syncGroupId: linkingGroupId } : s);
      onUpdateProjectType({ ...projectType, documents: projectType.documents.map(d => d.id === doc.id ? { ...d, steps: newSteps } : d), updatedAt: new Date().toISOString() });
    } else {
      // Create new group
      const newGroupId = uid();
      const groupCount = Object.keys(syncGroupMeta).length;
      const newMeta = { ...syncGroupMeta, [newGroupId]: { name: `Sync Group ${groupCount + 1}`, color: SYNC_COLORS[groupCount % SYNC_COLORS.length] } };
      onUpdateSyncGroupMeta(newMeta);
      const newSteps = doc.steps.map(s => s.id === step.id ? { ...s, syncGroupId: newGroupId } : s);
      onUpdateProjectType({ ...projectType, documents: projectType.documents.map(d => d.id === doc.id ? { ...d, steps: newSteps } : d), updatedAt: new Date().toISOString() });
      setLinkingGroupId(newGroupId);
    }
  };

  const updateDoc = (updated) => {
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.map(d => d.id === updated.id ? updated : d),
      updatedAt: new Date().toISOString(),
    });
  };

  const deleteDoc = (id) => {
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.filter(d => d.id !== id),
      updatedAt: new Date().toISOString(),
    });
  };

  const addDocument = () => {
    const name = prompt('Document name:');
    if (!name?.trim()) return;
    const colors = ['#0891b2', '#d97706', '#9333ea', '#0d9488', '#db2777'];
    const color = colors[projectType.documents.length % colors.length];
    onUpdateProjectType({
      ...projectType,
      documents: [...projectType.documents, { id: uid(), name: name.trim(), color, steps: [], orderLabel: '' }],
      updatedAt: new Date().toISOString(),
    });
  };

  if (projectType.documents.length === 0) {
    return (
      <div className="flex flex-col items-center justify-center h-64 text-slate-400">
        <div className="text-4xl mb-3">📄</div>
        <p className="text-sm mb-3">No documents defined for this project type.</p>
        <Btn onClick={addDocument}>+ Add Document Type</Btn>
      </div>
    );
  }

  const moveDoc = (id, dir) => {
    const arr = [...projectType.documents];
    const idx = arr.findIndex(d => d.id === id);
    const t = idx + dir;
    if (t < 0 || t >= arr.length) return;
    [arr[idx], arr[t]] = [arr[t], arr[idx]];
    onUpdateProjectType({ ...projectType, documents: arr, updatedAt: new Date().toISOString() });
  };

  const copyStepToDoc = (step, targetDocId) => {
    const newStep = { ...step, id: uid(), actions: step.actions.map(a => ({ ...a, id: uid() })), returnToStepId: null };
    onUpdateProjectType({
      ...projectType,
      documents: projectType.documents.map(d =>
        d.id === targetDocId ? { ...d, steps: [...d.steps, newStep] } : d
      ),
      updatedAt: new Date().toISOString(),
    });
  };

  const moveStepDrop = (srcDocId, stepId, targetDocId, beforeStepId) => {
    if (beforeStepId === stepId) return; // dropped on self — no-op
    const srcDoc = projectType.documents.find(d => d.id === srcDocId);
    if (!srcDoc) return;
    const step = srcDoc.steps.find(s => s.id === stepId);
    if (!step) return;
    const movingStep = srcDocId !== targetDocId ? { ...step, returnToStepId: null } : step;
    const newDocs = projectType.documents.map(d => {
      const isSrc = d.id === srcDocId;
      const isTgt = d.id === targetDocId;
      if (!isSrc && !isTgt) return d;
      if (isSrc && isTgt) {
        // reorder within same doc
        let steps = d.steps.filter(s => s.id !== stepId);
        const insertIdx = beforeStepId ? steps.findIndex(s => s.id === beforeStepId) : steps.length;
        steps.splice(insertIdx < 0 ? steps.length : insertIdx, 0, movingStep);
        return { ...d, steps };
      }
      if (isSrc) return { ...d, steps: d.steps.filter(s => s.id !== stepId) };
      // isTgt
      let steps = [...d.steps];
      const insertIdx = beforeStepId ? steps.findIndex(s => s.id === beforeStepId) : steps.length;
      steps.splice(insertIdx < 0 ? steps.length : insertIdx, 0, movingStep);
      return { ...d, steps };
    });
    onUpdateProjectType({ ...projectType, documents: newDocs, updatedAt: new Date().toISOString() });
    setDropTarget(null);
    dragRef.current = null;
  };

  const onStepsScroll = (e) => {
    if (headerScrollRef.current) headerScrollRef.current.scrollLeft = e.currentTarget.scrollLeft;
  };

  const colProps = (doc, docIdx) => ({
    doc,
    docIndex: docIdx,
    totalDocs: projectType.documents.length,
    onMoveDoc: (dir) => moveDoc(doc.id, dir),
    projectTypeId: projectType.id,
    otherDocs: projectType.documents.filter(d => d.id !== doc.id),
    otherProjects: (allProjectTypes || []).filter(p => p.id !== projectType.id),
    onCopyStepToDoc: copyStepToDoc,
    onCopyStepToProject,
    onCopyDocToProject,
    roles,
    onUpdateDoc: updateDoc,
    onDeleteDoc: deleteDoc,
  });

  return (
    <div className="flex flex-col h-full overflow-hidden relative" id="canvas-print-area">

      {/* Fixed header row — never scrolls vertically */}
      <div className="shrink-0 overflow-hidden relative z-20 no-print" ref={headerScrollRef}>
        <div className="flex gap-4 px-4 pt-4 pb-0" style={{ minWidth: 'max-content' }}>
          {projectType.documents.map((doc, docIdx) => (
            <DocumentColumn key={`hdr-${doc.id}`} renderMode="header" {...colProps(doc, docIdx)} />
          ))}
          <div className="doc-col" /> {/* spacer to align with Add Document button */}
        </div>
      </div>

      {/* Scrollable steps area */}
      <div className="overflow-x-auto overflow-y-auto flex-1 pb-4 relative" ref={canvasRef} onScroll={onStepsScroll}>
        {/* Gradient overlays the top of the steps area, below the fixed headers */}
        <div className="sticky top-0 left-0 right-0 h-8 pointer-events-none no-print z-10 -mb-8"
          style={{ background: 'linear-gradient(to bottom, #f1f5f9 0%, transparent 100%)' }} />
        <div className="flex gap-4 px-4 pt-3 pb-4 relative" style={{ minWidth: 'max-content', zIndex:1 }}>
          {projectType.documents.map((doc, docIdx) => (
            <DocumentColumn
              key={`body-${doc.id}`}
              renderMode="body"
              {...colProps(doc, docIdx)}
              dragRef={dragRef}
              dropTarget={dropTarget}
              setDropTarget={setDropTarget}
              onMoveStepDrop={moveStepDrop}
              linkingGroupId={linkingGroupId}
              onLinkStep={(step) => onLinkStep(step, doc)}
              syncGroupMeta={syncGroupMeta}
              onUpdateSyncGroupMeta={onUpdateSyncGroupMeta}
              onDissolveGroup={onDissolveGroup}
            />
          ))}
          {/* Add document column button */}
          <div className="doc-col no-print">
            <button onClick={addDocument}
              className="w-full h-24 rounded-xl border-2 border-dashed border-slate-300 text-slate-400 hover:border-indigo-400 hover:text-indigo-500 transition-colors text-sm font-medium flex flex-col items-center justify-center gap-1">
              <span className="text-2xl">+</span>
              <span>Add Document</span>
            </button>
          </div>
        </div>
      </div>

      {/* Done-linking floating button */}
      {linkingGroupId && (() => {
        const meta = syncGroupMeta[linkingGroupId];
        return (
          <div className="absolute bottom-6 right-6 z-50 no-print flex flex-col items-end gap-2">
            <div className="text-xs px-3 py-1 rounded-full font-semibold text-white shadow"
              style={{ background: meta?.color || '#64748b' }}>
              Editing: {meta?.name || 'Sync Group'}
            </div>
            <button onClick={() => setLinkingGroupId(null)}
              className="px-4 py-2 rounded-xl text-sm font-semibold text-white shadow-lg transition-transform hover:scale-105"
              style={{ background: meta?.color || '#64748b' }}>
              ✓ Done linking
            </button>
          </div>
        );
      })()}

    </div>
  );
}

// ── ProjectTypeEditor Modal ────────────────────────────────────────────────────
function ProjectTypeEditor({ store, onUpdateStore, onClose }) {
  const [pts, setPts] = useState(store.projectTypes.map(pt => ({ ...pt })));
  const [newName, setNewName] = useState('');
  const [renamingId, setRenamingId] = useState(null);
  const [renameVal, setRenameVal] = useState('');

  const add = () => {
    if (!newName.trim()) return;
    setPts(prev => [...prev, { id: uid(), name: newName.trim(), documents: [], createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() }]);
    setNewName('');
  };
  const del = (id) => { if (confirm('Delete this project type?')) setPts(prev => prev.filter(p => p.id !== id)); };
  const rename = (id) => {
    if (renameVal.trim()) setPts(prev => prev.map(p => p.id === id ? { ...p, name: renameVal.trim() } : p));
    setRenamingId(null);
  };
  const save = () => { onUpdateStore({ ...store, projectTypes: pts }); onClose(); };

  return (
    <Modal title="Manage Project / Program Types" onClose={onClose}>
      <p className="text-xs text-slate-500 mb-4">Project types define the top-level category. Documents and steps are configured directly on the canvas.</p>
      <div className="space-y-2 mb-4">
        {pts.map(pt => (

// ── BackupModal ────────────────────────────────────────────────────────────────
function BackupModal({ store, onRestore, onClose }) {
  const fileRef = useRef(null);
  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(store, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `langara-pipeline-v2-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };
  const importBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.projectTypes || !data.roles) { alert('Invalid backup file.'); return; }
        if (!confirm('Replace ALL current data with this backup?')) return;
        onRestore(data); onClose();
      } catch { alert('Could not read file.'); }
    };
    reader.readAsText(file);
  };
  return (
    <Modal title="Backup & Restore" onClose={onClose}>
      <div className="space-y-4">
        <div className="border rounded-lg p-4 bg-slate-50">
          <div className="font-semibold text-sm mb-1">Export Backup</div>
          <p className="text-xs text-slate-500 mb-3">Downloads all project types, documents, steps, templates, and roles as a JSON file.</p>
          <Btn onClick={exportBackup}>⬇ Download Backup</Btn>
        </div>
        <div className="border rounded-lg p-4 bg-slate-50">
          <div className="font-semibold text-sm mb-1">Restore from Backup</div>
          <p className="text-xs text-red-500 mb-3">⚠ This will overwrite all current data.</p>
          <input type="file" accept=".json" ref={fileRef} onChange={importBackup} className="hidden" />
          <Btn variant="secondary" onClick={() => fileRef.current.click()}>⬆ Import Backup File</Btn>
        </div>
      </div>
      <div className="flex justify-end mt-4">
        <Btn variant="secondary" onClick={onClose}>Close</Btn>
      </div>
    </Modal>
  );
}

// ── Step Flow view (step-centric) ──────────────────────────────────────────────
// Second view: rows are documents, columns are the shared pipeline of steps.
// Steps are matched across documents *by name* — two steps called "JCCS" are the
// same stage of the process, regardless of whether they happen at the same
// meeting (that's what sync groups are for, and they're deliberately ignored
// here). A document that never visits a step is shown bypassing it.

const FLOW_PREFS_KEY = 'cs_pipeline_flow_prefs_v1';

// Normalized matching key: case-, whitespace- and dash-insensitive so
// "VPE – ELT" and "VPE - ELT" collapse to one column.
const stepKey = (name) => (name || '')
  .replace(/[‐-―]/g, '-')
  .trim().toLowerCase().replace(/\s+/g, ' ');

// Derive the canonical left-to-right order of steps for a project type.
// Each document contributes ordering constraints (its own step sequence);
// a topological sort merges them. Documents that disagree, or a genuine
// cycle (a return loop), fall back to earliest-position-wins.
function buildStepSpine(projectType) {
  const docs = (projectType && projectType.documents) || [];
  const nodes = new Map();   // key -> { key, label, firstIdx }
  const succ  = new Map();   // key -> Set(key)
  const indeg = new Map();   // key -> number

  docs.forEach(doc => {
    (doc.steps || []).forEach((s, i) => {
      const k = stepKey(s.stageName);
      if (!k) return;
      if (!nodes.has(k)) {
        nodes.set(k, { key: k, label: (s.stageName || '').trim(), firstIdx: i });
        succ.set(k, new Set());
        indeg.set(k, 0);
      } else if (i < nodes.get(k).firstIdx) {
        nodes.get(k).firstIdx = i;
      }
    });
  });

  docs.forEach(doc => {
    const keys = (doc.steps || []).map(s => stepKey(s.stageName)).filter(Boolean);
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (a === b || !succ.has(a)) continue;
      if (!succ.get(a).has(b)) { succ.get(a).add(b); indeg.set(b, indeg.get(b) + 1); }
    }
  });

  const cmp = (a, b) =>
    (nodes.get(a).firstIdx - nodes.get(b).firstIdx) ||
    nodes.get(a).label.localeCompare(nodes.get(b).label);

  const order = [];
  const remaining = new Set(nodes.keys());
  while (remaining.size) {
    let ready = [...remaining].filter(k => indeg.get(k) === 0);
    if (!ready.length) ready = [...remaining];  // cycle — break at the earliest
    ready.sort(cmp);
    const k = ready[0];
    order.push(nodes.get(k));
    remaining.delete(k);
    succ.get(k).forEach(n => { if (remaining.has(n)) indeg.set(n, indeg.get(n) - 1); });
  }
  return order;
}

// Which steps of `doc` land on each spine column, plus where its track starts
// and ends. Steps whose name matches a spine entry more than once are kept
// together in the same cell.
function docTrack(doc, spine) {
  const byKey = new Map();
  (doc.steps || []).forEach(s => {
    const k = stepKey(s.stageName);
    if (!k) return;
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(s);
  });
  const cells = spine.map(n => byKey.get(n.key) || []);
  let first = -1, last = -1;
  cells.forEach((c, i) => { if (c.length) { if (first < 0) first = i; last = i; } });
  // Steps that exist on the document but were filtered out of the spine.
  const hiddenCount = (doc.steps || []).filter(s => {
    const k = stepKey(s.stageName);
    return k && !spine.some(n => n.key === k);
  }).length;
  return { cells, first, last, hiddenCount };
}

const FLOW_DETAILS = [
  { id: 'trigger',    label: 'Trigger' },
  { id: 'actions',    label: 'Actions' },
  { id: 'presenters', label: 'Prepares / Presents' },
  { id: 'carriers',   label: 'Carries to next' },
  { id: 'storage',    label: 'Where it lives' },
  { id: 'notes',      label: 'Notes' },
];
const NO_DETAILS = { trigger: false, actions: false, presenters: false, carriers: false, storage: false, notes: false };

function loadFlowPrefs(projectTypeId) {
  try {
    const all = JSON.parse(localStorage.getItem(FLOW_PREFS_KEY) || '{}');
    const p = all[projectTypeId] || {};
    return { hidden: p.hidden || [], details: { ...NO_DETAILS, ...(p.details || {}) } };
  } catch (e) {
    return { hidden: [], details: { ...NO_DETAILS } };
  }
}
function saveFlowPrefs(projectTypeId, prefs) {
  try {
    const all = JSON.parse(localStorage.getItem(FLOW_PREFS_KEY) || '{}');
    all[projectTypeId] = prefs;
    localStorage.setItem(FLOW_PREFS_KEY, JSON.stringify(all));
  } catch (e) { /* view preference only — safe to lose */ }
}

const FLOW_ROW_H = 62;   // vertical centre of a node sits at FLOW_ROW_H / 2

function FlowStepNode({ steps, doc, roles, details, anyDetail }) {
  const roleLabel = (ids) => (ids || [])
    .map(id => { const r = roles.find(x => x.id === id); return r ? r.label : id; })
    .join(', ');

  const actionIcon = (type) => type === 'review' ? '🔍' : type === 'approval' ? '✅' : type === 'consultation' ? '💬' : type === 'prepared_by' ? '📝' : '▸';

  const lines = [];
  steps.forEach(step => {
    if (details.trigger && triggerDisplay(step)) lines.push({ k: 'trigger', t: triggerDisplay(step) });
    if (details.actions) (step.actions || []).forEach(a => lines.push({
      k: 'action', t: `${actionIcon(a.type)} ${a.type === 'custom' ? a.label : a.label + (a.person ? ' ' + a.person : '')}`,
    }));
    if (details.presenters && (step.presenterIds || []).length) lines.push({ k: 'pres', t: `Presents: ${roleLabel(step.presenterIds)}` });
    if (details.carriers && (step.carrierIds || []).length) lines.push({ k: 'carr', t: `Carries: ${roleLabel(step.carrierIds)}` });
    if (details.storage && step.storageLocation) lines.push({ k: 'stor', t: `📁 ${step.storageLocation}${step.fileOperation === 'copy' ? ' (copy)' : step.fileOperation === 'move' ? ' (move)' : ''}` });
    if (details.notes && step.notes) lines.push({ k: 'note', t: `📝 ${step.notes}` });
  });

  const infoOnly = steps.every(s => s.informationOnly) && steps.length > 0;
  const returns = steps.some(s => s.returnToStepId);

  return (
    <div className="relative z-10 rounded-lg px-2 py-1.5 text-center shadow-sm"
      style={{
        background: infoOnly ? '#ffffff' : `linear-gradient(${doc.color}14, ${doc.color}14), #ffffff`,
        border: `2px ${infoOnly ? 'dashed' : 'solid'} ${doc.color}`,
        minWidth: anyDetail ? 0 : 44,
      }}>
      <div className="flex items-center justify-center gap-1">
        <span style={{ color: doc.color, fontSize: 13, lineHeight: 1 }}>{infoOnly ? 'ⓘ' : '●'}</span>
        {steps.length > 1 && <span className="text-[10px] font-bold" style={{ color: doc.color }}>×{steps.length}</span>}
        {returns && <span className="text-[10px]" style={{ color: '#b45309' }} title="Can return to an earlier step">↩</span>}
      </div>
      {lines.length > 0 && (
        <div className="mt-1 space-y-0.5 text-left">
          {lines.map((l, i) => (
            <div key={i} className="text-[10px] leading-snug text-slate-600 break-words">{l.t}</div>
          ))}
        </div>
      )}
    </div>
  );
}

function StepFlowView({ projectType, roles }) {
  const [prefs, setPrefs] = React.useState(() => loadFlowPrefs(projectType.id));
  const [panel, setPanel] = React.useState(null); // 'steps' | 'details' | null

  React.useEffect(() => { setPrefs(loadFlowPrefs(projectType.id)); }, [projectType.id]);

  const setAndSave = (next) => { setPrefs(next); saveFlowPrefs(projectType.id, next); };

  const fullSpine = React.useMemo(() => buildStepSpine(projectType), [projectType]);
  const hiddenSet = new Set(prefs.hidden);
  const spine = fullSpine.filter(n => !hiddenSet.has(n.key));

  const details = prefs.details;
  const anyDetail = FLOW_DETAILS.some(d => details[d.id]);
  const colW = anyDetail ? 190 : 128;
  const docs = projectType.documents || [];

  const toggleStep = (key) => {
    const hidden = hiddenSet.has(key) ? prefs.hidden.filter(k => k !== key) : [...prefs.hidden, key];
    setAndSave({ ...prefs, hidden });
  };
  const toggleDetail = (id) => setAndSave({ ...prefs, details: { ...details, [id]: !details[id] } });

  if (fullSpine.length === 0) {
    return (
      <div className="flex flex-col items-center justify-center h-64 text-slate-400">
        <div className="text-4xl mb-3">🪜</div>
        <p className="text-sm">No named steps yet — add steps in the Documents view and they'll appear here.</p>
      </div>
    );
  }

  return (
    <div className="flex flex-col h-full overflow-hidden" id="flow-print-area">

      {/* Toolbar */}
      <div className="shrink-0 flex items-center gap-2 px-4 py-2 border-b border-slate-200 bg-white no-print relative z-30">
        <div className="relative">
          <Btn variant="secondary" sm onClick={() => setPanel(panel === 'steps' ? null : 'steps')}>
            ⚑ Steps shown {prefs.hidden.length > 0 && <span className="text-indigo-600 font-bold">({spine.length}/{fullSpine.length})</span>}
          </Btn>
          {panel === 'steps' && (
            <div className="absolute left-0 top-full mt-1 w-72 bg-white border border-slate-200 rounded-xl shadow-xl p-2 fade-in max-h-80 overflow-y-auto">
              <div className="text-xs text-slate-400 px-2 py-1">Uncheck a step to drop it from this view. Doesn't change the data.</div>
              {fullSpine.map(n => (
                <label key={n.key} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <input type="checkbox" checked={!hiddenSet.has(n.key)} onChange={() => toggleStep(n.key)} />
                  <span className="text-sm text-slate-700 truncate">{n.label}</span>
                </label>
              ))}
              {prefs.hidden.length > 0 && (
                <button onClick={() => setAndSave({ ...prefs, hidden: [] })}
                  className="w-full mt-1 text-xs text-indigo-600 hover:bg-indigo-50 rounded-lg py-1.5">Show all steps</button>
              )}
            </div>
          )}
        </div>

        <div className="relative">
          <Btn variant="secondary" sm onClick={() => setPanel(panel === 'details' ? null : 'details')}>
            ⚙ Details {anyDetail && <span className="text-indigo-600 font-bold">({FLOW_DETAILS.filter(d => details[d.id]).length})</span>}
          </Btn>
          {panel === 'details' && (
            <div className="absolute left-0 top-full mt-1 w-64 bg-white border border-slate-200 rounded-xl shadow-xl p-2 fade-in">
              <div className="text-xs text-slate-400 px-2 py-1">Off by default — turn on only what you need.</div>
              {FLOW_DETAILS.map(d => (
                <label key={d.id} className="flex items-center gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50 cursor-pointer">
                  <input type="checkbox" checked={!!details[d.id]} onChange={() => toggleDetail(d.id)} />
                  <span className="text-sm text-slate-700">{d.label}</span>
                </label>
              ))}
              {anyDetail && (
                <button onClick={() => setAndSave({ ...prefs, details: { ...NO_DETAILS } })}
                  className="w-full mt-1 text-xs text-indigo-600 hover:bg-indigo-50 rounded-lg py-1.5">Hide all details</button>
              )}
            </div>
          )}
        </div>

        <div className="flex-1" />
        <div className="flex items-center gap-3 text-[11px] text-slate-400">
          <span className="flex items-center gap-1"><span className="text-slate-700">●</span> goes through</span>
          <span className="flex items-center gap-1">
            <span style={{ display:'inline-block', width:18, borderTop:'2px dashed #cbd5e1' }} /> bypasses
          </span>
          <span className="flex items-center gap-1"><span className="text-emerald-600 font-bold">▸</span> starts</span>
          <span className="flex items-center gap-1"><span className="text-slate-500 font-bold">✓</span> ends</span>
        </div>
      </div>

      {/* Matrix */}
      <div className="flex-1 overflow-auto" onClick={() => setPanel(null)}>
        <div style={{ minWidth: 'max-content' }} className="pb-6">

          {/* Step header row */}
          <div className="flex sticky top-0 bg-slate-100 z-20 border-b border-slate-200">
            <div className="shrink-0 px-3 py-2 sticky left-0 bg-slate-100 z-10 border-r border-slate-200"
              style={{ width: 190 }}>
              <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Document</span>
            </div>
            {spine.map((n, i) => (
              <div key={n.key} className="shrink-0 px-2 py-2 text-center" style={{ width: colW }}>
                <div className="text-[10px] font-bold text-slate-300">{i + 1}</div>
                <div className="text-xs font-bold text-slate-700 leading-tight break-words">{n.label}</div>
              </div>
            ))}
          </div>

          {/* One row per document */}
          {docs.map(doc => {
            const { cells, first, last, hiddenCount } = docTrack(doc, spine);
            return (
              <div key={doc.id} className="flex border-b border-slate-100 hover:bg-white/60 transition-colors">
                {/* Document label */}
                <div className="shrink-0 px-3 py-3 sticky left-0 bg-slate-100 z-10 border-r border-slate-200 flex items-start gap-2"
                  style={{ width: 190 }}>
                  <span className="mt-1 rounded-full shrink-0" style={{ width: 10, height: 10, background: doc.color }} />
                  <div className="min-w-0">
                    <div className="text-sm font-semibold text-slate-800 leading-tight break-words">{doc.name}</div>
                    <div className="text-[10px] text-slate-400 mt-0.5">
                      {first < 0 ? 'no steps in view' : `${cells.filter(c => c.length).length} of ${spine.length} steps`}
                      {hiddenCount > 0 && ` · ${hiddenCount} hidden`}
                    </div>
                  </div>
                </div>

                {/* Track cells */}
                {spine.map((n, i) => {
                  const steps = cells[i];
                  const active = steps.length > 0;
                  const inTrack = first >= 0 && i >= first && i <= last;
                  const lineColor = active ? doc.color : '#cbd5e1';
                  const lineStyle = active ? 'solid' : 'dashed';
                  return (
                    <div key={n.key} className="shrink-0 relative flex items-center justify-center px-2"
                      style={{ width: colW, minHeight: FLOW_ROW_H }}>
                      {/* connector: left half */}
                      {inTrack && i > first && (
                        <div style={{ position:'absolute', left:0, width:'50%', top:'50%',
                          borderTop:`2px ${lineStyle} ${lineColor}` }} />
                      )}
                      {/* connector: right half */}
                      {inTrack && i < last && (
                        <div style={{ position:'absolute', right:0, width:'50%', top:'50%',
                          borderTop:`2px ${lineStyle} ${lineColor}` }} />
                      )}
                      {active ? (
                        <div className="relative py-3" style={{ width: anyDetail ? '100%' : 'auto' }}>
                          {i === first && (
                            <div className="absolute -top-0.5 left-1/2 -translate-x-1/2 text-[9px] font-bold text-emerald-600 whitespace-nowrap">▸ START</div>
                          )}
                          <FlowStepNode steps={steps} doc={doc} roles={roles} details={details} anyDetail={anyDetail} />
                          {i === last && (
                            <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 text-[9px] font-bold text-slate-400 whitespace-nowrap">✓ END</div>
                          )}
                        </div>
                      ) : inTrack ? (
                        <span className="absolute left-0 right-0 text-center text-[9px] font-medium text-slate-400 pointer-events-none"
                          style={{ top: 'calc(50% - 15px)' }}>bypassed</span>
                      ) : null}
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ── Print / PDF generator ──────────────────────────────────────────────────────
function generatePrintHTML(projectType, roles, syncGroupMeta) {
  const numCols = projectType.documents.length;
  // Page width: ~62mm per column + 20mm margins; height auto
  const pageWidthMM = Math.max(150, numCols * 65 + 20);

  const roleLabel = (ids) =>
    (ids || []).map(id => roles.find(r => r.id === id)?.label ?? id).join(', ');

  const actionIcon = (type) => type === 'review' ? '🔍' : type === 'approval' ? '✅' : type === 'consultation' ? '💬' : type === 'prepared_by' ? '📝' : '▸';

  const fileOpLabel = (op) => {
    if (op === 'copy') return '⎘ Document Copied';
    if (op === 'move') return '→ Document Moved';
    if (op === 'download_email') return '📧 Emailed as Attachment';
    return '';
  };

  const deliveryLabel = (method) => {
    if (method === 'download_email') return '📧 Emailed as Attachment';
    if (method === 'in_person') return '🤝 Delivered In Person';
    if (method === 'shared_folder') return '📂 Via Shared Folder';
    return '';
  };

  const stepHTML = (step, color) => {
    const actions = (step.actions || []).map(a =>
      `<div class="action">${actionIcon(a.type)} ${a.type === 'custom' ? a.label : `<b>${a.label}</b>${a.person ? ' ' + a.person : ''}`}</div>`
    ).join('');

    const parties = [];
    if (step.presenterIds?.length) parties.push(`<span class="lbl-indigo">Prepares/Presents:</span> ${roleLabel(step.presenterIds)}`);
    if (step.carrierIds?.length) parties.push(`<span class="lbl-green">Carries to next:</span> ${roleLabel(step.carrierIds)}`);

    const storage = [];
    if (step.storageLocation) storage.push(`📁 ${step.storageLocation}`);
    if (step.fileOperation) storage.push(fileOpLabel(step.fileOperation));

    const delivery = step.deliveryMethod ? deliveryLabel(step.deliveryMethod) : '';

    const triggerBadge = (step.triggerType && step.triggerLabel)
      ? `<div class="trigger">⚡ ${step.triggerLabel}</div>` : '';

    const infoBadge = step.informationOnly
      ? '<span class="info-only">ⓘ Information Only</span>' : '';

    const syncMeta = step.syncGroupId && syncGroupMeta && syncGroupMeta[step.syncGroupId];
    const syncBadge = syncMeta
      ? `<div class="sync-badge" style="border-color:${syncMeta.color};color:${syncMeta.color}">🔗 ${syncMeta.name}</div>` : '';

    const rejection = step.returnToStepId ? '<div class="rejection">↩ If rejected, returns to an earlier step</div>' : '';
    const notes = step.notes ? `<div class="notes">📝 ${step.notes}</div>` : '';

    const borderStyle = syncMeta
      ? `border:2px solid ${syncMeta.color};border-top-color:${color};border-top-width:3px`
      : `border:1px solid #e2e8f0;border-top:2px solid ${color}`;

    return `
      <div class="step" style="${borderStyle}">
        <div class="step-name">${infoBadge}${step.stageName || '(unnamed)'}</div>
        ${triggerBadge}
        ${actions ? `<div class="actions">${actions}</div>` : ''}
        ${parties.length ? `<div class="parties">${parties.join('<br>')}</div>` : ''}
        ${(storage.length || delivery) ? `<div class="storage">${[...storage, delivery].filter(Boolean).join(' &nbsp;·&nbsp; ')}</div>` : ''}
        ${syncBadge}
        ${rejection}
        ${notes}
      </div>`;

  const colsHTML = projectType.documents.map(doc => {

    return `

      ${doc.steps.length === 0

            stepHTML(s, doc.color) + (i < doc.steps.length - 1 ? `<div class="arrow" style="color:${doc.color}">↓</div>` : '')
          ).join('')
      }
      <div class="complete" style="color:${doc.color};border-color:${doc.color}20;background:${doc.color}10">✓ Complete</div>
    </div>`;
  }).join('');

  return `<!DOCTYPE html>

  .info-only { font-size: 7px; font-weight: bold; color: #0284c7; background: #e0f2fe; border-radius: 3px; padding: 1px 3px; margin-right: 3px; vertical-align: middle; }
  .trigger { font-size: 7.5px; color: #92400e; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 3px; padding: 1px 4px; margin-bottom: 3px; display: inline-block; }
  .actions { margin-bottom: 3px; }
