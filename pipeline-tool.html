<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS Program Development Pipeline Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @media print {
      #app-shell > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; position: static !important; }
      body { background: white; }
      .no-print { display: none !important; }
    }
    body { font-family: system-ui, sans-serif; }
    .step-row:hover { background: #f0f4ff; }
    .lane-cell { min-width: 140px; }
    .drag-over { background: #e0e7ff !important; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #6366f1; outline-offset: 1px; }
    .fade-in { animation: fadeIn 0.15s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── Utilities ────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2, 9);

const STORAGE_KEY = 'cs_pipeline_tool_v1';

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return null;
}

function saveStore(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

// ─── Default Seed Data ────────────────────────────────────────────────────────
const DEFAULT_ROLES = [
  { id: 'r1', label: 'Program Coordinator (PC)' },
  { id: 'r2', label: 'Admin' },
  { id: 'r3', label: 'Dean' },
  { id: 'r4', label: 'Director' },
  { id: 'r5', label: 'Faculty' },
  { id: 'r6', label: 'TCDC' },
];

const DEFAULT_DOC_TYPES = [
  { id: 'd1', name: 'Concept Paper', color: '#c97c00' },
  { id: 'd2', name: 'Course Proposal', color: '#16a34a' },
  { id: 'd3', name: 'Program Proposal', color: '#2563eb' },
  { id: 'd4', name: 'Program Summary', color: '#7c3aed' },
  { id: 'd5', name: 'Discontinuation Form', color: '#dc2626' },
  { id: 'd6', name: 'EDCO Form', color: '#b45309' },
];

const DEFAULT_PROJECT_TYPES = [
  { id: 'pt1', name: 'New Program', documentTypeIds: ['d1','d2','d3','d4'] },
  { id: 'pt2', name: 'New Courses', documentTypeIds: ['d1','d2'] },
  { id: 'pt3', name: 'Course Changes', documentTypeIds: ['d2','d6'] },
  { id: 'pt4', name: 'Discontinuation', documentTypeIds: ['d5'] },
  { id: 'pt5', name: 'Micro-Credential', documentTypeIds: ['d1','d2','d3','d4'] },
];

// Seeded pipeline based on the existing PDF flowchart
function makeSeedPipeline() {
  return {
    id: uid(),
    name: 'CS Program Development Pipeline (Default)',
    projectTypeId: 'pt1',
    startLabel: 'Program Coordinator / Director Creates Files & Uploads to SharePoint',
    endLabel: 'Admin moves final approved files to folder — COMPLETE',
    steps: [
      {
        id: uid(), order: 0,
        stageName: 'CS Consultations — Faculty & TCDC',
        applicableDocIds: ['d1','d2'],
        responsiblePartyIds: ['r3','r1'],
        action: 'Dean shares with Faculty; PC shares with TCDC (Signs)',
        returnToStepId: null, notes: ''
      },
      {
        id: uid(), order: 1,
        stageName: 'JCCS',
        applicableDocIds: ['d1','d2'],
        responsiblePartyIds: ['r2','r3'],
        action: 'Admin & Dean share with JCCS (Signs)',
        returnToStepId: null, notes: 'Admin carries from previous step'
      },
      {
        id: uid(), order: 2,
        stageName: 'AQA – Langara Post',
        applicableDocIds: ['d1'],
        responsiblePartyIds: ['r4'],
        action: 'Director shares with AQA (Signs)',
        returnToStepId: null, notes: ''
      },
      {
        id: uid(), order: 3,
        stageName: 'VPE – ELT',
        applicableDocIds: ['d2','d3','d4','d5'],
        responsiblePartyIds: ['r3','r2'],
        action: 'Dean / Admin share with VPE (Signs)',
        returnToStepId: null, notes: ''
      },
      {
        id: uid(), order: 4,
        stageName: 'ELT / RES Review',
        applicableDocIds: ['d2','d3','d4','d5'],
        responsiblePartyIds: ['r4','r1'],
        action: 'Director shares Program Summary with ELT (Signs & adds ELT approval date); PC/Director share Course Proposals & Program Summaries with RES (Review & Adjust; Approve & Sign)',
        returnToStepId: null, notes: ''
      },
      {
        id: uid(), order: 5,
        stageName: 'CS Proposal & EDCO Documents',
        applicableDocIds: ['d1','d2','d3','d4','d5','d6'],
        responsiblePartyIds: ['r2'],
        action: 'Admin shares to CRC & EDCO',
        returnToStepId: null, notes: ''
      },
      {
        id: uid(), order: 6,
        stageName: 'CRC – EDCO Approved',
        applicableDocIds: ['d1','d2','d3','d4','d5','d6'],
        responsiblePartyIds: ['r2'],
        action: 'Admin moves final approved files to folder',
        returnToStepId: null, notes: 'End of pipeline'
      },
    ],
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
  };
}

function getDefaultStore() {
  const pipeline = makeSeedPipeline();
  return {
    roles: DEFAULT_ROLES,
    documentTypes: DEFAULT_DOC_TYPES,
    projectTypes: DEFAULT_PROJECT_TYPES,
    pipelines: [pipeline],
    templates: [],
    activePipelineId: pipeline.id,
  };
}

// ─── useStore hook ─────────────────────────────────────────────────────────────
function useStore() {
  const [store, setStore] = useState(() => loadStore() || getDefaultStore());

  useEffect(() => { saveStore(store); }, [store]);

  const update = useCallback((updater) => {
    setStore(prev => {
      const next = typeof updater === 'function' ? updater(prev) : { ...prev, ...updater };
      return next;
    });
  }, []);

  return [store, update];
}

// ─── Small helpers ─────────────────────────────────────────────────────────────
function Badge({ color, children }) {
  return (
    <span style={{ background: color + '22', color, borderColor: color }}
      className="inline-block text-xs font-semibold px-2 py-0.5 rounded border mr-1 mb-1">
      {children}
    </span>
  );
}

function Modal({ title, onClose, children, wide }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4"
      onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`bg-white rounded-xl shadow-2xl flex flex-col ${wide ? 'w-full max-w-3xl' : 'w-full max-w-lg'} max-h-[90vh] fade-in`}>
        <div className="flex items-center justify-between px-5 py-4 border-b">
          <h2 className="text-lg font-bold text-slate-800">{title}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-700 text-xl font-bold leading-none">&times;</button>
        </div>
        <div className="overflow-y-auto flex-1 px-5 py-4">{children}</div>
      </div>
    </div>
  );
}

function Btn({ onClick, children, variant = 'primary', sm, disabled, type = 'button', className = '' }) {
  const base = 'inline-flex items-center gap-1.5 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1';
  const size = sm ? 'text-xs px-2.5 py-1.5' : 'text-sm px-3.5 py-2';
  const variants = {
    primary: 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500',
    secondary: 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 focus:ring-indigo-400',
    danger: 'bg-red-600 hover:bg-red-700 text-white focus:ring-red-500',
    ghost: 'text-slate-600 hover:bg-slate-100 focus:ring-slate-400',
  };
  return (
    <button type={type} onClick={onClick} disabled={disabled}
      className={`${base} ${size} ${variants[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>
      {children}
    </button>
  );
}

function Field({ label, children, hint }) {
  return (
    <div className="mb-4">
      <label className="block text-sm font-semibold text-slate-700 mb-1">{label}</label>
      {hint && <p className="text-xs text-slate-400 mb-1">{hint}</p>}
      {children}
    </div>
  );
}

const inputCls = 'w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:border-indigo-400 transition-colors';
const textareaCls = inputCls + ' resize-none';

// ─── StepForm Modal ────────────────────────────────────────────────────────────
function StepForm({ step, pipeline, store, onSave, onClose }) {
  const docs = store.documentTypes.filter(d => pipeline.projectType?.documentTypeIds?.includes(d.id) ?? true);
  const allDocs = store.documentTypes;
  const [form, setForm] = useState(() => step ? { ...step } : {
    id: uid(), order: pipeline.steps.length,
    stageName: '', applicableDocIds: [], responsiblePartyIds: [],
    action: '', returnToStepId: null, notes: '',
  });

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleDoc = (id) => set('applicableDocIds', form.applicableDocIds.includes(id)
    ? form.applicableDocIds.filter(x => x !== id)
    : [...form.applicableDocIds, id]);
  const toggleRole = (id) => set('responsiblePartyIds', form.responsiblePartyIds.includes(id)
    ? form.responsiblePartyIds.filter(x => x !== id)
    : [...form.responsiblePartyIds, id]);

  const docList = allDocs;
  const prevSteps = pipeline.steps.filter(s => s.id !== form.id);

  return (
    <Modal title={step ? 'Edit Step' : 'Add Step'} onClose={onClose} wide>
      <Field label="Stage / Committee Name" hint="e.g. JCCS, VPE – ELT, AQA – Langara Post">
        <input className={inputCls} value={form.stageName} onChange={e => set('stageName', e.target.value)}
          placeholder="Stage name..." />
      </Field>

      <Field label="Applicable Document Types" hint="Which documents pass through this step?">
        <div className="flex flex-wrap gap-2">
          {docList.map(d => (
            <button key={d.id} type="button" onClick={() => toggleDoc(d.id)}
              style={form.applicableDocIds.includes(d.id) ? { background: d.color, color: '#fff', borderColor: d.color } : { borderColor: d.color, color: d.color }}
              className="px-3 py-1 rounded-full border-2 text-xs font-semibold transition-colors">
              {d.name}
            </button>
          ))}
        </div>
      </Field>

      <Field label="Responsible Party" hint="Who carries/submits the document at this step?">
        <div className="flex flex-wrap gap-2 mb-2">
          {store.roles.map(r => (
            <button key={r.id} type="button" onClick={() => toggleRole(r.id)}
              className={`px-3 py-1 rounded-full border text-xs font-semibold transition-colors ${form.responsiblePartyIds.includes(r.id) ? 'bg-indigo-600 text-white border-indigo-600' : 'border-slate-300 text-slate-600 hover:border-indigo-400'}`}>
              {r.label}
            </button>
          ))}
        </div>
      </Field>

      <Field label="Action / What Happens at This Step" hint="e.g. Signs, Reviews & Approves, For Approval">
        <textarea className={textareaCls} rows={2} value={form.action}
          onChange={e => set('action', e.target.value)}
          placeholder="Describe the action at this step..." />
      </Field>

      <Field label="If Rejected / Needs Revision — Return To" hint="Optional: select which earlier step the document goes back to">
        <select className={inputCls} value={form.returnToStepId || ''} onChange={e => set('returnToStepId', e.target.value || null)}>
          <option value="">— No return step —</option>
          {prevSteps.map(s => <option key={s.id} value={s.id}>{s.stageName || '(unnamed step)'}</option>)}
        </select>
      </Field>

      <Field label="Notes" hint="Optional: any additional context">
        <textarea className={textareaCls} rows={2} value={form.notes}
          onChange={e => set('notes', e.target.value)} placeholder="Notes..." />
      </Field>

      <div className="flex justify-end gap-2 mt-4">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={() => { if (form.stageName.trim()) onSave(form); }}>Save Step</Btn>
      </div>
    </Modal>
  );
}

// ─── Pipeline Canvas (SVG swimlane) ───────────────────────────────────────────
function PipelineCanvas({ pipeline, store }) {
  const { documentTypes, roles } = store;
  const activeDocs = useMemo(() =>
    documentTypes.filter(d => pipeline.steps.some(s => s.applicableDocIds.includes(d.id))),
    [documentTypes, pipeline.steps]
  );

  if (!pipeline.steps.length) {
    return (
      <div className="flex flex-col items-center justify-center h-64 text-slate-400">
        <svg className="w-16 h-16 mb-3 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5}
            d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7" />
        </svg>
        <p className="text-sm">No steps yet. Add steps using the editor on the right.</p>
      </div>
    );
  }

  const LANE_W = 160;
  const ROW_H = 110;
  const LABEL_W = 210;
  const PAD = 20;
  const HEADER_H = 60;
  const width = LABEL_W + activeDocs.length * LANE_W + PAD * 2;
  const height = HEADER_H + pipeline.steps.length * ROW_H + PAD * 2 + 60;

  const roleLabel = (ids) => ids.map(id => {
    const r = roles.find(r => r.id === id);
    return r ? r.label.replace(' (PC)', '').replace('Program Coordinator', 'PC') : id;
  }).join(', ');

  // Color-coded arrows per doc between rows
  const arrows = [];
  activeDocs.forEach((doc, di) => {
    const cx = LABEL_W + di * LANE_W + LANE_W / 2;
    for (let i = 0; i < pipeline.steps.length - 1; i++) {
      const curr = pipeline.steps[i];
      const next = pipeline.steps[i + 1];
      if (curr.applicableDocIds.includes(doc.id) && next.applicableDocIds.includes(doc.id)) {
        const y1 = HEADER_H + PAD + i * ROW_H + ROW_H - 12;
        const y2 = HEADER_H + PAD + (i + 1) * ROW_H + 12;
        arrows.push(
          <g key={`arr-${doc.id}-${i}`}>
            <line x1={cx} y1={y1} x2={cx} y2={y2 - 8} stroke={doc.color} strokeWidth="2.5" strokeOpacity="0.7" />
            <polygon points={`${cx},${y2} ${cx-5},${y2-8} ${cx+5},${y2-8}`} fill={doc.color} fillOpacity="0.8" />
          </g>
        );
      }
    }
    // Return arrows
    pipeline.steps.forEach((step, i) => {
      if (!step.returnToStepId || !step.applicableDocIds.includes(doc.id)) return;
      const targetIdx = pipeline.steps.findIndex(s => s.id === step.returnToStepId);
      if (targetIdx < 0) return;
      const x = LABEL_W + di * LANE_W + LANE_W - 10;
      const y1 = HEADER_H + PAD + i * ROW_H + ROW_H / 2;
      const y2 = HEADER_H + PAD + targetIdx * ROW_H + ROW_H / 2;
      const offset = 30 + di * 8;
      arrows.push(
        <g key={`ret-${doc.id}-${step.id}`}>
          <path d={`M${x},${y1} Q${x+offset},${(y1+y2)/2} ${x},${y2}`}
            fill="none" stroke={doc.color} strokeWidth="2" strokeDasharray="5,4" strokeOpacity="0.6" />
          <polygon points={`${x},${y2} ${x-5},${y2+7} ${x+5},${y2+7}`} fill={doc.color} fillOpacity="0.7" />
        </g>
      );
    });
  });

  return (
    <div className="overflow-auto rounded-xl bg-white border border-slate-200 shadow-sm">
      {/* Start label */}
      <div className="px-4 py-2 bg-slate-700 text-white text-xs font-semibold rounded-t-xl flex items-center gap-2">
        <span className="text-slate-300">START</span>
        <span>›</span>
        <span>{pipeline.startLabel}</span>
      </div>
      <svg width={width} height={height} style={{ display: 'block', minWidth: width }}>
        {/* Column headers */}
        <rect x={0} y={0} width={LABEL_W} height={HEADER_H} fill="#f1f5f9" />
        <text x={LABEL_W / 2} y={HEADER_H / 2 + 5} textAnchor="middle" fontSize="12" fontWeight="bold" fill="#475569">
          Stage / Committee
        </text>
        {activeDocs.map((doc, i) => (
          <g key={doc.id}>
            <rect x={LABEL_W + i * LANE_W} y={0} width={LANE_W} height={HEADER_H} fill={doc.color + '18'} />
            <line x1={LABEL_W + i * LANE_W} y1={0} x2={LABEL_W + i * LANE_W} y2={HEADER_H} stroke={doc.color} strokeWidth="1.5" />
            <foreignObject x={LABEL_W + i * LANE_W + 4} y={4} width={LANE_W - 8} height={HEADER_H - 8}>
              <div xmlns="http://www.w3.org/1999/xhtml"
                style={{ color: doc.color, fontWeight: 700, fontSize: 11, textAlign: 'center', padding: '4px 2px', wordBreak: 'break-word', lineHeight: 1.3 }}>
                {doc.name}
              </div>
            </foreignObject>
          </g>
        ))}

        {/* Grid lines */}
        {pipeline.steps.map((_, i) => (
          <line key={`hline-${i}`}
            x1={0} y1={HEADER_H + PAD + i * ROW_H} x2={width} y2={HEADER_H + PAD + i * ROW_H}
            stroke="#e2e8f0" strokeWidth="1" />
        ))}
        <line x1={LABEL_W} y1={0} x2={LABEL_W} y2={height} stroke="#cbd5e1" strokeWidth="1.5" />

        {/* Step rows */}
        {pipeline.steps.map((step, i) => {
          const y = HEADER_H + PAD + i * ROW_H;
          return (
            <g key={step.id}>
              {/* Stage label */}
              <rect x={0} y={y} width={LABEL_W} height={ROW_H} fill={i % 2 === 0 ? '#f8fafc' : '#f1f5f9'} />
              <foreignObject x={4} y={y + 4} width={LABEL_W - 8} height={ROW_H - 8}>
                <div xmlns="http://www.w3.org/1999/xhtml"
                  style={{ fontSize: 11, fontWeight: 600, color: '#334155', lineHeight: 1.3, padding: '2px 2px' }}>
                  <div style={{ marginBottom: 3 }}>{step.stageName || '(unnamed)'}</div>
                  {step.responsiblePartyIds.length > 0 && (
                    <div style={{ fontSize: 10, color: '#6366f1', fontWeight: 500 }}>
                      {roleLabel(step.responsiblePartyIds)}
                    </div>
                  )}
                </div>
              </foreignObject>

              {/* Doc lane cells */}
              {activeDocs.map((doc, di) => {
                const x = LABEL_W + di * LANE_W;
                const active = step.applicableDocIds.includes(doc.id);
                return (
                  <g key={doc.id}>
                    <rect x={x} y={y} width={LANE_W} height={ROW_H} fill={active ? doc.color + '12' : 'transparent'} />
                    <line x1={x} y1={y} x2={x} y2={y + ROW_H} stroke={doc.color + '50'} strokeWidth="1" />
                    {active && (
                      <foreignObject x={x + 5} y={y + 5} width={LANE_W - 10} height={ROW_H - 10}>
                        <div xmlns="http://www.w3.org/1999/xhtml"
                          style={{ fontSize: 9.5, color: '#374151', lineHeight: 1.35, padding: '2px' }}>
                          {step.action}
                        </div>
                      </foreignObject>
                    )}
                    {!active && (
                      <line x1={x + LANE_W / 4} y1={y + ROW_H / 2} x2={x + LANE_W * 3 / 4} y2={y + ROW_H / 2}
                        stroke="#e2e8f0" strokeWidth="1.5" />
                    )}
                  </g>
                );
              })}
            </g>
          );
        })}

        {/* Arrows */}
        {arrows}

        {/* Bottom padding row for end label */}
        <rect x={0} y={height - 50} width={width} height={50} fill="#f1f5f9" />
      </svg>
      {/* End label */}
      <div className="px-4 py-2 bg-emerald-700 text-white text-xs font-semibold rounded-b-xl flex items-center gap-2">
        <span className="text-emerald-200">END</span>
        <span>›</span>
        <span>{pipeline.endLabel}</span>
      </div>
    </div>
  );
}

// ─── Pipeline Editor (right panel) ────────────────────────────────────────────
function PipelineEditor({ pipeline, store, onUpdatePipeline }) {
  const [editStep, setEditStep] = useState(null);
  const [addingStep, setAddingStep] = useState(false);
  const [editMeta, setEditMeta] = useState(false);
  const [metaForm, setMetaForm] = useState({ name: pipeline.name, startLabel: pipeline.startLabel, endLabel: pipeline.endLabel });

  const saveStep = (stepData) => {
    const existing = pipeline.steps.find(s => s.id === stepData.id);
    const newSteps = existing
      ? pipeline.steps.map(s => s.id === stepData.id ? stepData : s)
      : [...pipeline.steps, stepData];
    onUpdatePipeline({ ...pipeline, steps: newSteps, updatedAt: new Date().toISOString() });
    setEditStep(null);
    setAddingStep(false);
  };

  const deleteStep = (id) => {
    if (!confirm('Delete this step?')) return;
    onUpdatePipeline({ ...pipeline, steps: pipeline.steps.filter(s => s.id !== id), updatedAt: new Date().toISOString() });
  };

  const moveStep = (idx, dir) => {
    const steps = [...pipeline.steps];
    const target = idx + dir;
    if (target < 0 || target >= steps.length) return;
    [steps[idx], steps[target]] = [steps[target], steps[idx]];
    onUpdatePipeline({ ...pipeline, steps, updatedAt: new Date().toISOString() });
  };

  const docName = (id) => store.documentTypes.find(d => d.id === id)?.name ?? id;
  const docColor = (id) => store.documentTypes.find(d => d.id === id)?.color ?? '#666';
  const roleName = (id) => {
    const r = store.roles.find(r => r.id === id);
    return r ? r.label.replace(' (PC)', '').replace('Program Coordinator', 'PC') : id;
  };

  return (
    <div className="flex flex-col h-full">
      <div className="flex items-center justify-between mb-3">
        <h3 className="font-bold text-slate-700 text-sm uppercase tracking-wide">Pipeline Steps</h3>
        <Btn sm onClick={() => setAddingStep(true)}>+ Add Step</Btn>
      </div>

      {/* Pipeline meta */}
      <div className="mb-3 bg-slate-50 rounded-lg p-3 border border-slate-200">
        {editMeta ? (
          <div>
            <input className={inputCls + ' mb-2'} value={metaForm.name} onChange={e => setMetaForm(f => ({ ...f, name: e.target.value }))} placeholder="Pipeline name" />
            <input className={inputCls + ' mb-2'} value={metaForm.startLabel} onChange={e => setMetaForm(f => ({ ...f, startLabel: e.target.value }))} placeholder="Start label" />
            <input className={inputCls + ' mb-2'} value={metaForm.endLabel} onChange={e => setMetaForm(f => ({ ...f, endLabel: e.target.value }))} placeholder="End label" />
            <div className="flex gap-2">
              <Btn sm onClick={() => { onUpdatePipeline({ ...pipeline, ...metaForm }); setEditMeta(false); }}>Save</Btn>
              <Btn sm variant="secondary" onClick={() => setEditMeta(false)}>Cancel</Btn>
            </div>
          </div>
        ) : (
          <div>
            <div className="font-semibold text-sm text-slate-700 truncate">{pipeline.name}</div>
            <div className="text-xs text-slate-400 mt-0.5 truncate">Start: {pipeline.startLabel}</div>
            <div className="text-xs text-slate-400 truncate">End: {pipeline.endLabel}</div>
            <button className="text-xs text-indigo-600 hover:underline mt-1" onClick={() => { setMetaForm({ name: pipeline.name, startLabel: pipeline.startLabel, endLabel: pipeline.endLabel }); setEditMeta(true); }}>
              Edit names
            </button>
          </div>
        )}
      </div>

      <div className="flex-1 overflow-y-auto space-y-2 pr-1">
        {pipeline.steps.length === 0 && (
          <div className="text-slate-400 text-sm text-center py-6">No steps yet. Click "+ Add Step" to begin.</div>
        )}
        {pipeline.steps.map((step, i) => (
          <div key={step.id} className="bg-white rounded-lg border border-slate-200 p-3 step-row transition-colors">
            <div className="flex items-start justify-between gap-1">
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-1.5 mb-1">
                  <span className="text-xs font-bold text-slate-400 w-5 shrink-0">{i + 1}</span>
                  <span className="font-semibold text-sm text-slate-700 truncate">{step.stageName || '(unnamed)'}</span>
                </div>
                <div className="flex flex-wrap ml-5">
                  {step.applicableDocIds.map(id => (
                    <Badge key={id} color={docColor(id)}>{docName(id)}</Badge>
                  ))}
                </div>
                {step.responsiblePartyIds.length > 0 && (
                  <div className="text-xs text-indigo-600 ml-5 mt-0.5">{step.responsiblePartyIds.map(roleName).join(', ')}</div>
                )}
                {step.action && (
                  <div className="text-xs text-slate-500 ml-5 mt-0.5 italic truncate">{step.action}</div>
                )}
                {step.returnToStepId && (
                  <div className="text-xs text-amber-600 ml-5 mt-0.5">
                    ↩ Returns to: {pipeline.steps.find(s => s.id === step.returnToStepId)?.stageName || '?'}
                  </div>
                )}
              </div>
              <div className="flex flex-col gap-1 shrink-0">
                <div className="flex gap-1">
                  <button onClick={() => moveStep(i, -1)} disabled={i === 0} className="text-slate-300 hover:text-slate-600 disabled:opacity-20 text-xs p-0.5">▲</button>
                  <button onClick={() => moveStep(i, 1)} disabled={i === pipeline.steps.length - 1} className="text-slate-300 hover:text-slate-600 disabled:opacity-20 text-xs p-0.5">▼</button>
                </div>
                <button onClick={() => setEditStep(step)} className="text-xs text-indigo-500 hover:text-indigo-700">Edit</button>
                <button onClick={() => deleteStep(step.id)} className="text-xs text-red-400 hover:text-red-600">Del</button>
              </div>
            </div>
          </div>
        ))}
      </div>

      {(editStep || addingStep) && (
        <StepForm
          step={editStep}
          pipeline={pipeline}
          store={store}
          onSave={saveStep}
          onClose={() => { setEditStep(null); setAddingStep(false); }}
        />
      )}
    </div>
  );
}

// ─── Project Type Editor ───────────────────────────────────────────────────────
function ProjectTypeEditor({ store, onUpdateStore, onClose }) {
  const [projectTypes, setProjectTypes] = useState(store.projectTypes);
  const [docTypes, setDocTypes] = useState(store.documentTypes);
  const [editPT, setEditPT] = useState(null);
  const [newPTName, setNewPTName] = useState('');
  const [newDocName, setNewDocName] = useState('');
  const [newDocColor, setNewDocColor] = useState('#6366f1');
  const [tab, setTab] = useState('projects');

  const addPT = () => {
    if (!newPTName.trim()) return;
    setProjectTypes(prev => [...prev, { id: uid(), name: newPTName.trim(), documentTypeIds: [] }]);
    setNewPTName('');
  };
  const deletePT = (id) => setProjectTypes(prev => prev.filter(p => p.id !== id));
  const toggleDocInPT = (ptId, docId) => {
    setProjectTypes(prev => prev.map(pt => {
      if (pt.id !== ptId) return pt;
      return {
        ...pt,
        documentTypeIds: pt.documentTypeIds.includes(docId)
          ? pt.documentTypeIds.filter(x => x !== docId)
          : [...pt.documentTypeIds, docId],
      };
    }));
  };

  const addDoc = () => {
    if (!newDocName.trim()) return;
    setDocTypes(prev => [...prev, { id: uid(), name: newDocName.trim(), color: newDocColor }]);
    setNewDocName('');
  };
  const deleteDoc = (id) => {
    setDocTypes(prev => prev.filter(d => d.id !== id));
    setProjectTypes(prev => prev.map(pt => ({ ...pt, documentTypeIds: pt.documentTypeIds.filter(x => x !== id) })));
  };

  const save = () => {
    onUpdateStore({ ...store, projectTypes, documentTypes: docTypes });
    onClose();
  };

  return (
    <Modal title="Manage Project Types & Document Types" wide onClose={onClose}>
      <div className="flex gap-2 mb-4">
        {['projects', 'docs'].map(t => (
          <button key={t} onClick={() => setTab(t)}
            className={`px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ${tab === t ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
            {t === 'projects' ? 'Project / Program Types' : 'Document Types'}
          </button>
        ))}
      </div>

      {tab === 'projects' && (
        <div>
          <div className="space-y-3 mb-4">
            {projectTypes.map(pt => (
              <div key={pt.id} className="border rounded-lg p-3">
                <div className="flex items-center justify-between mb-2">
                  {editPT === pt.id
                    ? <input className={inputCls} defaultValue={pt.name}
                        onBlur={e => { setProjectTypes(prev => prev.map(p => p.id === pt.id ? { ...p, name: e.target.value } : p)); setEditPT(null); }}
                        autoFocus onKeyDown={e => e.key === 'Enter' && e.target.blur()} />
                    : <span className="font-semibold text-sm">{pt.name}</span>
                  }
                  <div className="flex gap-2">
                    <button className="text-xs text-indigo-500 hover:underline" onClick={() => setEditPT(pt.id)}>Rename</button>
                    <button className="text-xs text-red-400 hover:underline" onClick={() => deletePT(pt.id)}>Delete</button>
                  </div>
                </div>
                <div className="text-xs text-slate-500 mb-1.5">Required documents:</div>
                <div className="flex flex-wrap gap-1.5">
                  {docTypes.map(d => (
                    <button key={d.id} onClick={() => toggleDocInPT(pt.id, d.id)}
                      style={pt.documentTypeIds.includes(d.id) ? { background: d.color, color: '#fff', borderColor: d.color } : { borderColor: d.color, color: d.color }}
                      className="px-2.5 py-0.5 rounded-full border text-xs font-semibold transition-colors">
                      {d.name}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div className="flex gap-2">
            <input className={inputCls} value={newPTName} onChange={e => setNewPTName(e.target.value)} placeholder="New project type name..."
              onKeyDown={e => e.key === 'Enter' && addPT()} />
            <Btn onClick={addPT}>Add</Btn>
          </div>
        </div>
      )}

      {tab === 'docs' && (
        <div>
          <div className="space-y-2 mb-4">
            {docTypes.map(d => (
              <div key={d.id} className="flex items-center gap-3 border rounded-lg p-2.5">
                <div className="w-5 h-5 rounded-full shrink-0" style={{ background: d.color }} />
                <span className="flex-1 text-sm font-medium">{d.name}</span>
                <input type="color" value={d.color}
                  onChange={e => setDocTypes(prev => prev.map(x => x.id === d.id ? { ...x, color: e.target.value } : x))}
                  className="w-8 h-7 rounded border cursor-pointer" title="Change color" />
                <button className="text-xs text-red-400 hover:underline" onClick={() => deleteDoc(d.id)}>Delete</button>
              </div>
            ))}
          </div>
          <div className="flex gap-2 items-center">
            <input className={inputCls} value={newDocName} onChange={e => setNewDocName(e.target.value)} placeholder="New document type..."
              onKeyDown={e => e.key === 'Enter' && addDoc()} />
            <input type="color" value={newDocColor} onChange={e => setNewDocColor(e.target.value)} className="w-10 h-9 rounded border cursor-pointer shrink-0" />
            <Btn onClick={addDoc}>Add</Btn>
          </div>
        </div>
      )}

      <div className="flex justify-end gap-2 mt-6">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={save}>Save Changes</Btn>
      </div>
    </Modal>
  );
}

// ─── Roles Editor ──────────────────────────────────────────────────────────────
function RolesEditor({ store, onUpdateStore, onClose }) {
  const [roles, setRoles] = useState(store.roles);
  const [newRole, setNewRole] = useState('');
  const add = () => { if (!newRole.trim()) return; setRoles(r => [...r, { id: uid(), label: newRole.trim() }]); setNewRole(''); };
  const del = (id) => setRoles(r => r.filter(x => x.id !== id));
  const save = () => { onUpdateStore({ ...store, roles }); onClose(); };
  return (
    <Modal title="Manage Responsible Parties / Roles" onClose={onClose}>
      <div className="space-y-2 mb-4">
        {roles.map(r => (
          <div key={r.id} className="flex items-center gap-2 border rounded-lg px-3 py-2">
            <span className="flex-1 text-sm">{r.label}</span>
            <button onClick={() => del(r.id)} className="text-xs text-red-400 hover:underline">Remove</button>
          </div>
        ))}
      </div>
      <div className="flex gap-2 mb-4">
        <input className={inputCls} value={newRole} onChange={e => setNewRole(e.target.value)} placeholder="New role / person label..."
          onKeyDown={e => e.key === 'Enter' && add()} />
        <Btn onClick={add}>Add</Btn>
      </div>
      <div className="flex justify-end gap-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={save}>Save</Btn>
      </div>
    </Modal>
  );
}

function TemplateSaveModal({ pipeline, onSave, onClose }) {
  const [name, setName] = useState(pipeline.name + ' (Template)');

    <Modal title="Save as Template" onClose={onClose}>

// ─── New Pipeline Modal ────────────────────────────────────────────────────────
function NewPipelineModal({ store, onCreate, onClose }) {
  const [name, setName] = useState('New Pipeline');
  const [projectTypeId, setProjectTypeId] = useState(store.projectTypes[0]?.id || '');
  const [fromTemplate, setFromTemplate] = useState('');
  const [startLabel, setStartLabel] = useState('Program Coordinator / Director Creates Files & Uploads to SharePoint');
  const [endLabel, setEndLabel] = useState('Admin moves final approved files to folder — COMPLETE');

  const create = () => {
    let steps = [];
    if (fromTemplate) {
      const tmpl = store.templates.find(t => t.id === fromTemplate);
      if (tmpl) steps = tmpl.pipeline.steps.map(s => ({ ...s, id: uid() }));
    }
    onCreate({
      id: uid(), name: name.trim(), projectTypeId,
      startLabel, endLabel, steps,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    });
  };

  return (
    <Modal title="New Pipeline" onClose={onClose}>
      <Field label="Pipeline Name">
        <input className={inputCls} value={name} onChange={e => setName(e.target.value)} autoFocus />
      </Field>
      <Field label="Project / Program Type">
        <select className={inputCls} value={projectTypeId} onChange={e => setProjectTypeId(e.target.value)}>
          {store.projectTypes.map(pt => <option key={pt.id} value={pt.id}>{pt.name}</option>)}
        </select>
      </Field>
      {store.templates.length > 0 && (
        <Field label="Start from Template (optional)">
          <select className={inputCls} value={fromTemplate} onChange={e => setFromTemplate(e.target.value)}>
            <option value="">— Blank pipeline —</option>
            {store.templates.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </Field>
      )}
      <Field label="Start Label">
        <input className={inputCls} value={startLabel} onChange={e => setStartLabel(e.target.value)} />
      </Field>
      <Field label="End Label">
        <input className={inputCls} value={endLabel} onChange={e => setEndLabel(e.target.value)} />
      </Field>
      <div className="flex justify-end gap-2 mt-2">
        <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
        <Btn onClick={create} disabled={!name.trim()}>Create Pipeline</Btn>
      </div>
    </Modal>
  );
}

// ─── Backup Modal ──────────────────────────────────────────────────────────────
function BackupModal({ store, onRestore, onClose }) {
  const fileRef = useRef(null);

  const exportBackup = () => {
    const data = JSON.stringify(store, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `langara-pipeline-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.pipelines || !data.documentTypes) { alert('Invalid backup file.'); return; }
        if (!confirm('This will replace ALL current data with the backup. Are you sure?')) return;
        onRestore(data);
        onClose();
      } catch { alert('Could not read backup file.'); }
    };
    reader.readAsText(file);
  };

  return (
    <Modal title="Backup & Restore" onClose={onClose}>
      <div className="space-y-4">
        <div className="border rounded-lg p-4 bg-slate-50">
          <div className="font-semibold text-sm mb-1">Export Backup</div>
          <p className="text-xs text-slate-500 mb-3">Downloads a JSON file containing all pipelines, templates, document types, project types, and roles. Store this file safely to avoid data loss.</p>
          <Btn onClick={exportBackup}>⬇ Download Backup</Btn>
        </div>
        <div className="border rounded-lg p-4 bg-slate-50">
          <div className="font-semibold text-sm mb-1">Restore from Backup</div>
          <p className="text-xs text-red-500 mb-3">⚠ This will overwrite all current data. Make sure to export a backup first.</p>
          <input type="file" accept=".json" ref={fileRef} onChange={importBackup} className="hidden" />
          <Btn variant="secondary" onClick={() => fileRef.current.click()}>⬆ Import Backup File</Btn>
        </div>
      </div>
      <div className="flex justify-end mt-4">
        <Btn variant="secondary" onClick={onClose}>Close</Btn>
      </div>
    </Modal>
  );
}

// ─── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const [store, updateStore] = useStore();
  const [modal, setModal] = useState(null); // 'newPipeline' | 'projectTypes' | 'roles' | 'backup' | 'saveTemplate'

  const activePipeline = store.pipelines.find(p => p.id === store.activePipelineId) || store.pipelines[0];

  const setActivePipeline = (id) => updateStore(s => ({ ...s, activePipelineId: id }));

  const updatePipeline = (updated) => {
    updateStore(s => ({ ...s, pipelines: s.pipelines.map(p => p.id === updated.id ? updated : p) }));
  };

  const deletePipeline = (id) => {
    if (!confirm('Delete this pipeline?')) return;
    updateStore(s => {
      const pipelines = s.pipelines.filter(p => p.id !== id);
      return { ...s, pipelines, activePipelineId: pipelines[0]?.id || null };
    });
  };

  const createPipeline = (pipeline) => {
    updateStore(s => ({ ...s, pipelines: [...s.pipelines, pipeline], activePipelineId: pipeline.id }));
    setModal(null);
  };

  const saveTemplate = (name) => {
    if (!activePipeline) return;
    const tmpl = { id: uid(), name, pipeline: { ...activePipeline, steps: activePipeline.steps.map(s => ({ ...s })) } };
    updateStore(s => ({ ...s, templates: [...s.templates, tmpl] }));
    setModal(null);
    alert(`Template "${name}" saved!`);
  };

  const deleteTemplate = (id) => {
    if (!confirm('Delete this template?')) return;
    updateStore(s => ({ ...s, templates: s.templates.filter(t => t.id !== id) }));
  };

  const printPipeline = () => {
    window.print();
  };

  const docTypeName = (id) => store.documentTypes.find(d => d.id === id)?.name ?? id;

  return (
    <div className="flex h-screen overflow-hidden bg-slate-100" id="app-shell">
      {/* Sidebar */}
      <aside className="w-64 bg-white border-r border-slate-200 flex flex-col shrink-0 no-print">
        <div className="p-4 border-b border-slate-200">
          <div className="font-bold text-slate-800 text-base leading-tight">CS Pipeline Tool</div>
          <div className="text-xs text-slate-400 mt-0.5">Continuing Studies · Langara</div>
        </div>

        {/* Pipelines */}
        <div className="p-3 flex-1 overflow-y-auto">
          <div className="flex items-center justify-between mb-2 px-1">
            <span className="text-xs font-bold text-slate-500 uppercase tracking-widest">Pipelines</span>
            <button onClick={() => setModal('newPipeline')} className="text-indigo-600 hover:text-indigo-800 text-lg leading-none font-bold" title="New pipeline">+</button>
          </div>
          {store.pipelines.map(p => (
            <div key={p.id}
              onClick={() => setActivePipeline(p.id)}
              className={`group flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer mb-1 transition-colors ${p.id === activePipeline?.id ? 'bg-indigo-600 text-white' : 'text-slate-700 hover:bg-slate-100'}`}>
              <span className="text-sm font-medium truncate flex-1">{p.name}</span>
              {p.id !== activePipeline?.id && store.pipelines.length > 1 && (
                <button onClick={e => { e.stopPropagation(); deletePipeline(p.id); }}
                  className="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 ml-1 shrink-0 text-xs">✕</button>
              )}
            </div>
          ))}

          {/* Templates */}
          {store.templates.length > 0 && (
            <div className="mt-4">
              <div className="text-xs font-bold text-slate-500 uppercase tracking-widest px-1 mb-2">Templates</div>
              {store.templates.map(t => (
                <div key={t.id} className="group flex items-center justify-between px-3 py-2 rounded-lg mb-1 text-slate-600 hover:bg-slate-100">
                  <span className="text-xs font-medium truncate flex-1" title={t.name}>{t.name}</span>
                  <button onClick={() => deleteTemplate(t.id)} className="opacity-0 group-hover:opacity-100 text-red-400 hover:text-red-600 ml-1 text-xs">✕</button>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Bottom nav */}
        <div className="p-3 border-t border-slate-200 space-y-1">
          <button onClick={() => setModal('projectTypes')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>🗂</span> Project &amp; Doc Types
          </button>
          <button onClick={() => setModal('roles')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>👥</span> Roles &amp; People
          </button>
          <button onClick={() => setModal('backup')} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-600 hover:bg-slate-100 flex items-center gap-2">
            <span>💾</span> Backup &amp; Restore
          </button>
          <button onClick={() => {
            if (!confirm('Reset everything back to the original default pipeline data? This will overwrite all current data.')) return;
            updateStore(getDefaultStore());
          }} className="w-full text-left px-3 py-2 rounded-lg text-sm text-slate-400 hover:bg-red-50 hover:text-red-600 flex items-center gap-2">
            <span>↺</span> Reset to Defaults
          </button>
        </div>
      </aside>

      {/* Main content */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        {/* Top toolbar */}
        <header className="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center gap-3 shrink-0 no-print">
          <div className="flex-1 min-w-0">
            <h1 className="font-bold text-slate-800 text-base truncate">{activePipeline?.name ?? 'No pipeline selected'}</h1>
            {activePipeline && (
              <div className="text-xs text-slate-400 truncate">
                {store.projectTypes.find(pt => pt.id === activePipeline.projectTypeId)?.name ?? 'Unknown type'} &middot;
                {activePipeline.steps.length} steps &middot;
                Updated {new Date(activePipeline.updatedAt).toLocaleDateString()}
              </div>
            )}
          </div>
          <div className="flex items-center gap-2 shrink-0">
            {activePipeline && (
              <>
                <Btn variant="secondary" sm onClick={() => setModal('saveTemplate')}>☆ Save as Template</Btn>
                <Btn variant="secondary" sm onClick={printPipeline}>🖨 Print / Export PDF</Btn>
              </>
            )}
          </div>
        </header>

        {/* Canvas + Editor */}
        <div className="flex flex-1 min-h-0 overflow-hidden">
          {/* Pipeline canvas */}
          <div className="flex-1 overflow-auto p-4" id="print-area">
            {activePipeline ? (
              <PipelineCanvas pipeline={activePipeline} store={store} />
            ) : (
              <div className="flex items-center justify-center h-full text-slate-400">
                <div className="text-center">
                  <div className="text-4xl mb-3">📋</div>
                  <p>No pipeline selected. Create one using the sidebar.</p>
                </div>
              </div>
            )}
          </div>

          {/* Right editor panel */}
          {activePipeline && (
            <aside className="w-72 bg-white border-l border-slate-200 p-4 overflow-y-auto shrink-0 no-print">
              <PipelineEditor
                pipeline={activePipeline}
                store={store}
                onUpdatePipeline={updatePipeline}
              />
            </aside>
          )}
        </div>
      </div>

      {/* Modals */}
      {modal === 'newPipeline' && (
        <NewPipelineModal store={store} onCreate={createPipeline} onClose={() => setModal(null)} />
      )}
      {modal === 'projectTypes' && (
        <ProjectTypeEditor store={store} onUpdateStore={(s) => updateStore(s)} onClose={() => setModal(null)} />
      )}
      {modal === 'roles' && (
        <RolesEditor store={store} onUpdateStore={(s) => updateStore(s)} onClose={() => setModal(null)} />
      )}
      {modal === 'backup' && (
        <BackupModal store={store} onRestore={(data) => updateStore(data)} onClose={() => setModal(null)} />
      )}
      {modal === 'saveTemplate' && activePipeline && (
        <TemplateSaveModal pipeline={activePipeline} onSave={saveTemplate} onClose={() => setModal(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
