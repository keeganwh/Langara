  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #F15A22; outline-offset: 1px; }
    .fade-in { animation: fadeIn 0.15s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    ::-webkit-scrollbar { width:8px; height:10px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
    /* Track matrix: one row per document, one column per step. */
    .trk-grid { display: grid; gap: 0; align-items: stretch; }
    .trk-cell { position: relative; padding: 8px 6px; min-width: 150px; }
    .trk-line { position: absolute; left: 0; right: 0; top: 50%; height: 0; z-index: 0; }
    .trk-line.solid { border-top: 3px solid var(--doc); opacity: .55; }
    .trk-line.bypass { border-top: 2px dashed #cbd5e1; }
    .trk-line.half-r { left: 50%; }
    .trk-line.half-l { right: 50%; }
    .trk-node { position: relative; z-index: 1; }
    .st-skipped { border-style: dashed !important; }
    /* Overview: each document's steps on one horizontal track. The current
       step is wide; done and upcoming steps are narrow either side. */
    .trk-track { display: flex; overflow-x: auto; cursor: grab; user-select: none; padding: 1px;
                 scrollbar-width: none; }
    .trk-track::-webkit-scrollbar { display: none; }
    .trk-track:active { cursor: grabbing; }
    .trk-now  { flex-grow: 0; flex-shrink: 0; min-height: 92px; scroll-snap-align: start; }
    .trk-track.snap { scroll-snap-type: x proximity; }
    .trk-side { flex-grow: 0; flex-shrink: 0; min-height: 92px; }
    .trk-edge { position: absolute; top: 0; bottom: 0; width: 36px; pointer-events: none; opacity: 0; transition: opacity .15s; }
    .trk-edge.l { left: 0; background: linear-gradient(90deg, #fff, rgba(255,255,255,0)); }
    .trk-edge.r { right: 0; background: linear-gradient(270deg, #fff, rgba(255,255,255,0)); }
    .trk-edge.on { opacity: 1; }
    /* Same nudge button as the Workflow Map's canvas. */
    .trk-nudge { position: absolute; top: 50%; transform: translateY(-50%); width: 26px; height: 40px; border-radius: 8px;
                 border: 1px solid #cbd5e1; background: #fff; color: #475569; display: flex; align-items: center;
                 justify-content: center; padding: 0; box-shadow: 0 2px 8px rgba(15,23,42,.14); z-index: 2; }
    .trk-nudge:hover { color: #0f172a; background: #f8fafc; }
    .trk-nudge.l { left: 2px; } .trk-nudge.r { right: 2px; }
    .tb-btn { min-width: 128px; justify-content: center; }
    .drawer { animation: drawerIn .18s ease; }
    @keyframes drawerIn { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
    /* Sidebar rail: icons only. Hovering one floats the full button over it
       (fixed-position, so the scrolling rail cannot clip it) and slides its
       label out. */
    .rail-btn { display: inline-flex; align-items: center; height: 40px; padding: 0 4px; border-radius: 10px; }
    .rail-fly { position: fixed; z-index: 99980; display: flex; align-items: center; }
    .rail-fly-btn { display: inline-flex; align-items: center; gap: 10px; height: 100%; padding: 0 4px; border-radius: 10px;
                    background: #fff; box-shadow: 0 6px 18px rgba(15,23,42,.18); white-space: nowrap; text-align: left; line-height: 1.2; }
    .rail-fly-label { display: inline-block; overflow: hidden; padding-right: 12px; animation: railOut .2s ease forwards; }
    @keyframes railOut { from { max-width: 0; opacity: 0; padding-right: 0; } to { max-width: 280px; opacity: 1; padding-right: 12px; } }
    .slide-in { animation: slideIn .18s ease; }
    @keyframes slideIn { from { transform: translateX(-24px); opacity: .5; } to { transform: none; opacity: 1; } }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

const dbSet = (p, v) => trkRef(p).set(v);

// ── Dates ──────────────────────────────────────────────────────────────────────

// ── Undo (delete / archive) ────────────────────────────────────────────────────

    return Promise.all(raws.map(([id]) => dbRemove('projects/' + id))).then(() => {
      showUndo(projects.length === 1 ? 'Deleted "' + projects[0].name + '"' : 'Deleted ' + projects.length + ' projects',

    dbUpdate('projects/' + p.id, { archived, updatedAt: Date.now() });

  });

    </div>, document.body);

// ── Data hook ──────────────────────────────────────────────────────────────────
// Live listeners on both trees: anyone's change shows up for everyone.
function useTrackerData(authUser) {
  const [map, setMap] = useState(null);
  const [trk, setTrk] = useState(null);
  const [online, setOnline] = useState(true);
  useEffect(() => {
    if (!authUser) return;
    const db = getFbDb();
    const mRef = db.ref(MAP_PATH), tRef = db.ref(TRK_PATH), cRef = db.ref('.info/connected');
    const onMap = mRef.on('value', s => setMap(s.val() || {}), () => setMap({}));
    const onTrk = tRef.on('value', s => setTrk(s.val() || {}), () => setTrk({}));
    const onCon = cRef.on('value', s => setOnline(s.val() !== false));
    return () => { mRef.off('value', onMap); tRef.off('value', onTrk); cRef.off('value', onCon); };
  }, [authUser && authUser.uid]);
  const data = useMemo(() => {
    if (!map || !trk) return null;
    const people = Object.entries(trk.people || {}).map(([id, p]) => ({ ...p, id, roleIds: p.roleIds || [] }))
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    const projects = Object.entries(trk.projects || {}).map(([id, p]) => normalizeProject(id, p))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const workflows = (map.projectTypes || []).map(pt => ({ ...pt, documents: pt.documents || [] }));
    ROLE_LIST = map.roles || [];
    return { roles: map.roles || [], workflows, people, projects, syncGroupMeta: map.syncGroupMeta || {} };
  }, [map, trk]);

}

        {footer && <div className="px-5 py-3 border-t flex items-center justify-end gap-2 bg-slate-50 rounded-b-xl">{footer}</div>}
      </div>
    </div>
  );
  return ReactDOM.createPortal(content, document.body);
}
function Btn({ onClick, children, variant = 'primary', sm, disabled, className = '', title }) {
  const base = 'inline-flex items-center gap-1.5 font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-offset-1';
  const size = sm ? 'text-xs px-2.5 py-1.5' : 'text-sm px-3.5 py-2';
  const vs = {
    primary: 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500',
    secondary: 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 focus:ring-indigo-400',
    danger: 'bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 focus:ring-red-400',
    ghost: 'text-slate-500 hover:bg-slate-100 focus:ring-slate-400',
  };
  return (
    <button onClick={onClick} disabled={disabled} title={title}
      className={`${base} ${size} ${vs[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>{children}</button>
  );
}
function Field({ label, hint, children }) {
  return (
    <div className="mb-4">
      <label className="block text-sm font-semibold text-slate-700 mb-1">{label}</label>
      {hint && <p className="text-xs text-slate-400 mb-1.5">{hint}</p>}
      {children}
    </div>
  );
}
const inputCls = 'w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:border-indigo-400 transition-colors';
const textareaCls = inputCls + ' resize-y';

// A confirmation that needs a reason — used for skip, send back and held up.
function ReasonModal({ title, message, label, required = true, confirmLabel, danger, onConfirm, onClose }) {
  const [reason, setReason] = useState('');

  return (
    <Modal title={title} onClose={onClose} footer={<>
      <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      <Btn variant={danger ? 'danger' : 'primary'} disabled={!ok} onClick={() => ok && onConfirm(reason.trim())}>{confirmLabel}</Btn>
    </>}>
      <p className="text-sm text-slate-600 mb-3">{message}</p>
      <Field label={label}>
        <textarea autoFocus rows={3} className={textareaCls} value={reason} onChange={e => setReason(e.target.value)} />

    </Modal>

}

// ── Login screen ───────────────────────────────────────────────────────────────

  const [error, setError] = useState('');

// ── New project ────────────────────────────────────────────────────────────────
function NewProjectModal({ data, authUser, onCreated, onClose }) {
  const [mode, setMode] = useState('workflow');      // 'workflow' | 'duplicate'
  const [batch, setBatch] = useState(false);
  const [itemsText, setItemsText] = useState('');
  const [shared, setShared] = useState([]);          // document ids with one copy for the whole batch
  const [name, setName] = useState('');
  const [wfId, setWfId] = useState(data.workflows[0] ? data.workflows[0].id : '');
  const [srcId, setSrcId] = useState(data.projects[0] ? data.projects[0].id : '');
  const [startDate, setStartDate] = useState(todayStr());
  const [dueDate, setDueDate] = useState('');
  const wf = data.workflows.find(w => w.id === wfId);
  const itemNames = itemsText.split('\n').map(s => s.trim()).filter(Boolean);
  const perItemCount = wf ? wf.documents.filter(d => !shared.includes(d.id)).length : 0;
  const src = data.projects.find(p => p.id === srcId);
  // Duplicate: an exact copy of the project — its copy of the workflow, people,
  // notes, dates and all progress (statuses, rounds, tasks, step history) —
  // except its file links. Its activity log starts fresh.
  const duplicate = () => {
    if (!name.trim() || !src) return;
    const id = uid();
    const copy = JSON.parse(JSON.stringify({
      workflowId: src.workflowId, workflowName: src.workflowName, sourceHash: src.sourceHash || null,
      ...(src.batch ? { batch: true, template: src.template, items: src.items, sharedDocIds: src.sharedDocIds } : { documents: src.allDocs }), hiddenDocs: src.hiddenDocs,
      syncGroupMeta: src.syncGroupMeta, roleAssignments: src.roleAssignments,
      progress: src.progress, notes: src.notes || '', syncedAt: src.syncedAt || src.createdAt || Date.now(),
    }));
    dbSet('projects/' + id, {
      ...copy, name: name.trim(), startDate, dueDate, archived: false,
      createdAt: Date.now(), createdBy: authUser.email || '', updatedAt: Date.now(),
    }).then(() => { logActivity(id, authUser, 'Duplicated from "' + src.name + '"', { kind: 'created' }); onCreated(id); });
  };
  const pickSource = (id) => {
    setSrcId(id);
    const s = data.projects.find(p => p.id === id);
    if (s) { setStartDate(s.startDate || todayStr()); setDueDate(s.dueDate || ''); if (!name.trim() || name.startsWith('Copy of ')) setName('Copy of ' + s.name); }
  };
  const create = () => {
    if (mode === 'duplicate') return duplicate();
    if (!name.trim() || !wf) return;
    const id = uid();
    const docs = snapshotDocs(wf);
    const usedGroups = new Set();
    docs.forEach(d => d.steps.forEach(s => s.syncGroupId && usedGroups.add(s.syncGroupId)));
    const syncGroupMeta = {};
    usedGroups.forEach(g => { if (data.syncGroupMeta[g]) syncGroupMeta[g] = data.syncGroupMeta[g]; });
    const shape = batch
      ? { batch: true, template: docs, items: itemNames.map(n => ({ id: uid(), name: n })), sharedDocIds: shared.filter(sid => docs.some(d => d.id === sid)) }
      : { documents: docs };
    dbSet('projects/' + id, {
      name: name.trim(), workflowId: wf.id, workflowName: wf.name || '', sourceHash: docsHash(docs),
      ...shape, syncGroupMeta, startDate, dueDate, notes: '', archived: false,
      createdAt: Date.now(), createdBy: authUser.email || '', updatedAt: Date.now(), syncedAt: Date.now(),
    }).then(() => { logActivity(id, authUser, 'Created from the "' + (wf.name || '') + '" workflow', { kind: 'created' }); onCreated(id); });
  };
  return (
    <Modal title="New project" onClose={onClose} footer={<>
      <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      <Btn disabled={!name.trim() || (mode === 'duplicate' ? !src : (!wf || (batch && !itemNames.length)))} onClick={create} >{mode === 'duplicate' ? 'Duplicate project' : 'Create project'}</Btn>
    </>}>
      <div className="flex items-center bg-slate-100 rounded-lg p-0.5 mb-4 w-max" data-testid="new-mode">
        {[['workflow', 'From a workflow'], ['duplicate', 'Duplicate a project']].map(([id, label]) => (
          <button key={id} onClick={() => { setMode(id); if (id === 'duplicate' && srcId) pickSource(srcId); }} disabled={id === 'duplicate' && !data.projects.length}
            className={`text-xs font-medium px-3 py-1.5 rounded-md ${mode === id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'} disabled:opacity-40`}>{label}</button>
        ))}
      </div>
      {mode === 'duplicate' && <>
        <Field label="Project to duplicate" hint="Copies its progress, people, notes and dates — everything except file links.">
          <select className={inputCls} value={srcId} onChange={e => pickSource(e.target.value)} data-testid="dup-source">
            {data.projects.map(p => <option key={p.id} value={p.id}>{p.name}{p.archived ? ' (archived)' : ''}</option>)}
          </select>
        </Field>
      </>}
      <Field label="Project name" hint="e.g. the program or course it is for.">
        <input autoFocus className={inputCls} value={name} onChange={e => setName(e.target.value)} placeholder="Certificate in …" />
      </Field>
      {mode === 'workflow' && <>
      <Field label="Workflow" hint="The project copies this workflow's documents and steps from the Workflow Map.">
        <select className={inputCls} value={wfId} onChange={e => setWfId(e.target.value)}>
          {data.workflows.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
        </select>
      </Field>
      {wf && <div className="text-xs text-slate-500 -mt-2 mb-4">
        {wf.documents.map(d => (d.name || 'Document') + ' (' + (d.steps || []).length + ' steps)').join(' · ') || 'This workflow has no documents yet.'}
      </div>}
      <label className="flex items-start gap-2 text-sm text-slate-700 mb-3" data-testid="batch-toggle">
        <input type="checkbox" className="mt-1" checked={batch} onChange={e => setBatch(e.target.checked)} />
        <span><span className="font-semibold">Batch of several initiatives</span><span className="block text-xs text-slate-500">Track several initiatives — e.g. new courses — through this workflow together, in one project.</span></span>
      </label>
      {batch && wf && <div className="border rounded-lg p-3 mb-4 bg-slate-50" data-testid="batch-setup">
        <Field label="Initiatives" hint="One per line, e.g. course codes.">
          <textarea rows={4} className={textareaCls} value={itemsText} onChange={e => setItemsText(e.target.value)} placeholder={'CPSC 1010\nCPSC 1020'} data-testid="batch-items" />
        </Field>
        <div className="text-sm font-semibold text-slate-700 mb-1">Documents</div>
        <p className="text-xs text-slate-500 mb-2">Each document is repeated for every initiative, unless it is shared — one copy covering the whole batch.</p>
        <div className="space-y-1">
          {wf.documents.map(d => {
            const on = shared.includes(d.id);
            return (
              <div key={d.id} className="flex items-center gap-2 text-sm">
                <span className="w-2.5 h-2.5 rounded-full" style={{ background: d.color }} />
                <span className="flex-1 truncate">{d.name}</span>
                <div className="flex items-center bg-white border border-slate-200 rounded-md p-0.5 text-[11px]">
                  {[[false, 'Per initiative'], [true, 'Shared']].map(([v, label]) => (
                    <button key={label} onClick={() => setShared(v ? [...shared, d.id] : shared.filter(x => x !== d.id))}
                      className={`px-2 py-0.5 rounded ${on === v ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}>{label}</button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
        {perItemCount > 3 && <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mt-2" data-testid="batch-warn">
          {perItemCount} documents per initiative — with {itemNames.length || 'several'} initiatives that is {perItemCount * Math.max(1, itemNames.length)} rows to track. Batches work best with 3 or fewer per initiative; consider marking some as shared or making separate projects.
        </p>}
      </div>}
      </>}
      <div className="grid grid-cols-2 gap-3">
        <Field label="Start date"><input type="date" className={inputCls} value={startDate} onChange={e => setStartDate(e.target.value)} /></Field>
        <Field label="Target completion"><input type="date" className={inputCls} value={dueDate} onChange={e => setDueDate(e.target.value)} /></Field>
      </div>
    </Modal>
  );
}

// ── Project settings (details, roles, workflow version, archive) ───────────────
// A confirmation box with a button, in place of the browser's confirm/prompt.
function ConfirmModal({ title, message, confirmLabel, danger, onConfirm, onClose }) {
  return (
    <Modal title={title} onClose={onClose} footer={<>
      <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      <Btn variant={danger ? 'danger' : 'primary'} onClick={() => { onConfirm(); onClose(); }}>{confirmLabel}</Btn>
    </>}>
      <div className="text-sm text-slate-700 whitespace-pre-line" data-testid="confirm-message">{message}</div>
    </Modal>
  );
}

// Items in a batch: rename, add, remove, or split one off into its own
// project. Writes immediately. Removing an item hides it; its progress stays
// in the database under its document ids.
function BatchItems({ project, authUser, onSplit }) {
  const [newName, setNewName] = useState('');
  const [ask, setAsk] = useState(null);
  const base = 'projects/' + project.id;
  const write = (items, text) => { dbUpdate(base, { items, updatedAt: Date.now() }); logActivity(project.id, authUser, text, { kind: 'project' }); };
  const rename = (it, name) => { if (name.trim() && name.trim() !== it.name) write(project.items.map(x => x.id === it.id ? { ...x, name: name.trim() } : x), 'Renamed initiative "' + it.name + '" to "' + name.trim() + '"'); };
  const add = () => { if (!newName.trim()) return; write([...project.items, { id: uid(), name: newName.trim() }], 'Added initiative "' + newName.trim() + '"'); setNewName(''); };
  const remove = (it) => setAsk({ title: 'Remove ' + it.name + '?', message: '"' + it.name + '" will no longer show in this batch. Its progress is kept on record, but there is no button to bring it back.', confirmLabel: 'Remove initiative', danger: true,
    onConfirm: () => write(project.items.filter(x => x.id !== it.id), 'Removed initiative "' + it.name + '"') });
  // Split off: a new batch project holding just this item (and copies of the
  // shared documents), with its progress, people, notes and dates.
  const split = (it) => setAsk({ title: 'Split off ' + it.name + '?', message: '"' + it.name + '" becomes its own project, keeping its progress. Shared documents are copied with their progress. It leaves this batch.', confirmLabel: 'Split off',
    onConfirm: () => {
      const id = uid();
      const prog = {};
      Object.entries(project.progress).forEach(([k, v]) => { if (k.endsWith(ITEM_SEP + it.id) || project.sharedDocIds.includes(k)) prog[k] = v; });
      dbSet('projects/' + id, JSON.parse(JSON.stringify({
        name: project.name + ' — ' + it.name, workflowId: project.workflowId, workflowName: project.workflowName, sourceHash: project.sourceHash || null,
        batch: true, template: project.template, items: [it], sharedDocIds: project.sharedDocIds, syncGroupMeta: project.syncGroupMeta,
        roleAssignments: project.roleAssignments, notes: project.notes || '', progress: prog, startDate: project.startDate, dueDate: project.dueDate,
        archived: false, syncedAt: project.syncedAt || project.createdAt || Date.now(), createdAt: Date.now(), createdBy: (authUser && authUser.email) || '', updatedAt: Date.now(),
      }))).then(() => {
        logActivity(id, authUser, 'Split off from "' + project.name + '"', { kind: 'created' });
        write(project.items.filter(x => x.id !== it.id), 'Split "' + it.name + '" off into its own project');
        onSplit(id);
      });
    } });
  return (
    <Field label="Initiatives in this batch" hint="Changes save immediately.">
      <div className="border rounded-lg divide-y" data-testid="batch-items-edit">
        {project.items.map(it => (
          <div key={it.id} className="flex items-center gap-2 px-2.5 py-1.5">
            <input className="flex-1 border border-transparent hover:border-slate-200 focus:border-slate-300 rounded px-1.5 py-0.5 text-sm" defaultValue={it.name} onBlur={e => rename(it, e.target.value)} />
            <Btn sm variant="ghost" onClick={() => split(it)} title="Make this initiative its own project"><Icon name="copy" size={12} />Split off</Btn>
            <Btn sm variant="ghost" onClick={() => remove(it)} title="Remove from the batch"><Icon name="trash" size={12} /></Btn>
          </div>
        ))}
        <div className="flex items-center gap-2 px-2.5 py-1.5 bg-slate-50">
          <input className="flex-1 border border-slate-300 rounded px-2 py-1 text-sm bg-white" placeholder="Add an initiative…" value={newName} onChange={e => setNewName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') add(); }} data-testid="batch-add" />
          <Btn sm onClick={add} disabled={!newName.trim()}><Icon name="plus" size={12} />Add</Btn>
        </div>
      </div>
      {ask && <ConfirmModal {...ask} onClose={() => setAsk(null)} />}
    </Field>
  );
}

function ProjectSettingsModal({ project, data, authUser, onDeleted, onClose, onOpenProject }) {
  const [confirmDel, setConfirmDel] = useState(false);
  const [form, setForm] = useState({ name: project.name, startDate: project.startDate, dueDate: project.dueDate, notes: project.notes });
  const [roles, setRoles] = useState(() => {
    const r = {};
    data.roles.forEach(role => { r[role.id] = project.roleAssignments[role.id] ? roleHolders(project, data.people, role.id) : null; });
    return r;
  });
  const base = 'projects/' + project.id;
  const save = () => {
    // An empty override is stored as 'none' — Firebase drops empty arrays, and
    // "nobody on this project" has to stay different from "use the default".
    const ra = {};
    Object.entries(roles).forEach(([k, v]) => { if (v) ra[k] = v.length ? v : 'none'; });
    dbUpdate(base, { ...form, roleAssignments: Object.keys(ra).length ? ra : null, updatedAt: Date.now() });
    logActivity(project.id, authUser, 'Edited project details', { kind: 'project' });
    onClose();
  };
  const toggleArchive = () => { setArchived([project], !project.archived, authUser); onClose(); };
  const del = () => setConfirmDel(true);
  return (
    <Modal title="Project settings" wide onClose={onClose} footer={<>
      <Btn variant="danger" onClick={del}><Icon name="trash" size={13} />Delete</Btn>
      <Btn variant="secondary" onClick={toggleArchive} className="mr-auto"><Icon name="archive" size={13} />{project.archived ? 'Restore' : 'Archive'}</Btn>
      <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      <Btn onClick={save}>Save</Btn>
    </>}>
      <Field label="Name"><input className={inputCls} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Start date"><input type="date" className={inputCls} value={form.startDate} onChange={e => setForm({ ...form, startDate: e.target.value })} /></Field>
        <Field label="Target completion"><input type="date" className={inputCls} value={form.dueDate} onChange={e => setForm({ ...form, dueDate: e.target.value })} /></Field>
      </div>
      <Field label="Project notes" hint="Shared with everyone."><textarea rows={3} className={textareaCls} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} /></Field>
      {project.batch && <BatchItems project={project} authUser={authUser} onSplit={id => { onClose(); onOpenProject && onOpenProject(id); }} />}
      {confirmDel && <ConfirmModal title={'Delete ' + project.name + '?'} danger confirmLabel="Delete project"
        message={'This deletes the project and all its progress, notes and history. You will have 5 seconds to undo.\n\nTo keep it on record instead, use Archive.'}
        onConfirm={() => deleteProjects([project], authUser).then(onDeleted)} onClose={() => setConfirmDel(false)} />}
      <Field label="Who fills each role on this project" hint="Uses the defaults from People unless you override a role here.">
        <div className="space-y-2">
          {data.roles.map(role => {
            const ov = roles[role.id];
            const defaults = data.people.filter(p => p.roleIds.includes(role.id));
            return (
              <div key={role.id} className="border rounded-lg p-2.5">
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="text-sm font-semibold text-slate-700">{role.label}</span>
                  <label className="ml-auto text-xs text-slate-500 inline-flex items-center gap-1.5">
                    <input type="checkbox" checked={!!ov} onChange={() => setRoles({ ...roles, [role.id]: ov ? null : defaults.map(p => p.id) })} />
                    Override for this project
                  </label>
                </div>
                {ov
                  ? <PeoplePicker people={data.people} value={ov} onChange={v => setRoles({ ...roles, [role.id]: v })} />
                  : <div className="text-xs text-slate-500">{defaults.length ? 'Default: ' + defaults.map(p => p.name).join(', ') : 'No default person'}</div>}
              </div>
            );
          })}
        </div>
      </Field>
    </Modal>
  );
}

// ── Update to latest workflow ─────────────────────────────────────────────────
function workflowDrift(project, data) {
  const wf = data.workflows.find(w => w.id === project.workflowId);
  if (!wf) return { missing: true };
  const latest = snapshotDocs(wf);
  if (docsHash(latest) === project.sourceHash) return null;
  const newIds = new Set();
  (project.batch ? expandBatch(latest, project.items, project.sharedDocIds) : latest).forEach(d => d.steps.forEach(s => newIds.add(d.id + '/' + s.id)));
  const lost = [];
  project.documents.forEach(d => d.steps.forEach(s => {
    const c = cellOf(project, d.id, s.id);
    if (!newIds.has(d.id + '/' + s.id) && (c.status !== 'pending' || c.notes || Object.keys(c.history).length)) lost.push(d.name + ' — ' + s.stageName);
  }));
  return { wf, latest, lost };
}
function applyWorkflowUpdate(project, data, drift, authUser) {
  const msg = drift.lost.length
    ? 'These steps have progress but are no longer in the workflow. Their records are kept but will not show:\n\n  ' + drift.lost.join('\n  ') + '\n\nUpdate anyway?'
    : 'Update this project to the current version of "' + drift.wf.name + '"? Progress on steps that still exist is kept.';
  if (!confirm(msg)) return;
  const syncGroupMeta = { ...project.syncGroupMeta };
  drift.latest.forEach(d => d.steps.forEach(s => { if (s.syncGroupId && data.syncGroupMeta[s.syncGroupId]) syncGroupMeta[s.syncGroupId] = data.syncGroupMeta[s.syncGroupId]; }));
  dbUpdate('projects/' + project.id, { [project.batch ? 'template' : 'documents']: drift.latest, sourceHash: docsHash(drift.latest), syncGroupMeta, workflowName: drift.wf.name || '', updatedAt: Date.now(), syncedAt: Date.now() });
  logActivity(project.id, authUser, 'Updated to the latest version of the workflow', { kind: 'project' });
}

// The held-up reason, editable in place (picking Held up again is a no-op, so
// this is the only way to change it). Multi-line; saved when you click away.
function HeldReason({ project, doc, step, cell, authUser }) {
  const [val, setVal] = useState(cell.heldReason);
  useEffect(() => { setVal(cell.heldReason); }, [cell.heldReason]);
  const save = () => {
    if (val === cell.heldReason) return;
    dbUpdate(cellPath(project.id, doc.id, step.id), { heldReason: val });
    logActivity(project.id, authUser, doc.name + ' · ' + step.stageName + ': held-up reason edited', { kind: 'notes', docId: doc.id, step: step.stageName });
  };
  return (
    <div className="mt-2" data-testid="held-reason">
      <div className="text-xs font-semibold text-amber-800 mb-1">Held up because</div>
      <textarea rows={Math.min(6, Math.max(2, (val || '').split('\n').length))} value={val} onChange={e => setVal(e.target.value)} onBlur={save}
        className="w-full text-sm text-amber-900 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 resize-y focus:border-amber-400" />
    </div>
  );
}

  const [allAtMeeting, setAllAtMeeting] = useState(false);
  const path = cellPath(project.id, doc.id, step.id);

  const stepIdx = doc.steps.findIndex(s => s.id === step.id);

  // Other documents' steps that are the same meeting (same sync group).
  const siblings = step.syncGroupId ? project.documents.flatMap(d => d.id === doc.id ? [] :
    d.steps.filter(s => s.syncGroupId === step.syncGroupId).map(s => ({ doc: d, step: s }))) : [];
  const meetingName = step.syncGroupId && project.syncGroupMeta[step.syncGroupId] ? project.syncGroupMeta[step.syncGroupId].name : '';
  // In a batch, the same step of the same document in every other item.

  const [allTasks, setAllTasks] = useState(false);
  const itemSiblings = doc.itemId ? project.documents.filter(d => d.srcDocId === doc.srcDocId && d.id !== doc.id)

  const targets = (() => {
    const out = [{ doc, step }];
    if (allAtMeeting) siblings.forEach(x => out.push(x));

    list.forEach(x => {

      if (cell.meetingDate && c.meetingDate !== cell.meetingDate) dbUpdate(cellPath(project.id, x.doc.id, x.step.id), { meetingDate: cell.meetingDate });

  // Tasks: ticking copies this step's task statuses to every initiative.

    itemSiblings.forEach(x => {
      const c = cellOf(project, x.doc.id, x.step.id);

            <span className="text-sm font-semibold text-slate-700">{'Tasks · ' + checkCount(step, cell).done + ' of ' + step.actions.length}</span>
            {itemSiblings.length > 0 && (

            {step.actions.map((a, i) => <TaskRow key={i} project={project} doc={doc} step={step} cell={cell} i={i} data={data} authUser={authUser} also={allTasks ? itemSiblings : null} />)}

<StepPeople project={project} doc={doc} step={step} cell={cell} data={data} authUser={authUser} path={path} />

        </ul>
      </div>

      {ask && <ReasonModal {...ask} onClose={() => setAsk(null)} onConfirm={r => { ask.run(r); setAsk(null); }} />}
    </Modal>
  );

// ── Activity ───────────────────────────────────────────────────────────────────
// ── Changes drawer: project activity and what changed in the workflow ─────────
// What differs between the project's copy of the workflow and the map's
// current version, as readable lines. This is what "the workflow has changed"
// means, spelled out, so nobody has to guess what triggered it.
// [field, label, substantial]. Substantial changes affect what the project
// tracks (steps, tasks, people, meetings) and raise the "Workflow changed"
// pill; the rest are wording and reference details, listed but not flagged.
const DIFF_FIELDS = [
  ['actions', 'tasks', true], ['roleIds', 'roles', true], ['syncGroupId', 'meeting group', true],
  ['informationOnly', 'information only', true],
  ['notes', 'notes', false], ['storageLocation', 'storage location', false], ['storageUrl', 'storage link', false],
  ['fileOperation', 'file handling', false], ['triggerType', 'trigger', false], ['triggerLabel', 'trigger', false],
];
// Compare values the way a person would: empty string, null, false and an
// empty list all mean "not set", and the order of a step's roles is not a
// change (toggling a role off and on again reorders the list).
const diffNorm = (k, v) => {
  if (v === null || v === undefined || v === false || v === '') return '';
  if (Array.isArray(v)) { if (!v.length) return ''; return stableStringify(k === 'roleIds' ? [...v].sort() : v); }
  return stableStringify(v);
};
function workflowDiff(oldDocs, newDocs) {
  const out = [];
  const oldById = new Map(oldDocs.map(d => [d.id, d]));
  const newById = new Map(newDocs.map(d => [d.id, d]));
  newDocs.forEach(d => { if (!oldById.has(d.id)) out.push({ kind: 'add', major: true, text: 'New document: ' + d.name }); });
  oldDocs.forEach(d => { if (!newById.has(d.id)) out.push({ kind: 'remove', major: true, text: 'Document removed: ' + d.name }); });
  newDocs.forEach(nd => {
    const od = oldById.get(nd.id);
    if (!od) return;
    if (od.name !== nd.name) out.push({ kind: 'edit', major: true, text: 'Document renamed: ' + od.name + ' → ' + nd.name });
    const os = new Map(od.steps.map((s, i) => [s.id, { s, i }]));
    const ns = new Map(nd.steps.map((s, i) => [s.id, { s, i }]));
    nd.steps.forEach(s => { if (!os.has(s.id)) out.push({ kind: 'add', major: true, doc: nd, text: 'New step: ' + s.stageName }); });
    od.steps.forEach(s => { if (!ns.has(s.id)) out.push({ kind: 'remove', major: true, doc: nd, text: 'Step removed: ' + s.stageName }); });
    let moved = false;
    nd.steps.forEach((s, i) => {
      const o = os.get(s.id);
      if (!o) return;
      if (o.i !== i) moved = true;
      if (o.s.stageName !== s.stageName) out.push({ kind: 'edit', major: true, doc: nd, text: 'Step renamed: ' + o.s.stageName + ' → ' + s.stageName });
      const changed = DIFF_FIELDS.filter(([k]) => diffNorm(k, o.s[k]) !== diffNorm(k, s[k]));
      const major = [...new Set(changed.filter(f => f[2]).map(f => f[1]))];
      const minor = [...new Set(changed.filter(f => !f[2]).map(f => f[1]))];
      if (major.length) out.push({ kind: 'edit', major: true, doc: nd, text: s.stageName + ': changed ' + major.join(', ') });
      if (minor.length) out.push({ kind: 'edit', major: false, doc: nd, text: s.stageName + ': changed ' + minor.join(', ') });
    });
    if (moved) out.push({ kind: 'edit', major: true, doc: nd, text: 'Steps reordered' });
  });
  return out;
}

// What the project's copy is missing: { drift, diff, major } or null when the
// copy is current. The pill only shows when something substantial changed.
function driftSummary(project, data) {
  const drift = workflowDrift(project, data);
  if (!drift || drift.missing) return drift ? { drift, diff: [], major: false } : null;
  const diff = workflowDiff(templateOf(project), drift.latest);
  return { drift, diff, major: diff.some(d => d.major) };
}

function Drawer({ title, onClose, children, testid }) {
  return ReactDOM.createPortal(
    <div className="fixed inset-0" style={{ zIndex: 99990 }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <aside className="drawer absolute top-0 right-0 bottom-0 w-full max-w-[420px] bg-white border-l border-slate-200 shadow-2xl flex flex-col" data-testid={testid}>
        <div className="flex items-center justify-between px-4 border-b border-slate-200 shrink-0" style={{ height: CHROME_BAR_H }}>
          <h2 className="font-bold text-slate-800 text-sm">{title}</h2>
          <button onClick={onClose} aria-label="Close" className="text-slate-400 hover:text-slate-700"><Icon name="x" size={18} /></button>
        </div>
        {children}
      </aside>
    </div>, document.body);
}

function ChangesDrawer({ project, data, authUser, tab, onTab, onClose }) {
  const items = Object.values(project.activity).map(a => activityKind(a, project)).sort((a, b) => (b.at || 0) - (a.at || 0));
  const sum = driftSummary(project, data);
  const drift = sum && sum.drift;
  const diff = sum ? sum.diff : [];
  const DIFF_STYLE = { add: ['plus', '#059669'], remove: ['x', '#dc2626'], edit: ['edit', '#0284c7'] };
  return (
    <Drawer title="Changes" onClose={onClose} testid="changes-drawer">
      <div className="flex gap-1 px-4 py-2 border-b border-slate-200 shrink-0">
        {[['activity', 'Project activity'], ['workflow', 'Workflow update' + (diff.filter(d => d.major).length ? ' · ' + diff.filter(d => d.major).length : '')]].map(([id, label]) => (
          <button key={id} onClick={() => onTab(id)} data-tab={id}
            className={`text-xs font-medium px-3 py-1.5 rounded-md ${tab === id ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:bg-slate-100'}`}>{label}</button>
        ))}
      </div>
      <div className="flex-1 overflow-y-auto px-4 py-3">
        {tab === 'activity' && <>
          {!items.length && <p className="text-sm text-slate-400">No activity yet.</p>}
          <ul className="space-y-2.5">
            {items.map((it, i) => {
              const ks = KIND_STYLE[it.kind] || KIND_STYLE.project;
              const st = it.kind === 'status' && it.status ? STATUS[it.status] : null;
              const color = st ? st.color : ks.color;
              return (
                <li key={i} className="flex items-start gap-2.5 text-xs">
                  <span className="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: color + '1a', color }}><Icon name={st ? st.icon : ks.icon} size={12} /></span>
                  <span className="min-w-0 flex-1">
                    <span className="text-slate-700">{it.short}</span>
                    <span className="flex items-center gap-1 mt-0.5 text-[10px] text-slate-400">
                      {it.doc && <><span className="w-1.5 h-1.5 rounded-full" style={{ background: it.doc.color }} />{it.doc.name} ·</>}
                      {shortWho(it.by)} · {fmtStamp(it.at)}
                    </span>
                  </span>
                </li>
              );
            })}
          </ul>
        </>}
        {tab === 'workflow' && <>
          {drift && drift.missing && <p className="text-sm text-slate-500 mb-3">The workflow this project was created from no longer exists in the Workflow Map.</p>}
          {!drift && <p className="text-sm text-slate-500 mb-3">This project matches the current "{project.workflowName}" workflow.</p>}
          {drift && !drift.missing && <div className="mb-5">
            <SectionLabel>Not yet in this project</SectionLabel>
            {(() => {
              // Substantial changes are listed one by one. Minor ones (notes,
              // storage, trigger wording) are summed into a single line — on
              // real data they can run to dozens and bury what matters.
              const major = diff.filter(d => d.major);
              const minor = diff.filter(d => !d.major);
              const minorWhat = [...new Set(minor.flatMap(d => (d.text.split(': changed ')[1] || '').split(', ')).filter(Boolean))];
              return <>
                {!major.length && <p className="text-xs text-slate-500 mb-2">Nothing that affects tracking has changed.</p>}
                {major.length > 0 && <ul className="space-y-1.5 mb-2" data-testid="workflow-diff">
                  {major.map((d, i) => {
                    const [icon, color] = DIFF_STYLE[d.kind];
                    return (
                      <li key={i} className="flex items-start gap-2 text-xs text-slate-800">
                        <span className="mt-0.5" style={{ color }}><Icon name={icon} size={12} /></span>
                        <span>{d.doc && <span className="inline-flex items-center gap-1 text-slate-500 mr-1"><span className="w-1.5 h-1.5 rounded-full" style={{ background: d.doc.color }} />{d.doc.name}:</span>}{d.text}</span>
                      </li>
                    );
                  })}
                </ul>}
                {minor.length > 0 && <p className="text-xs text-slate-400 mb-3" data-testid="minor-summary">
                  {major.length ? 'Also minor' : 'Only minor'} detail changes on {minor.length} {minor.length === 1 ? 'step' : 'steps'} ({minorWhat.join(', ')}).
                </p>}
                <Btn sm variant={sum.major ? 'primary' : 'secondary'} onClick={() => applyWorkflowUpdate(project, data, drift, authUser)}><Icon name="sync" size={13} />{diff.length ? 'Update to latest workflow' : 'Mark as up to date'}</Btn>
                <p className="text-[11px] text-slate-400 mt-1.5">Progress on steps that still exist is kept. The full edit history is on the Workflow Map, under History.</p>
              </>;
            })()}
          </div>}

        </>}
      </div>
    </Drawer>
  );
}

// ── Project view: one track per document ───────────────────────────────────────
function TrackNode({ project, doc, step, people, onOpen }) {
  const c = cellOf(project, doc.id, step.id);
  const s = STATUS[c.status];
  const due = !isClosed(c.status) ? dueLabel(c.dueDate) : null;
  const ppl = stepPeople(project, people, step, c).map(id => personById(people, id)).filter(Boolean);
  return (
    <button onClick={onOpen} className={`trk-node w-full text-left bg-white rounded-lg border-2 px-2.5 py-2 hover:shadow-md transition-shadow ${step.informationOnly ? 'border-dashed' : ''} ${c.status === 'skipped' ? 'st-skipped opacity-70' : ''}`}
      style={{ borderColor: s.color }} data-status={c.status}>
      <div className="flex items-center gap-1.5 mb-1">
        <span style={{ color: s.color }}><Icon name={s.icon} size={14} /></span>
        <span className="text-xs font-semibold text-slate-800 truncate flex-1">{step.stageName}</span>
        {c.round > 1 && <span className="text-[10px] font-semibold text-violet-700 bg-violet-50 border border-violet-200 rounded px-1">R{c.round}</span>}
      </div>
      <div className="flex items-center gap-1 flex-wrap">
        <StatusChip status={c.status} sm />
        {due && <span className={`text-[10px] border rounded-full px-1.5 ${TONE[due.tone]}`}>{due.text}</span>}
        {c.meetingDate && <span className="text-[10px] text-slate-500 inline-flex items-center gap-0.5"><Icon name="calendar" size={10} />{fmtDate(c.meetingDate)}</span>}
        {c.notes && <span className="text-slate-400" title="Has notes"><Icon name="notes" size={11} /></span>}
      </div>
      {ppl.length > 0 && <div className="flex -space-x-1 mt-1.5">{ppl.slice(0, 4).map(p => <Avatar key={p.id} person={p} size={18} />)}{ppl.length > 4 && <span className="text-[10px] text-slate-500 pl-2">+{ppl.length - 4}</span>}</div>}
    </button>
  );
}

function FlowGrid({ project, data, spine, onOpen }) {
  return (
    <div className="bg-white border rounded-xl overflow-auto">
            <div className="trk-grid" style={{ gridTemplateColumns: '190px repeat(' + spine.length + ', minmax(160px, 1fr))' }}>
              <div className="sticky left-0 z-10 bg-slate-50 border-b border-r px-3 py-2 text-[10px] font-semibold uppercase tracking-wider text-slate-400">Document</div>
              {spine.map(n => <div key={n.key} className="bg-slate-50 border-b px-2 py-2 text-xs font-semibold text-slate-600 truncate" title={n.label}>{n.label}</div>)}
              {project.documents.map(doc => {
                const byKey = new Map();
                doc.steps.forEach(s => { const k = stepKey(s.stageName); if (k && !byKey.has(k)) byKey.set(k, s); });
                const idx = spine.map(n => byKey.has(n.key));
                const first = idx.indexOf(true), last = idx.lastIndexOf(true);
                const cur = currentIndex(project, doc);
                const docDone = cur < 0 && doc.steps.length > 0;
                return (
                  <React.Fragment key={doc.id}>
                    <div className="sticky left-0 z-10 bg-white border-b border-r px-3 py-2 flex flex-col justify-center" style={{ '--doc': doc.color }}>
                      <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: doc.color }} /><span className="text-sm font-semibold text-slate-800 truncate">{doc.name}</span></div>
                      <div className="text-[11px] text-slate-500 mt-0.5 pl-4">{docDone ? 'Complete' : cur >= 0 ? 'At: ' + doc.steps[cur].stageName : 'No steps'}</div>
                    </div>
                    {spine.map((n, i) => {
                      const s = byKey.get(n.key);
                      const inside = i >= first && i <= last;
                      const lineCls = !inside ? '' : s ? 'solid' + (i === first ? ' half-r' : '') + (i === last ? ' half-l' : '') : 'bypass';
                      return (
                        <div key={n.key} className="trk-cell border-b" style={{ '--doc': doc.color }}>
                          {inside && !(i === first && i === last) && <div className={'trk-line ' + lineCls} />}
                          {s && <TrackNode project={project} doc={doc} step={s} people={data.people} onOpen={() => onOpen(doc.id, s.id)} />}
                        </div>
                      );
                    })}
                  </React.Fragment>
                );
              })}
            </div>
    </div>
  );
}

// ── Overview: one row per document, a sliding track of its steps ───────────────
// The at-a-glance view. Each document's steps sit on one horizontal track:
// done steps narrow and faded to the left, the current step wide in the
// middle, upcoming steps narrow to the right. The track scrolls itself to the
// current step (smoothly, when a step closes, so it slides along) and can be
// dragged or swiped to look back or ahead.
const VIEW_KEY = 'cs_tracker_project_view_v1';

const timeAgo = (ms) => {
  if (!ms) return '';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 7 * 86400) return Math.floor(s / 86400) + 'd ago';
  return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
};
const shortWho = (email) => (email || '').split('@')[0];

// The newest history entry on a step, as a sentence.
function latestUpdate(cell) {
  const h = Object.values(cell.history).sort((a, b) => (b.at || 0) - (a.at || 0))[0];
  if (!h) return null;
  const what = h.type === 'sent_back' ? (h.to === 'pending' ? 'Reset by a send-back from ' + h.from : 'Sent back from ' + h.from)
    : h.type === 'skipped' ? 'Skipped' : 'Marked ' + ((STATUS[h.to] || {}).label || '').toLowerCase();
  return { text: what + (h.reason ? ' — ' + h.reason : ''), by: shortWho(h.by), at: h.at };
}
function lastCompletedAt(cell) {
  return Object.values(cell.history).filter(h => h.to === 'complete').reduce((m, h) => Math.max(m, h.at || 0), 0);
}

// Segmented bar: one segment per step, filled by status, current one ringed.
function StepSegments({ project, doc, onOpen, cur, h = 10 }) {
  return (
    <div className="flex gap-[2px]" style={{ height: h }} data-testid="segments">
      {doc.steps.map((s, i) => {
        const c = cellOf(project, doc.id, s.id);
        const st = STATUS[c.status];
        const fill = c.status === 'complete' ? doc.color : c.status === 'pending' ? '#e2e8f0' : c.status === 'skipped' ? '#f1f5f9' : st.color;
        return <button key={s.id} onClick={() => onOpen(doc.id, s.id)} title={(i + 1) + '. ' + s.stageName + ' — ' + st.label}
          className={`flex-1 rounded-sm ${i === cur ? 'ring-2 ring-offset-1 ring-slate-500' : ''} ${c.status === 'skipped' ? 'border border-dashed border-slate-300' : ''}`}
          style={{ background: fill, minWidth: 6 }} />;
      })}
    </div>
  );
}

// People on a step, as a short list: who is on it automatically (from the
// step's roles and the roles its tasks name, labelled with the role), who was
// manually tagged (removable), and a Tag someone menu for everyone else.
function StepPeople({ project, doc, step, cell, data, authUser, path }) {
  const roleLabel = (id) => (data.roles.find(r => r.id === id) || {}).label || '';
  const auto = new Map();        // personId -> { roles:Set, why:[] }
  stepRoleIds(step).forEach(rid => roleHolders(project, data.people, rid).forEach(id => {
    if (!auto.has(id)) auto.set(id, { roles: new Set() });
    auto.get(id).roles.add(roleLabel(rid));
  }));
  const hand = cell.assignees.filter(id => personById(data.people, id));
  const others = data.people.filter(p => !auto.has(p.id) && !hand.includes(p.id));
  const save = (v) => {
    dbSet(path + '/assignees', v.length ? v : null);
    logActivity(project.id, authUser, doc.name + ' · ' + step.stageName + ': tagged — ' + (v.map(id => (personById(data.people, id) || {}).name).filter(Boolean).join(', ') || 'nobody'), { kind: 'people', docId: doc.id, step: step.stageName });
  };
  const row = (p, right, sub) => (
    <div key={p.id} className="flex items-center gap-2 py-1.5">
      <Avatar person={p} size={24} />
      <span className="text-sm text-slate-800">{p.name}</span>
      {sub && <span className="text-xs text-slate-500 truncate">{sub}</span>}
      <span className="ml-auto">{right}</span>
    </div>
  );
  return (
    <div className="mb-4" data-testid="step-people">
      <div className="text-sm font-semibold text-slate-700 mb-1">People on this step</div>
      <div className="border rounded-lg px-3 py-1.5">
        <SectionLabel>Automatic</SectionLabel>
        {!auto.size && <p className="text-xs text-slate-400 py-1">Nobody from this step's roles.</p>}
        <div className="divide-y divide-slate-100" data-testid="people-auto">
          {[...auto.entries()].map(([id, e]) => row(personById(data.people, id), null, [...e.roles].filter(Boolean).join(', ')))}
        </div>
        <div className="mt-2"><SectionLabel>Manually tagged</SectionLabel></div>
        {!hand.length && <p className="text-xs text-slate-400 py-1">Nobody.</p>}
        <div className="divide-y divide-slate-100" data-testid="people-hand">
          {hand.map(id => row(personById(data.people, id),
            <button onClick={() => save(hand.filter(x => x !== id))} className="text-slate-400 hover:text-red-600 p-1" title="Remove"><Icon name="x" size={13} /></button>))}
        </div>
        {others.length > 0 && (
          <select className="mt-2 mb-1 border border-slate-300 rounded-lg px-2 py-1 text-sm bg-white" value="" data-testid="people-add"
            onChange={e => { if (e.target.value) save([...hand, e.target.value]); }}>
            <option value="">+ Tag someone…</option>
            {others.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        )}
      </div>
    </div>
  );
}

// Who is on a step and why: role holders labelled with the role, plus tags.
function stepPeopleWithRoles(project, data, step, cell) {
  const out = new Map();
  stepRoleIds(step).forEach(r => {
    const label = (data.roles.find(x => x.id === r) || {}).label || '';
    roleHolders(project, data.people, r).forEach(id => { if (!out.has(id)) out.set(id, label); });
  });
  cell.assignees.forEach(id => { if (!out.has(id)) out.set(id, 'Tagged'); });
  return [...out.entries()].map(([id, role]) => ({ person: personById(data.people, id), role })).filter(x => x.person);
}
function daysOnStep(cell) {
  const started = Object.values(cell.history).filter(h => h.to === 'in_progress' || h.to === 'held_up').reduce((m, h) => Math.max(m, h.at || 0), 0);
  if (started) return Math.floor((Date.now() - started) / 86400000);
  return cell.startDate ? -daysUntil(cell.startDate) : null;
}
const taskText = (a) => (a.label + (a.person ? ' ' + a.person : '')).trim();

// Set one step's status. Completing a step completes every task on it that is
// not already complete or skipped (skipped tasks are left as they are).
function setStepStatus(project, doc, step, status, reason, authUser) {
  const p = cellPath(project.id, doc.id, step.id);
  const c = cellOf(project, doc.id, step.id);
  const upd = { status, heldReason: status === 'held_up' ? (reason || '') : null };
  if (status === 'in_progress' && !c.startDate) upd.startDate = todayStr();
  if (status === 'complete') {
    const rc = roundChecks(c);
    const who = (authUser && authUser.email) || '';
    (step.actions || []).forEach((a, i) => {
      if (!taskDone(taskStatus(rc, i))) upd['checks/r' + c.round + '/t' + i] = { at: firebase.database.ServerValue.TIMESTAMP, by: who, status: 'complete' };
    });
  }
  dbUpdate(p, upd);
  pushHistory(p, authUser, { type: status === 'skipped' ? 'skipped' : 'status', to: status, round: c.round, reason: reason || null });
  logActivity(project.id, authUser, doc.name + ' · ' + step.stageName + ': ' + STATUS[status].label + (reason ? ' — ' + reason : ''),
    { kind: 'status', status, docId: doc.id, step: step.stageName });
}

// Set one task's status. The step follows in two cases only: a held-up task
// holds the step up, and when every task is complete or skipped the step
// offers to mark itself complete.
// `autoComplete` answers the "mark the step complete?" question without
// asking (true/false); left undefined it asks. Returns the answer, so one
// question can cover a task applied to every initiative.
function setTask(project, doc, step, cell, i, status, authUser, autoComplete) {
  const p = cellPath(project.id, doc.id, step.id) + '/checks/r' + cell.round + '/t' + i;
  const a = step.actions[i];
  if (status === 'pending') dbRemove(p);
  else dbSet(p, { at: firebase.database.ServerValue.TIMESTAMP, by: (authUser && authUser.email) || '', status });
  logActivity(project.id, authUser, doc.name + ' · ' + step.stageName + ': "' + taskText(a) + '" ' + STATUS[status].label.toLowerCase(),
    { kind: 'tick', docId: doc.id, step: step.stageName });
  const next = { ...roundChecks(cell), ['t' + i]: status === 'pending' ? undefined : { status } };
  if (status === 'held_up' && cell.status !== 'held_up') {
    setStepStatus(project, doc, step, 'held_up', 'Task held up: ' + taskText(a), authUser);
  } else if (step.actions.every((x, j) => taskDone(taskStatus(next, j))) && !isClosed(cell.status)) {
    const yes = autoComplete !== undefined ? autoComplete : confirm('Every task on "' + step.stageName + '" is complete or skipped. Mark the step complete?');
    if (yes) setStepStatus(project, doc, step, 'complete', null, authUser);
    return yes;
  }
  return autoComplete;
}
// The same task on other initiatives' copies of this step.
function setTaskAll(project, doc, step, cell, i, status, authUser, also) {
  const ans = setTask(project, doc, step, cell, i, status, authUser);
  (also || []).forEach(x => {
    const c = cellOf(project, x.doc.id, x.step.id);
    if (taskStatus(roundChecks(c), i) !== status) setTask(project, x.doc, x.step, c, i, status, authUser, !!ans);
  });
}
// The checkbox: complete, or back to not started.
const toggleTask = (project, doc, step, cell, i, authUser, also) =>
  setTaskAll(project, doc, step, cell, i, taskStatus(roundChecks(cell), i) === 'complete' ? 'pending' : 'complete', authUser, also);

// One task: checkbox (complete), a ▾ menu for the other statuses, and the
// initials of whoever holds the role the task names.
const TASK_MENU = ['pending', 'in_progress', 'held_up', 'skipped', 'complete'];
function TaskRow({ project, doc, step, cell, i, data, authUser, compact, also }) {
  const [menu, setMenu] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!menu) return;
    const off = (e) => { if (ref.current && !ref.current.contains(e.target)) setMenu(false); };
    document.addEventListener('mousedown', off);
    return () => document.removeEventListener('mousedown', off);
  }, [menu]);
  const a = step.actions[i];
  const rc = roundChecks(cell);
  const st = taskStatus(rc, i);
  const entry = rc['t' + i];
  const S = STATUS[st];
  const who = taskPeople(project, data.people, a).map(id => personById(data.people, id)).filter(Boolean);
  const stop = (e) => e.stopPropagation();
  return (
    <div ref={ref} onClick={stop} className={`relative flex items-start gap-1.5 rounded ${compact ? 'text-[11px] px-0.5' : 'text-sm px-3 py-2'} hover:bg-slate-50`} data-testid="task-row" data-status={st}>
      {/* The status control sits right by the label: a checkbox while the task
          is not started or complete, otherwise the status marker in its place
          (click it to change). The ▾ beside it opens every status. */}
      <span className="flex items-center flex-shrink-0 mt-0.5">
        {st === 'pending' || st === 'complete'
          ? <input type="checkbox" className="flex-shrink-0" checked={st === 'complete'} onChange={() => toggleTask(project, doc, step, cell, i, authUser, also)} data-testid={compact ? 'card-task' : 'panel-task'} />
          : <button onClick={() => setMenu(!menu)} title={S.label + ' — change'} data-testid="task-marker" className="flex items-center justify-center" style={{ color: S.color, width: 13, height: 13 }}><Icon name={S.icon} size={compact ? 13 : 14} /></button>}
        <button onClick={() => setMenu(!menu)} className="text-slate-400 hover:text-slate-700 rounded" title="Set task status" aria-label="Set task status" data-testid="task-menu-btn">
          <Icon name="chev_d" size={compact ? 10 : 12} />
        </button>
      </span>
      {!compact && <span className="flex-shrink-0" style={{ color: ACTION_COLOR[ACTION_COLOR[a.type] ? a.type : 'custom'] }}><Icon name={ACTION_COLOR[a.type] ? a.type : 'custom'} size={14} /></span>}
      <span className={`leading-tight flex-1 min-w-0 ${st === 'complete' ? 'line-through text-slate-400' : st === 'skipped' ? 'line-through italic text-slate-400' : 'text-slate-700'}`}>
        {taskText(a)}
        {who.length > 0 && <span className="ml-1 inline-flex gap-0.5 align-middle" style={{ textDecoration: 'none' }}>{who.map(p => <Avatar key={p.id} person={p} size={compact ? 15 : 18} />)}</span>}
      </span>
      {!compact && entry && <span className="text-[11px] text-slate-400 whitespace-nowrap">{st !== 'complete' && st !== 'pending' ? S.label + ' · ' : ''}{shortWho(entry.by)} · {fmtStamp(entry.at)}</span>}
      {menu && (
        <div className="absolute left-0 top-full mt-0.5 z-30 bg-white border border-slate-200 rounded-lg shadow-lg py-1 min-w-[150px] fade-in" data-testid="task-menu">
          {TASK_MENU.map(id => (
            <button key={id} onClick={() => { setMenu(false); if (id !== st) setTaskAll(project, doc, step, cell, i, id, authUser, also); }}
              className={`w-full text-left flex items-center gap-2 px-3 py-1.5 text-xs hover:bg-slate-50 ${id === st ? 'font-semibold' : ''}`}>
              <span style={{ color: STATUS[id].color }}><Icon name={STATUS[id].icon} size={12} /></span>{id === 'pending' ? 'Not started' : STATUS[id].label}
              {id === st && <span className="ml-auto text-slate-400"><Icon name="check" size={11} /></span>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function SectionLabel({ children }) {
  return <div className="text-[9px] font-bold tracking-[.12em] text-slate-400 uppercase mb-1">{children}</div>;
}

// The current step: a header line, then three sections — status and dates,
// the checklist (tickable right here), and people with the latest activity.
function NowCard({ project, doc, idx, data, authUser, onOpen }) {
  const step = doc.steps[idx];
  const c = cellOf(project, doc.id, step.id);
  const s = STATUS[c.status];
  const due = dueLabel(c.dueDate);
  const ppl = stepPeopleWithRoles(project, data, step, c);
  const cc = checkCount(step, c);
  const rc = roundChecks(c);
  const days = daysOnStep(c);
  const hist = Object.values(c.history).sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, 2);
  const stop = (e) => e.stopPropagation();
  const MAX_TASKS = 4;
  return (
    <div onClick={() => onOpen(doc.id, step.id)} data-kind="now" role="button"
      className="w-full h-full text-left bg-white rounded-lg border-2 hover:shadow-md transition-shadow flex flex-col cursor-pointer"
      style={{ borderColor: s.color }}>

          <dl className="grid grid-cols-[auto_1fr] gap-x-2 gap-y-0.5 text-[11px]">
            <dt className="text-slate-400">Due</dt><dd>{due ? <span className={`border rounded-full px-1.5 ${TONE[due.tone]}`}>{due.text}</span> : <span className="text-slate-400">Not set</span>}</dd>
            {c.meetingDate && <><dt className="text-slate-400">Meeting</dt><dd className="text-slate-700">{fmtDate(c.meetingDate)}</dd></>}
