          <ul className="space-y-0.5">
            {/* Every task still to do is always shown. Done ones fold into one
                line once the list is long, so they never push a to-do out of view. */}
            {step.actions.map((a, i) => i).filter(i => !taskDone(taskStatus(rc, i)) || cc.n <= MAX_TASKS).map(i => (
              <li key={i}><TaskRow project={project} doc={doc} step={step} cell={c} i={i} data={data} authUser={authUser} compact /></li>
            ))}
          </ul>
          {cc.n > MAX_TASKS && cc.done > 0 && <div className="text-[10px] text-emerald-700 mt-0.5 inline-flex items-center gap-1" data-testid="done-tasks"
            title={step.actions.filter((a, i) => taskDone(taskStatus(rc, i))).map(taskText).join('\n')}>
            <Icon name="check" size={10} />{cc.done} done</div>}
        </div>
        <div className="px-3 py-2 min-w-0">
          <SectionLabel>People</SectionLabel>
          {!ppl.length && <div className="text-[11px] text-slate-400">Nobody assigned</div>}
          <ul className="space-y-0.5 mb-1.5">
            {ppl.slice(0, 3).map(({ person, role }) => (
              <li key={person.id} className="flex items-center gap-1.5 text-[11px] min-w-0">
                <Avatar person={person} size={18} /><span className="text-slate-700 truncate">{person.name}</span>
                {role && <span className="text-slate-400 truncate">· {role}</span>}
              </li>
            ))}
            {ppl.length > 3 && <li className="text-[10px] text-slate-400">+{ppl.length - 3} more</li>}
          </ul>
          {hist.length > 0 && <>
            <SectionLabel>Latest</SectionLabel>
            {hist.map((h, i) => {
              const u = latestUpdate({ history: { x: h } });
              return <div key={i} className="text-[10px] text-slate-500 truncate" title={u.text}>{u.text} · {timeAgo(u.at)}</div>;
            })}
          </>}
          {c.notes && <div className="text-[10px] text-slate-500 truncate mt-0.5 flex items-center gap-1" title={c.notes}><Icon name="notes" size={10} />{c.notes}</div>}
        </div>
      </div>
    </div>
  );
}

function SideCard({ project, doc, idx, kind, data, onOpen }) {
  const step = doc.steps[idx];
  const c = cellOf(project, doc.id, step.id);
  const s = STATUS[c.status];
  const done = c.status === 'complete' ? Object.values(c.history).filter(h => h.to === 'complete').sort((a, b) => (b.at || 0) - (a.at || 0))[0] : null;
  const due = kind === 'next' ? dueLabel(c.dueDate) : null;
  const ppl = kind === 'next' ? stepPeople(project, data.people, step, c).map(id => personById(data.people, id)).filter(Boolean) : [];
  return (
    <button onClick={() => onOpen(doc.id, step.id)} data-kind={kind} title={(idx + 1) + '. ' + step.stageName + ' — ' + s.label}
      className={`w-full h-full text-left rounded-lg px-2.5 py-1.5 flex flex-col gap-0.5 hover:shadow ${kind === 'past' ? 'bg-slate-50 border border-slate-200' : 'bg-white border border-dashed border-slate-300'}`}>
      <span className={`text-xs font-medium leading-tight line-clamp-2 ${kind === 'past' ? 'text-slate-500' : 'text-slate-700'}`}><span className="text-[10px] text-slate-400 font-semibold mr-1">{idx + 1}</span>{step.stageName}</span>
      <span className="text-[10px] inline-flex items-center gap-1" style={{ color: s.color }}>
        <Icon name={s.icon} size={11} />{c.status === 'complete' ? 'Done' : s.label}
        {c.round > 1 && <span className="font-semibold text-violet-700 ml-1">R{c.round}</span>}
      </span>
      {done && <span className="text-[10px] text-slate-400 truncate">{shortWho(done.by)} · {timeAgo(done.at)}</span>}
      {kind === 'next' && ppl.length > 0 && <span className="text-[10px] text-slate-500 truncate">{ppl.map(p => p.name.split(' ')[0]).join(', ')}</span>}
      {due && <span className={`mt-auto text-[10px] border rounded-full px-1.5 self-start ${TONE[due.tone]}`}>{due.text}</span>}
    </button>
  );
}

// Every step of a document on one row, as fixed slots: a narrow previous
// card, the current card (up to NOW_MAX wide), then upcoming cards filling the
// rest. Rows always open aligned on that layout — a Start placeholder fills a
// missing previous step — so the Now column lines up down the page. Drag or
// step with the edge buttons to look further; the Now card snaps back into
// place when dropped near it.
const SIDE_W = 180, TRACK_GAP = 6, NOW_MAX = 860;
const nowWidthFor = (w) => Math.max(320, Math.min(NOW_MAX, w - 2 * SIDE_W - 2 * TRACK_GAP));

function StepTrack({ project, doc, data, authUser, width, onOpen }) {
  const ref = useRef(null);
  const nowRef = useRef(null);
  const drag = useRef({ down: false, x: 0, left: 0, moved: false });
  const first = useRef(true);
  const [edges, setEdges] = useState({ l: false, r: false });
  const cur = currentIndex(project, doc);
  const curKey = cur >= 0 ? doc.steps[cur].id : 'done';
  const nowW = nowWidthFor(width);

  const measure = () => {
    const el = ref.current;
    if (el) setEdges({ l: el.scrollLeft > 4, r: el.scrollLeft + el.clientWidth < el.scrollWidth - 4 });
  };
  useEffect(() => {
    const el = ref.current, now = nowRef.current;
    if (!el || !now || !width) return;
    const left = Math.max(0, now.offsetLeft - SIDE_W - TRACK_GAP - el.firstChild.offsetLeft);
    if (el.scrollTo) el.scrollTo({ left, behavior: first.current ? 'auto' : 'smooth' }); else el.scrollLeft = left;
    first.current = false;
    setTimeout(measure, 350);
  }, [curKey, width]);

  // Snapping is off while dragging (it would fight the pointer) and back on at
  // release, which is when a nearly-parked Now card settles into place.
  const onDown = (e) => {
    if (e.pointerType !== 'mouse' || e.target.closest('input,label,a')) return;
    ref.current.classList.remove('snap');
    drag.current = { down: true, x: e.clientX, left: ref.current.scrollLeft, moved: false };
  };
  const onMove = (e) => {
    const d = drag.current;
    if (!d.down) return;
    const dx = e.clientX - d.x;
    if (Math.abs(dx) > 5) d.moved = true;
    if (d.moved) ref.current.scrollLeft = d.left - dx;
  };
  const onUp = () => { if (drag.current.down) ref.current.classList.add('snap'); drag.current.down = false; };
  const onClickCapture = (e) => { if (drag.current.moved) { e.stopPropagation(); e.preventDefault(); drag.current.moved = false; } };
  const nudge = (dir) => ref.current.scrollBy({ left: dir * (SIDE_W + TRACK_GAP), behavior: 'smooth' });

  const side = (key, child) => <div key={key} className="trk-side" style={{ flexBasis: SIDE_W }}>{child}</div>;
  const items = [];
  if (cur === 0) items.push(side('start', <div className="h-full rounded-lg border border-dashed border-slate-200 text-[11px] text-slate-300 flex items-center justify-center" data-kind="none">Start</div>));
  doc.steps.forEach((s, i) => {
    if (i === cur) items.push(<div key={s.id} ref={nowRef} className="trk-now" style={{ flexBasis: nowW, scrollMarginLeft: SIDE_W + TRACK_GAP }}><NowCard project={project} doc={doc} idx={i} data={data} authUser={authUser} onOpen={onOpen} /></div>);
    else items.push(side(s.id, <SideCard project={project} doc={doc} idx={i} kind={cur < 0 || i < cur ? 'past' : 'next'} data={data} onOpen={onOpen} />));
  });
  if (cur === doc.steps.length - 1) items.push(side('end', <div className="h-full rounded-lg border border-dashed border-slate-200 text-[11px] text-slate-300 flex items-center justify-center" data-kind="none">End</div>));

  return (
    <div className="relative min-w-0">
      <div ref={ref} className="trk-track snap" data-testid="track" style={{ gap: TRACK_GAP }}
        onScroll={measure} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp} onClickCapture={onClickCapture}>
        {items}
      </div>
      <div className={'trk-edge l' + (edges.l ? ' on' : '')} />
      <div className={'trk-edge r' + (edges.r ? ' on' : '')} />
      {edges.l && <button className="trk-nudge l" aria-label="Previous step" onClick={() => nudge(-1)}><Icon name="chev_l" size={15} /></button>}
      {edges.r && <button className="trk-nudge r" aria-label="Next step" onClick={() => nudge(1)}><Icon name="chev_r" size={15} /></button>}
    </div>
  );
}

// The document's file: one current link, with earlier versions kept.
function DocLinkModal({ project, doc, authUser, onClose }) {
  const cur = project.links[doc.id] || null;
  const [url, setUrl] = useState('');
  const [label, setLabel] = useState('');
  const base = 'projects/' + project.id + '/links/' + doc.id;
  const valid = /^https?:\/\//i.test(url.trim());
  const save = () => {
    if (!valid) return;
    const who = (authUser && authUser.email) || '';
    if (cur && cur.url) trkRef(base + '/history').push({ url: cur.url, label: cur.label || '', at: cur.at || null, by: cur.by || '' });
    dbUpdate(base, { url: url.trim(), label: label.trim(), at: firebase.database.ServerValue.TIMESTAMP, by: who, version: (cur && cur.version ? cur.version : 0) + 1 });
    logActivity(project.id, authUser, doc.name + ': ' + (cur ? 'updated the file link' : 'added a file link') + (label.trim() ? ' (' + label.trim() + ')' : ''), { kind: 'link', docId: doc.id });
    onClose();
  };
  const history = cur ? Object.values(cur.history || {}).sort((a, b) => (b.at || 0) - (a.at || 0)) : [];
  return (
    <Modal title={doc.name + ' · File link'} onClose={onClose} footer={<>
      <Btn variant="secondary" onClick={onClose}>Close</Btn>
      <Btn disabled={!valid} onClick={save}>{cur ? 'Save as latest version' : 'Add link'}</Btn>
    </>}>
      {cur && <div className="bg-slate-50 border rounded-lg px-3 py-2 mb-4 text-sm">
        <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-0.5">Current · v{cur.version || 1}</div>
        <a href={cur.url} target="_blank" rel="noopener" className="text-indigo-600 underline break-all">{cur.label || cur.url}</a>
        <div className="text-[11px] text-slate-500">{shortWho(cur.by)} · {fmtStamp(cur.at)}</div>
      </div>}
      <Field label={cur ? 'New version link' : 'Link'} hint="SharePoint, OneDrive or any web address.">
        <input autoFocus className={inputCls} placeholder="https://" value={url} onChange={e => setUrl(e.target.value)} />
      </Field>
      <Field label="Version note (optional)"><input className={inputCls} placeholder="e.g. after JCCS feedback" value={label} onChange={e => setLabel(e.target.value)} /></Field>
      {history.length > 0 && <div>
        <div className="text-sm font-semibold text-slate-700 mb-1">Earlier versions</div>
        <ul className="space-y-1">{history.map((h, i) => (
          <li key={i} className="text-xs text-slate-600"><a href={h.url} target="_blank" rel="noopener" className="text-indigo-600 underline break-all">{h.label || h.url}</a> <span className="text-slate-400">· {shortWho(h.by)} · {fmtStamp(h.at)}</span></li>
        ))}</ul>
      </div>}
    </Modal>
  );
}

// Hide an optional document from this project (or initiative). Progress stays.
function setDocHidden(project, docs, hidden, authUser) {
  const upd = {};
  docs.forEach(d => { upd['hiddenDocs/' + d.id] = hidden ? true : null; });
  dbUpdate('projects/' + project.id, upd);
  logActivity(project.id, authUser, (hidden ? 'Hid ' : 'Showed ') + docs.map(d => d.name).join(', '), { kind: 'project' });
}
function HideDocModal({ project, doc, authUser, onClose }) {
  const [all, setAll] = useState(false);
  const sibs = doc.itemId ? project.documents.filter(d => d.srcDocId === doc.srcDocId && d.id !== doc.id) : [];
  return (
    <Modal title={'Hide ' + doc.name + '?'} onClose={onClose} footer={<>
      <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      <Btn onClick={() => { setDocHidden(project, all ? [doc, ...sibs] : [doc], true, authUser); onClose(); }}>Hide document</Btn>
    </>}>
      <p className="text-sm text-slate-700">For optional documents this project doesn't need. It disappears from the project and the dashboard; its progress is kept, and it can be shown again from the foot of the Overview.</p>
      {sibs.length > 0 && <label className="inline-flex items-center gap-1.5 text-xs text-slate-600 mt-3 cursor-pointer" data-testid="hide-all">
        <input type="checkbox" checked={all} onChange={e => setAll(e.target.checked)} />Apply to all initiatives ({sibs.length + 1})
      </label>}
    </Modal>
  );
}

function Overview({ project, data, authUser, onOpen }) {
  const [linkFor, setLinkFor] = useState(null);
  const [hideFor, setHideFor] = useState(null);
  const [showHidden, setShowHidden] = useState(false);
  const [expanded, setExpanded] = useState({});      // finished documents opened up
  const [width, setWidth] = useState(0);
  const measureRef = useRef(null);
  useEffect(() => {
    const el = measureRef.current;
    if (!el) return;
    setWidth(el.clientWidth);
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => setWidth(el.clientWidth));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const linkDoc = linkFor && project.documents.find(d => d.id === linkFor);
  const nowW = nowWidthFor(width);

  const fileLink = (doc) => {
    const link = project.links[doc.id];
    return (
      <div className="flex items-center gap-1.5 text-[11px] min-w-0" data-testid="doc-link">
        <Icon name="storage" size={12} className="text-slate-400 flex-shrink-0" />
        {link && link.url
          ? <><a href={link.url} target="_blank" rel="noopener" className="text-indigo-600 hover:underline truncate">Open file</a>
              <span className="text-slate-400">v{link.version || 1}</span>
              <button onClick={() => setLinkFor(doc.id)} className="text-slate-400 hover:text-slate-700" title="Update link"><Icon name="edit" size={11} /></button></>
          : <button onClick={() => setLinkFor(doc.id)} className="text-slate-500 hover:text-indigo-600">Add file link</button>}
      </div>
    );
  };

  return (
    <div data-testid="overview" className="bg-white border border-slate-200 rounded-xl overflow-hidden">
      <div className="grid grid-cols-[210px_minmax(0,1fr)] bg-slate-50 border-b border-slate-200 text-[10px] font-semibold uppercase tracking-wider text-slate-400">
        <div className="px-3 py-1.5 border-r border-slate-200">Document</div>
        <div ref={measureRef} className="mx-2 py-1.5 flex" style={{ gap: TRACK_GAP }}>
          <span style={{ flex: '0 0 ' + SIDE_W + 'px' }}>Previous</span>
          <span style={{ flex: '0 0 ' + nowW + 'px' }}>Now</span>
          <span>Up next</span>
        </div>
      </div>
      {(() => {
        const docRow = (doc) => {
        const w = docWindow(project, doc);
        const done = w.cur < 0 && w.total > 0;
        const open = !done || expanded[doc.id];
        const finishedAt = done ? Math.max(0, ...doc.steps.map(s => lastCompletedAt(cellOf(project, doc.id, s.id)))) : 0;
        return (
          <div key={doc.id} className="grid grid-cols-[210px_minmax(0,1fr)] border-b border-slate-200 last:border-b-0" data-testid="ov-doc" data-done={done ? 'yes' : 'no'}>
            <div className="px-3 py-2 flex flex-col gap-1.5 min-w-0 border-r border-slate-200" style={{ boxShadow: 'inset 3px 0 0 ' + doc.color }}>
              <div className="flex items-center gap-1.5 min-w-0">
                {done && <span style={{ color: doc.color }}><Icon name="done" size={14} /></span>}
                <span className="text-sm font-bold text-slate-800 truncate">{doc.itemId ? doc.baseName : doc.name}{doc.shared && <span className="ml-1.5 text-[10px] font-semibold text-slate-500 border border-slate-300 rounded px-1 align-middle">Shared</span>}</span>
              </div>
              {!done && <div className="text-[11px] text-slate-500">Step {w.cur + 1} of {w.total} · {w.pct}%</div>}
              <button onClick={() => setHideFor(doc)} className="self-start text-[11px] text-slate-400 hover:text-slate-700 hover:underline" data-testid="hide-doc">Hide document</button>
              {open && <StepSegments project={project} doc={doc} cur={w.cur} onOpen={onOpen} />}
              {open && fileLink(doc)}
            </div>
            {open
              ? <div className="mx-2 py-2 min-w-0">
                  {done && <button onClick={() => setExpanded({ ...expanded, [doc.id]: false })} className="text-[11px] text-slate-500 hover:text-slate-800 inline-flex items-center gap-1 mb-1"><Icon name="chev_u" size={12} />Collapse</button>}
                  <StepTrack project={project} doc={doc} data={data} authUser={authUser} width={width} onOpen={onOpen} />
                </div>
              : <button onClick={() => setExpanded({ ...expanded, [doc.id]: true })} data-testid="done-row"
                  className="mx-2 my-1.5 px-3 rounded-lg border flex items-center gap-3 text-left hover:shadow-sm transition-shadow min-w-0"
                  style={{ borderColor: doc.color + '66', background: doc.color + '0f' }}>
                  <span className="text-xs font-semibold" style={{ color: doc.color }}>Complete</span>
                  <span className="text-xs text-slate-600">All {w.total} {w.total === 1 ? 'step' : 'steps'} done{finishedAt ? ' · finished ' + new Date(finishedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''}</span>
                  <span className="flex-1 max-w-[220px]"><StepSegments project={project} doc={doc} cur={-1} onOpen={() => {}} h={6} /></span>
                  <span onClick={e => e.stopPropagation()}>{fileLink(doc)}</span>
                  <span className="ml-auto text-[11px] text-slate-500 inline-flex items-center gap-1">Show steps<Icon name="chev_d" size={12} /></span>
                </button>}
          </div>
        );
        };
        if (!project.batch) return project.documents.map(docRow);
        // A batch: shared documents first, then each item as a collapsible group.
        return <>
          {project.documents.filter(d => d.shared).map(docRow)}
          {project.items.map(it => {
            const st = itemStats(project, it.id);
            const open = expanded['item:' + it.id] !== undefined ? expanded['item:' + it.id] : !st.done;
            return (
              <React.Fragment key={it.id}>
                <button onClick={() => setExpanded({ ...expanded, ['item:' + it.id]: !open })} data-testid="item-header"
                  className="w-full flex items-center gap-2 px-3 py-1.5 bg-slate-50 border-b border-slate-200 text-left hover:bg-slate-100">
                  <Icon name={open ? 'chev_d' : 'chev_r'} size={13} className="text-slate-400" />
                  <span className="text-sm font-bold text-slate-800">{it.name}</span>
                  {st.done && <span className="text-[11px] font-semibold text-emerald-700 inline-flex items-center gap-1"><Icon name="done" size={12} />Complete</span>}
                  <span className="ml-auto flex items-center gap-2 text-[11px] text-slate-500">
                    <span className="w-28 h-1.5 bg-slate-200 rounded-full overflow-hidden"><span className="block h-full bg-emerald-500" style={{ width: st.pct + '%' }} /></span>
                    {st.closed}/{st.total} steps · {st.pct}%
                  </span>
                </button>
                {open && itemDocs(project, it.id).map(docRow)}
              </React.Fragment>
            );
          })}
        </>;
      })()}
      {(() => {
        const hidden = project.allDocs.filter(d => project.hiddenDocs[d.id]);
        if (!hidden.length) return null;
        return (
          <div className="px-3 py-1.5 text-[11px] text-slate-500 border-t border-slate-200" data-testid="hidden-docs">
            {hidden.length} hidden {hidden.length === 1 ? 'document' : 'documents'} · <button className="text-indigo-600 hover:underline" onClick={() => setShowHidden(!showHidden)}>{showHidden ? 'close' : 'show'}</button>
            {showHidden && <ul className="mt-1 space-y-0.5">
              {hidden.map(d => <li key={d.id} className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full" style={{ background: d.color }} /><span className="text-slate-700">{d.name}</span>
                <button className="text-indigo-600 hover:underline" onClick={() => setDocHidden(project, [d], false, authUser)} data-testid="unhide-doc">Show again</button>
              </li>)}
            </ul>}
          </div>
        );
      })()}
      {hideFor && <HideDocModal project={project} doc={hideFor} authUser={authUser} onClose={() => setHideFor(null)} />}
      {linkDoc && <DocLinkModal project={project} doc={linkDoc} authUser={authUser} onClose={() => setLinkFor(null)} />}
    </div>
  );
}

// The project summary band under the toolbar: progress, held up, sent back,
// upcoming dates, and the timeline — one line, so the documents start high.
function SummaryBand({ project, onOpen }) {
  const stats = projectStats(project);
  const dates = upcomingDates([project], null);
  const { startDate, dueDate } = project;
  const span = startDate && dueDate && dueDate > startDate ? -daysUntil(startDate) + daysUntil(dueDate) : 0;
  const elapsed = span ? Math.min(Math.max(-daysUntil(startDate) / span, 0), 1) : null;
  const behind = elapsed !== null && elapsed * 100 > stats.pct + 15;
  const item = (label, value, color) => (
    <div className="flex items-baseline gap-1.5 flex-shrink-0">
      <span className="text-lg font-bold leading-none" style={{ color: color || '#1e293b' }}>{value}</span>

  return (
    <div className="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap items-center gap-x-6 gap-y-2" data-testid="summary">
      {item('complete', stats.pct + '%')}
      {item('held up', stats.held, stats.held ? '#b45309' : '#94a3b8')}
      {item('sent back', stats.sentBack, stats.sentBack ? '#6d28d9' : '#94a3b8')}
      <div className="flex items-center gap-1.5 min-w-0 flex-1" data-testid="upcoming">
        <Icon name="calendar" size={13} className="text-slate-400 flex-shrink-0" />

        {dates.slice(0, 3).map((it, i) => {

          return (
            <button key={i} onClick={() => onOpen(it.doc.id, it.step.id)} className={`text-[11px] border rounded-full pl-1.5 pr-2 py-0.5 inline-flex items-center gap-1 whitespace-nowrap ${TONE[tone]}`}>
              <span className="w-2 h-2 rounded-full" style={{ background: it.doc.color }} />
              <span className="font-semibold">{fmtDate(it.date).replace(/, \d{4}$/, '')}</span>
              <span>{it.step.stageName} {it.kind === 'meeting' ? 'meeting' : 'due'}</span>
            </button>
          );
        })}
        {dates.length > 3 && <span className="text-[11px] text-slate-400">+{dates.length - 3}</span>}
      </div>
      {elapsed !== null && (
        <div className="w-full md:w-[340px] flex-shrink-0" data-testid="timeline" title={Math.round(elapsed * 100) + '% of time used · ' + stats.pct + '% of steps done'}>
          <div className="relative h-2 bg-slate-100 border border-slate-200 rounded-full">
            <div className="absolute inset-y-0 left-0 bg-emerald-500 rounded-full" style={{ width: stats.pct + '%' }} />
            <div className="absolute -top-1 -bottom-1 w-0.5 bg-slate-700" style={{ left: 'calc(' + (elapsed * 100) + '% - 1px)' }} />
          </div>
          <div className="flex justify-between text-[10px] text-slate-400 mt-0.5">
            <span>{fmtDate(startDate)}</span>
            <span className={behind ? 'text-amber-700 font-medium' : ''}>{Math.round(elapsed * 100)}% of time{behind ? ' · behind' : ''}</span>
            <span>{fmtDate(dueDate)}</span>
          </div>
        </div>
      )}
    </div>
  );
}

function Stat({ label, value, sub, tone }) {

  return (
    <div>
      <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">{label}</div>
      <div className={`text-xl font-bold ${color}`}>{value}</div>

// Upcoming meetings as events: one per date + step name, with the projects
// going to it (a batch counts once).
function meetingEvents(dates) {
  const ev = {};
  dates.filter(d => d.kind === 'meeting' && d.days >= 0).forEach(d => {
    const k = d.date + '|' + stepKey(d.step.stageName);
    const e = ev[k] || (ev[k] = { key: k, date: d.date, days: d.days, name: d.step.stageName, projects: [] });
    if (!e.projects.some(x => x.project.id === d.project.id)) e.projects.push({ project: d.project, docs: [] });
    const pe = e.projects.find(x => x.project.id === d.project.id);
    if (!pe.docs.some(x => x.id === d.doc.id)) pe.docs.push(d.doc);
  });
  return Object.values(ev).sort((a, b) => a.date.localeCompare(b.date));
}
function MeetingList({ events, onOpen }) {
  const [open, setOpen] = useState({});
  if (!events.length) return <p className="text-xs text-slate-400">No meetings in the next 14 days.</p>;

        return (
          <li key={e.key} data-testid="meeting-event">
            <button onClick={() => setOpen({ ...open, [e.key]: !on })} className="w-full text-left py-1.5 flex items-center gap-2.5 hover:bg-slate-50 rounded">
              <span className={`text-[11px] font-semibold border rounded-md w-14 text-center py-1 flex-shrink-0 leading-tight ${TONE[tone]}`}>
                {new Date(e.date + 'T00:00').toLocaleDateString(undefined, { month: 'short' })}<br />{new Date(e.date + 'T00:00').getDate()}
              </span>
              <span className="min-w-0 flex-1">
                <span className="flex items-center gap-1 text-sm text-slate-800 truncate"><Icon name="t_meet" size={12} className="text-slate-400 flex-shrink-0" />{e.name}</span>
                <span className="text-[11px] text-slate-500">{e.projects.length} {e.projects.length === 1 ? 'project' : 'projects'}</span>

// Recent activity, grouped by project and thinned out: only the newest
// checklist tick per project, and a change applied to several documents at
// once (the meeting shortcut) collapses into one line.
const KIND_STYLE = {
  created:  { icon: 'plus',    color: '#F15A22' },
  status:   { icon: 'pending', color: '#64748b' },
  tick:     { icon: 'check',   color: '#059669' },
  sentback: { icon: 'ret',     color: '#7c3aed' },
  date:     { icon: 'calendar',color: '#0284c7' },
  people:   { icon: 'user',    color: '#475569' },
  notes:    { icon: 'notes',   color: '#475569' },
  link:     { icon: 'storage', color: '#0284c7' },
  project:  { icon: 'settings',color: '#475569' },
};
function activityKind(a, project) {
  let kind = a.kind, status = a.status, docId = a.docId, step = a.step;
  const t = a.text || '';
  if (!kind) {
    if (/^Created from/.test(t)) kind = 'created';
    else if (/: (un)?ticked /.test(t)) kind = 'tick';
    else if (/ sent back from /.test(t)) kind = 'sentback';
    else if (/ (set to|cleared)/.test(t)) kind = 'date';
    else if (/: tagged /.test(t)) kind = 'people';
    else if (/: edited notes/.test(t)) kind = 'notes';
    else {
      const m = t.match(/: (Pending|In progress|Held up|Complete|Skipped)\b/);
      if (m) { kind = 'status'; status = (STATUSES.find(s => s.label === m[1]) || {}).id; } else kind = 'project';
    }
  }
  if (!docId) { const d = project.documents.find(d => t.indexOf(d.name + ' ') === 0 || t.indexOf(d.name + ':') === 0); if (d) docId = d.id; }
  const doc = project.documents.find(d => d.id === docId);
  // Drop the "Document · " prefix: the row shows the document as a colour.
  const short = doc ? t.replace(doc.name + ' · ', '').replace(doc.name + ': ', '') : t;
  return { ...a, kind, status, doc, step, short };
}
function recentByProject(projects, maxProjects = 6, perProject = 3) {
  const groups = projects.map(project => {
    const items = Object.values(project.activity).map(a => activityKind(a, project)).sort((a, b) => (b.at || 0) - (a.at || 0));
    const out = [];
    let tickSeen = false;
    items.forEach(it => {
      if (it.kind === 'tick') { if (tickSeen) return; tickSeen = true; }
      const prev = out[out.length - 1];
      if (prev && prev.kind === it.kind && it.kind !== 'project' && prev.step && prev.step === it.step && prev.status === it.status && Math.abs((prev.at || 0) - (it.at || 0)) < 10 * 60000) {
        if (it.doc && !prev.docs.some(d => d.id === it.doc.id)) prev.docs.push(it.doc);
        return;
      }
      out.push({ ...it, docs: it.doc ? [it.doc] : [] });
    });
    return { project, items: out.slice(0, perProject), lastAt: items.length ? items[0].at || 0 : 0 };
  }).filter(g => g.items.length);
  return groups.sort((a, b) => b.lastAt - a.lastAt).slice(0, maxProjects);
}

// A dropdown of checkable options. Selection is a Set of ids.
function MultiSelect({ label, options, value, onChange, actions, testid, defaultSize }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const off = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', off);
    return () => document.removeEventListener('mousedown', off);
  }, [open]);
  const n = options.filter(o => value.has(o.id)).length;
  const narrowed = n !== (defaultSize == null ? options.length : defaultSize) || (defaultSize != null && n === options.length);
  const toggle = (id) => { const v = new Set(value); v.has(id) ? v.delete(id) : v.add(id); onChange(v); };
  return (
    <div className="relative" ref={ref} data-testid={testid}>
      <button onClick={() => setOpen(!open)}
        className={`inline-flex items-center gap-1.5 text-xs font-medium rounded-lg px-2.5 py-1.5 border transition-colors ${narrowed ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}`}>
        {label}<span className={`text-[10px] rounded-full px-1.5 ${narrowed ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}>{n === options.length ? 'All' : n}</span>

        <div className="absolute left-0 top-full mt-1 z-30 bg-white border border-slate-200 rounded-lg shadow-lg py-1 min-w-[220px] fade-in">

          ))}</div>}
          {options.map(o => (

const PROJECT_FLAGS = [

  { id: 'sentback', label: 'Sent back', dot: '#7c3aed' }, { id: 'overdue', label: 'Overdue', dot: '#dc2626' },
  { id: 'stale', label: 'Stale', dot: '#94a3b8' }, { id: 'complete', label: 'Complete', dot: '#059669' },
  { id: 'archived', label: 'Archived', dot: '#cbd5e1' },

const DEFAULT_FLAGS = ['active', 'held', 'sentback', 'overdue', 'stale'];
function projectFlags(p) {
  if (p.archived) return ['archived'];

  const f = ['active'];

  if (st.sentBack) f.push('sentback');
  if (st.overdue || (p.dueDate && daysUntil(p.dueDate) < 0)) f.push('overdue');

// ── Project status donut ──────────────────────────────────────────────────────
// Each project counted once, by its most pressing state. Status colours are the
// app's (same as the step chips); every slice is labelled in the legend with
// its count, so colour is never the only cue.
const DONUT_CATS = [
  { id: 'complete', label: 'Complete', color: '#059669' },
  { id: 'progress', label: 'In progress', color: '#2563eb' },
  { id: 'held', label: 'Held up', color: '#d97706' },
  { id: 'sentback', label: 'Sent back', color: '#7c3aed' },
  { id: 'notstarted', label: 'Not started', color: '#94a3b8' },
  { id: 'archived', label: 'Archived', color: '#cbd5e1' },
];
function donutCategory(p) {
  const st = projectStats(p);
  if (st.done) return 'complete';
  if (p.archived) return 'archived';
  if (st.held) return 'held';
  if (st.sentBack) return 'sentback';
  const started = p.documents.some(d => d.steps.some(s => cellOf(p, d.id, s.id).status !== 'pending'));
  return started ? 'progress' : 'notstarted';
}
function StatusDonut({ projects }) {
  const [range, setRange] = useState('all');
  const [hover, setHover] = useState(null);
  const cutoff = range === 'all' ? 0 : Date.now() - (range === '12m' ? 365 : 182) * 86400000;
  const inRange = projects.filter(p => (p.createdAt || 0) >= cutoff);
  const counts = DONUT_CATS.map(c => ({ ...c, n: inRange.filter(p => donutCategory(p) === c.id).length }));
  const total = inRange.length;
  const R = 42, SW = 14, C = 2 * Math.PI * R, GAP = 2;
  const shown = counts.filter(c => c.n);
  let offset = 0;
  const segs = shown.map(c => {
    const len = Math.max(0, (c.n / total) * C - (shown.length > 1 ? GAP : 0));
    const seg = { ...c, len, offset };
    offset += (c.n / total) * C;
    return seg;
  });
  const focus = hover && counts.find(c => c.id === hover);
  return (
    <div data-testid="donut">
      <div className="flex justify-end -mt-1 mb-2">
        <div className="flex items-center bg-slate-100 rounded-md p-0.5">
          {[['all', 'All time'], ['12m', '12 months'], ['6m', '6 months']].map(([id, label]) => (
            <button key={id} onClick={() => setRange(id)} className={`text-[11px] px-2 py-0.5 rounded ${range === id ? 'bg-white text-indigo-600 shadow-sm font-medium' : 'text-slate-500'}`}>{label}</button>
          ))}
        </div>
      </div>
      {!total ? <p className="text-xs text-slate-400">No projects in this period.</p> : (
        <div className="flex items-center gap-4">
          <svg width="120" height="120" viewBox="0 0 120 120" className="flex-shrink-0" role="img" aria-label={counts.map(c => c.label + ' ' + c.n).join(', ')}>
            <g transform="rotate(-90 60 60)">
              <circle cx="60" cy="60" r={R} fill="none" stroke="#f1f5f9" strokeWidth={SW} />
              {segs.map(s => (
                <circle key={s.id} cx="60" cy="60" r={R} fill="none" stroke={s.color} strokeWidth={hover === s.id ? SW + 4 : SW}
                  strokeDasharray={s.len + ' ' + (C - s.len)} strokeDashoffset={-s.offset}
                  style={{ cursor: 'pointer', transition: 'stroke-width .12s' }}
                  onMouseEnter={() => setHover(s.id)} onMouseLeave={() => setHover(null)}>
                  <title>{s.label}: {s.n} of {total}</title>
                </circle>
              ))}
            </g>
            <text x="60" y="58" textAnchor="middle" className="fill-slate-800" style={{ fontSize: 22, fontWeight: 700 }}>{focus ? focus.n : total}</text>
            <text x="60" y="74" textAnchor="middle" className="fill-slate-500" style={{ fontSize: 10 }}>{focus ? focus.label.toLowerCase() : 'projects'}</text>
          </svg>
          <ul className="flex-1 space-y-0.5 min-w-0">
            {counts.map(c => (
              <li key={c.id} onMouseEnter={() => setHover(c.id)} onMouseLeave={() => setHover(null)}
                className={`flex items-center gap-2 text-xs rounded px-1 ${hover === c.id ? 'bg-slate-50' : ''} ${c.n ? '' : 'opacity-40'}`}>
                <span className="w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{ background: c.color }} />
                <span className="text-slate-700 flex-1 truncate">{c.label}</span>
                <span className="text-slate-800 font-semibold tabular-nums">{c.n}</span>
                <span className="text-slate-400 tabular-nums w-9 text-right">{total ? Math.round(c.n / total * 100) : 0}%</span>
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
}

// ── Bulk actions on the dashboard list ─────────────────────────────────────────
// Acts on the selected projects. "Current step" is each document's (or each
// initiative's document's) current step, as on the Overview.
function mergeToBatch(projects, target, name, authUser) {
  // Every selected project becomes one initiative; its progress and file links
  // move from <docId> to <docId>__<initiativeId>. No shared documents.
  const items = projects.map(p => ({ id: uid(), name: p.name }));
  const prog = {}, links = {}, hidden = {};
  projects.forEach((p, i) => {
    Object.entries(p.progress || {}).forEach(([k, v]) => { prog[k + ITEM_SEP + items[i].id] = v; });
    Object.entries(p.links || {}).forEach(([k, v]) => { links[k + ITEM_SEP + items[i].id] = v; });
    Object.keys(p.hiddenDocs || {}).forEach(k => { hidden[k + ITEM_SEP + items[i].id] = true; });
  });
  const clean = (o) => JSON.parse(JSON.stringify(o));
  const first = projects[0];
  let id, batchName, write;
  if (target) {
    id = target.id; batchName = target.name;
    const upd = { items: [...target.items, ...items], updatedAt: Date.now() };
    Object.entries(prog).forEach(([k, v]) => { upd['progress/' + k] = v; });
    Object.entries(links).forEach(([k, v]) => { upd['links/' + k] = v; });
    Object.keys(hidden).forEach(k => { upd['hiddenDocs/' + k] = true; });
    write = dbUpdate('projects/' + id, clean(upd));
  } else {
    id = uid(); batchName = name;
    const template = first.allDocs.map(({ itemId, itemName, srcDocId, baseName, ...d }) => d);
    write = dbSet('projects/' + id, clean({
      name, workflowId: first.workflowId, workflowName: first.workflowName, sourceHash: first.sourceHash || null,
      batch: true, template, items, sharedDocIds: [], syncGroupMeta: first.syncGroupMeta, roleAssignments: first.roleAssignments,
      notes: '', progress: prog, links, hiddenDocs: hidden, startDate: projects.map(p => p.startDate).filter(Boolean).sort()[0] || todayStr(),
      dueDate: projects.map(p => p.dueDate).filter(Boolean).sort().slice(-1)[0] || '', archived: false,
      syncedAt: first.syncedAt || first.createdAt || Date.now(), createdAt: Date.now(), createdBy: (authUser && authUser.email) || '', updatedAt: Date.now(),
    }));
  }
  return write.then(() => {
    logActivity(id, authUser, (target ? 'Added ' : 'Created from ') + projects.length + (projects.length === 1 ? ' project' : ' projects') + ' as initiatives: ' + projects.map(p => p.name).join(', '), { kind: target ? 'project' : 'created' });
    projects.forEach(p => {
      const note = 'Added to the batch "' + batchName + '" on ' + fmtDate(todayStr()) + '.';
      dbUpdate('projects/' + p.id, { archived: true, notes: p.notes ? p.notes + '\n\n' + note : note, updatedAt: Date.now() });
      logActivity(p.id, authUser, 'Added to the batch "' + batchName + '" and archived', { kind: 'project' });
    });
    return id;
  });
}

  const needsReason = status === 'held_up' || status === 'skipped';

    selected.forEach(p => p.documents.forEach(d => {
      const w = docWindow(p, d);
      if (w.cur < 0) return;
      const step = d.steps[w.cur];
      if (cellOf(p, d.id, step.id).status === status) return;
      setStepStatus(p, d, step, status, needsReason ? reason.trim() : null, authUser);

    const upd = {};

                className={`text-xs font-medium px-3 py-1.5 rounded-md ${batchMode === id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'} disabled:opacity-40`}>{label}</button>
            ))}
          </div>
          {batchMode === 'new'
            ? <Field label="Batch name"><input autoFocus className={inputCls} value={batchName} onChange={e => setBatchName(e.target.value)} placeholder="e.g. New Courses Fall" data-testid="bulk-batch-name" /></Field>
            : <Field label="Batch" hint="Only batches on the same workflow are listed.">
                <select className={inputCls} value={targetId} onChange={e => setTargetId(e.target.value)} data-testid="bulk-batch-target">
                  <option value="">Choose…</option>
                  {targets.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </Field>}
          <div className="text-xs text-slate-500">Initiatives: {selected.map(p => p.name).join(', ')}</div>
        </>}
      </Modal>}
    </div>
  );
}

function Dashboard({ data, authUser, online, onOpen, onNew }) {
  const [sel, setSel] = useState(() => new Set());
  const me = meOf(data.people, authUser);
  const [q, setQ] = useState('');
  const [flags, setFlags] = useState(() => new Set(DEFAULT_FLAGS));
  const [who, setWho] = useState(null);       // null = everyone
  const [types, setTypes] = useState(null);   // null = every workflow
  const [report, setReport] = useState(null); // narrow view: which report panel is open
  const [attAll, setAttAll] = useState(false);
  const narrow = useNarrow();
  const repRef = useRef(null);
  useEffect(() => {
    if (!report) return;
    const off = (e) => { if (repRef.current && !repRef.current.contains(e.target)) setReport(null); };
    document.addEventListener('mousedown', off);
    return () => document.removeEventListener('mousedown', off);
  }, [report]);
  // A batch is one line however many of its steps need you.
  const attention = (() => {
    const out = [], byBatch = {};
    attentionFor(data.projects, data.people, me).forEach(it => {
      if (!it.project.batch) return out.push(it);
      const g = byBatch[it.project.id];
      if (g) { g.count++; if ((it.cell.dueDate || '9999') < (g.cell.dueDate || '9999')) g.cell = it.cell; return; }
      out.push(byBatch[it.project.id] = { ...it, batchLine: true, count: 1 });
    });
    // Most overdue first, then soonest due; steps with no due date last,
    // the one quiet longest first.
    const lastAt = (c) => Math.max(0, ...Object.values(c.history || {}).map(h => h.at || 0));
    return out.sort((a, b) => {
      const da = a.cell.dueDate, db = b.cell.dueDate;
      if (da && db) return da.localeCompare(db);
      if (da || db) return da ? -1 : 1;
      return lastAt(a.cell) - lastAt(b.cell);
    });
  })();
  const active = data.projects.filter(p => !p.archived);

  const peopleOpts = [...(me ? [me] : []), ...data.people.filter(p => !me || p.id !== me.id)].map(p => ({ id: p.id, label: p.name + (me && p.id === me.id ? ' (you)' : '') }));
  const allPeople = new Set(peopleOpts.map(o => o.id));
  const whoSet = who || allPeople;
  const typeOpts = data.workflows.map(w => ({ id: w.id, label: w.name }));
  const allTypes = new Set(typeOpts.map(o => o.id));
  const typeSet = types || allTypes;

  const list = data.projects.filter(p => {
    if (q && !p.name.toLowerCase().includes(q.toLowerCase())) return false;
    if (!projectFlags(p).some(f => flags.has(f))) return false;
    if (types && !types.has(p.workflowId)) return false;
    if (who) { const ids = projectPeopleIds(p, data.people); if (![...ids].some(id => who.has(id))) return false; }
    return true;
  });
  const filtered = list.length !== data.projects.length;
  const clear = () => { setQ(''); setFlags(new Set(PROJECT_FLAGS.map(f => f.id))); setWho(null); setTypes(null); };

  const stats = active.map(p => ({ p, st: projectStats(p) }));
  let held = 0, sentBack = 0;
  stats.forEach(x => { held += x.st.held; sentBack += x.st.sentBack; });
  const dates = upcomingDates(active, 14);
  const meetings = meetingEvents(dates);
  const stale = stats.filter(x => !x.st.done && (Date.now() - x.st.lastAt) > STALE_DAYS * 86400000);
  const tiles = [
    { label: 'Active projects', short: 'Active', value: active.filter(p => !projectStats(p).done).length, icon: 'dashboard', color: '#F15A22', sub: stats.filter(x => x.st.done).length + ' complete', always: true },
    { label: 'Held up', value: stats.filter(x => x.st.held > 0).length, icon: 'held', color: '#d97706', sub: 'projects waiting', flag: 'held' },
    { label: 'Sent back', value: sentBack, icon: 'ret', color: '#7c3aed', sub: 'being reworked', flag: 'sentback' },

  const recentLast = Math.max(0, ...active.flatMap(p => Object.values(p.activity).map(a => a.at || 0)));

      body: <MeetingList events={meetings} onOpen={onOpen} /> },
    { id: 'recent', short: 'Updates', title: 'Recent updates', icon: 'history', accent: '#0f766e', testid: 'recent', value: recentLast ? timeAgo(recentLast) : '—', sub: 'last update',
      body: <RecentUpdates projects={active} onOpen={onOpen} /> },
  ];
  const openRep = reports.find(r => r.id === report);

  const projectsBox = (
    <section className="bg-white border border-slate-200 rounded-xl min-w-0" data-testid="projects">
      {/* Narrow: search + New project on line 1, the filters on line 2. */}

          <MultiSelect label="Status" testid="f-status" options={PROJECT_FLAGS} value={flags} onChange={setFlags} defaultSize={DEFAULT_FLAGS.length}

          <MultiSelect label="People" testid="f-people" options={peopleOpts} value={whoSet} onChange={v => setWho(v.size === allPeople.size ? null : v)}
            actions={[...(me ? [{ label: 'Only me', value: () => new Set([me.id]) }] : []), { label: 'Everyone', value: () => new Set(allPeople) }]} />
          <MultiSelect label="Type" testid="f-type" options={typeOpts} value={typeSet} onChange={v => setTypes(v.size === allTypes.size ? null : v)}

          style={{ background: 'linear-gradient(135deg, #F47A48, #DD4513)' }}>
          <span className="w-6 h-6 rounded-md bg-white/20 flex items-center justify-center"><Icon name="plus" size={15} /></span>New project
        </button>
      </div>
      {filtered && list.length > 0 && <div className="px-4 py-1.5 text-[11px] text-slate-500 border-b border-slate-100 bg-slate-50">Showing {list.length} of {data.projects.length} projects · <button className="text-indigo-600 hover:underline" onClick={clear}>Show all</button></div>}
      {!list.length && <div className="text-sm text-slate-500 px-4 py-8 text-center">

      {list.map(p => <ProjectRow key={p.id} project={p} people={data.people} onOpen={onOpen} selected={sel.has(p.id)}

  const tileEl = (t, compact) => {

        style={{ opacity: on || sel ? 1 : .65, borderColor: sel ? t.color : undefined, '--tw-ring-color': t.color }}>
        <span className="absolute inset-y-0 left-0 w-1" style={{ background: on ? t.color : '#e2e8f0' }} />
        <span className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: (on ? t.color : '#94a3b8') + '1a', color: on ? t.color : '#94a3b8' }}><Icon name={t.icon} size={16} /></span>
        <span className="text-2xl font-bold leading-none tabular-nums" style={{ color: on ? t.color : '#94a3b8' }}>{t.value}</span>
        <span className="min-w-0 leading-tight">
          <span className="block text-xs font-semibold text-slate-700 truncate">{t.label}</span>
          <span className="block text-[11px] text-slate-400 truncate">{t.sub}</span>
        </span>
      </button>
    );
  };

  return (
    <>
      <TopBar eyebrow="Program Tracker" title="Dashboard" sub={<SyncLine online={online}>{' · ' + active.length + ' active ' + (active.length === 1 ? 'project' : 'projects')}</SyncLine>} />
      <div className="flex-1 min-h-0 overflow-auto p-4">
        {narrow ? <>
          {/* Narrow: Needs your attention in full, then one row of small cards —

          <div className="mb-2">{attentionPanel}</div>
          <div ref={repRef} className="mb-3">
            <div className="grid gap-1.5" style={{ gridTemplateColumns: 'repeat(auto-fill, minmax(118px, 1fr))' }} data-testid="tiles">

              {reports.map(r => (
                <button key={r.id} onClick={() => setReport(report === r.id ? null : r.id)} data-testid={'card-' + r.id} title={r.value + ' ' + r.sub}
                  className={`w-full h-8 bg-white border rounded-lg px-2 flex items-center gap-1.5 text-left relative overflow-hidden ${report === r.id ? 'ring-2 ring-offset-1' : 'border-slate-200 hover:shadow-sm'}`}
                  style={{ borderColor: report === r.id ? r.accent : undefined, '--tw-ring-color': r.accent }}>
                  <span className="absolute inset-y-0 left-0 w-0.5" style={{ background: r.accent }} />
                  <span style={{ color: r.accent }} className="flex-shrink-0"><Icon name={r.icon} size={13} /></span>
                  <span className="text-[11px] font-semibold text-slate-700 truncate flex-1">{r.short}</span>
                  <Icon name={report === r.id ? 'chev_u' : 'chev_d'} size={11} className="text-slate-400 flex-shrink-0" />
                </button>
              ))}
            </div>
            {openRep && <div className="mt-2 fade-in" data-testid="report-drop">
              <Panel title={openRep.title} icon={openRep.icon} testid={openRep.testid} accent={openRep.accent}>{openRep.body}</Panel>
            </div>}
          </div>
          {projectsBox}
        </> : <>
          <div className="grid grid-cols-5 gap-3 mb-4" data-testid="tiles">{tiles.map(t => tileEl(t, false))}</div>
          <div className="grid grid-cols-[minmax(0,1fr)_360px] gap-4 items-start">
            {projectsBox}
            <div className="space-y-4 min-w-0">
              {attentionPanel}
              {reports.map(r => <Panel key={r.id} title={r.title} icon={r.icon} testid={r.testid} accent={r.accent}>{r.body}</Panel>)}
            </div>
          </div>
        </>}
      </div>
    </>
  );
}

// ── Collapsible sidebar ────────────────────────────────────────────────────────
// Same behaviour as the Workflow Tool. Wide windows remember whether the
// sidebar was open; below NARROW_BELOW it always starts as the slim icon rail,
// and opening it slides the full sidebar over the page (click away to close).
// In the rail each icon grows into its full button on hover.
const NARROW_BELOW = 1280, RAIL_W = 64, SIDEBAR_W = 240;
const SIDEBAR_KEY = 'cs_tracker_sidebar_open_v1';
function useNarrow() {
  const q = '(max-width: ' + (NARROW_BELOW - 1) + 'px)';
  const [narrow, setNarrow] = useState(() => window.matchMedia ? window.matchMedia(q).matches : false);
  useEffect(() => {
    if (!window.matchMedia) return;
    const m = window.matchMedia(q);
    const on = () => setNarrow(m.matches);
    m.addEventListener ? m.addEventListener('change', on) : m.addListener(on);
    return () => { m.removeEventListener ? m.removeEventListener('change', on) : m.removeListener(on); };
  }, []);
  return narrow;
}
function useSidebar() {
  const narrow = useNarrow();
  const [pref, setPref] = useState(() => { try { return localStorage.getItem(SIDEBAR_KEY) !== '0'; } catch (e) { return true; } });
  const [overlay, setOverlay] = useState(false);
  useEffect(() => { if (!narrow) setOverlay(false); }, [narrow]);
  const toggle = () => {
    if (narrow) return setOverlay(o => !o);
    setPref(p => { try { localStorage.setItem(SIDEBAR_KEY, p ? '0' : '1'); } catch (e) {} return !p; });
  };
  const collapse = () => { if (narrow) return setOverlay(false); setPref(false); try { localStorage.setItem(SIDEBAR_KEY, '0'); } catch (e) {} };
  return { narrow, expanded: narrow ? overlay : pref, overlay: narrow && overlay, toggle, collapse, close: () => setOverlay(false) };
}
// Two letters from the first two words ("New Program" → NP; one word → its
// first two letters), ignoring punctuation.
const railInitials = (name) => {
  const w = (name || '?').replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 2)).toUpperCase();
};
// One rail entry: the icon (or initials) on its own. On hover the full button
// floats over it, its label sliding out to the right. It is drawn fixed-position
// through a portal because the rail scrolls, and a scrolling box clips anything
// that overflows sideways. `lead` sits before the icon (the Workflow Tool's grip).
function RailItem({ icon, badge, label, sub, onClick, href, active, testid, lead }) {
  const [rect, setRect] = useState(null);
  const ref = useRef(null);
  const show = () => { const r = ref.current && ref.current.getBoundingClientRect(); if (r) setRect({ top: r.top, left: r.left, height: r.height }); };
  const hide = () => setRect(null);
  const glyph = badge || <span className={`w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${active ? 'bg-indigo-600 text-white' : 'text-slate-500'}`}><Icon name={icon} size={17} /></span>;
  const act = () => { hide(); if (onClick) onClick(); };
  const fly = rect && ReactDOM.createPortal(
    <div className="rail-fly" style={{ top: rect.top, left: rect.left, height: rect.height }} onMouseLeave={hide} data-testid="rail-fly">
      {href ? <a href={href} className="rail-fly-btn">{glyph}<span className="rail-fly-label"><span className="block text-sm font-medium text-slate-800">{label}</span>{sub && <span className="block text-[11px] text-slate-500">{sub}</span>}</span></a>
            : <button onClick={act} className="rail-fly-btn">{glyph}<span className="rail-fly-label"><span className="block text-sm font-medium text-slate-800">{label}</span>{sub && <span className="block text-[11px] text-slate-500">{sub}</span>}</span></button>}
    </div>, document.body);
  return (
    <div className="flex items-center" data-testid={testid}>
      {lead}
      {href
        ? <a ref={ref} href={href} className="rail-btn" aria-label={label} onMouseEnter={show} onFocus={show}>{glyph}</a>
        : <button ref={ref} onClick={act} className="rail-btn" aria-label={label} onMouseEnter={show} onFocus={show}>{glyph}</button>}
      {fly}
    </div>
  );
}
// Initials circle; the outline carries the project's state.
const PROJECT_RING = { complete: ['#059669', 'Complete'], held: ['#d97706', 'Held up'], sentback: ['#7c3aed', 'Sent back'],
  overdue: ['#dc2626', 'Overdue'], progress: ['#2563eb', 'In progress'], notstarted: ['#94a3b8', 'Not started'], archived: ['#cbd5e1', 'Archived'] };
function projectRing(p) {
  const cat = donutCategory(p);
  const st = projectStats(p);
  if ((cat === 'progress' || cat === 'notstarted') && (st.overdue || (p.dueDate && daysUntil(p.dueDate) < 0))) return PROJECT_RING.overdue;
  return PROJECT_RING[cat];
}
function InitialsBadge({ name, ring, active }) {
  return <span className="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 text-[11px] font-bold"
    style={{ border: '2px solid ' + ring, background: active ? '#DD4513' : '#fff', color: active ? '#fff' : '#334155' }}>{railInitials(name)}</span>;
}

function Sidebar({ data, route, go, authUser, onModal, sb }) {
  const projects = data.projects.filter(p => !p.archived);
  const pick = (id) => { go(id); sb.close(); };
  const item = (active) => `group flex items-center gap-2 px-2 py-2 rounded-lg cursor-pointer mb-1 transition-colors ${active ? 'bg-indigo-600 text-white' : 'text-slate-700 hover:bg-slate-100'}`;
  const brand = (
    <button onClick={() => pick(null)} className="w-full text-left border-b border-slate-200 hover:bg-slate-50 transition-colors flex flex-col justify-center shrink-0 overflow-hidden"
      style={{ height: CHROME_BAR_H, paddingLeft: sb.expanded ? 16 : 0, alignItems: sb.expanded ? 'stretch' : 'center' }} title="Dashboard">
      {sb.expanded ? <>
        <div className="font-bold text-slate-800 text-sm leading-tight whitespace-nowrap">Program Tracker</div>
        <div className="text-xs text-slate-400 mt-0.5 whitespace-nowrap">Langara Continuing Studies</div>
      </> : <div className="font-bold text-slate-800 text-sm">PT</div>}
    </button>
  );
  if (!sb.expanded) return (
    <aside className="bg-white border-r border-slate-200 flex flex-col shrink-0 h-full" style={{ width: RAIL_W }} data-testid="rail">
      {brand}
      <div className="flex-1 overflow-y-auto py-2 flex flex-col items-start gap-1 pl-3">
        <RailItem icon="sb_open" label="Expand sidebar" onClick={sb.toggle} testid="rail-expand" />
        <RailItem icon="dashboard" label="Dashboard" active={!route} onClick={() => pick(null)} />
        <RailItem icon="plus" label="New project" onClick={() => onModal('new')} />
        <div className="w-8 border-t border-slate-200 my-1" />
        {projects.map(p => {
          const [ring, label] = projectRing(p);
          return <RailItem key={p.id} badge={<InitialsBadge name={p.name} ring={ring} active={route === p.id} />}
            label={p.name} sub={label + ' · ' + projectStats(p).pct + '%'} onClick={() => pick(p.id)} testid="rail-project" />;
        })}
      </div>
      <div className="py-2 pl-3 border-t border-slate-200 flex flex-col gap-1">
        <RailItem icon="map" label="Workflow Tool" href={MAP_URL} />
        <RailItem icon="settings" label="Settings" onClick={() => onModal('settings')} testid="settings-btn" />
      </div>
    </aside>
  );
  return (
    <aside className={`bg-white border-r border-slate-200 flex flex-col shrink-0 overflow-hidden h-full ${sb.overlay ? 'shadow-2xl slide-in' : ''}`} style={{ width: SIDEBAR_W }}>
      {brand}
      <div className="flex-1 overflow-y-auto p-3">
        <div onClick={() => pick(null)} className={item(!route)} data-testid="nav-dashboard">
          <Icon name="dashboard" size={15} className={!route ? 'text-indigo-200' : 'text-slate-400'} />
          <span className="text-sm font-medium">Dashboard</span>
        </div>
        <div className="flex items-center justify-between mt-4 mb-2 px-1">
          <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Projects</span>
          <div className="flex items-center gap-0.5">
            <button onClick={() => onModal('new')} className="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 rounded p-1 transition-colors" title="New project"><Icon name="plus" size={16} /></button>
            <button onClick={sb.toggle} className="text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded p-1 transition-colors" title="Collapse sidebar" data-testid="collapse-sidebar"><Icon name="sb_close" size={16} /></button>
          </div>
        </div>
        {!projects.length && <div className="text-xs text-slate-400 px-2">No projects yet.</div>}
        {projects.map(p => {
          const st = projectStats(p);
          const on = route === p.id;
          return (
            <div key={p.id} onClick={() => pick(p.id)} className={item(on)} title={p.name}>
              <span className="text-sm font-medium truncate flex-1">{p.name}</span>
              {st.held > 0 && <span className={on ? 'text-amber-200' : 'text-amber-600'} title="Held up"><Icon name="held" size={13} /></span>}
              <span className={`text-[10px] tabular-nums ${on ? 'text-indigo-200' : 'text-slate-400'}`}>{st.pct}%</span>
            </div>
          );
        })}
      </div>
      <div className="p-3 border-t border-slate-200 space-y-1.5">
        <a href={MAP_URL} className="w-full px-3 py-2.5 rounded-lg text-sm text-slate-700 border border-slate-200 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
          <Icon name="map" size={16} className="text-slate-500" /> Workflow Tool
        </a>
        <button onClick={() => onModal('settings')} data-testid="settings-btn" className="w-full px-3 py-2.5 rounded-lg text-sm text-slate-700 border border-slate-200 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
          <Icon name="settings" size={16} className="text-slate-500" /> Settings
        </button>
      </div>
    </aside>
  );
}

function App({ authUser }) {
  const [data, online] = useTrackerData(authUser);
  const [route, setRoute] = useState(readRoute());
  const [modal, setModal] = useState(null);   // 'people' | 'new'
  const sb = useSidebar();
  useEffect(() => {
    const on = () => setRoute(readRoute());
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const go = useCallback((id) => { location.hash = id ? '#/p/' + id : '#/'; setRoute(id); }, []);
  const project = data && route ? data.projects.find(p => p.id === route) : null;
  useEffect(() => { document.title = project ? project.name + ' · Program Tracker' : 'Program Tracker'; }, [project && project.name]);

  if (!data) return <div className="flex items-center justify-center h-screen text-slate-400 text-sm">Loading…</div>;
  return (
    <div className="flex h-screen overflow-hidden bg-slate-100">
      {/* Narrow: the rail holds its place and the opened sidebar slides over the page. */}
      <div className="relative shrink-0 h-full z-40" style={{ width: sb.narrow ? RAIL_W : (sb.expanded ? SIDEBAR_W : RAIL_W) }}>
        <div className={sb.overlay ? 'absolute inset-y-0 left-0' : 'h-full'}>
          <Sidebar data={data} route={route} go={go} authUser={authUser} onModal={setModal} sb={sb} />
        </div>
      </div>
      {sb.overlay && <div className="fixed inset-0 bg-slate-900/20 z-30" onClick={sb.close} data-testid="sidebar-backdrop" />}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        {route && project
          ? <ProjectView key={project.id} project={project} data={data} authUser={authUser} online={online} onBack={() => go(null)} onOpenProject={go} />
          : route
            ? <><TopBar eyebrow="Project" title="Not found" /><div className="p-6 text-sm text-slate-500">That project no longer exists. <button className="text-indigo-600 underline" onClick={() => go(null)}>Back to the dashboard</button></div></>
            : <Dashboard data={data} authUser={authUser} online={online} onOpen={go} onNew={() => setModal('new')} />}
      </div>
      {modal === 'settings' && <SettingsModal authUser={authUser} onOpen={setModal} onClose={() => setModal(null)} />}
      {modal === 'people' && <PeopleModal data={data} onClose={() => setModal(null)} />}
      <UndoToast />
      {modal === 'new' && <NewProjectModal data={data} authUser={authUser} onClose={() => setModal(null)} onCreated={id => { setModal(null); go(id); }} />}
    </div>
  );
}

function Root() {
  const [authUser, setAuthUser] = useState(undefined);
  useEffect(() => { getFbApp(); return getFbAuth().onAuthStateChanged(u => setAuthUser(u)); }, []);
  if (authUser === undefined) return <div className="flex items-center justify-center h-screen text-slate-400 text-sm">Checking authentication…</div>;
  if (!authUser) return <LoginScreen />;
  return <App authUser={authUser} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
