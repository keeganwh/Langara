// A dropdown of checkable options. Selection is a Set of ids.
function MultiSelect({ label, options, value, onChange, actions, testid, defaultSize }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return;
    const off = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', off);
    return () => document.removeEventListener('mousedown', off);
  }, [open]);
  const n = options.filter(o => value.has(o.id)).length;
  const narrowed = n !== (defaultSize == null ? options.length : defaultSize) || (defaultSize != null && n === options.length);
  const toggle = (id) => { const v = new Set(value); v.has(id) ? v.delete(id) : v.add(id); onChange(v); };
  return (
    <div className="relative" ref={ref} data-testid={testid}>
      <button onClick={() => setOpen(!open)}
        className={`inline-flex items-center gap-1.5 text-xs font-medium rounded-lg px-2.5 py-1.5 border transition-colors ${narrowed ? 'bg-indigo-50 border-indigo-300 text-indigo-700' : 'bg-white border-slate-300 text-slate-700 hover:bg-slate-50'}`}>
        {label}<span className={`text-[10px] rounded-full px-1.5 ${narrowed ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}>{n === options.length ? 'All' : n}</span>
        <Icon name="chev_d" size={12} />
      </button>
      {open && (
        <div className="absolute left-0 top-full mt-1 z-30 bg-white border border-slate-200 rounded-lg shadow-lg py-1 min-w-[220px] fade-in">
          {actions && <div className="flex gap-1 px-2 pb-1 mb-1 border-b border-slate-100">{actions.map(a => (
            <button key={a.label} onClick={() => onChange(a.value())} className="text-[11px] text-indigo-600 hover:bg-indigo-50 rounded px-2 py-0.5">{a.label}</button>
          ))}</div>}
          {options.map(o => (
            <button key={o.id} onClick={() => toggle(o.id)} className="w-full text-left flex items-center gap-2 px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-50">
              <span className={`w-4 h-4 rounded border flex items-center justify-center flex-shrink-0 ${value.has(o.id) ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300'}`}>{value.has(o.id) && <Icon name="check" size={11} />}</span>
              {o.dot && <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: o.dot }} />}
              <span className="truncate">{o.label}</span>
              {o.sub && <span className="ml-auto text-[11px] text-slate-400">{o.sub}</span>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// A project's flags, for the Status filter. A project shows if any flag is
// selected, so "Held up" alone narrows to projects with a held-up step.
const PROJECT_FLAGS = [
  { id: 'active', label: 'In progress' }, { id: 'held', label: 'Held up', dot: '#d97706' },
  { id: 'sentback', label: 'Sent back', dot: '#7c3aed' }, { id: 'overdue', label: 'Overdue', dot: '#dc2626' },
  { id: 'stale', label: 'Stale', dot: '#94a3b8' }, { id: 'complete', label: 'Complete', dot: '#059669' },
  { id: 'archived', label: 'Archived', dot: '#cbd5e1' },
];
const DEFAULT_FLAGS = ['active', 'held', 'sentback', 'overdue', 'stale'];
function projectFlags(p) {
  if (p.archived) return ['archived'];
  const st = projectStats(p);
  if (st.done) return ['complete'];
  const f = ['active'];
  if (st.held) f.push('held');
  if (st.sentBack) f.push('sentback');
  if (st.overdue || (p.dueDate && daysUntil(p.dueDate) < 0)) f.push('overdue');
  if ((Date.now() - st.lastAt) > STALE_DAYS * 86400000) f.push('stale');
  return f;
}
function projectPeopleIds(project, people) {
  const ids = new Set();
  project.documents.forEach(d => d.steps.forEach(s => stepPeople(project, people, s, cellOf(project, d.id, s.id)).forEach(id => ids.add(id))));
  return ids;
}

// ── Project status donut ──────────────────────────────────────────────────────
// Each project counted once, by its most pressing state. Status colours are the
// app's (same as the step chips); every slice is labelled in the legend with
// its count, so colour is never the only cue.
const DONUT_CATS = [
  { id: 'complete', label: 'Complete', color: '#059669' },
  { id: 'progress', label: 'In progress', color: '#2563eb' },
  { id: 'held', label: 'Held up', color: '#d97706' },
  { id: 'sentback', label: 'Sent back', color: '#7c3aed' },
  { id: 'notstarted', label: 'Not started', color: '#94a3b8' },
  { id: 'archived', label: 'Archived', color: '#cbd5e1' },
];
function donutCategory(p) {
  const st = projectStats(p);
  if (st.done) return 'complete';
  if (p.archived) return 'archived';
  if (st.held) return 'held';
  if (st.sentBack) return 'sentback';
  const started = p.documents.some(d => d.steps.some(s => cellOf(p, d.id, s.id).status !== 'pending'));
  return started ? 'progress' : 'notstarted';
}
function StatusDonut({ projects }) {
  const [range, setRange] = useState('all');
  const [hover, setHover] = useState(null);
  const cutoff = range === 'all' ? 0 : Date.now() - (range === '12m' ? 365 : 182) * 86400000;
  const inRange = projects.filter(p => (p.createdAt || 0) >= cutoff);
  const counts = DONUT_CATS.map(c => ({ ...c, n: inRange.filter(p => donutCategory(p) === c.id).length }));
  const total = inRange.length;
  const R = 42, SW = 14, C = 2 * Math.PI * R, GAP = 2;
  const shown = counts.filter(c => c.n);
  let offset = 0;
  const segs = shown.map(c => {
    const len = Math.max(0, (c.n / total) * C - (shown.length > 1 ? GAP : 0));
    const seg = { ...c, len, offset };
    offset += (c.n / total) * C;
    return seg;
  });
  const focus = hover && counts.find(c => c.id === hover);
  return (
    <div data-testid="donut">
      <div className="flex justify-end -mt-1 mb-2">
        <div className="flex items-center bg-slate-100 rounded-md p-0.5">
          {[['all', 'All time'], ['12m', '12 months'], ['6m', '6 months']].map(([id, label]) => (
            <button key={id} onClick={() => setRange(id)} className={`text-[11px] px-2 py-0.5 rounded ${range === id ? 'bg-white text-indigo-600 shadow-sm font-medium' : 'text-slate-500'}`}>{label}</button>
          ))}
        </div>
      </div>
      {!total ? <p className="text-xs text-slate-400">No projects in this period.</p> : (
        <div className="flex items-center gap-4">
          <svg width="120" height="120" viewBox="0 0 120 120" className="flex-shrink-0" role="img" aria-label={counts.map(c => c.label + ' ' + c.n).join(', ')}>
            <g transform="rotate(-90 60 60)">
              <circle cx="60" cy="60" r={R} fill="none" stroke="#f1f5f9" strokeWidth={SW} />
              {segs.map(s => (
                <circle key={s.id} cx="60" cy="60" r={R} fill="none" stroke={s.color} strokeWidth={hover === s.id ? SW + 4 : SW}
                  strokeDasharray={s.len + ' ' + (C - s.len)} strokeDashoffset={-s.offset}
                  style={{ cursor: 'pointer', transition: 'stroke-width .12s' }}
                  onMouseEnter={() => setHover(s.id)} onMouseLeave={() => setHover(null)}>
                  <title>{s.label}: {s.n} of {total}</title>
                </circle>
              ))}
            </g>
            <text x="60" y="58" textAnchor="middle" className="fill-slate-800" style={{ fontSize: 22, fontWeight: 700 }}>{focus ? focus.n : total}</text>
            <text x="60" y="74" textAnchor="middle" className="fill-slate-500" style={{ fontSize: 10 }}>{focus ? focus.label.toLowerCase() : 'projects'}</text>
          </svg>
          <ul className="flex-1 space-y-0.5 min-w-0">
            {counts.map(c => (
              <li key={c.id} onMouseEnter={() => setHover(c.id)} onMouseLeave={() => setHover(null)}
                className={`flex items-center gap-2 text-xs rounded px-1 ${hover === c.id ? 'bg-slate-50' : ''} ${c.n ? '' : 'opacity-40'}`}>
                <span className="w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{ background: c.color }} />
                <span className="text-slate-700 flex-1 truncate">{c.label}</span>
                <span className="text-slate-800 font-semibold tabular-nums">{c.n}</span>
                <span className="text-slate-400 tabular-nums w-9 text-right">{total ? Math.round(c.n / total * 100) : 0}%</span>
              </li>
            ))}
          </ul>
        </div>
      )}
    </div>
  );
}

              </div>
              <MultiSelect label="Status" testid="f-status" options={PROJECT_FLAGS} value={flags} onChange={setFlags} defaultSize={DEFAULT_FLAGS.length}
                actions={[{ label: 'Default', value: () => new Set(DEFAULT_FLAGS) }, { label: 'All', value: () => new Set(PROJECT_FLAGS.map(f => f.id)) }]} />
              <MultiSelect label="People" testid="f-people" options={peopleOpts} value={whoSet} onChange={v => setWho(v.size === allPeople.size ? null : v)}
                actions={[...(me ? [{ label: 'Only me', value: () => new Set([me.id]) }] : []), { label: 'Everyone', value: () => new Set(allPeople) }]} />
              <MultiSelect label="Type" testid="f-type" options={typeOpts} value={typeSet} onChange={v => setTypes(v.size === allTypes.size ? null : v)}
                actions={[{ label: 'All', value: () => new Set(allTypes) }]} />
              <button onClick={onNew} data-testid="new-project"
                className="ml-auto inline-flex items-center gap-2 text-sm font-semibold text-white rounded-lg pl-2 pr-4 py-1.5 shadow-md hover:shadow-lg transition-shadow"
                style={{ background: 'linear-gradient(135deg, #4f46e5, #7c3aed)' }}>
                <span className="w-6 h-6 rounded-md bg-white/20 flex items-center justify-center"><Icon name="plus" size={15} /></span>New project
              </button>
            </div>
            {filtered && list.length > 0 && <div className="px-4 py-1.5 text-[11px] text-slate-500 border-b border-slate-100 bg-slate-50">Showing {list.length} of {data.projects.length} projects · <button className="text-indigo-600 hover:underline" onClick={clear}>Show all</button></div>}
            {!list.length && <div className="text-sm text-slate-500 px-4 py-8 text-center">
              {data.projects.length ? <>No projects match these filters. <button className="text-indigo-600 hover:underline" onClick={clear}>Show all</button></> : 'No projects yet. Start one from a workflow with New project.'}
            </div>}
            {list.map(p => <ProjectRow key={p.id} project={p} people={data.people} onOpen={onOpen} />)}
          </section>

          <div className="space-y-4 min-w-0">
            <Panel title="Needs your attention" icon="t_cust" testid="attention" accent="#4f46e5" sub="Your steps that are active or next">
              {!me && <p className="text-sm text-slate-600">Your sign-in ({authUser.email}) is not on the People list yet, so nothing can be assigned to you. Add yourself under <strong>People</strong>.</p>}
              {me && !attention.length && <p className="text-sm text-slate-500">Nothing pending for you.</p>}
              {me && attention.length > 0 && <div className="divide-y -mx-1">
                {attention.map((it, i) => {
                  const due = dueLabel(it.cell.dueDate);
                  return (
                    <button key={i} onClick={() => onOpen(it.project.id)} className="w-full text-left px-1 py-1.5 flex items-center gap-2 hover:bg-slate-50 rounded">
                      <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: it.doc.color }} />
                      <span className="min-w-0 flex-1">
                        <span className="block text-sm font-medium text-slate-800 truncate">{it.step.stageName}</span>
                        <span className="block text-[11px] text-slate-500 truncate">{it.doc.name} · {it.project.name}</span>
                      </span>
                      <span className="flex flex-col items-end gap-0.5 flex-shrink-0">
                        <StatusChip status={it.cell.status} sm />
                        {due && <span className={`text-[10px] border rounded-full px-1.5 ${TONE[due.tone]}`}>{due.text}</span>}
                      </span>
                    </button>
                  );
                })}
              </div>}
            </Panel>
            <Panel title="Project status" icon="dashboard" testid="report-status" accent="#059669">
              <StatusDonut projects={data.projects} />
            </Panel>
            <Panel title="Next 14 days" icon="calendar" testid="report-dates" accent="#0284c7">
              <DateList items={dates} onOpen={it => onOpen(it.project.id)} empty="No due or meeting dates coming up." />
            </Panel>
            <Panel title="Recent updates" icon="history" testid="recent" accent="#0f766e">
              <RecentUpdates projects={active} onOpen={onOpen} />
            </Panel>
          </div>
        </div>
      </div>
    </>
  );
}

// ── App ────────────────────────────────────────────────────────────────────────
// Routing is the URL hash (#/p/<id>), so a project can be linked to directly.
const readRoute = () => { const m = location.hash.match(/^#\/p\/([\w-]+)/); return m ? m[1] : null; };

function Sidebar({ data, route, go, authUser, onModal }) {
  const projects = data.projects.filter(p => !p.archived);
  const item = (active) => `group flex items-center gap-2 px-2 py-2 rounded-lg cursor-pointer mb-1 transition-colors ${active ? 'bg-indigo-600 text-white' : 'text-slate-700 hover:bg-slate-100'}`;
  return (
    <aside className="bg-white border-r border-slate-200 flex flex-col shrink-0 overflow-hidden" style={{ width: 240 }}>
      <button onClick={() => go(null)} className="w-full text-left px-4 border-b border-slate-200 hover:bg-slate-50 transition-colors flex flex-col justify-center shrink-0"
        style={{ height: CHROME_BAR_H }} title="Dashboard">
        <div className="font-bold text-slate-800 text-sm leading-tight">Program Tracker</div>
        <div className="text-xs text-slate-400 mt-0.5">Langara Continuing Studies</div>
      </button>
      <div className="flex-1 overflow-y-auto p-3">
        <div onClick={() => go(null)} className={item(!route)} data-testid="nav-dashboard">
          <Icon name="dashboard" size={15} className={!route ? 'text-indigo-200' : 'text-slate-400'} />
          <span className="text-sm font-medium">Dashboard</span>
        </div>
        <div className="flex items-center justify-between mt-4 mb-2 px-1">
          <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">Projects</span>
          <button onClick={() => onModal('new')} className="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 rounded p-1 transition-colors" title="New project"><Icon name="plus" size={16} /></button>
        </div>
        {!projects.length && <div className="text-xs text-slate-400 px-2">No projects yet.</div>}
        {projects.map(p => {
          const st = projectStats(p);
          const on = route === p.id;
          return (
            <div key={p.id} onClick={() => go(p.id)} className={item(on)} title={p.name}>
              <span className="text-sm font-medium truncate flex-1">{p.name}</span>
              {st.held > 0 && <span className={on ? 'text-amber-200' : 'text-amber-600'} title="Held up"><Icon name="held" size={13} /></span>}
              <span className={`text-[10px] tabular-nums ${on ? 'text-indigo-200' : 'text-slate-400'}`}>{st.pct}%</span>
            </div>
          );
        })}
      </div>
      <div className="p-3 border-t border-slate-200 space-y-1.5">
        <a href={MAP_URL} className="w-full px-3 py-2 rounded-lg text-sm text-slate-700 border border-slate-200 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
          <Icon name="map" size={16} className="text-slate-500" /> Workflow Map
        </a>
        <button onClick={() => onModal('people')} className="w-full px-3 py-2 rounded-lg text-sm text-slate-700 border border-slate-200 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
          <Icon name="roles" size={16} className="text-slate-500" /> People
        </button>
        <button onClick={() => getFbAuth().signOut()} title={authUser.email || ''} className="w-full px-3 py-1.5 rounded-lg text-xs text-slate-500 hover:bg-slate-50 flex items-center gap-2.5 transition-colors">
          <Icon name="signout" size={14} /> <span className="truncate">Sign out {authUser.email ? '· ' + authUser.email : ''}</span>
        </button>
      </div>
    </aside>
  );
}

function App({ authUser }) {
  const [data, online] = useTrackerData(authUser);
  const [route, setRoute] = useState(readRoute());
  const [modal, setModal] = useState(null);   // 'people' | 'new'
  useEffect(() => {
    const on = () => setRoute(readRoute());
    window.addEventListener('hashchange', on);
    return () => window.removeEventListener('hashchange', on);
  }, []);
  const go = useCallback((id) => { location.hash = id ? '#/p/' + id : '#/'; setRoute(id); }, []);
  const project = data && route ? data.projects.find(p => p.id === route) : null;
  useEffect(() => { document.title = project ? project.name + ' · Program Tracker' : 'Program Tracker'; }, [project && project.name]);

  if (!data) return <div className="flex items-center justify-center h-screen text-slate-400 text-sm">Loading…</div>;
  return (
    <div className="flex h-screen overflow-hidden bg-slate-100">
      <Sidebar data={data} route={route} go={go} authUser={authUser} onModal={setModal} />
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        {route && project
          ? <ProjectView key={project.id} project={project} data={data} authUser={authUser} online={online} onBack={() => go(null)} />
          : route
            ? <><TopBar eyebrow="Project" title="Not found" /><div className="p-6 text-sm text-slate-500">That project no longer exists. <button className="text-indigo-600 underline" onClick={() => go(null)}>Back to the dashboard</button></div></>
            : <Dashboard data={data} authUser={authUser} online={online} onOpen={go} onNew={() => setModal('new')} />}
      </div>
      {modal === 'people' && <PeopleModal data={data} onClose={() => setModal(null)} />}
      {modal === 'new' && <NewProjectModal data={data} authUser={authUser} onClose={() => setModal(null)} onCreated={id => { setModal(null); go(id); }} />}
    </div>
  );
}

function Root() {
  const [authUser, setAuthUser] = useState(undefined);
  useEffect(() => { getFbApp(); return getFbAuth().onAuthStateChanged(u => setAuthUser(u)); }, []);
  if (authUser === undefined) return <div className="flex items-center justify-center h-screen text-slate-400 text-sm">Checking authentication…</div>;
  if (!authUser) return <LoginScreen />;
  return <App authUser={authUser} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
