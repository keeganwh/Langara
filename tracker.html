    @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    ::-webkit-scrollbar { width:8px; height:10px; }
    ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
    /* Track matrix: one row per document, one column per step. */
    .trk-grid { display: grid; gap: 0; align-items: stretch; }
    .trk-cell { position: relative; padding: 8px 6px; min-width: 150px; }
    .trk-line { position: absolute; left: 0; right: 0; top: 50%; height: 0; z-index: 0; }
    .trk-line.solid { border-top: 3px solid var(--doc); opacity: .55; }
    .trk-line.bypass { border-top: 2px dashed #cbd5e1; }
    .trk-line.half-r { left: 50%; }
    .trk-line.half-l { right: 50%; }
    .trk-node { position: relative; z-index: 1; }
    .st-skipped { border-style: dashed !important; }
    /* Overview: each document's steps on one horizontal track. The current
       step is wide; done and upcoming steps are narrow either side. */
    .trk-track { display: flex; overflow-x: auto; cursor: grab; user-select: none; padding: 1px;
                 scrollbar-width: none; }
    .trk-track::-webkit-scrollbar { display: none; }
    .trk-track:active { cursor: grabbing; }
    .trk-now  { flex-grow: 0; flex-shrink: 0; min-height: 92px; scroll-snap-align: start; }
    .trk-track.snap { scroll-snap-type: x proximity; }
    .trk-side { flex-grow: 0; flex-shrink: 0; min-height: 92px; }
    .trk-edge { position: absolute; top: 0; bottom: 0; width: 36px; pointer-events: none; opacity: 0; transition: opacity .15s; }
    .trk-edge.l { left: 0; background: linear-gradient(90deg, #fff, rgba(255,255,255,0)); }
    .trk-edge.r { right: 0; background: linear-gradient(270deg, #fff, rgba(255,255,255,0)); }
    .trk-edge.on { opacity: 1; }
    /* Same nudge button as the Workflow Map's canvas. */
    .trk-nudge { position: absolute; top: 50%; transform: translateY(-50%); width: 26px; height: 40px; border-radius: 8px;
                 border: 1px solid #cbd5e1; background: #fff; color: #475569; display: flex; align-items: center;
                 justify-content: center; padding: 0; box-shadow: 0 2px 8px rgba(15,23,42,.14); z-index: 2; }
    .trk-nudge:hover { color: #0f172a; background: #f8fafc; }
    .trk-nudge.l { left: 2px; } .trk-nudge.r { right: 2px; }
    .tb-btn { min-width: 128px; justify-content: center; }
    .drawer { animation: drawerIn .18s ease; }
    @keyframes drawerIn { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

// ── Dates ──────────────────────────────────────────────────────────────────────
// Dates are stored as local 'YYYY-MM-DD' strings — no time zone to drift.
const pad = (n) => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const daysUntil = (ds) => {
  if (!ds) return null;
  const [y, m, d] = ds.split('-').map(Number);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((new Date(y, m - 1, d) - t) / 86400000);
};
const fmtDate = (ds) => {
  if (!ds) return '';
  const [y, m, d] = ds.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
};
const fmtStamp = (ms) => ms ? new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
function dueLabel(ds) {
  const n = daysUntil(ds);
  if (n === null) return null;
  if (n < 0) return { text: 'Overdue ' + (-n) + 'd', tone: 'red' };
  if (n === 0) return { text: 'Due today', tone: 'amber' };
  if (n <= 7) return { text: 'Due in ' + n + 'd', tone: 'amber' };
  return { text: 'Due ' + fmtDate(ds), tone: 'slate' };
}

  { id: 'in_progress', label: 'In progress', icon: 'clock',   color: '#2563eb', cls: 'bg-blue-50 text-blue-700 border-blue-300' },
  { id: 'held_up',     label: 'Held up',     icon: 'held',    color: '#d97706', cls: 'bg-amber-50 text-amber-800 border-amber-300' },
  { id: 'complete',    label: 'Complete',    icon: 'done',    color: '#059669', cls: 'bg-emerald-50 text-emerald-700 border-emerald-300' },
  { id: 'skipped',     label: 'Skipped',     icon: 'skip',    color: '#94a3b8', cls: 'bg-slate-50 text-slate-500 border-slate-300 st-skipped' },
];
const STATUS = STATUSES.reduce((a, s) => { a[s.id] = s; return a; }, {});
// Same keys as the Workflow Map's TRIGGER_LABELS / TRIGGER_ICON.
const TRIGGER_LABELS = { immediate: 'Immediately after previous step', scheduled_meeting: 'Next scheduled meeting', manual_request: 'Manual request', task_assigned: 'Task assigned' };
const TRIGGER_ICON = { immediate: 't_imm', scheduled_meeting: 't_meet', manual_request: 't_man', task_assigned: 't_task', custom: 't_cust' };
const ACTION_COLOR = { review: '#0284c7', approval: '#059669', consultation: '#7c3aed', prepared_by: '#475569', custom: '#94a3b8' };
const isClosed = (st) => st === 'complete' || st === 'skipped';

function StatusChip({ status, sm }) {
  const s = STATUS[status] || STATUS.pending;
  return (
    <span className={`inline-flex items-center gap-1 border rounded-full font-medium whitespace-nowrap ${sm ? 'text-[10px] px-1.5 py-0' : 'text-xs px-2 py-0.5'} ${s.cls}`}>

// ── Step matching (same rules as the Workflow Map's Step Flow view) ───────────
const stepKey = (name) => (name || '')
  .replace(/[‐-―]/g, '-')
  .trim().toLowerCase().replace(/\s+/g, ' ');

function buildStepSpine(documents) {
  const nodes = new Map(), succ = new Map(), indeg = new Map();
  (documents || []).forEach(doc => {
    (doc.steps || []).forEach((s, i) => {
      const k = stepKey(s.stageName);
      if (!k) return;
      if (!nodes.has(k)) { nodes.set(k, { key: k, label: (s.stageName || '').trim(), firstIdx: i }); succ.set(k, new Set()); indeg.set(k, 0); }
      else if (i < nodes.get(k).firstIdx) nodes.get(k).firstIdx = i;
    });
  });
  (documents || []).forEach(doc => {
    const keys = (doc.steps || []).map(s => stepKey(s.stageName)).filter(Boolean);
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (a === b || !succ.has(a)) continue;
      if (!succ.get(a).has(b)) { succ.get(a).add(b); indeg.set(b, indeg.get(b) + 1); }
    }
  });
  const cmp = (a, b) => (nodes.get(a).firstIdx - nodes.get(b).firstIdx) || String(nodes.get(a).label).localeCompare(String(nodes.get(b).label));
  const order = [], remaining = new Set(nodes.keys());
  while (remaining.size) {
    let ready = [...remaining].filter(k => indeg.get(k) === 0);
    if (!ready.length) ready = [...remaining];
    ready.sort(cmp);
    const k = ready[0];
    order.push(nodes.get(k)); remaining.delete(k);
    succ.get(k).forEach(n => { if (remaining.has(n)) indeg.set(n, indeg.get(n) - 1); });
  }
  return order;
}

// ── Workflow snapshot ──────────────────────────────────────────────────────────
// A project copies its workflow when it is created, so later edits to the map
// don't move the ground under a project in flight. Step ids are kept from the
// map, which is what lets "Update to latest workflow" carry progress across.
function snapshotDocs(projectType) {
  return (projectType.documents || []).map(d => ({
    id: d.id, name: d.name || 'Document', color: d.color || '#6366f1',
    steps: (d.steps || []).map(s => ({
      id: s.id, stageName: s.stageName || '',
      roleIds: [...new Set([...(s.presenterIds || []), ...(s.carrierIds || [])])],
      actions: (s.actions || []).map(a => ({ type: a.type, label: a.label || '', person: a.person || '' })),
      syncGroupId: s.syncGroupId || null,
      informationOnly: !!s.informationOnly,
      triggerType: s.triggerType || '', triggerLabel: s.triggerLabel || '',
      notes: s.notes || '', storageLocation: s.storageLocation || '', storageUrl: s.storageUrl || '',
      fileOperation: s.fileOperation || '',
    })),
  }));
}
function stableStringify(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stableStringify).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stableStringify(v[k])).join(',') + '}';
}
function contentHash(obj) {
  const s = stableStringify(obj);
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
const docsHash = (docs) => contentHash(docs);

// Firebase drops empty arrays and objects, so fill them back in on read.
function normalizeProject(id, p) {
  const docs = (p.documents || []).map(d => ({ ...d, steps: (d.steps || []).map(s => ({
    ...s, roleIds: s.roleIds || [], actions: s.actions || [], syncGroupId: s.syncGroupId || null,
  })) }));
  return {
    ...p, id, name: p.name || 'Untitled project', documents: docs,
    roleAssignments: p.roleAssignments || {}, progress: p.progress || {}, activity: p.activity || {}, links: p.links || {},
    syncGroupMeta: p.syncGroupMeta || {}, notes: p.notes || '', archived: !!p.archived,
    startDate: p.startDate || '', dueDate: p.dueDate || '',
  };
}
function cellOf(project, docId, stepId) {
  const c = (project.progress[docId] || {})[stepId] || {};
  return {
    status: c.status || 'pending', round: c.round || 1,
    startDate: c.startDate || '', dueDate: c.dueDate || '', meetingDate: c.meetingDate || '',
    assignees: c.assignees || [], notes: c.notes || '', heldReason: c.heldReason || '',
    history: c.history || {}, checks: c.checks || {},
  };
}
// Checklist ticks are kept per round ('r1', 'r2', …), so a step sent back
// starts its checklist fresh while the earlier round's ticks stay on record.
// Keys are prefixed so Firebase never mistakes them for array indices.
const roundChecks = (cell) => cell.checks['r' + cell.round] || {};
const checkCount = (step, cell) => {
  const n = (step.actions || []).length;
  const rc = roundChecks(cell);
  return { n, done: (step.actions || []).filter((a, i) => rc['t' + i]).length };
};
const cellPath = (projectId, docId, stepId) => 'projects/' + projectId + '/progress/' + docId + '/' + stepId;

// The document's current step: the first one being worked on (in progress or
// held up), or failing that the first one not yet complete or skipped. The
// first rule matters when a meeting shortcut moves a later step ahead.
function currentIndex(project, doc) {
  const steps = doc.steps || [];
  for (let i = 0; i < steps.length; i++) {
    const st = cellOf(project, doc.id, steps[i].id).status;
    if (st === 'in_progress' || st === 'held_up') return i;
  }
  for (let i = 0; i < steps.length; i++) if (!isClosed(cellOf(project, doc.id, steps[i].id).status)) return i;
  return -1;   // every step closed
}
function docWindow(project, doc) {
  const steps = doc.steps || [];
  const cur = currentIndex(project, doc);
  let last = -1;
  const upto = cur < 0 ? steps.length : cur;
  for (let i = upto - 1; i >= 0; i--) if (cellOf(project, doc.id, steps[i].id).status === 'complete') { last = i; break; }
  let next = -1;
  if (cur >= 0) for (let i = cur + 1; i < steps.length; i++) if (!isClosed(cellOf(project, doc.id, steps[i].id).status)) { next = i; break; }
  const closed = steps.filter(s => isClosed(cellOf(project, doc.id, s.id).status)).length;
  return { cur, last, next, closed, total: steps.length, pct: steps.length ? Math.round(closed / steps.length * 100) : 0 };
}
// Every dated item on open steps (due and meeting dates), soonest first.
function upcomingDates(projects, withinDays) {
  const out = [];
  projects.forEach(project => project.documents.forEach(doc => doc.steps.forEach(step => {
    const c = cellOf(project, doc.id, step.id);
    if (isClosed(c.status)) return;
    [['due', c.dueDate], ['meeting', c.meetingDate]].forEach(([kind, ds]) => {
      if (!ds) return;
      const n = daysUntil(ds);
      if (withinDays == null || n <= withinDays) out.push({ project, doc, step, kind, date: ds, days: n });
    });
  })));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function projectStats(project) {
  let total = 0, closed = 0, held = 0, overdue = 0, nextDue = '', sentBack = 0;
  project.documents.forEach(doc => doc.steps.forEach(s => {
    const c = cellOf(project, doc.id, s.id);
    total++;
    if (isClosed(c.status)) { closed++; return; }
    if (c.status === 'held_up') held++;
    // A send-back counts where the rework is happening, not on every step it
    // reset to pending (those still show their round badge).
    if (c.round > 1 && c.status !== 'pending') sentBack++;
    if (c.dueDate) {
      if (daysUntil(c.dueDate) < 0) overdue++;
      if (!nextDue || c.dueDate < nextDue) nextDue = c.dueDate;
    }
  }));
  const lastAt = Math.max(project.createdAt || 0, ...Object.values(project.activity).map(a => a.at || 0));
  return { total, closed, held, overdue, nextDue, sentBack, lastAt, pct: total ? Math.round(closed / total * 100) : 0, done: total > 0 && closed === total };
}

// ── People and roles ──────────────────────────────────────────────────────────
// People are added by hand. Each can be the default holder of one or more of
// the map's roles; a project can override who fills a role; a step can have
// people tagged on it directly. A step's people = its roles' holders + tags.
function roleHolders(project, people, roleId) {
  const ov = project.roleAssignments[roleId];
  if (ov === 'none') return [];
  if (ov) return Array.isArray(ov) ? ov : Object.values(ov);
  return people.filter(p => (p.roleIds || []).includes(roleId)).map(p => p.id);
}
function stepPeople(project, people, step, cell) {
  const ids = new Set(cell.assignees);
  (step.roleIds || []).forEach(r => roleHolders(project, people, r).forEach(id => ids.add(id)));
  return [...ids];
}
const personById = (people, id) => people.find(p => p.id === id);
const meOf = (people, authUser) => authUser && authUser.email
  ? people.find(p => (p.email || '').trim().toLowerCase() === authUser.email.toLowerCase()) || null : null;
const initials = (name) => {
  const w = (name || '?').trim().split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[w.length - 1][0] : (w[0] || '?').slice(0, 2)).toUpperCase();
};

function Avatar({ person, size = 22 }) {
  return (
    <span title={person ? person.name + (person.email ? ' · ' + person.email : '') : 'Unknown'}
      className="inline-flex items-center justify-center rounded-full bg-indigo-100 text-indigo-700 font-semibold border border-white"
      style={{ width: size, height: size, fontSize: size * 0.42 }}>{initials(person && person.name)}</span>
  );
}

// Items needing a person's attention: steps they are on that are active, or
// pending and next up for their document.
function attentionFor(projects, people, me) {
  if (!me) return [];
  const items = [];
  projects.filter(p => !p.archived).forEach(project => {
    project.documents.forEach(doc => {
      const cur = currentIndex(project, doc);
      doc.steps.forEach((s, i) => {
        const c = cellOf(project, doc.id, s.id);
        if (isClosed(c.status)) return;
        if (!stepPeople(project, people, s, c).includes(me.id)) return;
        const active = c.status === 'in_progress' || c.status === 'held_up';
        if (!active && i !== cur) return;
        items.push({ project, doc, step: s, cell: c, isNext: i === cur });
      });
    });
  });
  const key = (it) => it.cell.dueDate || '9999';
  return items.sort((a, b) => key(a).localeCompare(key(b)));
}

// ── Activity log ───────────────────────────────────────────────────────────────
// `meta` is structured detail for the dashboard (kind, docId, step, status),
// so it can group and colour entries without parsing the text. Entries
// written before meta existed fall back to activityKind().
function logActivity(projectId, authUser, text, meta = {}) {
  return trkRef('projects/' + projectId + '/activity').push({
    at: firebase.database.ServerValue.TIMESTAMP, by: (authUser && authUser.email) || '', text, ...meta,
  });
}
function pushHistory(path, authUser, entry) {
  return trkRef(path + '/history').push({
    at: firebase.database.ServerValue.TIMESTAMP, by: (authUser && authUser.email) || '', ...entry,
  });
}

// ── Data hook ──────────────────────────────────────────────────────────────────
// Live listeners on both trees: anyone's change shows up for everyone.
function useTrackerData(authUser) {
  const [map, setMap] = useState(null);
  const [trk, setTrk] = useState(null);
  const [online, setOnline] = useState(true);
  useEffect(() => {
    if (!authUser) return;
    const db = getFbDb();
    const mRef = db.ref(MAP_PATH), tRef = db.ref(TRK_PATH), cRef = db.ref('.info/connected');
    const onMap = mRef.on('value', s => setMap(s.val() || {}), () => setMap({}));
    const onTrk = tRef.on('value', s => setTrk(s.val() || {}), () => setTrk({}));
    const onCon = cRef.on('value', s => setOnline(s.val() !== false));
    return () => { mRef.off('value', onMap); tRef.off('value', onTrk); cRef.off('value', onCon); };
  }, [authUser && authUser.uid]);
  const data = useMemo(() => {
    if (!map || !trk) return null;
    const people = Object.entries(trk.people || {}).map(([id, p]) => ({ ...p, id, roleIds: p.roleIds || [] }))
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
    const projects = Object.entries(trk.projects || {}).map(([id, p]) => normalizeProject(id, p))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const workflows = (map.projectTypes || []).map(pt => ({ ...pt, documents: pt.documents || [] }));
    return { roles: map.roles || [], workflows, people, projects, syncGroupMeta: map.syncGroupMeta || {} };
  }, [map, trk]);
  return [data, online];
}

function Btn({ onClick, children, variant = 'primary', sm, disabled, className = '', title }) {

  const size = sm ? 'text-xs px-2.5 py-1.5' : 'text-sm px-3.5 py-2';
  const vs = {
    primary: 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500',

    danger: 'bg-red-50 hover:bg-red-100 text-red-700 border border-red-200 focus:ring-red-400',

  };
  return (
    <button onClick={onClick} disabled={disabled} title={title}
      className={`${base} ${size} ${vs[variant]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}>{children}</button>
  );
}

const textareaCls = inputCls + ' resize-y';

// A confirmation that needs a reason — used for skip, send back and held up.
function ReasonModal({ title, message, label, required = true, confirmLabel, danger, onConfirm, onClose }) {

    <Modal title={title} onClose={onClose} footer={<>

// ── Login screen ───────────────────────────────────────────────────────────────
function LoginScreen() {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const submit = async (e) => {
    e.preventDefault(); setError(''); setLoading(true);
    try { await getFbAuth().signInWithEmailAndPassword(email.trim(), password); }
    catch (err) {
      setError(err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'
        ? 'Invalid email or password.' : 'Sign-in failed. Please try again.');
      setLoading(false);
    }
  };
  return (
    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-xl w-full max-w-sm p-8">
        <h1 className="text-xl font-bold text-slate-800 mb-1">CS Program Tracker</h1>
        <p className="text-sm text-slate-500 mb-6">Continuing Studies · Langara College</p>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="block text-xs font-semibold text-slate-600 mb-1">Email</label>
            <input type="email" value={email} onChange={e => setEmail(e.target.value)} className={inputCls} placeholder="you@langara.ca" required autoFocus />
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-600 mb-1">Password</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} className={inputCls} required />
          </div>
          {error && <p className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2">{error}</p>}
          <button type="submit" disabled={loading}
            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg py-2 text-sm disabled:opacity-60">
            {loading ? 'Signing in…' : 'Sign in'}
          </button>
        </form>
      </div>
    </div>
  );
}

                </label>
              );
            })}
          </div>
        </Field>
        <div className="flex gap-2 justify-end">
          <Btn variant="secondary" onClick={() => setEditing(null)}>Cancel</Btn>
          <Btn disabled={!editing.name.trim()} onClick={save}>Save person</Btn>
        </div>
      </div>}
    </Modal>
  );
}

// ── New project ────────────────────────────────────────────────────────────────
function NewProjectModal({ data, authUser, onCreated, onClose }) {
  const [name, setName] = useState('');
  const [wfId, setWfId] = useState(data.workflows[0] ? data.workflows[0].id : '');
  const [startDate, setStartDate] = useState(todayStr());
  const [dueDate, setDueDate] = useState('');
  const wf = data.workflows.find(w => w.id === wfId);
  const create = () => {
    if (!name.trim() || !wf) return;
    const id = uid();
    const docs = snapshotDocs(wf);
    const usedGroups = new Set();
    docs.forEach(d => d.steps.forEach(s => s.syncGroupId && usedGroups.add(s.syncGroupId)));
    const syncGroupMeta = {};
    usedGroups.forEach(g => { if (data.syncGroupMeta[g]) syncGroupMeta[g] = data.syncGroupMeta[g]; });
    dbSet('projects/' + id, {
      name: name.trim(), workflowId: wf.id, workflowName: wf.name || '', sourceHash: docsHash(docs),
      documents: docs, syncGroupMeta, startDate, dueDate, notes: '', archived: false,
      createdAt: Date.now(), createdBy: authUser.email || '', updatedAt: Date.now(),
    }).then(() => { logActivity(id, authUser, 'Created from the "' + (wf.name || '') + '" workflow', { kind: 'created' }); onCreated(id); });
  };
  return (
    <Modal title="New project" onClose={onClose} footer={<>
      <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      <Btn disabled={!name.trim() || !wf} onClick={create}>Create project</Btn>
    </>}>
      <Field label="Project name" hint="e.g. the program or course it is for.">
        <input autoFocus className={inputCls} value={name} onChange={e => setName(e.target.value)} placeholder="Certificate in …" />
      </Field>
      <Field label="Workflow" hint="The project copies this workflow's documents and steps from the Workflow Map.">
        <select className={inputCls} value={wfId} onChange={e => setWfId(e.target.value)}>
          {data.workflows.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
        </select>
      </Field>
      {wf && <div className="text-xs text-slate-500 -mt-2 mb-4">
        {wf.documents.map(d => (d.name || 'Document') + ' (' + (d.steps || []).length + ' steps)').join(' · ') || 'This workflow has no documents yet.'}
      </div>}
      <div className="grid grid-cols-2 gap-3">
        <Field label="Start date"><input type="date" className={inputCls} value={startDate} onChange={e => setStartDate(e.target.value)} /></Field>
        <Field label="Target completion"><input type="date" className={inputCls} value={dueDate} onChange={e => setDueDate(e.target.value)} /></Field>
      </div>
    </Modal>
  );
}

// ── Project settings (details, roles, workflow version, archive) ───────────────
function ProjectSettingsModal({ project, data, authUser, onDeleted, onClose }) {
  const [form, setForm] = useState({ name: project.name, startDate: project.startDate, dueDate: project.dueDate, notes: project.notes });
  const [roles, setRoles] = useState(() => {
    const r = {};
    data.roles.forEach(role => { r[role.id] = project.roleAssignments[role.id] ? roleHolders(project, data.people, role.id) : null; });
    return r;
  });
  const base = 'projects/' + project.id;
  const save = () => {
    // An empty override is stored as 'none' — Firebase drops empty arrays, and
    // "nobody on this project" has to stay different from "use the default".
    const ra = {};
    Object.entries(roles).forEach(([k, v]) => { if (v) ra[k] = v.length ? v : 'none'; });
    dbUpdate(base, { ...form, roleAssignments: Object.keys(ra).length ? ra : null, updatedAt: Date.now() });
    logActivity(project.id, authUser, 'Edited project details', { kind: 'project' });
    onClose();
  };
  const toggleArchive = () => {
    dbUpdate(base, { archived: !project.archived, updatedAt: Date.now() });
    logActivity(project.id, authUser, project.archived ? 'Restored from archive' : 'Archived the project', { kind: 'project' });
    onClose();
  };
  const del = () => {
    const typed = prompt('This permanently deletes "' + project.name + '" and all its progress. Type DELETE to confirm.');
    if (typed !== 'DELETE') return;
    dbRemove(base).then(onDeleted);
  };
  return (
    <Modal title="Project settings" wide onClose={onClose} footer={<>
      <Btn variant="danger" onClick={del} className="mr-auto"><Icon name="trash" size={13} />Delete</Btn>
      <Btn variant="secondary" onClick={toggleArchive}><Icon name="archive" size={13} />{project.archived ? 'Restore' : 'Archive'}</Btn>
      <Btn variant="secondary" onClick={onClose}>Cancel</Btn>
      <Btn onClick={save}>Save</Btn>
    </>}>
      <Field label="Name"><input className={inputCls} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Start date"><input type="date" className={inputCls} value={form.startDate} onChange={e => setForm({ ...form, startDate: e.target.value })} /></Field>
        <Field label="Target completion"><input type="date" className={inputCls} value={form.dueDate} onChange={e => setForm({ ...form, dueDate: e.target.value })} /></Field>
      </div>
      <Field label="Project notes" hint="Shared with everyone."><textarea rows={3} className={textareaCls} value={form.notes} onChange={e => setForm({ ...form, notes: e.target.value })} /></Field>
      <Field label="Who fills each role on this project" hint="Uses the defaults from People unless you override a role here.">
        <div className="space-y-2">
          {data.roles.map(role => {
            const ov = roles[role.id];
            const defaults = data.people.filter(p => p.roleIds.includes(role.id));
            return (
              <div key={role.id} className="border rounded-lg p-2.5">
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="text-sm font-semibold text-slate-700">{role.label}</span>
                  <label className="ml-auto text-xs text-slate-500 inline-flex items-center gap-1.5">
                    <input type="checkbox" checked={!!ov} onChange={() => setRoles({ ...roles, [role.id]: ov ? null : defaults.map(p => p.id) })} />
                    Override for this project
                  </label>
                </div>
                {ov
                  ? <PeoplePicker people={data.people} value={ov} onChange={v => setRoles({ ...roles, [role.id]: v })} />
                  : <div className="text-xs text-slate-500">{defaults.length ? 'Default: ' + defaults.map(p => p.name).join(', ') : 'No default person'}</div>}
              </div>
            );
          })}
        </div>
      </Field>
    </Modal>
  );
}

// ── Update to latest workflow ─────────────────────────────────────────────────
function workflowDrift(project, data) {
  const wf = data.workflows.find(w => w.id === project.workflowId);
  if (!wf) return { missing: true };
  const latest = snapshotDocs(wf);
  if (docsHash(latest) === project.sourceHash) return null;
  const newIds = new Set();
  latest.forEach(d => d.steps.forEach(s => newIds.add(d.id + '/' + s.id)));
  const lost = [];
  project.documents.forEach(d => d.steps.forEach(s => {
    const c = cellOf(project, d.id, s.id);
    if (!newIds.has(d.id + '/' + s.id) && (c.status !== 'pending' || c.notes || Object.keys(c.history).length)) lost.push(d.name + ' — ' + s.stageName);
  }));
  return { wf, latest, lost };
}
function applyWorkflowUpdate(project, data, drift, authUser) {
  const msg = drift.lost.length
    ? 'These steps have progress but are no longer in the workflow. Their records are kept but will not show:\n\n  ' + drift.lost.join('\n  ') + '\n\nUpdate anyway?'
    : 'Update this project to the current version of "' + drift.wf.name + '"? Progress on steps that still exist is kept.';
  if (!confirm(msg)) return;
  const syncGroupMeta = { ...project.syncGroupMeta };
  drift.latest.forEach(d => d.steps.forEach(s => { if (s.syncGroupId && data.syncGroupMeta[s.syncGroupId]) syncGroupMeta[s.syncGroupId] = data.syncGroupMeta[s.syncGroupId]; }));
  dbUpdate('projects/' + project.id, { documents: drift.latest, sourceHash: docsHash(drift.latest), syncGroupMeta, workflowName: drift.wf.name || '', updatedAt: Date.now() });
  logActivity(project.id, authUser, 'Updated to the latest version of the workflow', { kind: 'project' });
}

// ── Step panel ─────────────────────────────────────────────────────────────────
function StepModal({ project, doc, step, data, authUser, onClose }) {
  const cell = cellOf(project, doc.id, step.id);
  const [notes, setNotes] = useState(cell.notes);
  const [ask, setAsk] = useState(null);           // pending ReasonModal config
  const [allAtMeeting, setAllAtMeeting] = useState(false);
  const path = cellPath(project.id, doc.id, step.id);
  const who = (authUser && authUser.email) || '';
  const stepIdx = doc.steps.findIndex(s => s.id === step.id);

  // Other documents' steps that are the same meeting (same sync group).
  const siblings = step.syncGroupId ? project.documents.flatMap(d => d.id === doc.id ? [] :
    d.steps.filter(s => s.syncGroupId === step.syncGroupId).map(s => ({ doc: d, step: s }))) : [];
  const meetingName = step.syncGroupId && project.syncGroupMeta[step.syncGroupId] ? project.syncGroupMeta[step.syncGroupId].name : '';
  const targets = allAtMeeting ? [{ doc, step }, ...siblings] : [{ doc, step }];

  const setStatus = (status, reason) => {
    targets.forEach(t => {
      const p = cellPath(project.id, t.doc.id, t.step.id);
      const c = cellOf(project, t.doc.id, t.step.id);
      const upd = { status, heldReason: status === 'held_up' ? reason : null };
      if (status === 'in_progress' && !c.startDate) upd.startDate = todayStr();
      dbUpdate(p, upd);
      pushHistory(p, authUser, { type: status === 'skipped' ? 'skipped' : 'status', to: status, round: c.round, reason: reason || null });
      logActivity(project.id, authUser, t.doc.name + ' · ' + t.step.stageName + ': ' + STATUS[status].label + (reason ? ' — ' + reason : ''),
        { kind: 'status', status, docId: t.doc.id, step: t.step.stageName });
    });
  };
  const choose = (status) => {
    if (status === cell.status) return;
    if (status === 'held_up') return setAsk({ title: 'Mark as held up', message: 'What is it waiting on?', label: 'Reason', confirmLabel: 'Mark held up', run: r => setStatus('held_up', r) });
    if (status === 'skipped') return setAsk({ title: 'Skip this step?', message: 'Skipping marks "' + step.stageName + '" as not needed for ' + doc.name + '. It stays on record as skipped.', label: 'Why is it being skipped?', confirmLabel: 'Skip step', danger: true, run: r => setStatus('skipped', r) });
    setStatus(status);
  };
  const setField = (field, value) => {
    const fanOut = field === 'meetingDate' ? targets : [{ doc, step }];
    fanOut.forEach(t => dbUpdate(cellPath(project.id, t.doc.id, t.step.id), { [field]: value || null }));
    const label = { startDate: 'start date', dueDate: 'due date', meetingDate: 'meeting date' }[field];
    logActivity(project.id, authUser, doc.name + ' · ' + step.stageName + ': ' + (value ? label + ' set to ' + fmtDate(value) : label + ' cleared'), { kind: 'date', docId: doc.id, step: step.stageName });
  };
  const rc = roundChecks(cell);
  const toggleCheck = (i) => toggleTask(project, doc, step, cell, i, authUser);


  // Send back: the target step opens a new round; every step after it that
  // had been started resets to pending in a new round. History is never
  // cleared, so the earlier rounds stay on record.
  const sendBack = (targetIdx, reason) => {
    const target = doc.steps[targetIdx];
    for (let i = targetIdx; i <= stepIdx; i++) {
      const s = doc.steps[i];
      const c = cellOf(project, doc.id, s.id);
      const touched = c.status !== 'pending' || i === targetIdx;
      if (!touched) continue;
      const p = cellPath(project.id, doc.id, s.id);
      const round = c.status === 'pending' && !Object.keys(c.history).length ? c.round : c.round + 1;
      dbUpdate(p, { status: i === targetIdx ? 'in_progress' : 'pending', round, heldReason: null });
      pushHistory(p, authUser, { type: 'sent_back', to: i === targetIdx ? 'in_progress' : 'pending', round, from: step.stageName, reason });
    }
    logActivity(project.id, authUser, doc.name + ' sent back from ' + step.stageName + ' to ' + target.stageName + ' — ' + reason, { kind: 'sentback', docId: doc.id, step: target.stageName });
    onClose();
  };
  const [backTo, setBackTo] = useState(stepIdx > 0 ? stepIdx - 1 : -1);

  const history = Object.values(cell.history).sort((a, b) => (b.at || 0) - (a.at || 0));
  const assigned = stepPeople(project, data.people, step, cell);
  const roleLabel = (id) => (data.roles.find(r => r.id === id) || {}).label || '';
  const due = dueLabel(cell.dueDate);

  return (
    <Modal title={doc.name + ' · ' + step.stageName} wide onClose={onClose}>
      <div className="flex flex-wrap items-center gap-2 mb-4">
        <span className="w-3 h-3 rounded-full" style={{ background: doc.color }} />
        <span className="text-sm text-slate-600">Step {stepIdx + 1} of {doc.steps.length}</span>
        {cell.round > 1 && <span className="text-xs font-semibold bg-violet-50 text-violet-700 border border-violet-200 rounded-full px-2 py-0.5">Round {cell.round}</span>}
        {step.informationOnly && <span className="text-xs text-slate-500 border border-dashed border-slate-300 rounded-full px-2 py-0.5">Information only</span>}
        {due && !isClosed(cell.status) && <span className={`text-xs border rounded-full px-2 py-0.5 ${TONE[due.tone]}`}>{due.text}</span>}
      </div>

      <Field label="Status">
        <div className="flex flex-wrap gap-1.5">
          {STATUSES.map(s => (
            <button key={s.id} onClick={() => choose(s.id)}
              className={`inline-flex items-center gap-1.5 text-sm border rounded-lg px-3 py-1.5 ${cell.status === s.id ? s.cls + ' ring-2 ring-offset-1 ring-indigo-300' : 'bg-white border-slate-300 text-slate-600 hover:bg-slate-50'}`}>
              <Icon name={s.icon} size={14} />{s.label}
            </button>
          ))}
        </div>
        {cell.status === 'held_up' && cell.heldReason && <p className="text-xs text-amber-800 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 mt-2">Held up: {cell.heldReason}</p>}
        {siblings.length > 0 && (
          <label className="flex items-start gap-2 mt-3 text-xs text-slate-600 bg-slate-50 border rounded-lg px-3 py-2">
            <input type="checkbox" className="mt-0.5" checked={allAtMeeting} onChange={e => setAllAtMeeting(e.target.checked)} />
            <span>Apply status and meeting date to every document at this meeting{meetingName ? ' (' + meetingName + ')' : ''}: {siblings.map(s => s.doc.name).join(', ')}</span>
          </label>
        )}
      </Field>

      {step.actions.length > 0 && (
        <Field label={'Tasks · ' + checkCount(step, cell).done + ' of ' + step.actions.length} hint={cell.round > 1 ? 'Round ' + cell.round + ' — the checklist starts fresh each round.' : 'From the step\'s actions in the Workflow Map.'}>
          <ul className="border rounded-lg divide-y" data-testid="checklist">
            {step.actions.map((a, i) => {
              const done = rc['t' + i];
              const slot = ACTION_COLOR[a.type] ? a.type : 'custom';
              return (
                <li key={i}>
                  <label className="flex items-center gap-2.5 px-3 py-2 cursor-pointer hover:bg-slate-50">
                    <input type="checkbox" checked={!!done} onChange={() => toggleCheck(i)} />
                    <span style={{ color: ACTION_COLOR[slot] }}><Icon name={slot} size={14} /></span>
                    <span className={`text-sm flex-1 ${done ? 'line-through text-slate-400' : 'text-slate-700'}`}>{a.label}{a.person ? <span className="text-slate-500"> {a.person}</span> : null}</span>
                    {done && <span className="text-[11px] text-slate-400">{done.by} · {fmtStamp(done.at)}</span>}
                  </label>
                </li>
              );
            })}
          </ul>
        </Field>
      )}

      {(step.notes || step.storageLocation || step.triggerType) && (
        <div className="bg-slate-50 border rounded-lg px-3 py-2.5 mb-4 text-xs text-slate-600 space-y-1.5" data-testid="map-info">
          <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">From the Workflow Map</div>
          {step.triggerType && <div className="flex items-center gap-1.5"><Icon name={TRIGGER_ICON[step.triggerType] || 't_imm'} size={13} />{step.triggerType === 'custom' ? (step.triggerLabel || 'Custom trigger') : (TRIGGER_LABELS[step.triggerType] || '')}</div>}
          {step.storageLocation && <div className="flex items-center gap-1.5"><Icon name="storage" size={13} />
            {step.storageUrl ? <a className="text-indigo-600 underline" href={step.storageUrl} target="_blank" rel="noopener">{step.storageLocation}</a> : step.storageLocation}
            {step.fileOperation && <span className="text-slate-400">· {step.fileOperation === 'move' ? 'moved' : step.fileOperation === 'copy' ? 'copied' : step.fileOperation}</span>}</div>}
          {step.notes && <div className="flex items-start gap-1.5"><Icon name="notes" size={13} style={{ marginTop: 1 }} /><span className="whitespace-pre-wrap">{step.notes}</span></div>}
        </div>
      )}

      <div className="grid grid-cols-3 gap-3">
        <Field label="Start"><input type="date" className={inputCls} value={cell.startDate} onChange={e => setField('startDate', e.target.value)} /></Field>
        <Field label="Due"><input type="date" className={inputCls} value={cell.dueDate} onChange={e => setField('dueDate', e.target.value)} /></Field>
        <Field label={step.triggerType === 'scheduled_meeting' ? 'Meeting date' : 'Meeting date (if any)'}><input type="date" className={inputCls} value={cell.meetingDate} onChange={e => setField('meetingDate', e.target.value)} /></Field>
      </div>

      <Field label="People on this step" hint={step.roleIds.length ? 'From roles: ' + step.roleIds.map(roleLabel).filter(Boolean).join(', ') + '. Tag anyone else below.' : 'Tag the people who should see this step.'}>
        <div className="flex flex-wrap gap-1 mb-2">
          {assigned.map(id => { const p = personById(data.people, id); return p ? <span key={id} className="inline-flex items-center gap-1 text-xs text-slate-700 bg-slate-100 rounded-full pl-0.5 pr-2 py-0.5"><Avatar person={p} size={18} />{p.name}</span> : null; })}
          {!assigned.length && <span className="text-xs text-slate-400">Nobody yet.</span>}
        </div>
        <div className="text-xs font-semibold text-slate-500 mb-1">Tagged directly</div>
        <PeoplePicker people={data.people} value={cell.assignees} onChange={v => { dbSet(path + '/assignees', v.length ? v : null); logActivity(project.id, authUser, doc.name + ' · ' + step.stageName + ': tagged ' + (v.map(id => (personById(data.people, id) || {}).name).filter(Boolean).join(', ') || 'nobody'), { kind: 'people', docId: doc.id, step: step.stageName }); }} />
      </Field>

      <Field label="Notes" hint="Shared with everyone. Saved when you click away.">
        <textarea rows={3} className={textareaCls} value={notes} onChange={e => setNotes(e.target.value)}

      {stepIdx > 0 && (

            </select>
            <Btn variant="secondary" onClick={() => setAsk({ title: 'Send back?', message: doc.name + ' goes back to "' + doc.steps[backTo].stageName + '". That step and any started steps after it begin a new round.', label: 'Why is it going back?', confirmLabel: 'Send back', danger: true, run: r => sendBack(backTo, r) })}>Send back</Btn>
          </div>
        </div>
      )}

      <div>
        <div className="text-sm font-semibold text-slate-700 mb-1.5 flex items-center gap-1.5"><Icon name="history" size={14} />History</div>
        {!history.length && <p className="text-xs text-slate-400">Nothing yet.</p>}
        <ul className="space-y-1">
          {history.map((h, i) => (
            <li key={i} className="text-xs text-slate-600 flex gap-2">
              <span className="text-slate-400 whitespace-nowrap">{fmtStamp(h.at)}</span>

                {h.type === 'sent_back' ? 'Sent back from ' + h.from + (h.to === 'pending' ? ' (reset)' : '') : (STATUS[h.to] || {}).label}
                {h.reason ? ' — ' + h.reason : ''}<span className="text-slate-400"> · {h.by}</span>
              </span>
            </li>
          ))}
        </ul>
      </div>

      {ask && <ReasonModal {...ask} onClose={() => setAsk(null)} onConfirm={r => { ask.run(r); setAsk(null); }} />}
    </Modal>
  );
}

// ── Activity ───────────────────────────────────────────────────────────────────
// ── Changes drawer: project activity and what changed in the workflow ─────────
// What differs between the project's copy of the workflow and the map's
// current version, as readable lines. This is what "the workflow has changed"
// means, spelled out, so nobody has to guess what triggered it.
const DIFF_FIELDS = [
  ['actions', 'tasks'], ['roleIds', 'roles'], ['notes', 'notes'], ['storageLocation', 'storage location'],
  ['storageUrl', 'storage link'], ['fileOperation', 'file handling'], ['triggerType', 'trigger'],
  ['triggerLabel', 'trigger'], ['informationOnly', 'information only'], ['syncGroupId', 'meeting group'],
];
function workflowDiff(oldDocs, newDocs) {
  const out = [];
  const oldById = new Map(oldDocs.map(d => [d.id, d]));
  const newById = new Map(newDocs.map(d => [d.id, d]));
  newDocs.forEach(d => { if (!oldById.has(d.id)) out.push({ kind: 'add', text: 'New document: ' + d.name }); });
  oldDocs.forEach(d => { if (!newById.has(d.id)) out.push({ kind: 'remove', text: 'Document removed: ' + d.name }); });
  newDocs.forEach(nd => {
    const od = oldById.get(nd.id);
    if (!od) return;
    if (od.name !== nd.name) out.push({ kind: 'edit', text: 'Document renamed: ' + od.name + ' → ' + nd.name });
    const os = new Map(od.steps.map((s, i) => [s.id, { s, i }]));
    const ns = new Map(nd.steps.map((s, i) => [s.id, { s, i }]));
    nd.steps.forEach(s => { if (!os.has(s.id)) out.push({ kind: 'add', doc: nd, text: 'New step: ' + s.stageName }); });
    od.steps.forEach(s => { if (!ns.has(s.id)) out.push({ kind: 'remove', doc: nd, text: 'Step removed: ' + s.stageName }); });
    let moved = false;
    nd.steps.forEach((s, i) => {
      const o = os.get(s.id);
      if (!o) return;
      if (o.i !== i) moved = true;
      if (o.s.stageName !== s.stageName) out.push({ kind: 'edit', doc: nd, text: 'Step renamed: ' + o.s.stageName + ' → ' + s.stageName });
      const fields = [...new Set(DIFF_FIELDS.filter(([k]) => stableStringify(o.s[k] === undefined ? null : o.s[k]) !== stableStringify(s[k] === undefined ? null : s[k])).map(([, l]) => l))];
      if (fields.length) out.push({ kind: 'edit', doc: nd, text: s.stageName + ': changed ' + fields.join(', ') });
    });
    if (moved) out.push({ kind: 'edit', doc: nd, text: 'Steps reordered' });
  });
  return out;
}

function Drawer({ title, onClose, children, testid }) {
  return ReactDOM.createPortal(
    <div className="fixed inset-0" style={{ zIndex: 99990 }} onClick={e => { if (e.target === e.currentTarget) onClose(); }}>

                  <span className="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: color + '1a', color }}><Icon name={st ? st.icon : ks.icon} size={12} /></span>
                  <span className="min-w-0 flex-1">
                    <span className="text-slate-700">{it.short}</span>
                    <span className="flex items-center gap-1 mt-0.5 text-[10px] text-slate-400">
                      {it.doc && <><span className="w-1.5 h-1.5 rounded-full" style={{ background: it.doc.color }} />{it.doc.name} ·</>}
                      {shortWho(it.by)} · {fmtStamp(it.at)}
                    </span>
                  </span>
                </li>

          </ul>
        </>}
        {tab === 'workflow' && <>

          {diff.length > 0 && <>
            <p className="text-xs text-slate-500 mb-3">How the "{drift.wf.name}" workflow in the Workflow Map now differs from this project's copy. Any edit to a step it uses — its tasks, roles, notes, storage or trigger — counts.</p>
            <ul className="space-y-1.5 mb-4" data-testid="workflow-diff">
              {diff.map((d, i) => {
                const [icon, color] = DIFF_STYLE[d.kind];

                  <li key={i} className="flex items-start gap-2 text-xs text-slate-700">
                    <span className="mt-0.5" style={{ color }}><Icon name={icon} size={12} /></span>
                    <span>{d.doc && <span className="inline-flex items-center gap-1 text-slate-500 mr-1"><span className="w-1.5 h-1.5 rounded-full" style={{ background: d.doc.color }} />{d.doc.name}:</span>}{d.text}</span>
                  </li>

              })}

            <Btn sm onClick={() => applyWorkflowUpdate(project, data, drift, authUser)}><Icon name="sync" size={13} />Update to latest workflow</Btn>
            <p className="text-[11px] text-slate-400 mt-2">Progress on steps that still exist is kept.</p>
          </>}
          {drift && !drift.missing && !diff.length && <>

// ── Project view: one track per document ───────────────────────────────────────

function FlowGrid({ project, data, spine, onOpen }) {

                const idx = spine.map(n => byKey.has(n.key));

// ── Overview: one row per document, a sliding track of its steps ───────────────
// The at-a-glance view. Each document's steps sit on one horizontal track:
// done steps narrow and faded to the left, the current step wide in the
// middle, upcoming steps narrow to the right. The track scrolls itself to the
// current step (smoothly, when a step closes, so it slides along) and can be
// dragged or swiped to look back or ahead.
const VIEW_KEY = 'cs_tracker_project_view_v1';

const timeAgo = (ms) => {
  if (!ms) return '';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 7 * 86400) return Math.floor(s / 86400) + 'd ago';
  return new Date(ms).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
};
const shortWho = (email) => (email || '').split('@')[0];

// The newest history entry on a step, as a sentence.
function latestUpdate(cell) {
  const h = Object.values(cell.history).sort((a, b) => (b.at || 0) - (a.at || 0))[0];
  if (!h) return null;
  const what = h.type === 'sent_back' ? (h.to === 'pending' ? 'Reset by a send-back from ' + h.from : 'Sent back from ' + h.from)
    : h.type === 'skipped' ? 'Skipped' : 'Marked ' + ((STATUS[h.to] || {}).label || '').toLowerCase();
  return { text: what + (h.reason ? ' — ' + h.reason : ''), by: shortWho(h.by), at: h.at };
}
function lastCompletedAt(cell) {
  return Object.values(cell.history).filter(h => h.to === 'complete').reduce((m, h) => Math.max(m, h.at || 0), 0);
}

// Segmented bar: one segment per step, filled by status, current one ringed.
function StepSegments({ project, doc, onOpen, cur, h = 10 }) {
  return (
    <div className="flex gap-[2px]" style={{ height: h }} data-testid="segments">
      {doc.steps.map((s, i) => {
        const c = cellOf(project, doc.id, s.id);
        const st = STATUS[c.status];
        const fill = c.status === 'complete' ? doc.color : c.status === 'pending' ? '#e2e8f0' : c.status === 'skipped' ? '#f1f5f9' : st.color;
        return <button key={s.id} onClick={() => onOpen(doc.id, s.id)} title={(i + 1) + '. ' + s.stageName + ' — ' + st.label}
          className={`flex-1 rounded-sm ${i === cur ? 'ring-2 ring-offset-1 ring-slate-500' : ''} ${c.status === 'skipped' ? 'border border-dashed border-slate-300' : ''}`}
          style={{ background: fill, minWidth: 6 }} />;
      })}
    </div>
  );
}

// Who is on a step and why: role holders labelled with the role, plus tags.
function stepPeopleWithRoles(project, data, step, cell) {
  const out = new Map();
  (step.roleIds || []).forEach(r => {
    const label = (data.roles.find(x => x.id === r) || {}).label || '';
    roleHolders(project, data.people, r).forEach(id => { if (!out.has(id)) out.set(id, label); });
  });
  cell.assignees.forEach(id => { if (!out.has(id)) out.set(id, 'Tagged'); });
  return [...out.entries()].map(([id, role]) => ({ person: personById(data.people, id), role })).filter(x => x.person);
}
function daysOnStep(cell) {
  const started = Object.values(cell.history).filter(h => h.to === 'in_progress' || h.to === 'held_up').reduce((m, h) => Math.max(m, h.at || 0), 0);
  if (started) return Math.floor((Date.now() - started) / 86400000);
  return cell.startDate ? -daysUntil(cell.startDate) : null;
}
// Tick or untick one checklist item. Shared by the step panel and the card.
function toggleTask(project, doc, step, cell, i, authUser) {
  const rc = roundChecks(cell);
  const p = cellPath(project.id, doc.id, step.id) + '/checks/r' + cell.round + '/t' + i;
  const a = step.actions[i];
  if (rc['t' + i]) dbRemove(p);
  else dbSet(p, { at: firebase.database.ServerValue.TIMESTAMP, by: (authUser && authUser.email) || '' });
  logActivity(project.id, authUser, doc.name + ' · ' + step.stageName + ': ' + (rc['t' + i] ? 'unticked' : 'ticked') + ' "' + (a.label + (a.person ? ' ' + a.person : '')).trim() + '"', { kind: 'tick', docId: doc.id, step: step.stageName });
}

          {c.status === 'held_up' && c.heldReason && <div className="text-[11px] text-amber-800 bg-amber-50 border border-amber-200 rounded px-1.5 py-0.5 mb-1 line-clamp-2">{c.heldReason}</div>}
          <dl className="grid grid-cols-[auto_1fr] gap-x-2 gap-y-0.5 text-[11px]">
            <dt className="text-slate-400">Due</dt><dd>{due ? <span className={`border rounded-full px-1.5 ${TONE[due.tone]}`}>{due.text}</span> : <span className="text-slate-400">Not set</span>}</dd>

                  <input type="checkbox" className="mt-0.5" checked={!!rc['t' + i]} onChange={() => toggleTask(project, doc, step, c, i, authUser)} data-testid="card-task" />
                  <span className={`leading-tight ${rc['t' + i] ? 'line-through text-slate-400' : 'text-slate-700'}`}>{a.label}{a.person ? ' ' + a.person : ''}</span>

        </div>
        <div className="px-3 py-2 min-w-0">
          <SectionLabel>People</SectionLabel>
          {!ppl.length && <div className="text-[11px] text-slate-400">Nobody assigned</div>}

              <li key={person.id} className="flex items-center gap-1.5 text-[11px] min-w-0">
                <Avatar person={person} size={18} /><span className="text-slate-700 truncate">{person.name}</span>
                {role && <span className="text-slate-400 truncate">· {role}</span>}

            {ppl.length > 3 && <li className="text-[10px] text-slate-400">+{ppl.length - 3} more</li>}
          </ul>
          {hist.length > 0 && <>
            <SectionLabel>Latest</SectionLabel>
            {hist.map((h, i) => {
              const u = latestUpdate({ history: { x: h } });

function SideCard({ project, doc, idx, kind, data, onOpen }) {

  const s = STATUS[c.status];

      <span className="text-[10px] inline-flex items-center gap-1" style={{ color: s.color }}>

// Every step of a document on one row, as fixed slots: a narrow previous
// card, the current card (up to NOW_MAX wide), then upcoming cards filling the
// rest. Rows always open aligned on that layout — a Start placeholder fills a
// missing previous step — so the Now column lines up down the page. Drag or
// step with the edge buttons to look further; the Now card snaps back into
// place when dropped near it.
const SIDE_W = 180, TRACK_GAP = 6, NOW_MAX = 860;
const nowWidthFor = (w) => Math.max(320, Math.min(NOW_MAX, w - 2 * SIDE_W - 2 * TRACK_GAP));

function StepTrack({ project, doc, data, authUser, width, onOpen }) {
  const ref = useRef(null);
  const nowRef = useRef(null);
  const drag = useRef({ down: false, x: 0, left: 0, moved: false });
  const first = useRef(true);
  const [edges, setEdges] = useState({ l: false, r: false });
  const cur = currentIndex(project, doc);
  const curKey = cur >= 0 ? doc.steps[cur].id : 'done';
  const nowW = nowWidthFor(width);

  const measure = () => {
    const el = ref.current;
    if (el) setEdges({ l: el.scrollLeft > 4, r: el.scrollLeft + el.clientWidth < el.scrollWidth - 4 });
  };
  useEffect(() => {
    const el = ref.current, now = nowRef.current;
    if (!el || !now || !width) return;
    const left = Math.max(0, now.offsetLeft - SIDE_W - TRACK_GAP - el.firstChild.offsetLeft);
    if (el.scrollTo) el.scrollTo({ left, behavior: first.current ? 'auto' : 'smooth' }); else el.scrollLeft = left;
    first.current = false;
    setTimeout(measure, 350);
  }, [curKey, width]);

  // Snapping is off while dragging (it would fight the pointer) and back on at
  // release, which is when a nearly-parked Now card settles into place.
  const onDown = (e) => {
    if (e.pointerType !== 'mouse' || e.target.closest('input,label,a')) return;
    ref.current.classList.remove('snap');
    drag.current = { down: true, x: e.clientX, left: ref.current.scrollLeft, moved: false };
  };
  const onMove = (e) => {
    const d = drag.current;
    if (!d.down) return;
    const dx = e.clientX - d.x;
    if (Math.abs(dx) > 5) d.moved = true;
    if (d.moved) ref.current.scrollLeft = d.left - dx;
  };
  const onUp = () => { if (drag.current.down) ref.current.classList.add('snap'); drag.current.down = false; };
  const onClickCapture = (e) => { if (drag.current.moved) { e.stopPropagation(); e.preventDefault(); drag.current.moved = false; } };
  const nudge = (dir) => ref.current.scrollBy({ left: dir * (SIDE_W + TRACK_GAP), behavior: 'smooth' });

  const side = (key, child) => <div key={key} className="trk-side" style={{ flexBasis: SIDE_W }}>{child}</div>;
  const items = [];
  if (cur === 0) items.push(side('start', <div className="h-full rounded-lg border border-dashed border-slate-200 text-[11px] text-slate-300 flex items-center justify-center" data-kind="none">Start</div>));
  doc.steps.forEach((s, i) => {
    if (i === cur) items.push(<div key={s.id} ref={nowRef} className="trk-now" style={{ flexBasis: nowW, scrollMarginLeft: SIDE_W + TRACK_GAP }}><NowCard project={project} doc={doc} idx={i} data={data} authUser={authUser} onOpen={onOpen} /></div>);
    else items.push(side(s.id, <SideCard project={project} doc={doc} idx={i} kind={cur < 0 || i < cur ? 'past' : 'next'} data={data} onOpen={onOpen} />));
  });
  if (cur === doc.steps.length - 1) items.push(side('end', <div className="h-full rounded-lg border border-dashed border-slate-200 text-[11px] text-slate-300 flex items-center justify-center" data-kind="none">End</div>));

  return (
    <div className="relative min-w-0">
      <div ref={ref} className="trk-track snap" data-testid="track" style={{ gap: TRACK_GAP }}
        onScroll={measure} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp} onClickCapture={onClickCapture}>
        {items}
      </div>
      <div className={'trk-edge l' + (edges.l ? ' on' : '')} />
      <div className={'trk-edge r' + (edges.r ? ' on' : '')} />
      {edges.l && <button className="trk-nudge l" aria-label="Previous step" onClick={() => nudge(-1)}><Icon name="chev_l" size={15} /></button>}
      {edges.r && <button className="trk-nudge r" aria-label="Next step" onClick={() => nudge(1)}><Icon name="chev_r" size={15} /></button>}
    </div>
  );
}

// The document's file: one current link, with earlier versions kept.
function DocLinkModal({ project, doc, authUser, onClose }) {
  const cur = project.links[doc.id] || null;
  const [url, setUrl] = useState('');
  const [label, setLabel] = useState('');
  const base = 'projects/' + project.id + '/links/' + doc.id;
  const valid = /^https?:\/\//i.test(url.trim());
  const save = () => {
    if (!valid) return;
    const who = (authUser && authUser.email) || '';
    if (cur && cur.url) trkRef(base + '/history').push({ url: cur.url, label: cur.label || '', at: cur.at || null, by: cur.by || '' });
    dbUpdate(base, { url: url.trim(), label: label.trim(), at: firebase.database.ServerValue.TIMESTAMP, by: who, version: (cur && cur.version ? cur.version : 0) + 1 });
    logActivity(project.id, authUser, doc.name + ': ' + (cur ? 'updated the file link' : 'added a file link') + (label.trim() ? ' (' + label.trim() + ')' : ''), { kind: 'link', docId: doc.id });
    onClose();
  };
  const history = cur ? Object.values(cur.history || {}).sort((a, b) => (b.at || 0) - (a.at || 0)) : [];
  return (
    <Modal title={doc.name + ' · File link'} onClose={onClose} footer={<>
      <Btn variant="secondary" onClick={onClose}>Close</Btn>
      <Btn disabled={!valid} onClick={save}>{cur ? 'Save as latest version' : 'Add link'}</Btn>
    </>}>
      {cur && <div className="bg-slate-50 border rounded-lg px-3 py-2 mb-4 text-sm">
        <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400 mb-0.5">Current · v{cur.version || 1}</div>
        <a href={cur.url} target="_blank" rel="noopener" className="text-indigo-600 underline break-all">{cur.label || cur.url}</a>
        <div className="text-[11px] text-slate-500">{shortWho(cur.by)} · {fmtStamp(cur.at)}</div>
      </div>}
      <Field label={cur ? 'New version link' : 'Link'} hint="SharePoint, OneDrive or any web address.">
        <input autoFocus className={inputCls} placeholder="https://" value={url} onChange={e => setUrl(e.target.value)} />
      </Field>
      <Field label="Version note (optional)"><input className={inputCls} placeholder="e.g. after JCCS feedback" value={label} onChange={e => setLabel(e.target.value)} /></Field>
      {history.length > 0 && <div>
        <div className="text-sm font-semibold text-slate-700 mb-1">Earlier versions</div>
        <ul className="space-y-1">{history.map((h, i) => (
          <li key={i} className="text-xs text-slate-600"><a href={h.url} target="_blank" rel="noopener" className="text-indigo-600 underline break-all">{h.label || h.url}</a> <span className="text-slate-400">· {shortWho(h.by)} · {fmtStamp(h.at)}</span></li>
        ))}</ul>
      </div>}
    </Modal>
  );
}

function Overview({ project, data, authUser, onOpen }) {
  const [linkFor, setLinkFor] = useState(null);
  const [expanded, setExpanded] = useState({});      // finished documents opened up
  const [width, setWidth] = useState(0);
  const measureRef = useRef(null);
  useEffect(() => {
    const el = measureRef.current;
    if (!el) return;
    setWidth(el.clientWidth);
    if (typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(() => setWidth(el.clientWidth));
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  const linkDoc = linkFor && project.documents.find(d => d.id === linkFor);
  const nowW = nowWidthFor(width);

  const fileLink = (doc) => {
    const link = project.links[doc.id];
    return (
      <div className="flex items-center gap-1.5 text-[11px] min-w-0" data-testid="doc-link">
        <Icon name="storage" size={12} className="text-slate-400 flex-shrink-0" />
        {link && link.url
          ? <><a href={link.url} target="_blank" rel="noopener" className="text-indigo-600 hover:underline truncate">Open file</a>
              <span className="text-slate-400">v{link.version || 1}</span>
              <button onClick={() => setLinkFor(doc.id)} className="text-slate-400 hover:text-slate-700" title="Update link"><Icon name="edit" size={11} /></button></>
          : <button onClick={() => setLinkFor(doc.id)} className="text-slate-500 hover:text-indigo-600">Add file link</button>}
      </div>
    );
  };

  return (
    <div data-testid="overview" className="bg-white border border-slate-200 rounded-xl overflow-hidden">
      <div className="grid grid-cols-[210px_minmax(0,1fr)] bg-slate-50 border-b border-slate-200 text-[10px] font-semibold uppercase tracking-wider text-slate-400">
        <div className="px-3 py-1.5 border-r border-slate-200">Document</div>
        <div ref={measureRef} className="mx-2 py-1.5 flex" style={{ gap: TRACK_GAP }}>
          <span style={{ flex: '0 0 ' + SIDE_W + 'px' }}>Previous</span>
          <span style={{ flex: '0 0 ' + nowW + 'px' }}>Now</span>
          <span>Up next</span>
        </div>
      </div>
      {project.documents.map(doc => {
        const w = docWindow(project, doc);
        const done = w.cur < 0 && w.total > 0;
        const open = !done || expanded[doc.id];
        const finishedAt = done ? Math.max(0, ...doc.steps.map(s => lastCompletedAt(cellOf(project, doc.id, s.id)))) : 0;
        return (
          <div key={doc.id} className="grid grid-cols-[210px_minmax(0,1fr)] border-b border-slate-200 last:border-b-0" data-testid="ov-doc" data-done={done ? 'yes' : 'no'}>
            <div className="px-3 py-2 flex flex-col gap-1.5 min-w-0 border-r border-slate-200" style={{ boxShadow: 'inset 3px 0 0 ' + doc.color }}>
              <div className="flex items-center gap-1.5 min-w-0">
                {done && <span style={{ color: doc.color }}><Icon name="done" size={14} /></span>}
                <span className="text-sm font-bold text-slate-800 truncate">{doc.name}</span>
              </div>
              {!done && <div className="text-[11px] text-slate-500">Step {w.cur + 1} of {w.total} · {w.pct}%</div>}
              {open && <StepSegments project={project} doc={doc} cur={w.cur} onOpen={onOpen} />}
              {open && fileLink(doc)}
            </div>
            {open
              ? <div className="mx-2 py-2 min-w-0">
                  {done && <button onClick={() => setExpanded({ ...expanded, [doc.id]: false })} className="text-[11px] text-slate-500 hover:text-slate-800 inline-flex items-center gap-1 mb-1"><Icon name="chev_u" size={12} />Collapse</button>}
                  <StepTrack project={project} doc={doc} data={data} authUser={authUser} width={width} onOpen={onOpen} />
                </div>
              : <button onClick={() => setExpanded({ ...expanded, [doc.id]: true })} data-testid="done-row"
                  className="mx-2 my-1.5 px-3 rounded-lg border flex items-center gap-3 text-left hover:shadow-sm transition-shadow min-w-0"
                  style={{ borderColor: doc.color + '66', background: doc.color + '0f' }}>
                  <span className="text-xs font-semibold" style={{ color: doc.color }}>Complete</span>
                  <span className="text-xs text-slate-600">All {w.total} {w.total === 1 ? 'step' : 'steps'} done{finishedAt ? ' · finished ' + new Date(finishedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : ''}</span>
                  <span className="flex-1 max-w-[220px]"><StepSegments project={project} doc={doc} cur={-1} onOpen={() => {}} h={6} /></span>
                  <span onClick={e => e.stopPropagation()}>{fileLink(doc)}</span>
                  <span className="ml-auto text-[11px] text-slate-500 inline-flex items-center gap-1">Show steps<Icon name="chev_d" size={12} /></span>
                </button>}
          </div>
        );
      })}
      {linkDoc && <DocLinkModal project={project} doc={linkDoc} authUser={authUser} onClose={() => setLinkFor(null)} />}
    </div>
  );
}

// The project summary band under the toolbar: progress, held up, sent back,
// upcoming dates, and the timeline — one line, so the documents start high.
function SummaryBand({ project, onOpen }) {
  const stats = projectStats(project);
  const dates = upcomingDates([project], null);
  const { startDate, dueDate } = project;
  const span = startDate && dueDate && dueDate > startDate ? -daysUntil(startDate) + daysUntil(dueDate) : 0;
  const elapsed = span ? Math.min(Math.max(-daysUntil(startDate) / span, 0), 1) : null;
  const behind = elapsed !== null && elapsed * 100 > stats.pct + 15;
  const item = (label, value, color) => (
    <div className="flex items-baseline gap-1.5 flex-shrink-0">
      <span className="text-lg font-bold leading-none" style={{ color: color || '#1e293b' }}>{value}</span>
      <span className="text-[11px] text-slate-500">{label}</span>
    </div>
  );
  return (
    <div className="bg-white border-b border-slate-200 px-4 py-2 flex flex-wrap items-center gap-x-6 gap-y-2" data-testid="summary">
      {item('complete', stats.pct + '%')}
      {item('held up', stats.held, stats.held ? '#b45309' : '#94a3b8')}
      {item('sent back', stats.sentBack, stats.sentBack ? '#6d28d9' : '#94a3b8')}
      <div className="flex items-center gap-1.5 min-w-0 flex-1" data-testid="upcoming">
        <Icon name="calendar" size={13} className="text-slate-400 flex-shrink-0" />
        {!dates.length && <span className="text-[11px] text-slate-400">No upcoming dates</span>}
        {dates.slice(0, 3).map((it, i) => {
          const tone = it.days < 0 ? 'red' : it.days <= 7 ? 'amber' : 'slate';
          return (
            <button key={i} onClick={() => onOpen(it.doc.id, it.step.id)} className={`text-[11px] border rounded-full pl-1.5 pr-2 py-0.5 inline-flex items-center gap-1 whitespace-nowrap ${TONE[tone]}`}>
              <span className="w-2 h-2 rounded-full" style={{ background: it.doc.color }} />
              <span className="font-semibold">{fmtDate(it.date).replace(/, \d{4}$/, '')}</span>
              <span>{it.step.stageName} {it.kind === 'meeting' ? 'meeting' : 'due'}</span>
            </button>
          );
        })}
        {dates.length > 3 && <span className="text-[11px] text-slate-400">+{dates.length - 3}</span>}
      </div>
      {elapsed !== null && (
        <div className="w-full md:w-[340px] flex-shrink-0" data-testid="timeline" title={Math.round(elapsed * 100) + '% of time used · ' + stats.pct + '% of steps done'}>
          <div className="relative h-2 bg-slate-100 border border-slate-200 rounded-full">
            <div className="absolute inset-y-0 left-0 bg-emerald-500 rounded-full" style={{ width: stats.pct + '%' }} />
            <div className="absolute -top-1 -bottom-1 w-0.5 bg-slate-700" style={{ left: 'calc(' + (elapsed * 100) + '% - 1px)' }} />
          </div>
          <div className="flex justify-between text-[10px] text-slate-400 mt-0.5">
            <span>{fmtDate(startDate)}</span>
            <span className={behind ? 'text-amber-700 font-medium' : ''}>{Math.round(elapsed * 100)}% of time{behind ? ' · behind' : ''}</span>
            <span>{fmtDate(dueDate)}</span>
          </div>
        </div>
      )}
    </div>
  );
}

function Stat({ label, value, sub, tone }) {
  const color = { amber: 'text-amber-700', red: 'text-red-700', violet: 'text-violet-700' }[tone] || 'text-slate-800';
  return (
    <div>
      <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">{label}</div>
      <div className={`text-xl font-bold ${color}`}>{value}</div>
      {sub && <div className="text-[11px] text-slate-500">{sub}</div>}
    </div>
  );
}

function DateList({ items, onOpen, showProject = true, empty, limit = 12 }) {
  if (!items.length) return <p className="text-xs text-slate-400">{empty}</p>;
  return (
    <ul className="divide-y">
      {items.slice(0, limit).map((it, i) => {
        const tone = it.days < 0 ? 'red' : it.days <= 7 ? 'amber' : 'slate';
        return (
          <li key={i}>
            <button onClick={() => onOpen(it)} className="w-full text-left py-1.5 flex items-center gap-2.5 hover:bg-slate-50 rounded">
              <span className={`text-[11px] font-semibold border rounded-md w-14 text-center py-1 flex-shrink-0 leading-tight ${TONE[tone]}`}>
                {new Date(it.date + 'T00:00').toLocaleDateString(undefined, { month: 'short' })}<br />{new Date(it.date + 'T00:00').getDate()}
              </span>
              <span className="min-w-0 flex-1">
                <span className="flex items-center gap-1 text-sm text-slate-800 truncate"><Icon name={it.kind === 'meeting' ? 't_meet' : 'clock'} size={12} className="text-slate-400 flex-shrink-0" />{it.step.stageName} <span className="text-slate-400 text-xs">{it.kind === 'meeting' ? 'meeting' : 'due'}</span></span>
                <span className="flex items-center gap-1 text-[11px] text-slate-500 truncate"><span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: it.doc.color }} />{it.doc.name}{showProject ? ' · ' + it.project.name : ''}</span>
              </span>
            </button>
          </li>
        );
      })}
      {items.length > limit && <li className="text-xs text-slate-400 pt-1.5">and {items.length - limit} more</li>}
    </ul>
  );
}

// Same structure as workflow-tool.html: brand block above a white sidebar, a

        <div className="text-[9px] font-bold tracking-[.13em] text-slate-400 uppercase leading-none mb-0.5 truncate">{eyebrow}</div>

function ToolBtn({ icon, children, onClick, active, title, testid }) {

function ViewToggle({ view, onSetView }) {

  return (
    <div className="flex items-center bg-slate-100 rounded-lg p-0.5 shrink-0">

function SyncLine({ online, children }) {
  return <>
    <span className={online ? 'text-emerald-600' : 'text-red-500'} title={online ? 'Live — changes sync as you make them' : 'Offline — changes will sync when you reconnect'}>

function ProjectView({ project, data, authUser, online, onBack }) {
  const [open, setOpen] = useState(null);          // { docId, stepId }
  const [modal, setModal] = useState(null);        // 'settings'
  const [drawer, setDrawer] = useState(null);      // null | 'activity' | 'workflow'
  const [view, setViewState] = useState(() => { try { return localStorage.getItem(VIEW_KEY) || 'overview'; } catch (e) { return 'overview'; } });
  const setView = (v) => { setViewState(v); try { localStorage.setItem(VIEW_KEY, v); } catch (e) {} };
  const spine = useMemo(() => buildStepSpine(project.documents), [project.documents]);
  const stats = projectStats(project);
  const drift = workflowDrift(project, data);
  const openDoc = open && project.documents.find(d => d.id === open.docId);
  const openStep = openDoc && openDoc.steps.find(s => s.id === open.stepId);
  const pdue = !stats.done ? dueLabel(project.dueDate) : null;
  const pids = new Set();
  project.documents.forEach(d => d.steps.forEach(s => stepPeople(project, data.people, s, cellOf(project, d.id, s.id)).forEach(id => pids.add(id))));
  const ppl = [...pids].map(id => personById(data.people, id)).filter(Boolean);
  const onOpenStep = (d, s) => setOpen({ docId: d, stepId: s });

  return (
    <>
      <TopBar eyebrow={'Project · ' + project.workflowName + (project.archived ? ' · Archived' : '')} title={project.name}
        sub={<SyncLine online={online}>
          {project.startDate ? ' · started ' + fmtDate(project.startDate) : ''}
          {project.dueDate ? ' · target ' + fmtDate(project.dueDate) : ''}
          {pdue && pdue.tone !== 'slate' ? ' (' + pdue.text.toLowerCase() + ')' : ''}
        </SyncLine>}>
        {ppl.length > 0 && <div className="flex items-center gap-1 shrink-0" data-testid="header-people">{ppl.slice(0, 6).map(p => <Avatar key={p.id} person={p} size={26} />)}</div>}
        {drift && !drift.missing && (
          <button onClick={() => setDrawer('workflow')} data-testid="drift-pill"
            className="shrink-0 inline-flex items-center gap-1.5 text-xs font-semibold rounded-lg px-3 py-2 border bg-amber-50 text-amber-700 border-amber-300"
            title="The workflow in the Workflow Map has changed since this project copied it">
            <Icon name="warn" size={14} /> Workflow changed
          </button>
        )}
      </TopBar>
      <Toolbar>
        <ViewToggle view={view} onSetView={setView} />
        <ToolBtn icon="history" onClick={() => setDrawer(drawer ? null : 'activity')} active={!!drawer} testid="changes-btn">Changes</ToolBtn>
        <ToolBtn icon="settings" onClick={() => setModal('settings')}>Project settings</ToolBtn>
        {project.notes && <span className="text-[11px] text-slate-500 truncate max-w-[40%]" title={project.notes}><Icon name="notes" size={12} className="inline mr-1 text-amber-500" />{project.notes}</span>}
      </Toolbar>
      {project.documents.length > 0 && <SummaryBand project={project} onOpen={onOpenStep} />}

      <div className="flex-1 min-h-0 overflow-auto p-4">
        {!project.documents.length
          ? <div className="text-sm text-slate-500 bg-white border rounded-lg p-6">This workflow had no documents when the project was created.</div>
          : view === 'flow'
            ? <FlowGrid project={project} data={data} spine={spine} onOpen={onOpenStep} />
            : <Overview project={project} data={data} authUser={authUser} onOpen={onOpenStep} />}
      </div>

      {openStep && <StepModal key={open.docId + open.stepId} project={project} doc={openDoc} step={openStep} data={data} authUser={authUser} onClose={() => setOpen(null)} />}
      {modal === 'settings' && <ProjectSettingsModal project={project} data={data} authUser={authUser} onDeleted={onBack} onClose={() => setModal(null)} />}
      {drawer && <ChangesDrawer project={project} data={data} authUser={authUser} tab={drawer} onTab={setDrawer} onClose={() => setDrawer(null)} />}
    </>
  );
}

// One row per project. Left: what it is and when it's due. Right: overall
// progress, and one chip per document filled to its own progress.
function ProjectRow({ project, people, onOpen }) {
  const st = projectStats(project);
  // Everyone on any step, through a role or tagged directly.
  const pids = new Set();

          {stale && <span className="text-slate-400 flex-shrink-0" title={'No activity in ' + STALE_DAYS + '+ days'}><Icon name="clock" size={15} /></span>}
        </div>

          {project.documents.map(d => {
            const w = docWindow(project, d);
            const c = w.cur >= 0 ? cellOf(project, d.id, d.steps[w.cur].id) : null;
            const held = c && c.status === 'held_up';

              <span key={d.id} className="relative overflow-hidden rounded-full border text-[11px] font-medium px-2 py-0.5 text-slate-800 flex items-center gap-1 min-w-0"

                <span className="relative truncate">{d.name}</span>

            );

      </div>
    </button>
  );
}

// Recent activity, grouped by project and thinned out: only the newest
// checklist tick per project, and a change applied to several documents at
// once (the meeting shortcut) collapses into one line.
const KIND_STYLE = {
  created:  { icon: 'plus',    color: '#4f46e5' },
  status:   { icon: 'pending', color: '#64748b' },
  tick:     { icon: 'check',   color: '#059669' },
  sentback: { icon: 'ret',     color: '#7c3aed' },
  date:     { icon: 'calendar',color: '#0284c7' },
  people:   { icon: 'user',    color: '#475569' },
  notes:    { icon: 'notes',   color: '#475569' },
  link:     { icon: 'storage', color: '#0284c7' },
  project:  { icon: 'settings',color: '#475569' },
};
function activityKind(a, project) {
  let kind = a.kind, status = a.status, docId = a.docId, step = a.step;
  const t = a.text || '';
  if (!kind) {
    if (/^Created from/.test(t)) kind = 'created';
    else if (/: (un)?ticked /.test(t)) kind = 'tick';
    else if (/ sent back from /.test(t)) kind = 'sentback';
    else if (/ (set to|cleared)/.test(t)) kind = 'date';
    else if (/: tagged /.test(t)) kind = 'people';
    else if (/: edited notes/.test(t)) kind = 'notes';
    else {
      const m = t.match(/: (Pending|In progress|Held up|Complete|Skipped)\b/);
      if (m) { kind = 'status'; status = (STATUSES.find(s => s.label === m[1]) || {}).id; } else kind = 'project';
    }
  }
  if (!docId) { const d = project.documents.find(d => t.indexOf(d.name + ' ') === 0 || t.indexOf(d.name + ':') === 0); if (d) docId = d.id; }
  const doc = project.documents.find(d => d.id === docId);
  // Drop the "Document · " prefix: the row shows the document as a colour.
  const short = doc ? t.replace(doc.name + ' · ', '').replace(doc.name + ': ', '') : t;
  return { ...a, kind, status, doc, step, short };
}
function recentByProject(projects, maxProjects = 6, perProject = 3) {
  const groups = projects.map(project => {
    const items = Object.values(project.activity).map(a => activityKind(a, project)).sort((a, b) => (b.at || 0) - (a.at || 0));
    const out = [];
    let tickSeen = false;
    items.forEach(it => {
      if (it.kind === 'tick') { if (tickSeen) return; tickSeen = true; }
      const prev = out[out.length - 1];
      if (prev && prev.kind === it.kind && it.kind !== 'project' && prev.step && prev.step === it.step && prev.status === it.status && Math.abs((prev.at || 0) - (it.at || 0)) < 10 * 60000) {
        if (it.doc && !prev.docs.some(d => d.id === it.doc.id)) prev.docs.push(it.doc);
        return;
      }
      out.push({ ...it, docs: it.doc ? [it.doc] : [] });
    });
    return { project, items: out.slice(0, perProject), lastAt: items.length ? items[0].at || 0 : 0 };
  }).filter(g => g.items.length);
  return groups.sort((a, b) => b.lastAt - a.lastAt).slice(0, maxProjects);
}

function RecentUpdates({ projects, onOpen }) {
  const groups = recentByProject(projects);
  if (!groups.length) return <p className="text-xs text-slate-400">No activity yet.</p>;
  return (

          <div className="flex items-baseline gap-2">

          </div>
          <ul className="mt-1 space-y-1">
            {g.items.map((it, i) => {
              const ks = KIND_STYLE[it.kind] || KIND_STYLE.project;
              const st = it.kind === 'status' && it.status ? STATUS[it.status] : null;
              const color = st ? st.color : ks.color;
              const multi = it.docs.length > 1;
              const text = multi && it.step && st ? it.step + ': ' + st.label : it.short;
              return (

                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="text-slate-700">{text}</span>
                    <span className="flex items-center gap-1 mt-0.5 flex-wrap">
                      {it.docs.map(d => <span key={d.id} className="inline-flex items-center gap-1 text-[10px] text-slate-500"><span className="w-1.5 h-1.5 rounded-full" style={{ background: d.color }} />{d.name}</span>)}
                      <span className="text-[10px] text-slate-400">{it.docs.length ? '· ' : ''}{shortWho(it.by)} · {timeAgo(it.at)}</span>
